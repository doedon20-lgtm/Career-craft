<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificates | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
    min-height:100vh;
}

/* HEADER */

header{
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:50;
}

.header-inner{
    max-width:1150px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#2563eb;
}

.logo span{
    color:#111827;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.home-link{
    color:#4b5563;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.create-btn{
    border:none;
    background:#2563eb;
    color:white;
    padding:11px 17px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.create-btn:hover{
    background:#1d4ed8;
}

/* MAIN */

main{
    max-width:1150px;
    margin:auto;
    padding:35px 20px 60px;
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:30px;
}

.hero h1{
    font-size:32px;
    margin-bottom:8px;
}

.hero p{
    color:#6b7280;
    line-height:1.6;
}

/* LOADING */

.loading-box{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    min-height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
    color:#6b7280;
}

.spinner{
    width:36px;
    height:36px;
    border:4px solid #e5e7eb;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* GRID */

.certificates-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(285px,1fr));
    gap:22px;
}

/* CARD */

.certificate-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 7px 24px rgba(0,0,0,.05);
    transition:transform .2s,box-shadow .2s;
}

.certificate-card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.certificate-preview{
    height:190px;
    padding:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.certificate-preview.classic{
    background:#f8fbff;
    border:9px solid #1e3a8a;
    margin:0;
}

.certificate-preview.modern{
    background:linear-gradient(135deg,#eff6ff,#ffffff);
    border-left:10px solid #2563eb;
    border-right:10px solid #2563eb;
}

.certificate-preview.elegant{
    background:#fffdf5;
    border:2px solid #c9a227;
    box-shadow:inset 0 0 0 8px #fff;
}

.certificate-preview.achievement{
    background:linear-gradient(135deg,#ffffff,#f3f4f6);
    border:9px solid #111827;
}

.preview-inner{
    max-width:90%;
}

.preview-label{
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#6b7280;
    margin-bottom:8px;
}

.preview-title{
    font-family:Georgia,serif;
    color:#1e3a8a;
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.achievement .preview-title{
    color:#111827;
}

.preview-name{
    font-family:Georgia,serif;
    font-size:17px;
    font-weight:bold;
    margin-bottom:7px;
}

.preview-org{
    font-size:11px;
    color:#6b7280;
}

.card-body{
    padding:18px;
}

.card-body h3{
    font-size:17px;
    margin-bottom:6px;
}

.card-description{
    color:#6b7280;
    font-size:13px;
    margin-bottom:15px;
    line-height:1.4;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
}

.card-actions button{
    border:1px solid #e5e7eb;
    background:white;
    padding:10px 5px;
    border-radius:9px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.view-btn{
    color:#2563eb;
}

.edit-btn{
    color:#374151;
}

.delete-btn{
    color:#dc2626;
}

/* EMPTY */

.empty{
    background:white;
    border:2px dashed #d9dee8;
    border-radius:18px;
    padding:65px 25px;
    text-align:center;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

.empty h2{
    font-size:21px;
    margin-bottom:8px;
}

.empty p{
    color:#6b7280;
    margin-bottom:22px;
}

.empty button{
    border:none;
    background:#2563eb;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

/* ERROR */

.error-box{
    background:white;
    border:1px solid #fecaca;
    border-radius:18px;
    padding:35px 25px;
    text-align:center;
}

.error-icon{
    font-size:40px;
    margin-bottom:12px;
}

.error-box h2{
    margin-bottom:8px;
}

.error-box p{
    color:#6b7280;
    font-size:14px;
    margin-bottom:18px;
    word-break:break-word;
}

.retry-btn{
    border:none;
    background:#2563eb;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
}

/* TOAST */

.toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    font-size:14px;
    display:none;
    z-index:100;
}

/* MOBILE */

@media(max-width:650px){

    header{
        padding:14px;
    }

    .header-inner{
        flex-wrap:wrap;
    }

    .logo{
        font-size:20px;
    }

    .home-link{
        display:none;
    }

    .create-btn{
        padding:10px 13px;
        font-size:13px;
    }

    main{
        padding:25px 14px 50px;
    }

    .hero{
        align-items:start;
        flex-direction:column;
    }

    .hero h1{
        font-size:27px;
    }

    .certificates-grid{
        grid-template-columns:1fr;
    }

    .card-actions button{
        padding:10px 3px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            Career<span>Craft</span>
        </div>

        <div class="header-right">

            <a
                href="index.html"
                class="home-link">
                Home
            </a>

            <button
                class="create-btn"
                onclick="createCertificate()">
                + Create Certificate
            </button>

        </div>

    </div>

</header>


<main>

    <section class="hero">

        <div>
            <h1>My Certificates</h1>

            <p>
                Create, manage and download your professional
                certificates in one place.
            </p>
        </div>

    </section>


    <div id="content">

        <div class="loading-box">

            <div class="spinner"></div>

            <div>
                Loading your certificates...
            </div>

        </div>

    </div>

</main>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   CREATE CERTIFICATE
   ===================================================== */

function createCertificate(){

    window.location.href =
        "certificate-editor.html";

}


/* =====================================================
   CHECK LOGIN
   ===================================================== */

async function getCurrentUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();


    if(error){

        console.error(
            "Authentication error:",
            error
        );

        return null;
    }


    return data.user || null;

}


/* =====================================================
   LOAD CERTIFICATES
   ===================================================== */

async function loadCertificates(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = `
        <div class="loading-box">
            <div class="spinner"></div>
            <div>Loading your certificates...</div>
        </div>
    `;


    try{

        const user =
            await getCurrentUser();


        if(!user){

            content.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🔐
                    </div>

                    <h2>
                        Please log in
                    </h2>

                    <p>
                        You need to be logged in
                        to view your certificates.
                    </p>

                    <button
                        onclick="window.location.href='login.html'">
                        Go to Login
                    </button>

                </div>

            `;

            return;
        }


        const {
            data,
            error
        } = await supabaseClient
            .from("certificates")
            .select("*")
            .eq("user_id", user.id)
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "Certificate query error:",
                error
            );

            content.innerHTML = `

                <div class="error-box">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <h2>
                        Unable to load certificates
                    </h2>

                    <p>
                        ${escapeHtml(error.message)}
                    </p>

                    <button
                        class="retry-btn"
                        onclick="loadCertificates()">
                        Try Again
                    </button>

                </div>

            `;

            return;
        }


        if(!data || data.length === 0){

            content.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📜
                    </div>

                    <h2>
                        No certificates yet
                    </h2>

                    <p>
                        Create your first professional
                        certificate and it will appear here.
                    </p>

                    <button
                        onclick="createCertificate()">
                        Create Your First Certificate
                    </button>

                </div>

            `;

            return;
        }


        renderCertificates(data);

    }

    catch(error){

        console.error(
            "Unexpected error:",
            error
        );


        content.innerHTML = `

            <div class="error-box">

                <div class="error-icon">
                    ⚠️
                </div>

                <h2>
                    Something went wrong
                </h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

                <button
                    class="retry-btn"
                    onclick="loadCertificates()">
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =====================================================
   RENDER CERTIFICATES
   ===================================================== */

function renderCertificates(certificates){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = `

        <div class="certificates-grid">

            ${certificates.map(
                certificateCard
            ).join("")}

        </div>

    `;

}


/* =====================================================
   CERTIFICATE CARD
   ===================================================== */

function certificateCard(cert){

    const template =
        cert.template ||
        "classic";


    const title =
        cert.certificate_title ||
        "Certificate";


    const recipient =
        cert.recipient_name ||
        "Recipient";


    const organization =
        cert.issuing_organization ||
        "Issuing Organization";


    const description =
        cert.description ||
        "Professional certificate";


    return `

        <article class="certificate-card">

            <div
                class="certificate-preview ${escapeHtml(template)}">

                <div class="preview-inner">

                    <div class="preview-label">
                        Certificate
                    </div>

                    <div class="preview-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="preview-name">
                        ${escapeHtml(recipient)}
                    </div>

                    <div class="preview-org">
                        ${escapeHtml(organization)}
                    </div>

                </div>

            </div>


            <div class="card-body">

                <h3>
                    ${escapeHtml(recipient)}
                </h3>

                <div class="card-description">
                    ${escapeHtml(description)}
                </div>


                <div class="card-actions">

                    <button
                        class="view-btn"
                        onclick="viewCertificate('${escapeAttribute(cert.id)}')">
                        View
                    </button>

                    <button
                        class="edit-btn"
                        onclick="editCertificate('${escapeAttribute(cert.id)}')">
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteCertificate('${escapeAttribute(cert.id)}')">
                        Delete
                    </button>

                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   VIEW
   ===================================================== */

function viewCertificate(id){

    window.location.href =
        "certificate-preview.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   EDIT
   ===================================================== */

function editCertificate(id){

    window.location.href =
        "certificate-editor.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   DELETE
   ===================================================== */

async function deleteCertificate(id){

    const confirmed =
        confirm(
            "Are you sure you want to delete this certificate?"
        );


    if(!confirmed){

        return;
    }


    const user =
        await getCurrentUser();


    if(!user){

        showToast(
            "Please log in again."
        );

        return;
    }


    const {
        error
    } = await supabaseClient
        .from("certificates")
        .delete()
        .eq("id", id)
        .eq(
            "user_id",
            user.id
        );


    if(error){

        console.error(
            error
        );

        showToast(
            "Unable to delete certificate."
        );

        return;
    }


    showToast(
        "Certificate deleted."
    );


    loadCertificates();

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ESCAPE ATTRIBUTE
   ===================================================== */

function escapeAttribute(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =====================================================
   TOAST
   ===================================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    setTimeout(
        () => {

            toast.style.display =
                "none";

        },
        2500
    );

}


/* =====================================================
   START
   ===================================================== */

loadCertificates();

</script>

</body>
    </html>
