<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Communities | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:#fff;
    border-right:1px solid #e5e7eb;
    padding:22px 14px;
    z-index:20;
}

.logo{
    font-size:24px;
    font-weight:800;
    color:#2563eb;
    padding:0 12px 25px;
}

.nav-title{
    font-size:11px;
    color:#9ca3af;
    font-weight:700;
    text-transform:uppercase;
    padding:12px;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:10px;
    margin-bottom:4px;
    color:#4b5563;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.nav-item:hover{
    background:#f1f5ff;
    color:#2563eb;
}

.nav-item.active{
    background:#eff6ff;
    color:#2563eb;
}

.nav-icon{
    width:22px;
    text-align:center;
    font-size:18px;
}

/* TOPBAR */

.topbar{
    position:fixed;
    left:245px;
    right:0;
    top:0;
    height:70px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    z-index:15;
}

.search-box{
    width:380px;
    position:relative;
}

.search-box input{
    width:100%;
    height:42px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:0 15px 0 42px;
    outline:none;
    background:#f8fafc;
}

.search-box input:focus{
    border-color:#2563eb;
    background:#fff;
}

.search-icon{
    position:absolute;
    left:14px;
    top:11px;
    color:#6b7280;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:18px;
}

.top-link{
    text-decoration:none;
    color:#374151;
    font-size:14px;
    font-weight:600;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    background:#f3f4f6;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
}

/* MAIN */

.main{
    margin-left:245px;
    padding:95px 28px 90px;
    max-width:1400px;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:24px;
}

.page-title{
    font-size:30px;
    font-weight:800;
}

.page-subtitle{
    color:#6b7280;
    margin-top:7px;
    font-size:14px;
}

.create-btn{
    border:0;
    background:#2563eb;
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    font-weight:700;
}

.create-btn:hover{
    background:#1d4ed8;
}

/* TABS */

.tabs{
    display:flex;
    gap:8px;
    border-bottom:1px solid #e5e7eb;
    margin-bottom:22px;
}

.tab{
    border:0;
    background:transparent;
    padding:13px 18px;
    color:#6b7280;
    font-weight:700;
    border-bottom:3px solid transparent;
}

.tab.active{
    color:#2563eb;
    border-bottom-color:#2563eb;
}

/* SEARCH/FILTER */

.community-tools{
    display:flex;
    gap:12px;
    margin-bottom:22px;
}

.community-search{
    flex:1;
    height:45px;
    border:1px solid #e5e7eb;
    background:#fff;
    border-radius:10px;
    padding:0 15px;
    outline:none;
}

.community-search:focus{
    border-color:#2563eb;
}

.category-select{
    width:190px;
    height:45px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:0 12px;
    background:#fff;
    outline:none;
}

/* GRID */

.communities-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.community-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:20px;
    transition:.2s;
}

.community-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.community-icon{
    width:58px;
    height:58px;
    background:#eff6ff;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-bottom:15px;
}

.community-name{
    font-size:18px;
    font-weight:800;
    margin-bottom:7px;
}

.community-description{
    font-size:13px;
    line-height:1.6;
    color:#6b7280;
    min-height:62px;
}

.community-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:15px 0;
    color:#6b7280;
    font-size:12px;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    background:#f3f4f6;
    color:#4b5563;
    font-size:11px;
    font-weight:700;
}

.community-actions{
    display:flex;
    gap:8px;
}

.join-btn,
.open-btn{
    flex:1;
    border-radius:9px;
    padding:10px;
    font-weight:700;
    font-size:13px;
}

.join-btn{
    border:1px solid #2563eb;
    background:#2563eb;
    color:#fff;
}

.join-btn.joined{
    background:#fff;
    color:#2563eb;
}

.open-btn{
    border:1px solid #e5e7eb;
    background:#fff;
    color:#374151;
}

.open-btn:hover{
    background:#f8fafc;
}

.empty{
    background:#fff;
    border:1px dashed #d1d5db;
    border-radius:14px;
    padding:55px 20px;
    text-align:center;
    color:#6b7280;
    grid-column:1/-1;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty h3{
    color:#172033;
    margin-bottom:7px;
}

/* MODAL */

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:16px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:21px;
}

.close-btn{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#f3f4f6;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:11px;
    outline:none;
}

.form-group textarea{
    resize:vertical;
    min-height:100px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#2563eb;
}

.modal-footer{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:20px;
}

.cancel-btn{
    border:1px solid #d1d5db;
    background:#fff;
    padding:11px 17px;
    border-radius:9px;
    font-weight:700;
}

.save-btn{
    border:0;
    background:#2563eb;
    color:#fff;
    padding:11px 17px;
    border-radius:9px;
    font-weight:700;
}

/* MOBILE NAV */

.mobile-nav{
    display:none;
}

/* RESPONSIVE */

@media(max-width:1100px){
    .communities-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){

    .sidebar{
        display:none;
    }

    .topbar{
        left:0;
        height:64px;
        padding:0 15px;
    }

    .search-box{
        width:calc(100% - 50px);
    }

    .top-link,
    .top-actions .icon-btn{
        display:none;
    }

    .main{
        margin-left:0;
        padding:82px 15px 85px;
    }

    .page-header{
        align-items:flex-start;
    }

    .page-title{
        font-size:25px;
    }

    .create-btn{
        padding:10px 13px;
        font-size:12px;
    }

    .community-tools{
        flex-direction:column;
    }

    .category-select{
        width:100%;
    }

    .communities-grid{
        grid-template-columns:1fr;
    }

    .mobile-nav{
        position:fixed;
        display:flex;
        bottom:0;
        left:0;
        right:0;
        height:65px;
        background:#fff;
        border-top:1px solid #e5e7eb;
        z-index:30;
        justify-content:space-around;
        align-items:center;
    }

    .mobile-nav a{
        text-decoration:none;
        color:#6b7280;
        font-size:10px;
        font-weight:700;
        text-align:center;
    }

    .mobile-nav a.active{
        color:#2563eb;
    }

    .mobile-nav span{
        display:block;
        font-size:20px;
        margin-bottom:2px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<script>

/* SUPABASE */

const SUPABASE_URL =
    "https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* GLOBAL VARIABLES */

let currentUser = null;
let currentProfile = null;
let currentTab = "discover";

let communities = [];


/* DEFAULT COMMUNITIES */

const defaultCommunities = [

    {
        id:"career-growth",
        name:"Career Growth",
        description:
            "Share career advice, opportunities, interview tips and professional growth strategies.",
        type:"Public",
        category:"Career",
        icon:"🚀",
        members:1240,
        createdBy:"CareerCraft"
    },

    {
        id:"tech-professionals",
        name:"Tech Professionals",
        description:
            "A community for developers, engineers, designers and technology professionals.",
        type:"Public",
        category:"Technology",
        icon:"💻",
        members:986,
        createdBy:"CareerCraft"
    },

    {
        id:"entrepreneurs",
        name:"Entrepreneurs Hub",
        description:
            "Build, learn and connect with entrepreneurs and ambitious business-minded professionals.",
        type:"Public",
        category:"Business",
        icon:"💡",
        members:734,
        createdBy:"CareerCraft"
    },

    {
        id:"students",
        name:"Students & Graduates",
        description:
            "A place for students and recent graduates to learn, network and find opportunities.",
        type:"Public",
        category:"Education",
        icon:"🎓",
        members:1580,
        createdBy:"CareerCraft"
    },

    {
        id:"designers",
        name:"Designers Community",
        description:
            "Connect with UI/UX, graphic, product and creative designers.",
        type:"Public",
        category:"Design",
        icon:"🎨",
        members:623,
        createdBy:"CareerCraft"
    },

    {
        id:"finance",
        name:"Finance Professionals",
        description:
            "Discuss finance, accounting, investing, banking and professional development.",
        type:"Public",
        category:"Finance",
        icon:"📊",
        members:452,
        createdBy:"CareerCraft"
    }

];


/* AUTHENTICATION */

async function checkAuthentication(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if(error || !data.user){

        window.location.href =
            "login.html";

        return false;
    }

    currentUser =
        data.user;

    return true;
}


/* PROFILE */

function createAvatar(name){

    const letter =
        encodeURIComponent(
            (name || "U")
            .charAt(0)
            .toUpperCase()
        );

    return `https://ui-avatars.com/api/?name=${letter}&background=2563eb&color=ffffff&size=100`;
}


async function loadCurrentProfile(){

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("ID", currentUser.id)
        .maybeSingle();

    currentProfile =
        data || {};

    const name =
        currentProfile["FULL NAME"] ||
        currentProfile.full_name ||
        currentProfile.fullName ||
        currentProfile.name ||
        currentUser.user_metadata?.full_name ||
        currentUser.user_metadata?.name ||
        currentUser.email?.split("@")[0] ||
        "CareerCraft User";

    const avatar =
        currentProfile.avatar_url ||
        createAvatar(name);

    document.getElementById(
        "profileAvatar"
    ).src = avatar;
}


/* STORAGE */

function getCustomCommunities(){

    const key =
        "careercraft_custom_communities_" +
        currentUser.id;

    try{

        return JSON.parse(
            localStorage.getItem(key)
        ) || [];

    }catch(error){

        return [];

    }
}


function saveCustomCommunities(custom){

    const key =
        "careercraft_custom_communities_" +
        currentUser.id;

    localStorage.setItem(
        key,
        JSON.stringify(custom)
    );
}


/*
    IMPORTANT FIX:
    Only custom communities are stored separately.
    Default communities are always loaded once.
*/

function loadStoredCommunities(){

    const custom =
        getCustomCommunities();

    communities = [
        ...defaultCommunities,
        ...custom
    ];

    applySavedJoinState();
}


/* JOINED COMMUNITIES */

function getJoinedCommunityIds(){

    const key =
        "careercraft_joined_" +
        currentUser.id;

    try{

        return JSON.parse(
            localStorage.getItem(key)
        ) || [];

    }catch(error){

        return [];

    }
}


function saveJoinedCommunityIds(ids){

    const key =
        "careercraft_joined_" +
        currentUser.id;

    localStorage.setItem(
        key,
        JSON.stringify(ids)
    );
}


function applySavedJoinState(){

    const joinedIds =
        getJoinedCommunityIds();

    communities.forEach(
        community => {

            community.joined =
                joinedIds.includes(
                    community.id
                );

        }
    );
}


/* TABS */

function setTab(tab){

    currentTab =
        tab;

    document
        .getElementById("discoverTab")
        .classList.toggle(
            "active",
            tab === "discover"
        );

    document
        .getElementById("myTab")
        .classList.toggle(
            "active",
            tab === "mine"
        );

    applySavedJoinState();

    renderCommunities();
}


/* RENDER */

function renderCommunities(){

    applySavedJoinState();

    const grid =
        document.getElementById(
            "communitiesGrid"
        );

    const search =
        document
            .getElementById(
                "communitySearch"
            )
            .value
            .trim()
            .toLowerCase();

    const category =
        document
            .getElementById(
                "categoryFilter"
            )
            .value;

    let filtered =
        communities.filter(
            community => {

                const matchesSearch =
                    !search ||
                    community.name
                        .toLowerCase()
                        .includes(search) ||
                    community.description
                        .toLowerCase()
                        .includes(search);

                const matchesCategory =
                    category === "all" ||
                    community.category === category;

                const matchesTab =
                    currentTab === "discover" ||
                    community.joined === true;

                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesTab
                );

            }
        );


    if(filtered.length === 0){

        if(currentTab === "mine"){

            grid.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🌐
                    </div>

                    <h3>
                        No communities yet
                    </h3>

                    <p>
                        You haven't joined any communities yet.
                        Discover a community and join it to see it here.
                    </p>

                </div>

            `;

        }else{

            grid.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🔎
                    </div>

                    <h3>
                        No communities found
                    </h3>

                    <p>
                        Try another search or category.
                    </p>

                </div>

            `;

        }

        return;
    }


    grid.innerHTML =
        filtered
            .map(
                community =>
                    communityCard(
                        community
                    )
            )
            .join("");
}


/* COMMUNITY CARD */

function communityCard(community){

    const joined =
        community.joined === true;

    return `

        <div class="community-card">

            <div class="community-icon">
                ${community.icon || "🌐"}
            </div>

            <div class="community-name">
                ${escapeHTML(
                    community.name
                )}
            </div>

            <div class="community-description">
                ${escapeHTML(
                    community.description
                )}
            </div>

            <div class="community-meta">

                <span>
                    👥 ${Number(
                        community.members || 0
                    ).toLocaleString()} members
                </span>

                <span class="badge">
                    ${escapeHTML(
                        community.type || "Public"
                    )}
                </span>

            </div>

            <div class="community-actions">

                <button
                    class="join-btn ${joined ? "joined" : ""}"
                    onclick="toggleJoin('${escapeJS(
                        community.id
                    )}')"
                >
                    ${joined ? "✓ Joined" : "Join"}
                </button>

                <button
                    class="open-btn"
                    onclick="openCommunity('${escapeJS(
                        community.id
                    )}')"
                >
                    Open
                </button>

            </div>

        </div>

    `;
}


/* JOIN / LEAVE */

function toggleJoin(id){

    const community =
        communities.find(
            item =>
                String(item.id) ===
                String(id)
        );

    if(!community){
        return;
    }

    const joinedIds =
        getJoinedCommunityIds();

    const index =
        joinedIds.indexOf(
            community.id
        );


    if(index === -1){

        joinedIds.push(
            community.id
        );

        community.joined =
            true;

        community.members =
            Number(
                community.members || 0
            ) + 1;

    }else{

        joinedIds.splice(
            index,
            1
        );

        community.joined =
            false;

        community.members =
            Math.max(
                0,
                Number(
                    community.members || 0
                ) - 1
            );

    }


    saveJoinedCommunityIds(
        joinedIds
    );

    /*
        Custom communities are saved separately.
        This prevents default communities from being duplicated.
    */

    const custom =
        getCustomCommunities();

    const customIndex =
        custom.findIndex(
            item =>
                String(item.id) ===
                String(community.id)
        );

    if(customIndex !== -1){

        custom[customIndex] =
            community;

        saveCustomCommunities(
            custom
        );

    }

    applySavedJoinState();

    renderCommunities();
}


/* OPEN COMMUNITY */

function openCommunity(id){

    if(!id){
        return;
    }

    window.location.href =
        "community.html?id=" +
        encodeURIComponent(id);
}


/* CREATE MODAL */

function openCreateModal(){

    document
        .getElementById(
            "createModal"
        )
        .classList.add("show");

}


function closeCreateModal(){

    document
        .getElementById(
            "createModal"
        )
        .classList.remove("show");

}


/* CREATE COMMUNITY */

function createCommunity(){

    const name =
        document
            .getElementById(
                "communityName"
            )
            .value
            .trim();

    const description =
        document
            .getElementById(
                "communityDescription"
            )
            .value
            .trim();

    const type =
        document
            .getElementById(
                "communityType"
            )
            .value;

    const category =
        document
            .getElementById(
                "communityCategory"
            )
            .value;


    if(!name){

        alert(
            "Please enter a community name."
        );

        return;
    }


    if(!description){

        alert(
            "Please enter a community description."
        );

        return;
    }


    const custom =
        getCustomCommunities();


    const newCommunity = {

        id:
            "custom-" +
            currentUser.id +
            "-" +
            Date.now(),

        name:name,

        description:description,

        type:type,

        category:category,

        icon:
            getCategoryIcon(
                category
            ),

        members:1,

        createdBy:
            currentProfile["FULL NAME"] ||
            currentProfile.full_name ||
            currentProfile.name ||
            currentUser.email,

        joined:true

    };


    custom.push(
        newCommunity
    );

    saveCustomCommunities(
        custom
    );


    const joinedIds =
        getJoinedCommunityIds();

    joinedIds.push(
        newCommunity.id
    );

    saveJoinedCommunityIds(
        joinedIds
    );


    loadStoredCommunities();

    closeCreateModal();


    document
        .getElementById(
            "communityName"
        )
        .value = "";

    document
        .getElementById(
            "communityDescription"
        )
        .value = "";


    setTab("mine");

}


/* CATEGORY ICON */

function getCategoryIcon(category){

    const icons = {

        Career:"🚀",

        Technology:"💻",

        Business:"💡",

        Education:"🎓",

        Design:"🎨",

        Finance:"📊",

        Other:"🌐"

    };

    return (
        icons[category] ||
        "🌐"
    );
}


/* HTML ESCAPE */

function escapeHTML(value){

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function escapeJS(value){

    return String(value || "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        );
}


/* CLOSE MODAL WHEN CLICKING OUTSIDE */

document
    .getElementById("createModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeCreateModal();

            }

        }
    );


/* INITIALIZE */

async function init(){

    const authenticated =
        await checkAuthentication();

    if(!authenticated){
        return;
    }

    await loadCurrentProfile();

    loadStoredCommunities();

    /*
        This is the important fix.
        It loads all communities the current
        user has already joined.
    */

    applySavedJoinState();

    renderCommunities();

}


init();

</script>
