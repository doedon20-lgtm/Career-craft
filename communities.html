<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Communities | CareerCraft</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      color: #2563eb;
      text-decoration: none;
    }

    .back-btn {
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 18px 100px;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border-radius: 22px;
      padding: 30px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      opacity: .92;
      line-height: 1.6;
      max-width: 650px;
    }

    .top-actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .create-btn {
      background: white;
      color: #2563eb;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .refresh-btn {
      background: rgba(255,255,255,.18);
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .toolbar {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 1px solid #e5e7eb;
    }

    #searchInput {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    #searchInput:focus {
      border-color: #2563eb;
    }

    #communitiesList {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .community-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      padding: 22px;
      transition: .2s;
    }

    .community-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,.07);
    }

    .community-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      margin-bottom: 15px;
    }

    .community-card h3 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .community-card p {
      color: #6b7280;
      line-height: 1.5;
      min-height: 48px;
      margin-bottom: 18px;
    }

    .view-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border-radius: 10px;
    }

    .view-btn:hover {
      background: #1d4ed8;
    }

    .loading,
    .empty-state,
    .error-state {
      grid-column: 1 / -1;
      background: white;
      border-radius: 17px;
      padding: 45px 20px;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .loading {
      color: #6b7280;
    }

    .empty-state h3,
    .error-state h3 {
      margin-bottom: 8px;
    }

    .empty-state p,
    .error-state p {
      color: #6b7280;
      margin-bottom: 18px;
    }

    .retry-btn {
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 18px;
      padding: 25px;
    }

    .modal-box h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .cancel-btn {
      background: #e5e7eb;
      padding: 12px 18px;
      border-radius: 9px;
    }

    .submit-btn {
      background: #2563eb;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      #communitiesList {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 23px;
      }

      .hero h1 {
        font-size: 26px;
      }

      main {
        padding: 20px 13px 90px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">CareerCraft</a>
    <a href="index.html" class="back-btn">← Back</a>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Career Communities</h1>

    <p>
      Connect with professionals, share ideas, ask questions,
      discover opportunities and grow your career together.
    </p>

    <div class="top-actions">
      <button class="create-btn" onclick="openCreateModal()">
        + Create Community
      </button>

      <button class="refresh-btn" onclick="loadCommunities()">
        ↻ Refresh
      </button>
    </div>
  </section>

  <div class="toolbar">
    <input
      type="search"
      id="searchInput"
      placeholder="Search communities..."
      oninput="filterCommunities()"
    >
  </div>

  <section id="communitiesList">
    <div class="loading">
      Loading communities...
    </div>
  </section>

</main>

<!-- CREATE COMMUNITY MODAL -->

<div class="modal" id="createModal">

  <div class="modal-box">

    <h2>Create Community</h2>

    <form id="createCommunityForm">

      <div class="form-group">
        <label for="communityName">
          Community Name
        </label>

        <input
          id="communityName"
          type="text"
          placeholder="e.g. Career Growth"
          required
          maxlength="100"
        >
      </div>

      <div class="form-group">
        <label for="communityDescription">
          Description
        </label>

        <textarea
          id="communityDescription"
          placeholder="What is this community about?"
          required
          maxlength="500"
        ></textarea>
      </div>

      <div id="createMessage" class="message"></div>

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          onclick="closeCreateModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="submit-btn"
          id="submitCommunity"
        >
          Create Community
        </button>

      </div>

    </form>

  </div>

</div>

<script>
/* =========================================
   SUPABASE CONFIGURATION
========================================= */

const SUPABASE_URL = "https://upcxmlbgmqhaqieldmyk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   VARIABLES
========================================= */

let allCommunities = [];


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================
   LOAD COMMUNITIES
========================================= */

async function loadCommunities() {

  const container =
    document.getElementById("communitiesList");

  container.innerHTML = `
    <div class="loading">
      Loading communities...
    </div>
  `;

  try {

    const { data, error } = await supabaseClient
      .from("communities")
      .select("id, name, description, created_by, created_at")
      .order("created_at", {
        ascending: false
      });

    if (error) {
      throw error;
    }

    allCommunities = data || [];

    displayCommunities(allCommunities);

  } catch (error) {

    console.error(
      "Error loading communities:",
      error
    );

    container.innerHTML = `
      <div class="error-state">

        <h3>Unable to load communities</h3>

        <p>
          ${escapeHtml(error.message)}
        </p>

        <button
          class="retry-btn"
          onclick="loadCommunities()"
        >
          Try Again
        </button>

      </div>
    `;
  }
}


/* =========================================
   DISPLAY COMMUNITIES
========================================= */

function displayCommunities(communities) {

  const container =
    document.getElementById("communitiesList");

  if (!communities.length) {

    container.innerHTML = `
      <div class="empty-state">

        <h3>No communities found</h3>

        <p>
          Create the first community and start
          building your professional network.
        </p>

        <button
          class="retry-btn"
          onclick="openCreateModal()"
        >
          Create Community
        </button>

      </div>
    `;

    return;
  }


  container.innerHTML = communities.map(
    community => `

      <article class="community-card">

        <div class="community-icon">
          👥
        </div>

        <h3>
          ${escapeHtml(
            community.name || "Community"
          )}
        </h3>

        <p>
          ${escapeHtml(
            community.description ||
            "Join this community to connect with other professionals."
          )}
        </p>

        <button
          class="view-btn"
          onclick="openCommunity('${community.id}')"
        >
          View Community
        </button>

      </article>

    `
  ).join("");
}


/* =========================================
   SEARCH
========================================= */

function filterCommunities() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if (!search) {

    displayCommunities(
      allCommunities
    );

    return;
  }


  const filtered =
    allCommunities.filter(
      community => {

        const name =
          String(
            community.name || ""
          ).toLowerCase();

        const description =
          String(
            community.description || ""
          ).toLowerCase();

        return (
          name.includes(search) ||
          description.includes(search)
        );
      }
    );

  displayCommunities(filtered);
}


/* =========================================
   OPEN COMMUNITY
========================================= */

function openCommunity(id) {

  window.location.href =
    "community.html?id=" +
    encodeURIComponent(id);
}


/* =========================================
   CREATE MODAL
========================================= */

function openCreateModal() {

  document
    .getElementById("createModal")
    .classList.add("active");
}


function closeCreateModal() {

  document
    .getElementById("createModal")
    .classList.remove("active");

  document
    .getElementById("createMessage")
    .textContent = "";
}


/* =========================================
   CREATE COMMUNITY
========================================= */

document
  .getElementById("createCommunityForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const name =
        document
          .getElementById("communityName")
          .value
          .trim();

      const description =
        document
          .getElementById("communityDescription")
          .value
          .trim();

      const message =
        document.getElementById(
          "createMessage"
        );

      const button =
        document.getElementById(
          "submitCommunity"
        );


      if (!name || !description) {

        message.textContent =
          "Please fill in all fields.";

        return;
      }


      button.disabled = true;
      button.textContent = "Creating...";

      message.textContent = "";


      try {

        const {
          data: {
            user
          }
        } =
          await supabaseClient
            .auth
            .getUser();


        if (!user) {

          throw new Error(
            "Please log in before creating a community."
          );
        }


        const {
          data,
          error
        } =
          await supabaseClient
            .from("communities")
            .insert([
              {
                name: name,
                description: description,
                created_by: user.id
              }
            ])
            .select()
            .single();


        if (error) {
          throw error;
        }


        document
          .getElementById(
            "communityName"
          )
          .value = "";

        document
          .getElementById(
            "communityDescription"
          )
          .value = "";


        closeCreateModal();

        await loadCommunities();


        if (data && data.id) {

          /*
            We intentionally stay on the
            communities page after creation.
          */

        }

      } catch (error) {

        console.error(
          "Create community error:",
          error
        );

        message.textContent =
          error.message ||
          "Unable to create community.";

      } finally {

        button.disabled = false;
        button.textContent =
          "Create Community";
      }

    }
  );


/* =========================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================= */

document
  .getElementById("createModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeCreateModal();

      }

    }
  );


/* =========================================
   START PAGE
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadCommunities();

  }
);
</script>

</body>
    </html>
