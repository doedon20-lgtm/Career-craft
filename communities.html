<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Communities | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#f5f7fb;
    color:#172033;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   HEADER
========================= */

.header{
    height:70px;
    background:white;
    border-bottom:1px solid #e5e7eb;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:23px;
    font-weight:800;
    color:#2563eb;

    text-decoration:none;
}

.logo-icon{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#2563eb;
    color:white;

    border-radius:11px;

    font-weight:800;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.header-link{
    text-decoration:none;
    color:#475569;
    font-weight:600;
}

.header-link:hover{
    color:#2563eb;
}

.avatar{
    width:40px;
    height:40px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #e5e7eb;
}


/* =========================
   PAGE
========================= */

.page{
    max-width:1200px;
    margin:auto;
    padding:35px 22px 100px;
}

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    margin-bottom:28px;
}

.page-title h1{
    font-size:32px;
    margin-bottom:7px;
}

.page-title p{
    color:#64748b;
    font-size:15px;
}

.create-btn{
    border:0;
    background:#2563eb;
    color:white;

    padding:13px 19px;

    border-radius:10px;

    font-weight:700;

    box-shadow:
        0 6px 18px
        rgba(37,99,235,.18);
}

.create-btn:hover{
    background:#1d4ed8;
}


/* =========================
   CONTROLS
========================= */

.controls{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:16px;

    padding:17px;

    margin-bottom:25px;

    display:flex;
    flex-wrap:wrap;
    gap:13px;
}

.search-box{
    flex:1;
    min-width:220px;

    position:relative;
}

.search-box input{
    width:100%;

    height:46px;

    border:1px solid #dbe1ea;

    border-radius:10px;

    padding:0 15px;

    outline:none;
}

.search-box input:focus{
    border-color:#2563eb;
    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.1);
}

.category-select{
    height:46px;

    border:1px solid #dbe1ea;

    border-radius:10px;

    padding:0 13px;

    background:white;

    color:#334155;

    outline:none;
}


/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:8px;

    margin-bottom:25px;

    border-bottom:1px solid #e5e7eb;
}

.tab{
    border:0;
    background:none;

    padding:13px 18px;

    color:#64748b;

    font-weight:700;

    border-bottom:3px solid transparent;
}

.tab:hover{
    color:#2563eb;
}

.tab.active{
    color:#2563eb;

    border-bottom-color:#2563eb;
}


/* =========================
   GRID
========================= */

.community-grid{
    display:grid;

    grid-template-columns:
        repeat(3, minmax(0,1fr));

    gap:20px;
}

.community-card{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:18px;

    padding:22px;

    transition:
        transform .2s,
        box-shadow .2s,
        border-color .2s;
}

.community-card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 12px 30px
        rgba(15,23,42,.08);

    border-color:#cbd5e1;
}

.community-icon{
    width:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:#eff6ff;

    font-size:30px;

    margin-bottom:17px;
}

.community-content h3{
    font-size:19px;

    margin-bottom:9px;
}

.community-content p{
    color:#64748b;

    line-height:1.55;

    font-size:14px;

    min-height:66px;
}

.community-meta{
    display:flex;
    flex-wrap:wrap;

    gap:8px;

    margin-top:15px;
}

.community-meta span{
    background:#f1f5f9;

    color:#475569;

    padding:6px 9px;

    border-radius:7px;

    font-size:12px;

    font-weight:700;
}

.community-actions{
    display:flex;

    gap:9px;

    margin-top:20px;
}

.open-btn,
.join-btn,
.leave-btn{
    flex:1;

    border:0;

    min-height:42px;

    border-radius:9px;

    font-weight:700;
}

.open-btn{
    background:#eff6ff;
    color:#2563eb;
}

.open-btn:hover{
    background:#dbeafe;
}

.join-btn{
    background:#2563eb;
    color:white;
}

.join-btn:hover{
    background:#1d4ed8;
}

.leave-btn{
    background:#ecfdf5;
    color:#047857;
}

.leave-btn:hover{
    background:#d1fae5;
}


/* =========================
   EMPTY STATE
========================= */

.empty-state{
    grid-column:1/-1;

    background:white;

    border:1px dashed #cbd5e1;

    border-radius:18px;

    text-align:center;

    padding:65px 20px;
}

.empty-icon{
    font-size:45px;

    margin-bottom:14px;
}

.empty-state h3{
    font-size:20px;

    margin-bottom:8px;
}

.empty-state p{
    color:#64748b;
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:
        rgba(15,23,42,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:530px;

    background:white;

    border-radius:20px;

    padding:27px;

    box-shadow:
        0 25px 70px
        rgba(15,23,42,.25);

    max-height:90vh;
    overflow:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;
}

.modal-header h2{
    font-size:23px;
}

.close-btn{
    width:36px;
    height:36px;

    border:0;

    border-radius:50%;

    background:#f1f5f9;

    font-size:22px;

    color:#475569;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    font-weight:700;

    font-size:14px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;

    border:1px solid #dbe1ea;

    border-radius:10px;

    padding:12px 13px;

    outline:none;

    background:white;
}

.form-group textarea{
    resize:vertical;

    min-height:110px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.1);
}

.modal-actions{
    display:flex;

    gap:10px;

    margin-top:23px;
}

.cancel-btn,
.submit-btn{
    flex:1;

    min-height:46px;

    border:0;

    border-radius:10px;

    font-weight:700;
}

.cancel-btn{
    background:#f1f5f9;
    color:#475569;
}

.submit-btn{
    background:#2563eb;
    color:white;
}

.submit-btn:hover{
    background:#1d4ed8;
}


/* =========================
   LOADING
========================= */

.loading{
    grid-column:1/-1;

    text-align:center;

    padding:60px 20px;

    color:#64748b;
}

.spinner{
    width:38px;
    height:38px;

    border:4px solid #dbeafe;

    border-top-color:#2563eb;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   MOBILE NAV
========================= */

.mobile-nav{
    display:none;

    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:67px;

    background:white;

    border-top:1px solid #e5e7eb;

    z-index:200;
}

.mobile-nav a{
    flex:1;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    text-decoration:none;

    color:#64748b;

    font-size:11px;

    font-weight:700;
}

.mobile-nav a.active{
    color:#2563eb;
}

.mobile-nav span{
    font-size:21px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:950px){

    .community-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media(max-width:650px){

    .header{
        height:62px;

        padding:
            0 15px;
    }

    .logo{
        font-size:20px;
    }

    .logo-icon{
        width:34px;
        height:34px;
    }

    .header-link{
        display:none;
    }

    .page{
        padding:
            25px 14px 90px;
    }

    .page-top{
        align-items:flex-start;

        flex-direction:column;
    }

    .page-title h1{
        font-size:27px;
    }

    .create-btn{
        width:100%;
    }

    .controls{
        padding:13px;
    }

    .search-box{
        min-width:100%;
    }

    .category-select{
        width:100%;
    }

    .community-grid{
        grid-template-columns:1fr;
    }

    .community-card{
        padding:19px;
    }

    .community-content p{
        min-height:auto;
    }

    .mobile-nav{
        display:flex;
    }

}

</style>
</head>

<!-- =========================

<main class="page">

        >

            </option>

                Career
            </option>

            <option value="Technology">
                Technology
            </option>

            <option value="Business">
                Business
            </option>

            <option value="Education">

            <option value="Design">
                Design
            </option>

            <option value="Finance">

            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            id="discoverTab"

            onclick="showDiscover()"

            Discover
        </button>

        <button
            id="myCommunitiesTab"
            class="tab"
            onclick="showMyCommunities()"
        >
            My Communities
        </button>

    </div>


    <!-- COMMUNITY GRID -->

    <div
        id="communitiesGrid"
        class="community-grid"
    >

        <div class="loading">

            <div class="spinner"></div>

            Loading communities...

        </div>

    </div>

</main>


<!-- =========================
     CREATE COMMUNITY MODAL
========================= -->

<div
    id="createModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Create Community
            </h2>

            <button
                class="close-btn"
                onclick="closeCreateModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label for="communityName">
                Community Name
            </label>

            <input
                id="communityName"
                type="text"
                maxlength="100"
                placeholder="e.g. Remote Workers"
            >

        </div>


        <div class="form-group">

            <label for="communityDescription">
                Description
            </label>

            <textarea
                id="communityDescription"
                maxlength="500"
                placeholder="What is this community about?"
            ></textarea>

        </div>


        <div class="form-group">

            <label for="communityType">
                Community Type
            </label>

            <select
                id="communityType"
            >

                <option value="Public">
                    Public
                </option>

                <option value="Private">
                    Private
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="communityCategory">
                Category
            </label>

            <select
                id="communityCategory"
            >

                <option value="Career">
                    Career
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Business">
                    Business
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Design">
                    Design
                </option>

                <option value="Finance">
                    Finance
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeCreateModal()"
            >
                Cancel
            </button>

            <button
                class="submit-btn"
                onclick="createCommunity()"
            >
                Create Community
            </button>

        </div>

    </div>

</div>


<!-- =========================
     MOBILE NAV
========================= -->

<nav class="mobile-nav">

</nav>
