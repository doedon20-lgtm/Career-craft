<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CV Builder | CareerCraft</title>

  <meta
    name="description"
    content="Create a professional CV with CareerCraft."
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #172033;
      --muted: #667085;
      --border: #e5e7eb;
      --bg: #f5f7fb;
      --white: #ffffff;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
      --radius: 16px;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      background: #f5f7fb;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .loading-logo {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #dbe5f5;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .app {
      display: none;
      min-height: 100vh;
    }

    /* HEADER */

    .topbar {
      height: 70px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      background: var(--primary);
      color: white;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 9px 14px;
      border-radius: 9px;
      font-weight: 600;
    }

    .top-btn:hover {
      background: #f8fafc;
    }

    .logout-btn {
      color: var(--danger);
    }

    /* MAIN */

    .page {
      max-width: 1450px;
      margin: 0 auto;
      padding: 30px;
    }

    .page-heading {
      margin-bottom: 25px;
    }

    .page-heading h1 {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .page-heading p {
      color: var(--muted);
      font-size: 15px;
    }

    .builder-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 24px;
      align-items: start;
    }

    .left-column,
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .card-title {
      font-size: 19px;
      font-weight: 750;
      margin-bottom: 5px;
    }

    .card-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .section-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #eff6ff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* PROGRESS */

    .progress-card {
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      border: 1px solid #dbeafe;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-label {
      font-weight: 750;
    }

    .progress-percent {
      color: var(--primary);
      font-weight: 800;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      background: #dbeafe;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .progress-message {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    /* FORMS */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 17px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #344054;
    }

    .required {
      color: var(--danger);
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      padding: 12px 13px;
      color: var(--text);
      background: white;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.09);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.55;
    }

    .help-text {
      color: #98a2b3;
      font-size: 11px;
      line-height: 1.4;
    }

    /* PHOTO */

    .photo-area {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
      padding-bottom: 22px;
      border-bottom: 1px solid #edf0f5;
    }

    .photo-preview {
      width: 90px;
      height: 90px;
      border-radius: 14px;
      background: #f1f5f9;
      border: 1px dashed #cbd5e1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .photo-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border-radius: 9px;
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #dbeafe;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-label input {
      display: none;
    }

    .remove-photo {
      border: none;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      text-align: left;
    }

    /* REPEATING SECTIONS */

    .repeat-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .repeat-item {
      border: 1px solid #e7ebf1;
      border-radius: 13px;
      padding: 17px;
      background: #fbfcfe;
      position: relative;
    }

    .repeat-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .repeat-item-title {
      font-size: 13px;
      font-weight: 800;
      color: #344054;
    }

    .remove-btn {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      width: 29px;
      height: 29px;
      border-radius: 8px;
      font-weight: 800;
    }

    .remove-btn:hover {
      background: #fecaca;
    }

    .repeat-item .form-grid {
      gap: 13px;
    }

    .add-btn {
      width: 100%;
      border: 1px dashed #b7c8e8;
      background: #f8fbff;
      color: var(--primary);
      padding: 12px;
      border-radius: 10px;
      font-weight: 750;
      margin-top: 14px;
    }

    .add-btn:hover {
      background: #eff6ff;
    }

    /* TEMPLATE SELECTOR */

    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }
