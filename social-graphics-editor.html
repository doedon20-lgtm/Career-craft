<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Graphic Editor | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f3f5f9;
    --panel: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --danger: #ef4444;
}

body.dark {
    --bg: #090e1a;
    --panel: #111827;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #273449;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* TOPBAR */

.topbar {
    height: 70px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.top-left,
.top-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-btn,
.icon-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 11px;
    display: grid;
    place-items: center;
}

.back-btn:hover,
.icon-btn:hover {
    border-color: var(--primary);
}

.editor-title {
    margin-left: 4px;
}

.editor-title strong {
    display: block;
    font-size: 15px;
}

.editor-title span {
    color: var(--muted);
    font-size: 11px;
}

.btn {
    border: none;
    border-radius: 11px;
    padding: 11px 16px;
    font-weight: 700;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
}

.btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
}

/* WORKSPACE */

.workspace {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    min-height: calc(100vh - 70px);
}

/* SIDEBAR */

.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
}

.section {
    padding-bottom: 22px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
}

.section:last-child {
    border-bottom: none;
}

.section-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 12px;
}

.field {
    margin-bottom: 13px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 7px;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 11px;
    outline: none;
}

.field textarea {
    min-height: 85px;
    resize: vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    border-color: var(--primary);
}

.platform-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.platform-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 6px;
    font-size: 11px;
    font-weight: 700;
}

.platform-btn:hover {
    border-color: var(--primary);
}

.platform-btn.active {
    border-color: var(--primary);
    background: rgba(79,70,229,.1);
    color: var(--primary);
}

.template-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.template-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 5px;
    font-size: 11px;
}

.template-btn:hover {
    border-color: var(--primary);
}

.template-btn.active {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(79,70,229,.08);
}

.color-row {
    display: flex;
    gap: 8px;
}

.color-row input[type="color"] {
    width: 50px;
    height: 43px;
    padding: 3px;
}

.color-row input[type="text"] {
    flex: 1;
}

.range-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.range-row input {
    flex: 1;
}

.range-value {
    width: 45px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
}

.upload-box {
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 13px;
    text-align: center;
}

.upload-box input {
    font-size: 11px;
    max-width: 100%;
}

.upload-preview {
    width: 70px;
    height: 70px;
    border-radius: 10px;
    object-fit: cover;
    margin: 0 auto 8px;
    display: none;
}

/* CANVAS AREA */

.canvas-area {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.canvas-toolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}

.size-info {
    color: var(--muted);
    font-size: 12px;
}

.size-info strong {
    color: var(--text);
}

.canvas-actions {
    display: flex;
    gap: 8px;
}

.canvas-scroll {
    flex: 1;
    overflow: auto;
    padding: 45px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.canvas-wrap {
    position: relative;
    width: min(760px, 90vw);
}

.canvas {
    width: 100%;
    aspect-ratio: 1 / 1;
    position: relative;
    overflow: hidden;
    background: #4f46e5;
    box-shadow: 0 25px 70px rgba(0,0,0,.18);
}

.canvas-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.logo {
    position: absolute;
    width: 90px;
    height: 90px;
    object-fit: contain;
    top: 35px;
    right: 35px;
    display: none;
}

.headline {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    width: 82%;
    color: white;
    text-align: center;
    font-size: clamp(24px, 5vw, 72px);
    font-weight: 800;
    line-height: 1.08;
    word-break: break-word;
    white-space: pre-wrap;
}

.body-text {
    position: absolute;
    left: 50%;
    top: 61%;
    transform: translate(-50%, -50%);
    width: 76%;
    color: white;
    text-align: center;
    font-size: clamp(13px, 2.3vw, 30px);
    line-height: 1.35;
    word-break: break-word;
    white-space: pre-wrap;
}

.author {
    position: absolute;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
    font-size: clamp(11px, 1.8vw, 24px);
    font-weight: 600;
    white-space: nowrap;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #111827;
    color: white;
    padding: 13px 17px;
    border-radius: 12px;
    opacity: 0;
    transform: translateY(100px);
    pointer-events: none;
    transition: .3s;
    z-index: 200;
    max-width: calc(100vw - 40px);
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* LOADING */

.loading {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
}

.loading.show {
    display: flex;
}

.loading-box {
    background: var(--panel);
    color: var(--text);
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    min-width: 180px;
}

/* MOBILE */

@media(max-width: 900px) {

    .workspace {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: none;
        order: 2;
    }

    .canvas-area {
        order: 1;
    }

    .canvas-scroll {
        padding: 25px 15px;
    }
}

@media(max-width: 600px) {

    .topbar {
        height: auto;
        min-height: 64px;
        padding: 10px;
    }

    .editor-title span {
        display: none;
    }

    .top-right .btn-secondary {
        display: none;
    }

    .btn {
        padding: 10px 11px;
        font-size: 12px;
    }

    .canvas-toolbar {
        padding: 10px;
    }

    .canvas-actions .btn {
        font-size: 11px;
        padding: 9px;
    }

    .canvas-scroll {
        padding: 15px 8px;
    }

    .back-btn,
    .icon-btn {
        width: 38px;
        height: 38px;
    }

    .editor-title strong {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="top-left">

        <button
            class="back-btn"
            onclick="goBack()"
            title="Back to Social Graphics"
            aria-label="Back to Social Graphics"
        >
            ←
        </button>

        <div class="editor-title">
            <strong id="editorHeading">New Social Graphic</strong>
            <span>Social Graphic Editor</span>
        </div>

    </div>

    <div class="top-right">

        <button
            class="icon-btn"
            id="themeBtn"
            title="Dark mode"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>

        <button
            class="btn btn-secondary"
            onclick="deleteCurrentGraphic()"
            id="deleteTopBtn"
            style="display:none;"
        >
            Delete
        </button>

        <button
            class="btn btn-primary"
            onclick="saveGraphic()"
            id="saveBtn"
        >
            Save Graphic
        </button>

    </div>

</header>


<div class="workspace">

<aside class="sidebar">

    <!-- PLATFORM -->

    <section class="section">

        <div class="section-title">
            Platform & Size
        </div>

        <div class="platform-grid">

            <button
                class="platform-btn active"
                data-platform="Instagram"
                data-width="1080"
                data-height="1080"
            >
                Instagram Post
            </button>

            <button
                class="platform-btn"
                data-platform="Instagram Story"
                data-width="1080"
                data-height="1920"
            >
                Instagram Story
            </button>

            <button
                class="platform-btn"
                data-platform="Facebook"
                data-width="1200"
                data-height="630"
            >
                Facebook
            </button>

            <button
                class="platform-btn"
                data-platform="LinkedIn"
                data-width="1200"
                data-height="627"
            >
                LinkedIn
            </button>

            <button
                class="platform-btn"
                data-platform="X"
                data-width="1600"
                data-height="900"
            >
                X Post
            </button>

            <button
                class="platform-btn"
                data-platform="TikTok"
                data-width="1080"
                data-height="1920"
            >
                TikTok
            </button>

        </div>

        <div class="field" style="margin-top:12px;">

            <label>Custom Width</label>

            <input
                type="number"
                id="customWidth"
                min="100"
                max="4000"
                placeholder="1080"
            >

        </div>

        <div class="field">

            <label>Custom Height</label>

            <input
                type="number"
                id="customHeight"
                min="100"
                max="4000"
                placeholder="1080"
            >

        </div>

        <button
            class="btn btn-secondary"
            style="width:100%;"
            onclick="applyCustomSize()"
        >
            Apply Custom Size
        </button>

    </section>


    <!-- TEMPLATE -->

    <section class="section">

        <div class="section-title">
            Template
        </div>

        <div class="template-grid">

            <button
                class="template-btn active"
                data-template="modern"
            >
                Modern
            </button>

            <button
                class="template-btn"
                data-template="clean"
            >
                Clean
            </button>

            <button
                class="template-btn"
                data-template="bold"
            >
                Bold
            </button>

            <button
                class="template-btn"
                data-template="minimal"
            >
                Minimal
            </button>

        </div>

    </section>


    <!-- CONTENT -->

    <section class="section">

        <div class="section-title">
            Content
        </div>

        <div class="field">

            <label>Graphic Title</label>

            <input
                type="text"
                id="title"
                placeholder="My Social Graphic"
            >

        </div>

        <div class="field">

            <label>Headline</label>

            <textarea
                id="headline"
                placeholder="Your main headline"
            ></textarea>

        </div>

        <div class="field">

            <label>Body Text</label>

            <textarea
                id="bodyText"
                placeholder="Add supporting text here..."
            ></textarea>

        </div>

        <div class="field">

            <label>Author / Name</label>

            <input
                type="text"
                id="author"
                placeholder="Optional"
            >

        </div>

    </section>


    <!-- BACKGROUND -->

    <section class="section">

        <div class="section-title">
            Background
        </div>

        <div class="field">

            <label>Background Color</label>

            <div class="color-row">

                <input
                    type="color"
                    id="backgroundColor"
                    value="#4f46e5"
                >

                <input
                    type="text"
                    id="backgroundHex"
                    value="#4f46e5"
                >

            </div>

        </div>

        <div class="field">

            <label>Background Image</label>

            <div class="upload-box">

                <img
                    id="backgroundPreview"
                    class="upload-preview"
                    alt="Background preview"
                >

                <input
                    type="file"
                    id="backgroundFile"
                    accept="image/png,image/jpeg,image/webp"
                >

            </div>

        </div>

        <div class="field">

            <label>Overlay Opacity</label>

            <div class="range-row">

                <input
                    type="range"
                    id="overlayOpacity"
                    min="0"
                    max="100"
                    value="0"
                >

                <span
                    class="range-value"
                    id="overlayValue"
                >
                    0%
                </span>

            </div>

        </div>

    </section>


    <!-- LOGO -->

    <section class="section">

        <div class="section-title">
            Logo
        </div>

        <div class="upload-box">

            <img
                id="logoPreview"
                class="upload-preview"
                alt="Logo preview"
            >

            <input
                type="file"
                id="logoFile"
                accept="image/png,image/jpeg,image/webp"
            >

        </div>

    </section>


    <!-- TEXT STYLE -->

    <section class="section">

        <div class="section-title">
            Text Styling
        </div>

        <div class="field">

            <label>Headline Size</label>

            <div class="range-row">

                <input
                    type="range"
                    id="headlineSize"
                    min="20"
                    max="150"
                    value="72"
                >

                <span
                    class="range-value"
                    id="headlineSizeValue"
                >
                    72
                </span>

            </div>

        </div>

        <div class="field">

            <label>Body Size</label>

            <div class="range-row">

                <input
                    type="range"
                    id="bodySize"
                    min="12"
                    max="80"
                    value="30"
                >

                <span
                    class="range-value"
                    id="bodySizeValue"
                >
                    30
                </span>

            </div>

        </div>

        <div class="field">

            <label>Text Alignment</label>

            <select id="textAlign">

                <option value="center">Center</option>
                <option value="left">Left</option>
                <option value="right">Right</option>

            </select>

        </div>

        <div class="field">

            <label>Headline Color</label>

            <input
                type="color"
                id="headlineColor"
                value="#ffffff"
                style="width:100%;height:42px;"
            >

        </div>

        <div class="field">

            <label>Body Color</label>

            <input
                type="color"
                id="bodyColor"
                value="#ffffff"
                style="width:100%;height:42px;"
            >

        </div>

    </section>

</aside>


<!-- CANVAS -->

<main class="canvas-area">

    <div class="canvas-toolbar">

        <div class="size-info">
            Canvas:
            <strong id="sizeLabel">1080 × 1080</strong>
        </div>

        <div class="canvas-actions">

            <button
                class="btn btn-secondary"
                onclick="downloadGraphic()"
            >
                Download
            </button>

            <button
                class="btn btn-primary"
                onclick="saveToPhone()"
            >
                Save to Phone
            </button>

        </div>

    </div>

    <div class="canvas-scroll">

        <div class="canvas-wrap">

            <div
                class="canvas"
                id="graphicCanvas"
            >

                <img
                    id="canvasBackground"
                    class="canvas-bg"
                    style="display:none;"
                    crossorigin="anonymous"
                    alt=""
                >

                <div
                    class="overlay"
                    id="canvasOverlay"
                ></div>

                <img
                    id="canvasLogo"
                    class="logo"
                    crossorigin="anonymous"
                    alt=""
                >

                <div
                    class="headline"
                    id="canvasHeadline"
                ></div>

                <div
                    class="body-text"
                    id="canvasBody"
                ></div>

                <div
                    class="author"
                    id="canvasAuthor"
                ></div>

            </div>

        </div>

    </div>

</main>

</div>


<div class="toast" id="toast"></div>


<div class="loading" id="loading">

    <div class="loading-box">

        <div style="font-size:30px;margin-bottom:10px;">
            ⏳
        </div>

        <strong id="loadingText">
            Saving...
        </strong>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   STATE
========================================================= */

let currentGraphicId = null;

let currentWidth = 1080;

let currentHeight = 1080;

let currentPlatform = "Instagram";

let currentTemplate = "modern";

let backgroundImageUrl = null;

let logoUrl = null;

let backgroundFile = null;

let logoFile = null;


/* =========================================================
   DOM
========================================================= */

const title =
    document.getElementById("title");

const headline =
    document.getElementById("headline");

const bodyText =
    document.getElementById("bodyText");

const author =
    document.getElementById("author");

const backgroundColor =
    document.getElementById("backgroundColor");

const backgroundHex =
    document.getElementById("backgroundHex");

const overlayOpacity =
    document.getElementById("overlayOpacity");

const headlineSize =
    document.getElementById("headlineSize");

const bodySize =
    document.getElementById("bodySize");

const textAlign =
    document.getElementById("textAlign");

const headlineColor =
    document.getElementById("headlineColor");

const bodyColor =
    document.getElementById("bodyColor");

const graphicCanvas =
    document.getElementById("graphicCanvas");

const canvasHeadline =
    document.getElementById("canvasHeadline");

const canvasBody =
    document.getElementById("canvasBody");

const canvasAuthor =
    document.getElementById("canvasAuthor");

const canvasBackground =
    document.getElementById("canvasBackground");

const canvasLogo =
    document.getElementById("canvasLogo");

const canvasOverlay =
    document.getElementById("canvasOverlay");


/* =========================================================
   THEME
========================================================= */

const savedTheme =
    localStorage.getItem(
        "cc_social_editor_theme"
    );

if (savedTheme === "dark") {

    document.body.classList.add("dark");

    document.getElementById(
        "themeBtn"
    ).textContent = "☀️";
}

document.getElementById(
    "themeBtn"
).addEventListener("click", () => {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "cc_social_editor_theme",
        dark ? "dark" : "light"
    );

    document.getElementById(
        "themeBtn"
    ).textContent =
        dark ? "☀️" : "🌙";
});


/* =========================================================
   PLATFORM BUTTONS
========================================================= */

document
    .querySelectorAll(".platform-btn")
    .forEach(button => {

        button.addEventListener("click", () => {

            document
                .querySelectorAll(".platform-btn")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            button.classList.add("active");

            currentPlatform =
                button.dataset.platform;

            currentWidth =
                Number(button.dataset.width);

            currentHeight =
                Number(button.dataset.height);

            updateCanvasSize();

        });

    });


/* =========================================================
   TEMPLATE BUTTONS
========================================================= */

document
    .querySelectorAll(".template-btn")
    .forEach(button => {

        button.addEventListener("click", () => {

            document
                .querySelectorAll(".template-btn")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            button.classList.add("active");

            currentTemplate =
                button.dataset.template;

            applyTemplate();

        });

    });


/* =========================================================
   INPUT EVENTS
========================================================= */

[
    title,
    headline,
    bodyText,
    author,
    backgroundColor,
    backgroundHex,
    overlayOpacity,
    headlineSize,
    bodySize,
    textAlign,
    headlineColor,
    bodyColor
].forEach(element => {

    element.addEventListener(
        "input",
        updateCanvas
    );

    element.addEventListener(
        "change",
        updateCanvas
    );

});


/* =========================================================
   COLOR
========================================================= */

backgroundColor.addEventListener(
    "input",
    () => {

        backgroundHex.value =
            backgroundColor.value;

        updateCanvas();

    }
);

backgroundHex.addEventListener(
    "change",
    () => {

        let value =
            backgroundHex.value.trim();

        if (
            /^#[0-9A-Fa-f]{6}$/.test(value)
        ) {

            backgroundColor.value =
                value;

/* =========================================================

========================================================= */

function applyCustomSize() {

    const width =
        Number(
            document.getElementById(
                "customWidth"
            ).value
        );

    const height =
        Number(
            document.getElementById(
                "customHeight"
            ).value
        );

        width > 4000 ||
        height > 4000

        .forEach(btn =>

/* =========================================================
   UPDATE CANVAS
========================================================= */

function updateCanvas() {

    graphicCanvas.style.background =
        backgroundColor.value;

    canvasHeadline.textContent =
        headline.value;

    canvasBody.textContent =
        bodyText.value;

    canvasAuthor.textContent =
        author.value;

    canvasHeadline.style.fontSize =
        `${headlineSize.value}px`;

    canvasBody.style.fontSize =
        `${bodySize.value}px`;

    canvasHeadline.style.textAlign =
        textAlign.value;

    canvasBody.style.textAlign =
        textAlign.value;

    canvasHeadline.style.color =
        headlineColor.value;

    canvasBody.style.color =
        bodyColor.value;

    canvasOverlay.style.background =
        `rgba(0,0,0,${Number(
            overlayOpacity.value
        ) / 100})`;

    /*
     * Horizontal alignment
     */

    if (textAlign.value === "left") {

        canvasHeadline.style.left = "9%";
        canvasHeadline.style.transform =
            "translateY(-50%)";

        canvasBody.style.left = "12%";
        canvasBody.style.transform =
            "translateY(-50%)";

    } else if (textAlign.value === "right") {

        canvasHeadline.style.left = "91%";
        canvasHeadline.style.transform =
            "translate(-100%, -50%)";

        canvasBody.style.left = "88%";
        canvasBody.style.transform =
            "translate(-100%, -50%)";

    } else {

        canvasHeadline.style.left = "50%";
        canvasHeadline.style.transform =
            "translate(-50%, -50%)";

        canvasBody.style.left = "50%";
        canvasBody.style.transform =
            "translate(-50%, -50%)";

    }

    if (backgroundImageUrl) {

        canvasBackground.src =
            backgroundImageUrl;

        canvasBackground.style.display =
            "block";

    } else {

        canvasBackground.style.display =
            "none";

    }

    if (logoUrl) {

            logoUrl;

        canvasLogo.style.display =
            "block";

    } else {

            "none";

}

/* =========================================================
   AUTH
========================================================= */

async function getUser() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();

    if (error) {

        console.error(error);

        return null;
    }

    return data.user;
}


/* =========================================================
   UPLOAD FILE
========================================================= */

async function uploadFile(
    file,
    userId,
    prefix
) {

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();

    const fileName =
        `${userId}/${prefix}-${Date.now()}-${Math.random()
            .toString(36)
            .substring(2)}.${extension}`;

    const {
        error
    } =
        await supabaseClient
            .storage
            .from("social-graphics")
            .upload(
                fileName,
                file,
                {
                    upsert: false,
                    contentType: file.type
                }
            );

    if (error)
        throw error;

    const {
        data
    } =
        supabaseClient
            .storage
            .from("social-graphics")
            .getPublicUrl(fileName);

    return data.publicUrl;
}


/* =========================================================
   SAVE / UPDATE
========================================================= */

async function saveGraphic() {

    const user =
        await getUser();

    if (!user) {

        showToast(
            "Please sign in before saving."
        );

        return;
    }

    if (!title.value.trim()) {

        showToast(
            "Please enter a graphic title."
        );

        title.focus();

        return;
    }

    setLoading(
        true,
        currentGraphicId
            ? "Updating graphic..."
            : "Saving graphic..."
    );

    try {

        /* Upload background */

        if (backgroundFile) {

            backgroundImageUrl =
                await uploadFile(
                    backgroundFile,
                    user.id,
                    "background"
                );

            backgroundFile =
                null;
        }


        /* Upload logo */

        if (logoFile) {

            logoUrl =
                await uploadFile(
                    logoFile,
                    user.id,
                    "logo"
                );

            logoFile =
                null;
        }


        const graphicData = {

            headlineColor:
                headlineColor.value,

            bodyColor:
                bodyColor.value,

            headlineSize:
                Number(
                    headlineSize.value
                ),

            bodySize:
                Number(
                    bodySize.value
                ),

            headlineY:
                currentHeight * .42,

            bodyY:
                currentHeight * .61,

            authorY:
                currentHeight * .93,

            authorSize:
                Math.max(
                    18,
                    Number(
                        bodySize.value
                    ) * .8
                ),

            overlay:
                `rgba(0,0,0,${Number(
                    overlayOpacity.value
                ) / 100})`,

            headlineAlign:
                textAlign.value,

            bodyAlign:
                textAlign.value,

            headlineLineHeight:
                Number(
                    headlineSize.value
                ) * 1.08,

            bodyLineHeight:
                Number(
                    bodySize.value
                ) * 1.35
        };


        const payload = {

            title:
                title.value.trim(),

            platform:
                currentPlatform,

            width:
                currentWidth,

            height:
                currentHeight,

            background_color:
                backgroundColor.value,

            background_type:
                backgroundImageUrl
                    ? "image"
                    : "color",

            background_image_url:
                backgroundImageUrl,

            logo_url:
                logoUrl,

            headline:
                headline.value,

            body_text:
                bodyText.value,

            author_name:
                author.value,

            template:
                currentTemplate,

            graphic_data:
                graphicData
        };


        /* UPDATE */

        if (currentGraphicId) {

            const {
                error
            } =
                await supabaseClient
                    .from("social_graphics")
                    .update(payload)
                    .eq(
                        "id",
                        currentGraphicId
                    )
                    .eq(
                        "user_id",
                        user.id
                    );

            if (error)
                throw error;

            showToast(
                "Graphic updated successfully."
            );

        }


        /* INSERT */

        else {

            payload.user_id =
                user.id;

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("social_graphics")
                    .insert(payload)
                    .select()
                    .single();

            if (error)
                throw error;

            currentGraphicId =
                data.id;

            document.getElementById(
                "editorHeading"
            ).textContent =
                "Edit Social Graphic";

            document.getElementById(
                "deleteTopBtn"
            ).style.display =
                "block";

            document.getElementById(
                "saveBtn"
            ).textContent =
                "Update Graphic";

            showToast(
                "Graphic saved successfully."
            );
        }

    } catch (error) {

        console.error(error);

        showToast(
            "Save failed: " +
            error.message
        );

    } finally {

        setLoading(false);
    }
}


/* =========================================================
   DELETE
========================================================= */

async function deleteCurrentGraphic() {

    if (!currentGraphicId)
        return;

    const confirmed =
        confirm(
            "Delete this graphic permanently?"
        );

    if (!confirmed)
        return;

    const user =
        await getUser();

    if (!user)
        return;

    setLoading(
        true,
        "Deleting graphic..."
    );

    try {

        const {
            error
        } =
            await supabaseClient
                .from("social_graphics")
                .delete()
                .eq(
                    "id",
                    currentGraphicId
                )
                .eq(
                    "user_id",
                    user.id
                );

        if (error)
            throw error;

        showToast(
            "Graphic deleted."
        );

        setTimeout(() => {

            window.location.href =
                "social-graphic.html";

        }, 700);

    } catch (error) {

        console.error(error);

        showToast(
            "Delete failed: " +
            error.message
        );

    } finally {

        setLoading(false);
    }
}


/* =========================================================
   DOWNLOAD
========================================================= */

async function downloadGraphic() {

    setLoading(
        true,
        "Preparing PNG..."
    );

    try {

        const canvas =
            await html2canvas(
                graphicCanvas,
                {
                    scale: 2,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: null,
                    logging: false
                }
            );

        const link =
            document.createElement("a");

        link.download =
            safeFileName(
                title.value ||
                "social-graphic"
            ) + ".png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        document.body.appendChild(link);

        link.click();

        link.remove();

        showToast(
            "PNG downloaded."
        );

    } catch (error) {

        console.error(error);

        showToast(
            "Download failed."
        );

    } finally {

        setLoading(false);
    }
}


/* =========================================================
   SAVE TO PHONE
========================================================= */

async function saveToPhone() {

    setLoading(
        true,
        "Preparing your graphic..."
    );

    try {

        const canvas =
            await html2canvas(
                graphicCanvas,
                {
                    scale: 2,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: null,
                    logging: false
                }
            );

        canvas.toBlob(
            async blob => {

                if (!blob) {

                    showToast(
                        "Unable to create image."
                    );

                    setLoading(false);

                    return;
                }

                const fileName =
                    safeFileName(
                        title.value ||
                        "social-graphic"
                    ) + ".png";


                /* Android / modern browser */

                if (
                    navigator.share &&
                    window.File
                ) {

                    try {

                        const file =
                            new File(
                                [blob],
                                fileName,
                                {
                                    type:
                                        "image/png"
                                }
                            );

                        if (
                            navigator.canShare &&
                            navigator.canShare({
                                files: [file]
                            })
                        ) {

                            await navigator.share({

                                title:
                                    title.value ||
                                    "Social Graphic",

                                files: [file]

                            });

                            showToast(
                                "Graphic ready to save or share."
                            );

                            setLoading(false);

                            return;
                        }

                    } catch (shareError) {

                        if (
                            shareError.name ===
                            "AbortError"
                        ) {

                            setLoading(false);

                            return;
                        }

                    }

                }


                /* Fallback download */

                const url =
                    URL.createObjectURL(
                        blob
                    );

                const link =
                    document.createElement("a");

                link.href =
                    url;

                link.download =
                    fileName;

                document.body.appendChild(
                    link
                );

                link.click();

                link.remove();

                setTimeout(
                    () =>
                        URL.revokeObjectURL(url),
                    1000
                );

                showToast(
                    "Graphic saved to your device."
                );

                setLoading(false);

            },
            "image/png"
        );

    } catch (error) {

        console.error(error);

        showToast(
            "Save to Phone failed."
        );

        setLoading(false);
    }
}


/* =========================================================
   LOAD EXISTING GRAPHIC
========================================================= */

async function loadExistingGraphic() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");

    if (!id)
        return;

    currentGraphicId =
        id;

    const user =
        await getUser();

    if (!user) {

        showToast(
            "Please sign in first."
        );

        return;
    }

    setLoading(
        true,
        "Loading graphic..."
    );

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("social_graphics")
                .select("*")
                .eq(
                    "id",
                    id
                )
                .eq(
                    "user_id",
                    user.id
                )
                .single();

        if (error)
            throw error;


        title.value =
            data.title || "";

        headline.value =
            data.headline || "";

        bodyText.value =
            data.body_text || "";

        author.value =
            data.author_name || "";


        currentPlatform =
            data.platform ||
            "Instagram";

        currentWidth =
            Number(data.width) ||
            1080;

        currentHeight =
            Number(data.height) ||
            1080;

        currentTemplate =
            data.template ||
            "modern";


        backgroundImageUrl =
            data.background_image_url ||
            null;

        logoUrl =
            data.logo_url ||
            null;


        if (data.background_color) {

            backgroundColor.value =
                data.background_color;

            backgroundHex.value =
                data.background_color;

        }


        const graphicData =
            data.graphic_data || {};


        if (graphicData.headlineColor)
            headlineColor.value =
                graphicData.headlineColor;


        if (graphicData.bodyColor)
            bodyColor.value =
                graphicData.bodyColor;


        if (graphicData.headlineSize)
            headlineSize.value =
                graphicData.headlineSize;


        if (graphicData.bodySize)
            bodySize.value =
                graphicData.bodySize;


        if (graphicData.headlineAlign)
            textAlign.value =
                graphicData.headlineAlign;


        if (graphicData.overlay) {

            const match =
                String(
                    graphicData.overlay
                ).match(
                    /rgba?\([^,]+,[^,]+,[^,]+,([^)]+)\)/
                );

            if (match) {

                overlayOpacity.value =
                    Math.round(
                        Number(match[1]) * 100
                    );

            }

        }


        /* Platform active */

        document
            .querySelectorAll(".platform-btn")
            .forEach(btn => {

                btn.classList.toggle(
                    "active",
                    btn.dataset.platform ===
                    currentPlatform
                );

            });


        /* Template active */

        document
            .querySelectorAll(".template-btn")
            .forEach(btn => {

                btn.classList.toggle(
                    "active",
                    btn.dataset.template ===
                    currentTemplate
                );

            });


        /* Custom dimensions */

        if (
            currentPlatform ===
            "Custom"
        ) {

            document.getElementById(
                "customWidth"
            ).value =
                currentWidth;

            document.getElementById(
                "customHeight"
            ).value =
                currentHeight;

        }


        /* Background preview */

        if (backgroundImageUrl) {

            document.getElementById(
                "backgroundPreview"
            ).src =
                backgroundImageUrl;

            document.getElementById(
                "backgroundPreview"
            ).style.display =
                "block";

        }


        /* Logo preview */

        if (logoUrl) {

            document.getElementById(
                "logoPreview"
            ).src =
                logoUrl;

            document.getElementById(
                "logoPreview"
            ).style.display =
                "block";

        }


        document.getElementById(
            "editorHeading"
        ).textContent =
            "Edit Social Graphic";


        document.getElementById(
            "deleteTopBtn"
        ).style.display =
            "block";


        document.getElementById(
            "saveBtn"
        ).textContent =
            "Update Graphic";


        document.getElementById(
            "headlineSizeValue"
        ).textContent =
            headlineSize.value;


        document.getElementById(
            "bodySizeValue"
        ).textContent =
            bodySize.value;


        document.getElementById(
            "overlayValue"
        ).textContent =
            overlayOpacity.value +
            "%";


        updateCanvasSize();

    } catch (error) {

        console.error(error);

        showToast(
            "Unable to load graphic: " +
            error.message
        );

    } finally {

        setLoading(false);
    }
}

/* =========================================================
   UTILITIES
========================================================= */

function safeFileName(name) {

    return String(name)

        .replace(
            /[^a-z0-9-_]+/gi,
            "-"
        )

        .replace(
            /-+/g,
            "-"
        )

        .replace(
            /^-|-$/g,
            ""
        )

        .toLowerCase()

        ||
        "social-graphic";
}


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );
}


function setLoading(
    show,
    message = "Loading..."
) {

    const loading =
        document.getElementById(
            "loading"
        );

    document.getElementById(
        "loadingText"
    ).textContent =
        message;

    loading.classList.toggle(
        "show",
        show
    );
}
