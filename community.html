<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Community • CareerCraft</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #172033;
      min-height: 100vh;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* HEADER */

    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      color: #2563eb;
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      border: none;
      background: #f1f5f9;
      color: #334155;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #e2e8f0;
    }

    /* PAGE */

    .page {
      max-width: 1180px;
      margin: 24px auto 100px;
      padding: 0 18px;
    }

    /* COMMUNITY HERO */

    .community-header {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .cover {
      height: 170px;
      background:
        linear-gradient(135deg, #2563eb, #4f46e5, #7c3aed);
      position: relative;
    }

    .cover-pattern {
      position: absolute;
      inset: 0;
      opacity: .12;
      background-image:
        radial-gradient(circle at 20% 30%, white 0 2px, transparent 3px),
        radial-gradient(circle at 70% 60%, white 0 2px, transparent 3px);
      background-size: 55px 55px;
    }

    .community-info {
      padding: 0 24px 24px;
      position: relative;
    }

    .community-icon {
      width: 82px;
      height: 82px;
      border-radius: 18px;
      background: white;
      border: 5px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,.12);
      margin-top: -41px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    .community-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-top: 12px;
    }

    .community-name {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .community-description {
      color: #64748b;
      line-height: 1.5;
      max-width: 760px;
    }

    .community-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 13px;
      color: #64748b;
      font-size: 14px;
    }

    .join-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
      min-width: 100px;
    }

    .join-btn.joined {
      background: #e8f0ff;
      color: #2563eb;
    }

    .join-btn:hover {
      opacity: .9;
    }

    /* LAYOUT */

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 20px;
      align-items: start;
    }

    /* POST CREATOR */

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
    }

    .create-post {
      padding: 18px;
      margin-bottom: 18px;
    }

    .create-row {
      display: flex;
      gap: 12px;
    }

    .my-avatar,
    .avatar {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1d4ed8;
      font-weight: 800;
      overflow: hidden;
    }

    .avatar img,
    .my-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-input {
      width: 100%;
      min-height: 95px;
      resize: vertical;
      border: 1px solid #dbe2ea;
      border-radius: 13px;
      padding: 13px;
      outline: none;
      font-size: 15px;
      line-height: 1.5;
    }

    .post-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    .post-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .post-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 11px 20px;
      border-radius: 10px;
      font-weight: 700;
    }

    .post-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* POSTS */

    .post-card {
      padding: 18px;
      margin-bottom: 16px;
    }

    .post-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .author-name {
      font-weight: 750;
      font-size: 15px;
    }

    .post-time {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 3px;
    }

    .more-btn {
      border: none;
      background: transparent;
      font-size: 22px;
      color: #64748b;
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }

    .more-btn:hover {
      background: #f1f5f9;
    }

    .post-content {
      margin: 15px 0 3px 55px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      color: #334155;
    }

    .post-footer {
      margin: 15px 0 0 55px;
      border-top: 1px solid #eef2f7;
      padding-top: 12px;
      display: flex;
      gap: 20px;
    }

    .post-footer button {
      border: none;
      background: transparent;
      color: #64748b;
      font-weight: 600;
      padding: 5px;
    }

    .post-footer button:hover {
      color: #2563eb;
    }

    /* SIDEBAR */

    .side-card {
      padding: 20px;
      margin-bottom: 18px;
    }

    .side-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 13px;
    }

    .side-text {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid #eef2f7;
      font-size: 14px;
    }

    .stat:last-child {
      border-bottom: none;
    }

    .stat span:last-child {
      font-weight: 700;
      color: #172033;
    }

    /* EMPTY */

    .empty {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 50px 25px;
      text-align: center;
    }

    .empty-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .empty h3 {
      margin-bottom: 7px;
      font-size: 20px;
    }

    .empty p {
      color: #64748b;
    }

    /* LOADING */

    .loading {
      padding: 35px;
      text-align: center;
      color: #64748b;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #172033;
      color: white;
      padding: 12px 17px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 200;
      max-width: calc(100% - 30px);
      text-align: center;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: #b91c1c;
    }

    /* MOBILE NAV */

    .bottom-nav {
      display: none;
    }

    @media (max-width: 800px) {

      .topbar {
        padding: 0 14px;
      }

      .brand {
        font-size: 20px;
      }

      .page {
        margin-top: 15px;
        padding: 0 10px 85px;
      }

      .cover {
        height: 130px;
      }

      .community-info {
        padding: 0 16px 18px;
      }

      .community-icon {
        width: 72px;
        height: 72px;
        margin-top: -36px;
      }

      .community-title-row {
        flex-direction: column;
      }

      .community-name {
        font-size: 23px;
      }

      .join-btn {
        width: 100%;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .post-content,
      .post-footer {
        margin-left: 0;
      }

      .post-content {
        margin-top: 14px;
      }

      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: white;
        border-top: 1px solid #e5e7eb;
        z-index: 100;
        justify-content: space-around;
        align-items: center;
      }

      .bottom-nav a {
        text-decoration: none;
        color: #64748b;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }

      .bottom-nav span {
        display: block;
        font-size: 21px;
        margin-bottom: 2px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <a href="index.html" class="brand">CareerCraft</a>

  <div class="top-actions">
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>
</header>

<main class="page">

  <!-- COMMUNITY HEADER -->
  <section class="community-header">

    <div class="cover">
      <div class="cover-pattern"></div>
    </div>

    <div class="community-info">

      <div class="community-icon" id="communityIcon">
        💼
      </div>

      <div class="community-title-row">

        <div>
          <h1 class="community-name" id="communityName">
            Loading community...
          </h1>

          <p class="community-description" id="communityDescription">
            Please wait while the community loads.
          </p>

          <div class="community-meta">
            <span id="communityCategory">Community</span>
            <span>•</span>
            <span id="memberCount">0 members</span>
          </div>
        </div>

        <button class="join-btn" id="joinBtn">
          Join
        </button>

      </div>

    </div>

  </section>

  <div class="content-grid">

    <!-- MAIN FEED -->

    <section>

      <!-- CREATE POST -->
      <div class="card create-post">

        <div class="create-row">

          <div class="my-avatar" id="myAvatar">
            U
          </div>

          <textarea
            id="postInput"
            class="post-input"
            placeholder="Share something with this community..."
            maxlength="5000"
          ></textarea>

        </div>

        <div class="post-actions">
          <button class="post-btn" id="postBtn">
            Post
          </button>
        </div>

      </div>

      <!-- FEED -->
      <div id="feed">

        <div class="loading">
          <div class="spinner"></div>
          Loading posts...
        </div>

      </div>

    </section>

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="card side-card">

        <h3 class="side-title">About this community</h3>

        <p class="side-text" id="sideDescription">
          Loading...
        </p>

      </div>

      <div class="card side-card">

        <h3 class="side-title">Community stats</h3>

        <div class="stat">
          <span>Members</span>
          <span id="sideMembers">0</span>
        </div>

        <div class="stat">
          <span>Posts</span>
          <span id="postCount">0</span>
        </div>

        <div class="stat">
          <span>Status</span>
          <span id="membershipStatus">Not joined</span>
        </div>

      </div>

    </aside>

  </div>

</main>

<!-- MOBILE NAV -->

<nav class="bottom-nav">

  <a href="index.html">
    <span>⌂</span>
    Home
  </a>

  <a href="job-finder.html">
    <span>💼</span>
    Jobs
  </a>

  <a href="communities.html">
    <span>👥</span>
    Communities
  </a>

  <a href="messages.html">
    <span>💬</span>
    Messages
  </a>

</nav>

<div class="toast" id="toast"></div>

<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://upcxmlbgmqhaqieldmyk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     GLOBAL VARIABLES
  ========================================================= */

  const params = new URLSearchParams(
    window.location.search
  );

  const communityId = params.get("id");

  let currentUser = null;
  let currentProfile = null;
  let community = null;
  let isMember = false;
  let posts = [];
  let profileMap = {};

  let realtimeChannel = null;


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const communityName =
    document.getElementById("communityName");

  const communityDescription =
    document.getElementById("communityDescription");

  const communityCategory =
    document.getElementById("communityCategory");

  const memberCount =
    document.getElementById("memberCount");

  const communityIcon =
    document.getElementById("communityIcon");

  const joinBtn =
    document.getElementById("joinBtn");

  const feed =
    document.getElementById("feed");

  const postInput =
    document.getElementById("postInput");

  const postBtn =
    document.getElementById("postBtn");

  const myAvatar =
    document.getElementById("myAvatar");

  const sideDescription =
    document.getElementById("sideDescription");

  const sideMembers =
    document.getElementById("sideMembers");

  const postCount =
    document.getElementById("postCount");

  const membershipStatus =
    document.getElementById("membershipStatus");


  /* =========================================================
     START
  ========================================================= */

  document.addEventListener("DOMContentLoaded", init);


  async function init() {

    if (!communityId) {

      showToast(
        "No community was selected.",
        true
      );

      setTimeout(() => {
        window.location.href =
          "communities.html";
      }, 1200);

      return;
    }

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if (error || !data.session) {

      window.location.href =
        "login.html";

      return;
    }

    currentUser =
      data.session.user;

    await loadProfile();
    await loadCommunity();
    await loadMembership();
    await loadPosts();

    setupRealtime();
  }


  /* =========================================================
     PROFILE
  ========================================================= */

  async function loadProfile() {

    try {

      let result =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq("ID", currentUser.id)
          .maybeSingle();

      if (result.error) {

        result =
          await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", currentUser.id)
            .maybeSingle();
      }

      if (!result.error && result.data) {

        currentProfile =
          result.data;

      }

      const name =
        getProfileName(
          currentProfile
        );

      const avatar =
        getProfileAvatar(
          currentProfile
        );

      renderAvatar(
        myAvatar,
        name,
        avatar
      );

    } catch (error) {

      renderAvatar(
        myAvatar,
        "User",
        null
      );
    }
  }


  /* =========================================================
     COMMUNITY
  ========================================================= */

  async function loadCommunity() {

    const {
      data,
      error
    } = await supabaseClient
      .from("communities")
      .select("*")
      .eq("id", communityId)
      .single();

    if (error) {

      console.error(error);

      showToast(
        "Unable to load this community.",
        true
      );

      return;
    }

    community = data;

    communityName.textContent =
      community.name ||
      "Community";

    communityDescription.textContent =
      community.description ||
      "Welcome to this CareerCraft community.";

    sideDescription.textContent =
      community.description ||
      "A professional community on CareerCraft.";

    communityCategory.textContent =
      community.category ||
      community.type ||
      "Professional Community";

    communityIcon.textContent =
      community.icon ||
      "💼";
  }


  /* =========================================================
     MEMBERSHIP
  ========================================================= */

  async function loadMembership() {

    const {
      data,
      error
    } = await supabaseClient
      .from("community_members")
      .select("*")
      .eq("community_id", communityId);

    if (error) {

      console.error(
        "Membership error:",
        error
      );

      return;
    }

    const members =
      data || [];

    const mine =
      members.find(
        member =>
          member.user_id ===
          currentUser.id
      );

    isMember =
      !!mine;

    updateMembershipUI(
      members.length
    );
  }


  function updateMembershipUI(count) {

    memberCount.textContent =
      `${count} ${count === 1 ? "member" : "members"}`;

    sideMembers.textContent =
      count;

    membershipStatus.textContent =
      isMember
        ? "Joined"
        : "Not joined";

    joinBtn.textContent =
      isMember
        ? "Joined ✓"
        : "Join";

    joinBtn.classList.toggle(
      "joined",
      isMember
    );
  }


  /* =========================================================
     JOIN / LEAVE
  ========================================================= */

  joinBtn.addEventListener(
    "click",
    async () => {

      if (!community) {
        return;
      }

      joinBtn.disabled = true;

      try {

        if (!isMember) {

          const {
            error
          } = await supabaseClient
            .from("community_members")
            .insert({
              community_id:
                communityId,
              user_id:
                currentUser.id
            });

          if (error) {

            if (error.code === "23505") {

              isMember = true;

            } else {

              throw error;
            }

          } else {

            isMember = true;

            showToast(
              "You joined the community."
            );
          }

        } else {

          const {
            error
          } = await supabaseClient
            .from("community_members")
            .delete()
            .eq(
              "community_id",
              communityId
            )
            .eq(
              "user_id",
              currentUser.id
            );

          if (error) {
            throw error;
          }

          isMember = false;

          showToast(
            "You left the community."
          );
        }

        await loadMembership();

      } catch (error) {

        console.error(error);

        showToast(
          error.message ||
          "Unable to update membership.",
          true
        );

      } finally {

        joinBtn.disabled = false;
      }
    }
  );


  /* =========================================================
     LOAD POSTS
  ========================================================= */

  async function loadPosts() {

    feed.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        Loading posts...
      </div>
    `;

    const {
      data,
      error
    } = await supabaseClient
      .from("community_posts")
      .select("*")
      .eq(
        "community_id",
        communityId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

    if (error) {

      console.error(
        "Posts error:",
        error
      );

      feed.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <h3>Unable to load posts</h3>
          <p>${escapeHtml(error.message)}</p>
        </div>
      `;

      return;
    }

    posts =
      data || [];

    await loadPostProfiles();

    renderPosts();
  }


  /* =========================================================
     LOAD POST AUTHORS
  ========================================================= */

  async function loadPostProfiles() {

    profileMap = {};

    const authorIds =
      [
        ...new Set(
          posts
            .map(post =>
              post.author_id
            )
            .filter(Boolean)
        )
      ];

    if (!authorIds.length) {
      return;
    }

    let result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .in("ID", authorIds);

    if (result.error) {

      result =
        await supabaseClient
          .from("profiles")
          .select("*")
          .in("id", authorIds);
    }

    if (
      !result.error &&
      result.data
    ) {

      result.data.forEach(
        profile => {

          const id =
            profile.ID ||
            profile.id;

          if (id) {
            profileMap[id] =
              profile;
          }
        }
      );
    }
  }


  /* =========================================================
     RENDER POSTS
  ========================================================= */

  function renderPosts() {

    postCount.textContent =
      posts.length;

    if (!posts.length) {

      feed.innerHTML = `
        <div class="empty">
          <div class="empty-icon">💬</div>
          <h3>Start the conversation</h3>
          <p>
            Be the first person to share something
            with this community.
          </p>
        </div>
      `;

      return;
    }

    feed.innerHTML =
      posts
        .map(renderPost)
        .join("");
  }


  function renderPost(post) {

    const profile =
      profileMap[post.author_id] ||
      (
        post.author_id ===
        currentUser.id
          ? currentProfile
          : null
      );

    const name =
      getProfileName(profile) ||
      "CareerCraft Member";

    const avatar =
      getProfileAvatar(profile);

    const initials =
      getInitials(name);

    const time =
      formatTime(post.created_at);

    const isOwner =
      post.author_id ===
      currentUser.id;

    return `
      <article
        class="card post-card"
        data-post-id="${escapeAttribute(post.id)}"
      >

        <div class="post-top">

          <div class="author">

            <div class="avatar">

              ${
                avatar
                  ? `<img src="${escapeAttribute(avatar)}" alt="">`
                  : initials
              }

            </div>

            <div>

              <div class="author-name">
                ${escapeHtml(name)}
              </div>

              <div class="post-time">
                ${escapeHtml(time)}
              </div>

            </div>

          </div>

          ${
            isOwner
              ? `
                <button
                  class="more-btn"
                  onclick="deletePost('${escapeAttribute(post.id)}')"
                  title="Delete post"
                >
                  ⋯
                </button>
              `
              : ""
          }

        </div>

        <div class="post-content">
          ${escapeHtml(post.content || "")}
        </div>

        <div class="post-footer">

          <button
            onclick="sharePost('${escapeAttribute(post.id)}')"
          >
            ↗ Share
          </button>

          ${
            isOwner
              ? `
                <button
                  onclick="deletePost('${escapeAttribute(post.id)}')"
                >
                  🗑 Delete
                </button>
              `
              : ""
          }

        </div>

      </article>
    `;
  }


  /* =========================================================
     CREATE POST
  ========================================================= */

  postBtn.addEventListener(
    "click",
    createPost
  );


  postInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
      ) {

        createPost();
      }
    }
  );


  async function createPost() {

    const content =
      postInput.value.trim();

    if (!content) {

      showToast(
        "Write something before posting.",
        true
      );

      postInput.focus();

      return;
    }

    if (content.length > 5000) {

      showToast(
        "Your post is too long.",
        true
      );

      return;
    }

    postBtn.disabled = true;
    postBtn.textContent =
      "Posting...";

    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("community_posts")
        .insert({
          community_id:
            communityId,

          author_id:
            currentUser.id,

          content:
            content
        })
        .select()
        .single();

      if (error) {
        throw error;
      }

      postInput.value = "";

      showToast(
        "Post published."
      );

      /*
       * Realtime normally adds the post automatically.
       * Reloading also makes the page reliable when
       * Realtime is not enabled yet.
       */

      await loadPosts();

    } catch (error) {

      console.error(error);

      showToast(
        error.message ||
        "Unable to publish your post.",
        true
      );

    } finally {

      postBtn.disabled = false;
      postBtn.textContent =
        "Post";
    }
  }


  /* =========================================================
     DELETE POST
  ========================================================= */

  window.deletePost =
    async function(postId) {

      const post =
        posts.find(
          item =>
            item.id === postId
        );

      if (!post) {
        return;
      }

      if (
        post.author_id !==
        currentUser.id
      ) {

        showToast(
          "You can only delete your own posts.",
          true
        );

        return;
      }

      const confirmed =
        confirm(
          "Delete this post?"
        );

      if (!confirmed) {
        return;
      }

      try {

        const {
          error
        } = await supabaseClient
          .from("community_posts")
          .delete()
          .eq(
            "id",
            postId
          )
          .eq(
            "author_id",
            currentUser.id
          );

        if (error) {
          throw error;
        }

        posts =
          posts.filter(
            item =>
              item.id !== postId
          );

        renderPosts();

        showToast(
          "Post deleted."
        );

      } catch (error) {

        console.error(error);

        showToast(
          error.message ||
          "Unable to delete post.",
          true
        );
      }
    };


  /* =========================================================
     SHARE POST
  ========================================================= */

  window.sharePost =
    async function(postId) {

      const url =
        window.location.origin +
        window.location.pathname +
        "?id=" +
        encodeURIComponent(
          communityId
        ) +
        "#post-" +
        encodeURIComponent(
          postId
        );

      try {

        if (
          navigator.share
        ) {

          await navigator.share({
            title:
              community?.name ||
              "CareerCraft Community",

            text:
              "Check out this post on CareerCraft.",

            url
          });

        } else {

          await navigator.clipboard.writeText(
            url
          );

          showToast(
            "Post link copied."
          );
        }

      } catch (error) {

        if (
          error.name !==
          "AbortError"
        ) {

          try {

            await navigator.clipboard.writeText(
              url
            );

            showToast(
              "Post link copied."
            );

          } catch (copyError) {

            showToast(
              "Unable to share this post.",
              true
            );
          }
        }
      }
    };


  /* =========================================================
     REALTIME
  ========================================================= */

  function setupRealtime() {

    if (realtimeChannel) {

      supabaseClient.removeChannel(
        realtimeChannel
      );
    }

    realtimeChannel =
      supabaseClient
        .channel(
          "community-posts-" +
          communityId
        )

        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "community_posts",
            filter:
              `community_id=eq.${communityId}`
          },

          async payload => {

            const newPost =
              payload.new;

            if (
              posts.some(
                post =>
                  post.id ===
                  newPost.id
              )
            ) {

              return;
            }

            posts.unshift(
              newPost
            );

            await loadPostProfiles();

            renderPosts();
          }
        )

        .on(
          "postgres_changes",
          {
            event: "DELETE",
            schema: "public",
            table: "community_posts"
          },

          payload => {

            const deletedId =
              payload.old?.id;

            if (!deletedId) {
              return;
            }

            posts =
              posts.filter(
                post =>
                  post.id !==
                  deletedId
              );

            renderPosts();
          }
        )

        .subscribe(
          status => {

            console.log(
              "Community realtime:",
              status
            );

          }
        );
  }


  /* =========================================================
     PROFILE HELPERS
  ========================================================= */

  function getProfileName(profile) {

    if (!profile) {
      return null;
    }

    return (
      profile["FULL NAME"] ||
      profile.full_name ||
      profile.fullName ||
      profile.name ||
      profile.username ||
      profile.email ||
      null
    );
  }


  function getProfileAvatar(profile) {

    if (!profile) {
      return null;
    }

    return (
      profile.avatar_url ||
      profile.avatar ||
      profile.profile_image ||
      profile.profile_image_url ||
      profile.photo_url ||
      null
    );
  }


  function getInitials(name) {

    if (!name) {
      return "U";
    }

    const words =
      name
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if (!words.length) {
      return "U";
    }

    if (words.length === 1) {

      return words[0]
        .substring(0, 2)
        .toUpperCase();
    }

    return (
      words[0][0] +
      words[words.length - 1][0]
    ).toUpperCase();
  }


  function renderAvatar(
    element,
    name,
    avatar
  ) {

    if (!element) {
      return;
    }

    if (avatar) {

      element.innerHTML =
        `<img src="${escapeAttribute(avatar)}" alt="">`;

    } else {

      element.textContent =
        getInitials(name);
    }
  }


  /* =========================================================
     TIME
  ========================================================= */

  function formatTime(dateString) {

    if (!dateString) {
      return "";
    }

    const date =
      new Date(dateString);

    const now =
      new Date();

    const seconds =
      Math.floor(
        (now - date) / 1000
      );

    if (seconds < 10) {
      return "Just now";
    }

    if (seconds < 60) {
      return `${seconds}s ago`;
    }

    const minutes =
      Math.floor(
        seconds / 60
      );

    if (minutes < 60) {
      return `${minutes}m ago`;
    }

    const hours =
      Math.floor(
        minutes / 60
      );

    if (hours < 24) {
      return `${hours}h ago`;
    }

    const days =
      Math.floor(
        hours / 24
      );

    if (days < 7) {
      return `${days}d ago`;
    }

    return date.toLocaleDateString(
      undefined,
      {
        month: "short",
        day: "numeric",
        year:
          date.getFullYear() !==
          now.getFullYear()
            ? "numeric"
            : undefined
      }
    );
  }


  /* =========================================================
     SECURITY / HTML HELPERS
  ========================================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function escapeAttribute(value) {

    return escapeHtml(value);
  }


  /* =========================================================
     TOAST
  ========================================================= */

  let toastTimer;

  function showToast(
    message,
    isError = false
  ) {

    const toast =
      document.getElementById(
        "toast"
      );

    toast.textContent =
      message;

    toast.classList.toggle(
      "error",
      isError
    );

    toast.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {
          toast.classList.remove(
            "show"
          );
        },
        3000
      );
  }


  /* =========================================================
     BACK
  ========================================================= */

  function goBack() {

    if (
      document.referrer &&
      document.referrer.includes(
        window.location.host
      )
    ) {

      history.back();

    } else {

      window.location.href =
        "communities.html";
    }
  }


  /* =========================================================
     CLEANUP
  ========================================================= */

  window.addEventListener(
    "beforeunload",
    () => {

      if (realtimeChannel) {

        supabaseClient.removeChannel(
          realtimeChannel
        );
      }
    }
  );

</script>
