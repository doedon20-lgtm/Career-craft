    <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CareerCraft — CV Preview</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f9;
    color: #202124;
}

/* NAVBAR */

.navbar {
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: #111827;
    text-decoration: none;
}

.logo span {
    color: #2563eb;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
}

.nav-links a {
    text-decoration: none;
    color: #4b5563;
    font-size: 14px;
    font-weight: 600;
}

.nav-links a:hover {
    color: #2563eb;
}

/* PAGE */

.page {
    max-width: 1100px;
    margin: auto;
    padding: 35px 20px 70px;
}

.top-area {
    text-align: center;
    margin-bottom: 30px;
}

.top-area h1 {
    font-size: 34px;
    margin-bottom: 10px;
    color: #111827;
}

.top-area p {
    color: #6b7280;
}

/* BUTTONS */

.actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 22px;
}

.btn {
    display: inline-block;
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: white;
    color: #374151;
    border: 1px solid #d1d5db;
}

.btn-secondary:hover {
    background: #f9fafb;
}

/* CV PAPER */

.cv-wrapper {
    display: flex;
    justify-content: center;
}

.cv {
    width: 794px;
    min-height: 1123px;
    background: white;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    overflow: hidden;
    position: relative;
}

/* GENERAL CV */

.cv-header {
    padding: 40px 48px 30px;
}

.name {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.1;
}

.profession {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 600;
}

.contact {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    font-size: 13px;
}

.cv-body {
    padding: 0 48px 50px;
}

.section {
    margin-bottom: 27px;
}

.section-title {
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.section-line {
    width: 100%;
    height: 1px;
    background: #d1d5db;
    margin-bottom: 13px;
}

.summary {
    font-size: 14px;
    line-height: 1.7;
    color: #374151;
}

.experience-item {
    margin-bottom: 20px;
}

.job-title {
    font-size: 17px;
    font-weight: 800;
}

.company {
    font-size: 14px;
    font-weight: 600;
    margin-top: 4px;
}

.dates {
    font-size: 13px;
    color: #6b7280;
    margin-top: 3px;
}

.description {
    font-size: 14px;
    line-height: 1.7;
    margin-top: 9px;
    white-space: pre-line;
}

.education {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
}

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.skill {
    padding: 7px 11px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
}

/* =========================
   CLASSIC TEMPLATE
========================= */

.template-classic .cv-header {
    text-align: center;
    border-bottom: 3px solid #222;
}

.template-classic .profession {
    color: #555;
}

.template-classic .contact {
    justify-content: center;
    color: #555;
}

.template-classic .section-title {
    color: #222;
}

.template-classic .skill {
    background: #eeeeee;
    color: #333;
}

/* =========================
   MODERN TEMPLATE
========================= */

.template-modern .cv {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 1123px;
}

.template-modern .cv-header {
    grid-column: 1;
    grid-row: 1;
    background: #2563eb;
    color: white;
    padding: 38px 25px;
}

.template-modern .cv-body {
    grid-column: 2;
    grid-row: 1;
    padding: 42px 40px;
}

.template-modern .name {
    font-size: 29px;
}

.template-modern .profession {
    color: #dbeafe;
    font-size: 15px;
}

.template-modern .contact {
    display: block;
    color: #e5e7eb;
}

.template-modern .contact div {
    margin-bottom: 10px;
}

.template-modern .section-title {
    color: #2563eb;
}

.template-modern .section-line {
    background: #bfdbfe;
}

.template-modern .skill {
    background: #dbeafe;
    color: #1d4ed8;
}

/* =========================
   MINIMAL TEMPLATE
========================= */

.template-minimal .cv-header {
    padding-bottom: 35px;
}

.template-minimal .name {
    font-size: 38px;
    font-weight: 500;
    letter-spacing: -1px;
}

.template-minimal .profession {
    color: #6b7280;
    font-weight: 400;
}

.template-minimal .contact {
    color: #6b7280;
}

.template-minimal .cv-body {
    padding-top: 5px;
}

.template-minimal .section-title {
    font-size: 13px;
    color: #111827;
    letter-spacing: 1.5px;
}

.template-minimal .section-line {
    background: #111827;
}

.template-minimal .skill {
    background: transparent;
    border: 1px solid #d1d5db;
    border-radius: 0;
    color: #374151;
}

/* =========================
   EXECUTIVE TEMPLATE
========================= */

.template-executive .cv-header {
    background: #111827;
    color: white;
    padding: 45px 48px;
}

.template-executive .profession {
    color: #d1d5db;
}

.template-executive .contact {
    color: #d1d5db;
}

.template-executive .cv-body {
    padding-top: 35px;
}

.template-executive .section-title {
    color: #111827;
}

.template-executive .section-line {
    height: 2px;
    background: #111827;
}

.template-executive .skill {
    background: #111827;
    color: white;
}

/* EMPTY CV */

.empty {
    text-align: center;
    padding: 100px 30px;
}

.empty h2 {
    margin-bottom: 10px;
}

.empty p {
    color: #6b7280;
    margin-bottom: 20px;
}

/* MOBILE */

@media (max-width: 800px) {

    .navbar {
        padding: 14px 20px;
        flex-direction: column;
        align-items: flex-start;
    }

    .nav-links {
        gap: 12px;
    }

    .top-area h1 {
        font-size: 28px;
    }

    .cv {
        width: 100%;
        min-height: auto;
    }

    .template-modern .cv {
        display: block;
    }

    .template-modern .cv-header {
        padding: 30px;
    }

    .template-modern .cv-body {
        padding: 30px;
    }

    .cv-header {
        padding: 30px;
    }

    .cv-body {
        padding: 0 30px 40px;
    }

    .name {
        font-size: 29px;
    }

}

/* PRINT */

@media print {

    body {
        background: white;
    }

    .navbar,
    .top-area,
    .actions {
        display: none !important;
    }

    .page {
        padding: 0;
        margin: 0;
        max-width: none;
    }

    .cv-wrapper {
        display: block;
    }

    .cv {
        box-shadow: none;
        width: 100%;
        min-height: 100vh;
    }

    @page {
        size: A4;
        margin: 0;
    }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <a href="index.html" class="logo">
        Career<span>Craft</span>
    </a>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="cv-builder.html">CV Builder</a>

        <a href="cv-templates.html">Templates</a>

        <a href="cv-review.html">CV Review</a>

        <a href="job-finder.html">Find Jobs</a>

        <a href="saved-jobs.html">Saved Jobs</a>

    </div>

</nav>


<!-- PAGE -->

<main class="page">

    <div class="top-area">

        <h1>CV Preview</h1>

        <p id="templateText">
            Your CV is ready to preview.
        </p>

        <div class="actions">

            <a
                href="cv-templates.html"
                class="btn btn-secondary">
                ← Change Template
            </a>

            <a
                href="cv-builder.html"
                class="btn btn-secondary">
                ✏️ Edit CV
            </a>

            <button
                onclick="printCV()"
                class="btn btn-primary">
                🖨️ Print / Save PDF
            </button>

        </div>

    </div>


    <!-- CV -->

    <div class="cv-wrapper">

        <div id="cv" class="cv">

            <!-- HEADER -->

            <header class="cv-header">

                <div
                    id="fullName"
                    class="name">
                    Your Name
                </div>

                <div
                    id="professionalTitle"
                    class="profession">
                    Professional Title
                </div>

                <div class="contact">

                    <div id="email"></div>

                    <div id="phone"></div>

                    <div id="location"></div>

                </div>

            </header>


            <!-- BODY -->

            <div class="cv-body">


                <!-- SUMMARY -->

                <section
                    id="summarySection"
                    class="section">

                    <div class="section-title">
                        Professional Summary
                    </div>

                    <div class="section-line"></div>

                    <p
                        id="summary"
                        class="summary">
                    </p>

                </section>


                <!-- EXPERIENCE -->

                <section
                    id="experienceSection"
                    class="section">

                    <div class="section-title">
                        Experience
                    </div>

                    <div class="section-line"></div>

                    <div class="experience-item">

                        <div
                            id="jobTitle"
                            class="job-title">
                        </div>

                        <div
                            id="company"
                            class="company">
                        </div>

                        <div
                            id="experienceDates"
                            class="dates">
                        </div>

                        <div
                            id="experience"
                            class="description">
                        </div>

                    </div>

                </section>


                <!-- EDUCATION -->

                <section
                    id="educationSection"
                    class="section">

                    <div class="section-title">
                        Education
                    </div>

                    <div class="section-line"></div>

                    <div
                        id="education"
                        class="education">
                    </div>

                </section>


                <!-- SKILLS -->

                <section
                    id="skillsSection"
                    class="section">

                    <div class="section-title">
                        Skills
                    </div>

                    <div class="section-line"></div>

                    <div
                        id="skills"
                        class="skills">
                    </div>

                </section>

            </div>

        </div>

    </div>

</main>


<script>

/* =========================
   LOAD CV
========================= */

const cvData =
    JSON.parse(
        localStorage.getItem("careerCraftCV")
    );


/* =========================
   LOAD TEMPLATE
========================= */

const selectedTemplate =
    localStorage.getItem("careerCraftTemplate")
    || "classic";


const templateNames = {

    classic: "Classic",

    modern: "Modern",

    minimal: "Minimal",

    executive: "Executive"

};


/* =========================
   APPLY TEMPLATE
========================= */

document.body.classList.add(
    "template-" + selectedTemplate
);


document.getElementById(
    "templateText"
).textContent =
    "Currently using the " +
    (templateNames[selectedTemplate] || "Classic") +
    " CV template.";


/* =========================
   SAFE TEXT FUNCTION
========================= */

function setText(id, value) {

    const element =
        document.getElementById(id);

    if (!element) return;

    element.textContent =
        value || "";

}


/* =========================
   CHECK CV
========================= */

if (!cvData) {

    document.getElementById("cv")
        .innerHTML = `

        <div class="empty">

            <h2>No CV Found</h2>

            <p>
                You haven't created your CV yet.
            </p>

            <a
                href="cv-builder.html"
                class="btn btn-primary">
                Create My CV
            </a>

        </div>

    `;

} else {


    /* BASIC INFORMATION */

    setText(
        "fullName",
        cvData.fullName || "Your Name"
    );

    setText(
        "professionalTitle",
        cvData.professionalTitle ||
        "Professional Title"
    );

    setText(
        "email",
        cvData.email
    );

    setText(
        "phone",
        cvData.phone
    );

    setText(
        "location",
        cvData.location
    );


    /* SUMMARY */

    setText(
        "summary",
        cvData.summary
    );


    /* EXPERIENCE */

    setText(
        "jobTitle",
        cvData.jobTitle
    );

    setText(
        "company",
        cvData.company
    );

    setText(
        "experienceDates",
        cvData.experienceDates
    );

    setText(
        "experience",
        cvData.experience
    );


    /* EDUCATION */

    setText(
        "education",
        cvData.education
    );


    /* SKILLS */

    const skillsContainer =
        document.getElementById("skills");

    const skillsText =
        cvData.skills || "";

    const skillsArray =
        skillsText
            .split(",")
            .map(skill => skill.trim())
            .filter(skill => skill.length > 0);


    skillsArray.forEach(skill => {

        const span =
            document.createElement("span");

        span.className = "skill";

        span.textContent = skill;

        skillsContainer.appendChild(span);

    });


    /* HIDE EMPTY SECTIONS */

    if (!cvData.summary) {

        document.getElementById(
            "summarySection"
        ).style.display = "none";

    }


    if (
        !cvData.jobTitle &&
        !cvData.company &&
        !cvData.experience
    ) {

        document.getElementById(
            "experienceSection"
        ).style.display = "none";

    }


    if (!cvData.education) {

        document.getElementById(
            "educationSection"
        ).style.display = "none";

    }


    if (!skillsArray.length) {

        document.getElementById(
            "skillsSection"
        ).style.display = "none";

    }

}


/* =========================
   PRINT / SAVE PDF
========================= */

function printCV() {

    window.print();

}

</script>

</body>

        </html>
