<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CareerCraft — CV Preview</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f9;
    color: #202124;
}

.navbar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    text-decoration: none;
    font-size: 24px;
    font-weight: 800;
    color: #111827;
}

.logo span {
    color: #2563eb;
}

.nav-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

.nav-links a {
    text-decoration: none;
    color: #4b5563;
    font-size: 14px;
    font-weight: 600;
}

.nav-links a:hover {
    color: #2563eb;
}

.page {
    max-width: 1100px;
    margin: auto;
    padding: 35px 20px 70px;
}

.top-area {
    text-align: center;
    margin-bottom: 30px;
}

.top-area h1 {
    font-size: 34px;
    color: #111827;
    margin-bottom: 8px;
}

.top-area p {
    color: #6b7280;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 22px;
}

.btn {
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: white;
    color: #374151;
    border: 1px solid #d1d5db;
}

.btn-secondary:hover {
    background: #f9fafb;
}

/* CV */

.cv-wrapper {
    display: flex;
    justify-content: center;
}

.cv {
    width: 794px;
    min-height: 1123px;
    background: white;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
    overflow: hidden;
}

.cv-header {
    padding: 40px 48px 30px;
}

.name {
    font-size: 34px;
    font-weight: 800;
}

.profession {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 600;
}

.contact {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    font-size: 13px;
}

.cv-body {
    padding: 0 48px 50px;
}

.section {
    margin-bottom: 27px;
}

.section-title {
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.section-line {
    width: 100%;
    height: 1px;
    background: #d1d5db;
    margin-bottom: 13px;
}

.summary,
.description,
.education {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
}

.summary {
    color: #374151;
}

.experience-item {
    margin-bottom: 20px;
}

.job-title {
    font-size: 17px;
    font-weight: 800;
}

.company {
    font-size: 14px;
    font-weight: 600;
    margin-top: 4px;
}

.dates {
    font-size: 13px;
    color: #6b7280;
    margin-top: 3px;
}

.description {
    margin-top: 9px;
}

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.skill {
    padding: 7px 11px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
}

/* CLASSIC */

.template-classic .cv-header {
    text-align: center;
    border-bottom: 3px solid #222;
}

.template-classic .profession {
    color: #555;
}

.template-classic .contact {
    justify-content: center;
    color: #555;
}

.template-classic .skill {
    background: #eeeeee;
    color: #333;
}

/* MODERN */

.template-modern .cv {
    display: grid;
    grid-template-columns: 220px 1fr;
}

.template-modern .cv-header {
    grid-column: 1;
    grid-row: 1;
    background: #2563eb;
    color: white;
    padding: 38px 25px;
}

.template-modern .cv-body {
    grid-column: 2;
    grid-row: 1;
    padding: 42px 40px;
}

.template-modern .name {
    font-size: 29px;
}

.template-modern .profession {
    color: #dbeafe;
    font-size: 15px;
}

.template-modern .contact {
    display: block;
    color: #e5e7eb;
}

.template-modern .contact div {
    margin-bottom: 10px;
}

.template-modern .section-title {
    color: #2563eb;
}

.template-modern .section-line {
    background: #bfdbfe;
}

.template-modern .skill {
    background: #dbeafe;
    color: #1d4ed8;
}

/* MINIMAL */

.template-minimal .cv-header {
    padding-bottom: 35px;
}

.template-minimal .name {
    font-size: 38px;
    font-weight: 500;
}

.template-minimal .profession {
    color: #6b7280;
    font-weight: 400;
}

.template-minimal .contact {
    color: #6b7280;
}

.template-minimal .section-title {
    font-size: 13px;
    color: #111827;
    letter-spacing: 1.5px;
}

.template-minimal .section-line {
    background: #111827;
}

.template-minimal .skill {
    background: transparent;
    border: 1px solid #d1d5db;
    border-radius: 0;
    color: #374151;
}

/* EXECUTIVE */

.template-executive .cv-header {
    background: #111827;
    color: white;
    padding: 45px 48px;
}

.template-executive .profession {
    color: #d1d5db;
}

.template-executive .contact {
    color: #d1d5db;
}

.template-executive .cv-body {
    padding-top: 35px;
}

.template-executive .section-line {
    height: 2px;
    background: #111827;
}

.template-executive .skill {
    background: #111827;
    color: white;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 100px 30px;
}

.empty h2 {
    margin-bottom: 10px;
}

.empty p {
    color: #6b7280;
    margin-bottom: 20px;
}

/* MOBILE */

@media(max-width:800px) {

    .navbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 20px;
    }

    .nav-links {
        gap: 12px;
    }

    .top-area h1 {
        font-size: 28px;
    }

    .cv {
        width: 100%;
        min-height: auto;
    }

    .template-modern .cv {
        display: block;
    }

    .template-modern .cv-header {
        padding: 30px;
    }

    .template-modern .cv-body {
        padding: 30px;
    }

    .cv-header {
        padding: 30px;
    }

    .cv-body {
        padding: 0 30px 40px;
    }

}

/* PRINT */

@media print {

    body {
        background: white;
    }

    .navbar,
    .top-area,
    .actions {
        display: none !important;
    }

    .page {
        padding: 0;
        margin: 0;
        max-width: none;
    }

    .cv-wrapper {
        display: block;
    }

    .cv {
        box-shadow: none;
        width: 100%;
        min-height: 100vh;
    }

    @page {
        size: A4;
        margin: 0;
    }
}

</style></head><body><nav class="navbar"><a href="index.html" class="logo">
    Career<span>Craft</span>
</a>

<div class="nav-links">

    <a href="index.html">Home</a>
    <a href="cv-builder.html">CV Builder</a>
    <a href="cv-templates.html">Templates</a>
    <a href="cv-review.html">CV Review</a>
    <a href="job-finder.html">Find Jobs</a>
    <a href="saved-jobs.html">Saved Jobs</a>

</div>

</nav><main class="page"><div class="top-area">

    <h1>CV Preview</h1>

    <p id="templateText">
        Your CV is ready.
    </p>

    <div class="actions">

        <a
            href="cv-templates.html"
            class="btn btn-secondary">
            ← Change Template
        </a>

        <a
            href="cv-builder.html"
            class="btn btn-secondary">
            ✏️ Edit CV
        </a>

        <button
            onclick="downloadPDF()"
            id="downloadButton"
            class="btn btn-primary">
            📄 Download PDF
        </button>

        <button
            onclick="window.print()"
            class="btn btn-secondary">
            🖨️ Print
        </button>

    </div>

</div>

<div class="cv-wrapper">

    <div id="cv" class="cv">

        <header class="cv-header">

            <div id="fullName" class="name">
                Your Name
            </div>

            <div id="professionalTitle" class="profession">
                Professional Title
            </div>

            <div class="contact">

                <div id="email"></div>
                <div id="phone"></div>
                <div id="location"></div>

            </div>

        </header>

        <div class="cv-body">

            <section id="summarySection" class="section">

                <div class="section-title">
                    Professional Summary
                </div>

                <div class="section-line"></div>

                <p id="summary" class="summary"></p>

            </section>

            <section id="experienceSection" class="section">

                <div class="section-title">
                    Experience
                </div>

                <div class="section-line"></div>

                <div class="experience-item">

                    <div id="jobTitle" class="job-title"></div>

                    <div id="company" class="company"></div>

                    <div id="experienceDates" class="dates"></div>

                    <div id="experience" class="description"></div>

                </div>

            </section>

            <section id="educationSection" class="section">

                <div class="section-title">
                    Education
                </div>

                <div class="section-line"></div>

                <div id="education" class="education"></div>

            </section>

            <section id="skillsSection" class="section">

                <div class="section-title">
                    Skills
                </div>

                <div class="section-line"></div>

                <div id="skills" class="skills"></div>

            </section>

        </div>

    </div>

</div>

</main><script>

const cvData =
    JSON.parse(
        localStorage.getItem("careerCraftCV")
    );

const selectedTemplate =
    localStorage.getItem("careerCraftTemplate")
    || "classic";

const templateNames = {

    classic: "Classic",

    modern: "Modern",

    minimal: "Minimal",

    executive: "Executive"

};

document.body.classList.add(
    "template-" + selectedTemplate
);

document.getElementById("templateText").textContent =
    "Currently using the " +
    (templateNames[selectedTemplate] || "Classic") +
    " CV template.";


function setText(id, value) {

    const element =
        document.getElementById(id);

    if (element) {
        element.textContent = value || "";
    }

}


if (!cvData) {

    document.getElementById("cv").innerHTML = `

        <div class="empty">

            <h2>No CV Found</h2>

            <p>
                Create your CV first before previewing it.
            </p>

            <a
                href="cv-builder.html"
                class="btn btn-primary">
                Create My CV
            </a>

        </div>

    `;

} else {

    setText(
        "fullName",
        cvData.fullName || "Your Name"
    );

    setText(
        "professionalTitle",
        cvData.professionalTitle ||
        "Professional Title"
    );

    setText("email", cvData.email);
    setText("phone", cvData.phone);
    setText("location", cvData.location);

    setText("summary", cvData.summary);

    setText("jobTitle", cvData.jobTitle);
    setText("company", cvData.company);
    setText("experienceDates", cvData.experienceDates);
    setText("experience", cvData.experience);

    setText("education", cvData.education);

    const skillsContainer =
        document.getElementById("skills");

    const skillsArray =
        (cvData.skills || "")
        .split(",")
        .map(skill => skill.trim())
        .filter(skill => skill);

    skillsArray.forEach(skill => {

        const span =
            document.createElement("span");

        span.className = "skill";

        span.textContent = skill;

        skillsContainer.appendChild(span);

    });

    if (!cvData.summary) {

        document.getElementById(
            "summarySection"
        ).style.display = "none";

    }

    if (
        !cvData.jobTitle &&
        !cvData.company &&
        !cvData.experience
    ) {

        document.getElementById(
            "experienceSection"
        ).style.display = "none";

    }

    if (!cvData.education) {

        document.getElementById(
            "educationSection"
        ).style.display = "none";

    }

    if (!skillsArray.length) {

        document.getElementById(
            "skillsSection"
        ).style.display = "none";

    }

}


/* DOWNLOAD PDF */

function downloadPDF() {

    const cv =
        document.getElementById("cv");

    const button =
        document.getElementById("downloadButton");

    if (!cvData) {

        alert(
            "Please create your CV before downloading it."
        );

        return;
    }

    button.textContent =
        "⏳ Creating PDF...";

    button.disabled = true;

    const name =
        (cvData.fullName || "CareerCraft-CV")
        .replace(/[^a-z0-9]/gi, "-");

    const options = {

        margin: 0,

        filename:
            name + "-CV.pdf",

        image: {
            type: "jpeg",
            quality: 0.98
        },

        html2canvas: {

            scale: 2,

            useCORS: true,

            backgroundColor: "#ffffff"

        },

        jsPDF: {

            unit: "mm",

            format: "a4",

            orientation: "portrait"

        },

        pagebreak: {

            mode: [
                "css",
                "legacy"
            ]

        }

    };

    html2pdf()
        .set(options)
        .from(cv)
        .save()
        .then(() => {

            button.textContent =
                "📄 Download PDF";

            button.disabled = false;

        })
        .catch(error => {

            console.error(error);

            alert(
                "Sorry, the PDF could not be created. Please try again."
            );

            button.textContent =
                "📄 Download PDF";

            button.disabled = false;

        });

}

</script></body></html>
