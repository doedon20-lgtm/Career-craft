<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Preview | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f5f8;
    color:#182230;
}

button{
    font-family:inherit;
}

.topbar{
    height:70px;
    background:#ffffff;
    border-bottom:1px solid #e5e9ef;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#111827;
}

.logo span{
    color:#2563eb;
}

.top-actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.btn{
    border:0;
    border-radius:9px;
    padding:11px 17px;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
}

.btn-secondary{
    background:#eef2f7;
    color:#1f2937;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-dark{
    background:#111827;
    color:#fff;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.page{
    max-width:1500px;
    margin:auto;
    padding:28px;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:24px;
}

.heading h1{
    font-size:28px;
    margin-bottom:7px;
}

.heading p{
    color:#6b7280;
    font-size:14px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.workspace{
    display:flex;
    gap:28px;
    align-items:flex-start;
}

.sidebar{
    width:270px;
    background:#fff;
    border:1px solid #e2e7ee;
    border-radius:16px;
    padding:18px;
    position:sticky;
    top:95px;
}

.sidebar h3{
    font-size:15px;
    margin-bottom:15px;
}

.sidebar-item{
    padding:13px;
    border-radius:10px;
    margin-bottom:7px;
    cursor:pointer;
    color:#4b5563;
    font-size:14px;
}

.sidebar-item:hover{
    background:#f3f6fa;
}

.sidebar-item.active{
    background:#eaf1ff;
    color:#2563eb;
    font-weight:700;
}

.template-label{
    font-size:12px;
    color:#9ca3af;
    margin-top:18px;
    margin-bottom:8px;
}

.preview-area{
    flex:1;
    display:flex;
    justify-content:center;
    min-width:0;
}

.cv-paper{
    width:850px;
    min-height:1100px;
    background:white;
    box-shadow:0 12px 40px rgba(0,0,0,.12);
    border-radius:3px;
    overflow:hidden;
}

/* =========================================
   COMMON CV STYLES
========================================= */

.cv-content{
    padding:52px 58px;
}

.cv-header{
    margin-bottom:28px;
}

.cv-name{
    font-size:34px;
    line-height:1.1;
    font-weight:800;
    color:#111827;
}

.cv-title{
    margin-top:8px;
    font-size:17px;
    color:#4b5563;
    font-weight:600;
}

.contact{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    margin-top:16px;
    color:#4b5563;
    font-size:12px;
}

.contact span{
    display:inline-flex;
    align-items:center;
}

.section{
    margin-top:26px;
}

.section-title{
    font-size:14px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:12px;
    color:#111827;
}

.summary{
    color:#4b5563;
    font-size:13px;
    line-height:1.7;
}

.entry{
    margin-bottom:19px;
}

.entry:last-child{
    margin-bottom:0;
}

.entry-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.entry-title{
    font-size:14px;
    font-weight:800;
    color:#111827;
}

.entry-company{
    margin-top:3px;
    color:#374151;
    font-size:13px;
    font-weight:600;
}

.entry-date{
    color:#6b7280;
    font-size:11px;
    white-space:nowrap;
}

.entry-location{
    color:#6b7280;
    font-size:11px;
    margin-top:3px;
}

.entry-description{
    margin-top:7px;
    color:#4b5563;
    font-size:12px;
    line-height:1.65;
    white-space:pre-line;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.skill{
    background:#f1f5f9;
    border-radius:6px;
    padding:6px 9px;
    font-size:11px;
    color:#374151;
}

.simple-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.simple-item{
    font-size:12px;
    color:#4b5563;
    line-height:1.5;
}

.simple-item strong{
    color:#111827;
}

.photo{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
}

/* =========================================
   EXECUTIVE
========================================= */

.template-executive .cv-header{
    border-bottom:2px solid #111827;
    padding-bottom:23px;
}

.template-executive .section-title{
    border-bottom:1px solid #d1d5db;
    padding-bottom:7px;
}

.template-executive .skill{
    border-radius:3px;
}

/* =========================================
   MODERN
========================================= */

.template-modern .cv-content{
    padding:0;
}

.template-modern .cv-header{
    background:#111827;
    color:white;
    padding:48px 58px;
}

.template-modern .cv-name{
    color:white;
}

.template-modern .cv-title{
    color:#cbd5e1;
}

.template-modern .contact{
    color:#cbd5e1;
}

.template-modern .cv-body{
    padding:38px 58px;
}

.template-modern .section-title{
    color:#2563eb;
}

/* =========================================
   ATS
========================================= */

.template-ats .cv-content{
    padding:48px 55px;
}

.template-ats .cv-name{
    font-size:31px;
}

.template-ats .section-title{
    border-bottom:1px solid #111827;
    padding-bottom:6px;
}

.template-ats .skill{
    background:none;
    padding:0;
}

.template-ats .skill:not(:last-child)::after{
    content:", ";
}

/* =========================================
   CREATIVE
========================================= */

.template-creative .cv-content{
    padding:0;
}

.template-creative .cv-header{
    padding:45px 55px;
    background:#eef2ff;
}

.template-creative .cv-body{
    padding:35px 55px;
}

.template-creative .cv-name{
    color:#312e81;
}

.template-creative .section-title{
    color:#4338ca;
}

/* =========================================
   MINIMAL
========================================= */

.template-minimal .cv-content{
    padding:62px 65px;
}

.template-minimal .cv-name{
    font-weight:600;
    font-size:32px;
}

.template-minimal .section{
    margin-top:32px;
}

.template-minimal .section-title{
    font-weight:600;
    letter-spacing:.5px;
}

.template-minimal .skill{
    background:none;
    padding:0;
    color:#374151;
}

/* =========================================
   PROFESSIONAL
========================================= */

.template-professional .cv-header{
    background:#f8fafc;
    padding:30px;
    border-radius:10px;
}

.template-professional .section-title{
    color:#2563eb;
}

.template-professional .skill{
    background:#eff6ff;
    color:#1d4ed8;
}

/* =========================================
   EMPTY / LOADING
========================================= */

.loading{
    min-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #e5e7eb;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error-box{
    max-width:600px;
    margin:80px auto;
    background:#fff;
    padding:35px;
    border-radius:16px;
    text-align:center;
    border:1px solid #e5e7eb;
}

.error-box h2{
    margin-bottom:10px;
}

.error-box p{
    color:#6b7280;
    margin-bottom:20px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:1000px){

    .workspace{
        display:block;
    }

    .sidebar{
        width:100%;
        position:static;
        margin-bottom:20px;
    }

    .sidebar-items{
        display:flex;
        overflow-x:auto;
        gap:7px;
    }

    .sidebar-item{
        white-space:nowrap;
        margin:0;
    }

    .preview-area{
        width:100%;
        overflow:auto;
        justify-content:flex-start;
    }

    .cv-paper{
        width:850px;
        flex-shrink:0;
    }
}

@media(max-width:700px){

    .topbar{
        padding:0 15px;
    }

    .logo{
        font-size:19px;
    }

    .top-actions .btn-secondary{
        display:none;
    }

    .page{
        padding:18px 10px;
    }

    .heading{
        display:block;
    }

    .heading h1{
        font-size:23px;
    }

    .controls{
        margin-top:16px;
    }

    .controls .btn{
        flex:1;
    }

    .sidebar{
        padding:12px;
    }

    .cv-paper{
        transform-origin:top left;
    }
}

/* PRINT */

@media print{

    body{
        background:white;
    }

    .topbar,
    .heading,
    .sidebar{
        display:none !important;
    }

    .page{
        padding:0;
        margin:0;
    }

    .workspace{
        display:block;
    }

    .preview-area{
        display:block;
    }

    .cv-paper{
        width:100%;
        min-height:auto;
        box-shadow:none;
        border-radius:0;
    }

    @page{
        size:A4;
        margin:0;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        Career<span>Craft</span>
    </div>

    <div class="top-actions">

        <button class="btn btn-secondary"
                onclick="goDashboard()">
            Dashboard
        </button>

        <button class="btn btn-danger"
                onclick="logout()">
            Log out
        </button>

    </div>

</header>


<main class="page">

    <div class="heading">

        <div>
            <h1 id="pageTitle">
                CV Preview
            </h1>

            <p id="pageSubtitle">
                Review your CV before printing or sharing it.
            </p>
        </div>

        <div class="controls">

            <button class="btn btn-secondary"
                    onclick="editCV()">
                ✏️ Edit CV
            </button>

            <button class="btn btn-dark"
                    onclick="window.print()">
                🖨️ Print / Save PDF
            </button>

        </div>

    </div>


    <div id="loading" class="loading">

        <div class="spinner"></div>

        <p>
            Loading your CV...
        </p>

    </div>


    <div id="error" style="display:none;"></div>


    <div id="workspace"
         class="workspace"
         style="display:none;">

        <aside class="sidebar">

            <h3>
                CV Style
            </h3>

            <div class="sidebar-items">

                <div class="sidebar-item"
                     data-template="executive"
                     onclick="changeTemplate('executive')">
                    Executive
                </div>

                <div class="sidebar-item"
                     data-template="modern"
                     onclick="changeTemplate('modern')">
                    Modern
                </div>

                <div class="sidebar-item"
                     data-template="ats"
                     onclick="changeTemplate('ats')">
                    ATS-Friendly
                </div>

                <div class="sidebar-item"
                     data-template="creative"
                     onclick="changeTemplate('creative')">
                    Creative
                </div>

                <div class="sidebar-item"
                     data-template="minimal"
                     onclick="changeTemplate('minimal')">
                    Minimal
                </div>

                <div class="sidebar-item"
                     data-template="professional"
                     onclick="changeTemplate('professional')">
                    Professional
                </div>

            </div>

            <div class="template-label">
                Selected style
            </div>

            <strong id="selectedTemplate">
                Executive
            </strong>

            <div style="margin-top:25px;">

                <button class="btn btn-primary"
                        style="width:100%;"
                        onclick="saveTemplate()">
                    Save Style
                </button>

            </div>

        </aside>


        <section class="preview-area">

            <div id="cvPaper"
                 class="cv-paper">

            </div>

        </section>

    </div>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;
let currentCV = null;
let currentCVId = null;
let selectedTemplate = "executive";


/* =========================================
   GET CV ID
========================================= */

function getCVId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");
}


/* =========================================
   AUTHENTICATION
========================================= */

async function checkAuthentication(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();

    if(
        error ||
        !data ||
        !data.session ||
        !data.session.user
    ){

        window.location.href =
            "login.html";

        return false;
    }

    currentUser =
        data.session.user;

    return true;
}


/* =========================================
   LOAD CV
========================================= */

async function loadCV(){

    currentCVId =
        getCVId();

    if(!currentCVId){

        showError(
            "No CV was selected.",
            "Please return to your dashboard and choose a CV to preview."
        );

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("cvs")
            .select("*")
            .eq("id", currentCVId)
            .eq(
                "user_id",
                String(currentUser.id)
            )
            .maybeSingle();


    if(error){

        console.error(error);

        showError(
            "Unable to load your CV.",
            error.message
        );

        return;
    }


    if(!data){

        showError(
            "CV not found.",
            "This CV may have been deleted or you may not have permission to view it."
        );

        return;
    }


    currentCV =
        data;


    /* -----------------------------------------
       Get JSON content
    ----------------------------------------- */

    if(
        data.content &&
        typeof data.content === "object"
    ){

        currentCV.content =
            data.content;

    }
    else{

        currentCV.content =
            buildFallbackContent(data);

    }


    selectedTemplate =
        data.template ||
        currentCV.content.template ||
        "executive";


    renderTemplateButtons();

    renderCV();

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("workspace")
        .style.display = "flex";

}


/* =========================================
   FALLBACK CONTENT
========================================= */

function buildFallbackContent(data){

    return {

        cvTitle:
            data.title || "My CV",

        fullName:
            data.full_name || "",

        email:
            data.email || "",

        phone:
            data.phone || "",

        location:
            data.location || "",

        professionalTitle:
            "",

        summary:
            data.professional_summary || "",

        education:
            parseJSON(data.education, []),

        experience:
            parseJSON(data.experience, []),

        skills:
            parseJSON(data.skills, []),

        certifications:
            parseJSON(data.certifications, []),

        projects:
            parseJSON(data.projects, []),

        languages:
            parseJSON(data.languages, []),

        achievements:
            "",

        volunteer:
            "",

        references:
            ""

    };
}


/* =========================================
   JSON PARSER
========================================= */

function parseJSON(value, fallback){

    if(!value){
        return fallback;
    }

    if(typeof value === "object"){
        return value;
    }

    try{
        return JSON.parse(value);
    }
    catch{
        return fallback;
    }
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================
   GET CONTENT
========================================= */

function getContent(){

    return currentCV.content || {};
}


/* =========================================
   RENDER CV
========================================= */

function renderCV(){

    const cv =
        getContent();


    const template =
        selectedTemplate;


    document.getElementById("selectedTemplate")
        .textContent =
            templateName(template);


    document.getElementById("pageTitle")
        .textContent =
            cv.cvTitle ||
            currentCV.title ||
            "CV Preview";


    const paper =
        document.getElementById("cvPaper");


    paper.className =
        "cv-paper template-" +
        template;


    const header =
        renderHeader(cv, template);


    const body =
        renderBody(cv, template);


    paper.innerHTML =
        header + body;

}


/* =========================================
   TEMPLATE NAME
========================================= */

function templateName(template){

    const names = {

        executive:
            "Executive",

        modern:
            "Modern",

        ats:
            "ATS-Friendly",

        creative:
            "Creative",

        minimal:
            "Minimal",

        professional:
            "Professional"

    };

    return names[template] ||
           "Executive";
}


/* =========================================
   HEADER
========================================= */

function renderHeader(cv, template){

    const photo =
        cv.photo
        ? `
            <img
                class="photo"
                src="${escapeHTML(cv.photo)}"
                alt="Profile photo"
            >
        `
        : "";


    const fullName =
        escapeHTML(
            cv.fullName ||
            currentCV.full_name ||
            "Your Name"
        );


    const title =
        escapeHTML(
            cv.professionalTitle ||
            "Professional"
        );


    const contacts = [];


    if(cv.email){
        contacts.push(
            `<span>✉ ${escapeHTML(cv.email)}</span>`
        );
    }


    if(cv.phone){
        contacts.push(
            `<span>☎ ${escapeHTML(cv.phone)}</span>`
        );
    }


    if(cv.location){
        contacts.push(
            `<span>📍 ${escapeHTML(cv.location)}</span>`
        );
    }


    if(cv.linkedin){
        contacts.push(
            `<span>LinkedIn: ${escapeHTML(cv.linkedin)}</span>`
        );
    }


    if(cv.website){
        contacts.push(
            `<span>Website: ${escapeHTML(cv.website)}</span>`
        );
    }


    if(cv.github){
        contacts.push(
            `<span>GitHub: ${escapeHTML(cv.github)}</span>`
        );
    }


    const contactHTML =
        contacts.length
        ? `
            <div class="contact">
                ${contacts.join("")}
            </div>
        `
        : "";


    if(template === "modern"){

        return `
            <div class="cv-content">
                <header class="cv-header">
                    ${photo}

                    <div class="cv-name">
                        ${fullName}
                    </div>

                    <div class="cv-title">
                        ${title}
                    </div>

                    ${contactHTML}
                </header>

                <div class="cv-body">
        `;
    }


    if(template === "creative"){

        return `
            <div class="cv-content">

                <header class="cv-header">

                    ${photo}

                    <div class="cv-name">
                        ${fullName}
                    </div>

                    <div class="cv-title">
                        ${title}
                    </div>

                    ${contactHTML}

                </header>

                <div class="cv-body">
        `;
    }


    return `
        <div class="cv-content">

            <header class="cv-header">

                ${photo}

                <div class="cv-name">
                    ${fullName}
                </div>

                <div class="cv-title">
                    ${title}
                </div>

                ${contactHTML}

            </header>
    `;
}


/* =========================================
   BODY
========================================= */

function renderBody(cv, template){

    let html = "";


    /* SUMMARY */

    if(cv.summary){

        html += `
            <section class="section">

                <div class="section-title">
                    Professional Summary
                </div>

                <div class="summary">
                    ${escapeHTML(cv.summary)}
                </div>

            </section>
        `;
    }


    /* EXPERIENCE */

    if(
        Array.isArray(cv.experience) &&
        cv.experience.length
    ){

        const valid =
            cv.experience.filter(item =>
                item &&
                (
                    item.jobTitle ||
                    item.company ||
                    item.description
                )
            );


        if(valid.length){

            html += `
                <section class="section">

                    <div class="section-title">
                        Professional Experience
                    </div>

                    ${valid.map(item => `

                        <div class="entry">

                            <div class="entry-top">

                                <div>

                                    <div class="entry-title">
                                        ${escapeHTML(item.jobTitle || "")}
                                    </div>

                                    <div class="entry-company">
                                        ${escapeHTML(item.company || "")}
                                    </div>

                                </div>

                                <div class="entry-date">

                                    ${escapeHTML(
                                        formatDates(
                                            item.startDate,
                                            item.endDate
                                        )
                                    )}

                                </div>

                            </div>

                            ${
                                item.location
                                ?
                                `
                                <div class="entry-location">
                                    ${escapeHTML(item.location)}
                                </div>
                                `
                                :
                                ""
                            }

                            ${
                                item.description
                                ?
                                `
                                <div class="entry-description">
                                    ${escapeHTML(item.description)}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    `).join("")}

                </section>
            `;
        }
    }


    /* EDUCATION */

    if(
        Array.isArray(cv.education) &&
        cv.education.length
    ){

        const valid =
            cv.education.filter(item =>
                item &&
                (
                    item.school ||
                    item.degree ||
                    item.field
                )
            );


        if(valid.length){

            html += `
                <section class="section">

                    <div class="section-title">
                        Education
                    </div>

                    ${valid.map(item => `

                        <div class="entry">

                            <div class="entry-top">

                                <div>

                                    <div class="entry-title">
                                        ${escapeHTML(item.degree || "")}
                                    </div>

                                    <div class="entry-company">
                                        ${escapeHTML(item.school || "")}
                                        ${
                                            item.field
                                            ? " · " + escapeHTML(item.field)
                                            : ""
                                        }
                                    </div>

                                </div>

                                <div class="entry-date">

                                    ${escapeHTML(
                                        formatDates(
                                            item.startDate,
                                            item.endDate
                                        )
                                    )}

                                </div>

                            </div>

                            ${
                                item.details
                                ?
                                `
                                <div class="entry-description">
                                    ${escapeHTML(item.details)}
                                </div>
                                `
                                :
                                ""
                            }

                        </div>

                    `).join("")}

                </section>
            `;
        }
    }


    /* SKILLS */

    if(
        Array.isArray(cv.skills) &&
        cv.skills.length
    ){

        const valid =
            cv.skills.filter(item => {

                if(typeof item === "string"){
                    return item.trim();
                }

                return item &&
                    (
                        item.name ||
                        item.skill
                    );
            });


        if(valid.length){

            html += `
                <section class="section">

                    <div class="section-title">
                        Skills
                    </div>

                    <div class="skills">

                        ${valid.map(item => {

                            if(typeof item === "string"){

                                return `
                                    <span class="skill">
                                        ${escapeHTML(item)}
                                    </span>
                                `;
                            }


                            const name =
                                item.name ||
                                item.skill ||
                                "";


                            const level =
                                item.level ||
                                "";


                            return `
                                <span class="skill">

                                    ${escapeHTML(name)}

                                    ${
                                        level
                                        ?
                                        " · " +
                                        escapeHTML(level)
                                        :
                                        ""
                                    }

                                </span>
                            `;

                        }).join("")}

                    </div>

                </section>
            `;
        }
    }


    /* CERTIFICATIONS */

    if(
        Array.isArray(cv.certifications) &&
        cv.certifications.length
    ){

        const valid =
            cv.certifications.filter(item =>
                item &&
                (
                    item.name ||
                    item.organisation ||
                    item.organization
                )
            );


        if(valid.length){

            html += `
                <section class="section">

                    <div class="section-title">
                        Certifications
                    </div>

                    <div class="simple-list">

                        ${valid.map(item => `

                            <div class="simple-item">

                                <strong>
                                    ${escapeHTML(item.name || "")}
                                </strong>

                                ${
                                    item.organisation ||
                                    item.organization
                                    ?
                                    `
                                    — ${escapeHTML(
                                        item.organisation ||
                                        item.organization
                                    )}
                                    `
                                    :
                                    ""
                                }

                                ${
                                    item.year
                                    ?
                                    ` (${escapeHTML(item.year)})`
                                    :
                                    ""
                                }

                            </div>

                        `).join("")}

                    </div>

                </section>
            `;
        }
    }


    /* PROJECTS */

    if(
        Array.isArray(cv.projects) &&
        cv.projects.length
    ){

        const valid =
            cv.projects.filter(item =>
                item &&
                (
                    item.name ||
                    item.description
                )
            );


        if(valid.length){

            html += `
                <section class="section">

                    <div class="section-title">
                        Projects
                    </div>

                    <div class="simple-list">

                        ${valid.map(item => `

                            <div class="simple-item">

                                <strong>
                                    ${escapeHTML(item.name || "")}
                                </strong>

                                ${
                                    item.link
                                    ?
                                    `
                                    — ${escapeHTML(item.link)}
                                    `
                                    :
                                    ""
                                }

                                ${
                                    item.description
                                    ?
                                    `
                                    <div style="margin-top:3px;">
                                        ${escapeHTML(item.description)}
                                    </div>
                                    `
                                    :
                                    ""
                                }

                            </div>

                        `).join("")}

                    </div>

                </section>
            `;
        }
    }


    /* LANGUAGES */

    if(
        Array.isArray(cv.languages) &&
        cv.languages.length
    ){

        const valid =
            cv.languages.filter(item => {

                if(typeof item === "string"){
                    return item.trim();
                }

                return item &&
                    (
                        item.name ||
                        item.language
                    );
            });


        if(valid.length){

            html += `
                <section class="section">

                    <div class="section-title">
                        Languages
                    </div>

                    <div class="simple-list">

                        ${valid.map(item => {

                            if(typeof item === "string"){

                                return `
                                    <div class="simple-item">
                                        ${escapeHTML(item)}
                                    </div>
                                `;
                            }


                            return `
                                <div class="simple-item">

                                    <strong>
                                        ${escapeHTML(
                                            item.name ||
                                            item.language ||
                                            ""
                                        )}
                                    </strong>

                                    ${
                                        item.level
                                        ?
                                        ` — ${escapeHTML(item.level)}`
                                        :
                                        ""
                                    }

                                </div>
                            `;

                        }).join("")}

                    </div>

                </section>
            `;
        }
    }


    /* ACHIEVEMENTS */

    if(cv.achievements){

        html += `
            <section class="section">

                <div class="section-title">
                    Achievements
                </div>

                <div class="entry-description">
                    ${escapeHTML(cv.achievements)}
                </div>

            </section>
        `;
    }


    /* VOLUNTEER */

    if(cv.volunteer){

        html += `
            <section class="section">

                <div class="section-title">
                    Volunteer Experience
                </div>

                <div class="entry-description">
                    ${escapeHTML(cv.volunteer)}
                </div>

            </section>
        `;
    }


    /* REFERENCES */

    if(cv.references){

        html += `
            <section class="section">

                <div class="section-title">
                    References
                </div>

                <div class="entry-description">
                    ${escapeHTML(cv.references)}
                </div>

            </section>
        `;
    }


    if(
        template === "modern" ||
        template === "creative"
    ){

        html += `
                </div>
            </div>
        `;
    }
    else{

        html += `
            </div>
        `;
    }


    return html;
}


/* =========================================
   DATE FORMAT
========================================= */

function formatDates(start, end){

    if(!start && !end){
        return "";
    }

    if(start && !end){
        return start + " – Present";
    }

    if(!start && end){
        return end;
    }

    return start + " – " + end;
}


/* =========================================
   TEMPLATE BUTTONS
========================================= */

function renderTemplateButtons(){

    document
        .querySelectorAll(".sidebar-item")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.template === selectedTemplate
            );

        });

}


/* =========================================
   CHANGE TEMPLATE
========================================= */

function changeTemplate(template){

    selectedTemplate =
        template;

    renderTemplateButtons();

    renderCV();

}


/* =========================================
   SAVE TEMPLATE
========================================= */

async function saveTemplate(){

    if(!currentCVId){
        return;
    }


    const button =
        document.querySelector(
            ".sidebar .btn-primary"
        );


    button.disabled = true;

    button.textContent =
        "Saving...";


    const {
        error
    } =
        await supabaseClient
            .from("cvs")
            .update({

                template:
                    selectedTemplate,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                currentCVId
            )
            .eq(
                "user_id",
                String(currentUser.id)
            );


    button.disabled = false;

    button.textContent =
        "Save Style";


    if(error){

        alert(
            "Could not save the CV style: " +
            error.message
        );

        return;
    }


    currentCV.template =
        selectedTemplate;


    alert(
        "CV style saved successfully."
    );

}


/* =========================================
   EDIT CV
========================================= */

function editCV(){

    if(!currentCVId){
        return;
    }


    window.location.href =
        "cv-builder.html?id=" +
        encodeURIComponent(currentCVId);

}


/* =========================================
   DASHBOARD
========================================= */

function goDashboard(){

    window.location.href =
        "index.html";

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

    const {
        error
    } =
        await supabaseClient.auth.signOut();


    if(error){

        alert(
            "Unable to log out: " +
            error.message
        );

        return;
    }


    window.location.href =
        "login.html";

}


/* =========================================
   ERROR
========================================= */

function showError(title, message){

    document.getElementById("loading")
        .style.display = "none";


    const errorBox =
        document.getElementById("error");


    errorBox.style.display =
        "block";


    errorBox.innerHTML = `

        <div class="error-box">

            <h2>
                ${escapeHTML(title)}
            </h2>

            <p>
                ${escapeHTML(message)}
            </p>

            <button
                class="btn btn-primary"
                onclick="goDashboard()">

                Back to Dashboard

            </button>

        </div>

    `;
}


/* =========================================
   START
========================================= */

async function init(){

    const authenticated =
        await checkAuthentication();


    if(!authenticated){
        return;
    }


    await loadCV();

}


init();

</script>
