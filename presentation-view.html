<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presentation | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1020;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}

button{
  font:inherit;
}

.topbar{
  height:64px;
  background:rgba(15,23,42,.96);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:18px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.actions{
  display:flex;
  gap:8px;
}

.action-btn{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#fff;
  padding:9px 13px;
  border-radius:9px;
  cursor:pointer;
  transition:.2s;
}

.action-btn:hover{
  background:rgba(255,255,255,.12);
}

.viewer{
  position:fixed;
  inset:64px 0 72px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.slide-wrapper{
  width:min(1100px,94vw);
  aspect-ratio:16/9;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.slide{
  width:100%;
  height:100%;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  background:#fff;
  color:#111827;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:7%;
}

.slide-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:0;
}

.slide-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.18);
  z-index:1;
}

.slide-content{
  position:relative;
  z-index:2;
  max-width:900px;
}

.slide-title{
  font-size:clamp(28px,5vw,68px);
  line-height:1.05;
  font-weight:800;
  margin-bottom:20px;
  white-space:pre-wrap;
}

.slide-subtitle{
  font-size:clamp(18px,2.4vw,32px);
  line-height:1.3;
  opacity:.85;
  margin-bottom:22px;
  white-space:pre-wrap;
}

.slide-text{
  font-size:clamp(15px,1.7vw,23px);
  line-height:1.6;
  white-space:pre-wrap;
}

.slide-image{
  max-width:100%;
  max-height:42%;
  object-fit:contain;
  border-radius:12px;
  margin-top:25px;
}

.empty{
  text-align:center;
  padding:30px;
}

.empty h2{
  margin-bottom:10px;
}

.empty p{
  color:#94a3b8;
}

.loading{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:#0b1020;
  z-index:100;
}

.loader{
  width:42px;
  height:42px;
  border:4px solid rgba(255,255,255,.15);
  border-top-color:#8b5cf6;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:rgba(15,23,42,.97);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  z-index:50;
}

.nav-btn{
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  background:rgba(255,255,255,.06);
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.nav-btn:hover{
  background:rgba(255,255,255,.12);
}

.counter{
  min-width:90px;
  text-align:center;
  color:#cbd5e1;
  font-size:14px;
}

.presentation-info{
  position:absolute;
  left:20px;
  bottom:18px;
  color:#94a3b8;
  font-size:12px;
  z-index:10;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){

  .topbar{
    height:58px;
    padding:0 10px;
  }

  .brand{
    font-size:15px;
  }

  .brand-mark{
    width:30px;
    height:30px;
  }

  .action-btn{
    padding:8px 10px;
    font-size:13px;
  }

  .viewer{
    inset:58px 0 66px;
    padding:8px;
  }

  .slide{
    border-radius:9px;
    padding:7%;
  }

  .bottom{
    height:66px;
    gap:12px;
  }

  .nav-btn{
    width:40px;
    height:40px;
  }

  .presentation-info{
    display:none;
  }
}

@media print{

  body{
    background:#fff;
    overflow:visible;
  }

  .topbar,
  .bottom,
  .presentation-info{
    display:none!important;
  }

  .viewer{
    position:static;
    padding:0;
    display:block;
  }

  .slide-wrapper{
    width:100%;
    height:auto;
    aspect-ratio:auto;
  }

  .slide{
    box-shadow:none;
    border-radius:0;
    min-height:100vh;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="loader"></div>
</div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">C</div>
    <span>CareerCraft</span>
  </div>

  <div class="actions">
    <button class="action-btn" onclick="sharePresentation()">
      Share
    </button>

    <button class="action-btn" onclick="printPresentation()">
      Print
    </button>

    <button class="action-btn" onclick="toggleFullscreen()">
      Fullscreen
    </button>
  </div>
</header>

<main class="viewer">

  <div class="slide-wrapper">

    <div class="slide" id="slide">

      <div class="slide-bg" id="slideBg"></div>
      <div class="slide-overlay" id="slideOverlay"></div>

      <div class="slide-content">

        <h1 class="slide-title" id="slideTitle"></h1>

        <div class="slide-subtitle" id="slideSubtitle"></div>

        <div class="slide-text" id="slideText"></div>

        <img
          class="slide-image hidden"
          id="slideImage"
          alt="Presentation image"
        >

      </div>

    </div>

  </div>

  <div class="presentation-info" id="presentationInfo"></div>

</main>

<footer class="bottom">

  <button class="nav-btn" onclick="previousSlide()">
    ←
  </button>

  <div class="counter" id="counter">
    0 / 0
  </div>

  <button class="nav-btn" onclick="nextSlide()">
    →
  </button>

</footer>

<script>

const SUPABASE_URL="https://upcxmlbgmqhaqieldmyk.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient=
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const params=
new URLSearchParams(location.search);

const presentationId=
params.get("id");

let presentation=null;
let slides=[];
let currentSlide=0;


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  loadPresentation
);


/* =========================
   LOAD PRESENTATION
========================= */

async function loadPresentation(){

  if(!presentationId){

    showError(
      "Presentation not found",
      "No presentation ID was provided."
    );

    return;
  }

  try{

    const {
      data,
      error
    }=
    await supabaseClient
      .from("presentations")
      .select("*")
      .eq("id",presentationId)
      .eq("is_published",true)
      .maybeSingle();

    if(error){
      throw error;
    }

    if(!data){

      showError(
        "Presentation unavailable",
        "This presentation does not exist or has not been published."
      );

      return;
    }

    presentation=data;


    /*
      Record a real view in Supabase.
      A browser is prevented from counting
      the same presentation repeatedly
      within 30 minutes.
    */

    await recordView(
      presentation.id
    );


    const {
      data:slideData,
      error:slideError
    }=
    await supabaseClient
      .from("presentation_slides")
      .select("*")
      .eq("presentation_id",presentation.id)
      .order("slide_order",{ascending:true});

    if(slideError){
      throw slideError;
    }

    slides=slideData||[];

    if(!slides.length){

      showError(
        "No slides available",
        "This presentation does not contain any slides yet."
      );

      return;
    }

    document.title=
      presentation.title ||
      "Presentation | CareerCraft";

    document.getElementById(
      "presentationInfo"
    ).textContent=
      presentation.title||"";

    currentSlide=0;

    renderSlide();

    document.getElementById(
      "loading"
    ).classList.add("hidden");

  }catch(error){

    console.error(error);

    showError(
      "Unable to load presentation",
      error.message||"Something went wrong."
    );

  }
}


/* =========================
   RECORD VIEW
========================= */

async function recordView(presentationId){

  try{

    const key=
      "cc_presentation_view_"+presentationId;

    const lastView=
      localStorage.getItem(key);

    const now=
      Date.now();

    const cooldown=
      30*60*1000;

    if(
      lastView &&
      now-Number(lastView)<cooldown
    ){
      return;
    }


    const {
      data:{user}
    }=
    await supabaseClient.auth.getUser();


    const {
      error
    }=
    await supabaseClient
      .from("presentation_views")
      .insert({

        presentation_id:
          presentationId,

        viewer_id:
          user?.id||null,

        viewed_at:
          new Date().toISOString()

      });


    if(!error){

      localStorage.setItem(
        key,
        String(now)
      );

    }else{

      console.error(
        "View tracking error:",
        error
      );

    }

  }catch(error){

    console.error(
      "Unable to record view:",
      error
    );

  }
}


/* =========================
   RENDER SLIDE
========================= */

function renderSlide(){

  if(!slides.length){
    return;
  }

  const slide=
    slides[currentSlide];


  const title=
    document.getElementById(
      "slideTitle"
    );

  const subtitle=
    document.getElementById(
      "slideSubtitle"
    );

  const text=
    document.getElementById(
      "slideText"
    );

  const image=
    document.getElementById(
      "slideImage"
    );

  const bg=
    document.getElementById(
      "slideBg"
    );

  const overlay=
    document.getElementById(
      "slideOverlay"
    );

  const slideElement=
    document.getElementById(
      "slide"
    );


  title.textContent=
    slide.title||"";

  subtitle.textContent=
    slide.subtitle||"";

  text.textContent=
    slide.content||"";


  if(slide.image_url){

    image.src=
      slide.image_url;

    image.classList.remove(
      "hidden"
    );

  }else{

    image.removeAttribute("src");

    image.classList.add(
      "hidden"
    );

  }


  if(slide.background){

    bg.style.background=
      slide.background;

  }else{

    bg.style.background=
      "#ffffff";

  }


  /*
    Allow saved background values
    such as gradients or colors.
  */

  if(
    slide.background &&
    (
      slide.background.includes(
        "gradient"
      ) ||
      slide.background.startsWith("#") ||
      slide.background.startsWith("rgb") ||
      slide.background.startsWith("hsl")
    )
  ){

    bg.style.background=
      slide.background;

  }else if(slide.background){

    bg.style.background=
      `url("${slide.background}") center/cover no-repeat`;

  }


  /*
    Light/dark readability.
  */

  if(
    slide.background &&
    (
      slide.background.includes(
        "gradient"
      ) ||
      slide.background.startsWith("url")
    )
  ){

    slideElement.style.color=
      "#ffffff";

    overlay.style.background=
      "rgba(0,0,0,.28)";

  }else{

    slideElement.style.color=
      "#111827";

    overlay.style.background=
      "transparent";

  }


  document.getElementById(
    "counter"
  ).textContent=
    `${currentSlide+1} / ${slides.length}`;

}


/* =========================
   NEXT
========================= */

function nextSlide(){

  if(
    currentSlide<
    slides.length-1
  ){

    currentSlide++;

    renderSlide();

  }

}


/* =========================
   PREVIOUS
========================= */

function previousSlide(){

  if(currentSlide>0){

    currentSlide--;

    renderSlide();

  }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="ArrowRight"){
      nextSlide();
    }

    if(event.key==="ArrowLeft"){
      previousSlide();
    }

    if(event.key===" "){
      event.preventDefault();
      nextSlide();
    }

    if(event.key==="Escape"){
      if(document.fullscreenElement){
        document.exitFullscreen();
      }
    }

  }
);


/* =========================
   SHARE
========================= */

async function sharePresentation(){

  const url=
    location.href;

  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          presentation?.title||
          "CareerCraft Presentation",

        text:
          "View this presentation on CareerCraft",

        url

      });

    }catch(error){

      console.log(error);

    }

  }else{

    try{

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Presentation link copied."
      );

    }catch(error){

      prompt(
        "Copy this presentation link:",
        url
      );

    }

  }

}


/* =========================
   PRINT
========================= */

function printPresentation(){

  window.print();

}


/* =========================
   FULLSCREEN
========================= */

async function toggleFullscreen(){

  try{

    if(!document.fullscreenElement){

      await document.documentElement.requestFullscreen();

    }else{

      await document.exitFullscreen();

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================
   ERROR SCREEN
========================= */

function showError(
  title,
  message
){

  document.getElementById(
    "loading"
  ).classList.add("hidden");

  document.querySelector(
    ".viewer"
  ).innerHTML=`

    <div class="empty">

      <h2>${escapeHtml(title)}</h2>

      <p>${escapeHtml(message)}</p>

    </div>

  `;

}


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
  </html>
