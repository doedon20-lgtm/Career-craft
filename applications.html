<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CareerCraft — Application Tracker</title><style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* NAVBAR */

.navbar {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.logo {
    text-decoration: none;
    font-size: 25px;
    font-weight: 800;
    color: #111827;
}

.logo span {
    color: #2563eb;
}

.nav-links {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

.nav-links a {
    text-decoration: none;
    color: #4b5563;
    font-size: 14px;
    font-weight: 600;
}

.nav-links a:hover {
    color: #2563eb;
}

/* PAGE */

.container {
    max-width: 1150px;
    margin: auto;
    padding: 40px 20px 70px;
}

.header {
    margin-bottom: 28px;
}

.header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.header p {
    color: #6b7280;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 30px;
}

.stat {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 13px;
    padding: 20px;
}

.stat-number {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 5px;
}

.stat-label {
    color: #6b7280;
    font-size: 13px;
}

/* ACTION BAR */

.action-bar {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.filter {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.filter button {
    border: 1px solid #d1d5db;
    background: white;
    color: #374151;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
}

.filter button.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

.primary-btn {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 17px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
}

/* APPLICATION */

.application {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 23px;
    margin-bottom: 15px;
}

.application-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.job-title {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 7px;
}

.company {
    font-size: 14px;
    color: #4b5563;
    margin-bottom: 7px;
}

.location {
    font-size: 13px;
    color: #6b7280;
}

.status {
    display: inline-block;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
}

.status-Saved {
    background: #f3f4f6;
    color: #374151;
}

.status-Applied {
    background: #dbeafe;
    color: #1d4ed8;
}

.status-Interview {
    background: #fef3c7;
    color: #92400e;
}

.status-Offer {
    background: #dcfce7;
    color: #166534;
}

.status-Rejected {
    background: #fee2e2;
    color: #991b1b;
}

.application-bottom {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #f0f0f0;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.date {
    color: #9ca3af;
    font-size: 12px;
}

.controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.controls select,
.controls button {
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 12px;
    cursor: pointer;
}

.controls button {
    color: #dc2626;
    font-weight: 700;
}

.view-job {
    text-decoration: none;
    color: #2563eb;
    font-size: 12px;
    font-weight: 700;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    text-align: center;
    padding: 70px 20px;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty h2 {
    margin-bottom: 8px;
}

.empty p {
    color: #6b7280;
    margin-bottom: 20px;
}

/* MOBILE */

@media(max-width:900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width:600px) {

    .navbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .container {
        padding-top: 25px;
    }

    .header h1 {
        font-size: 27px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .application-top {
        flex-direction: column;
    }

}

</style></head><body><nav class="navbar"><a href="index.html" class="logo">
    Career<span>Craft</span>
</a>

<div class="nav-links">

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="cv-builder.html">
        CV Builder
    </a>

    <a href="cv-templates.html">
        Templates
    </a>

    <a href="job-finder.html">
        Find Jobs
    </a>

    <a href="saved-jobs.html">
        Saved Jobs
    </a>

</div>

</nav><main class="container"><header class="header">

    <h1>
        Application Tracker
    </h1>

    <p>
        Keep track of every job application
        from saved to offer.
    </p>

</header>


<!-- STATS -->

<section class="stats">

    <div class="stat">

        <div
            id="totalCount"
            class="stat-number">
            0
        </div>

        <div class="stat-label">
            Total
        </div>

    </div>


    <div class="stat">

        <div
            id="savedCount"
            class="stat-number">
            0
        </div>

        <div class="stat-label">
            Saved
        </div>

    </div>


    <div class="stat">

        <div
            id="appliedCount"
            class="stat-number">
            0
        </div>

        <div class="stat-label">
            Applied
        </div>

    </div>


    <div class="stat">

        <div
            id="interviewCount"
            class="stat-number">
            0
        </div>

        <div class="stat-label">
            Interviews
        </div>

    </div>


    <div class="stat">

        <div
            id="offerCount"
            class="stat-number">
            0
        </div>

        <div class="stat-label">
            Offers
        </div>

    </div>

</section>


<!-- ACTION BAR -->

<section class="action-bar">

    <div class="filter">

        <button
            class="active"
            data-filter="All">
            All
        </button>

        <button data-filter="Saved">
            Saved
        </button>

        <button data-filter="Applied">
            Applied
        </button>

        <button data-filter="Interview">
            Interview
        </button>

        <button data-filter="Offer">
            Offer
        </button>

        <button data-filter="Rejected">
            Rejected
        </button>

    </div>

    <a
        href="job-finder.html"
        class="primary-btn">
        + Find Jobs
    </a>

</section>


<!-- APPLICATIONS -->

<section id="applicationsList"></section>

</main><script>

/* ==========================
   STORAGE
========================== */

let applications =
    JSON.parse(
        localStorage.getItem(
            "careerCraftApplications"
        )
    ) || [];


/* ==========================
   FILTER
========================== */

let currentFilter = "All";


/* ==========================
   SAVE
========================== */

function saveApplications() {

    localStorage.setItem(
        "careerCraftApplications",
        JSON.stringify(applications)
    );

}


/* ==========================
   STATISTICS
========================== */

function updateStats() {

    document.getElementById(
        "totalCount"
    ).textContent =
        applications.length;

    document.getElementById(
        "savedCount"
    ).textContent =
        applications.filter(
            job => job.status === "Saved"
        ).length;

    document.getElementById(
        "appliedCount"
    ).textContent =
        applications.filter(
            job => job.status === "Applied"
        ).length;

    document.getElementById(
        "interviewCount"
    ).textContent =
        applications.filter(
            job => job.status === "Interview"
        ).length;

    document.getElementById(
        "offerCount"
    ).textContent =
        applications.filter(
            job => job.status === "Offer"
        ).length;

}


/* ==========================
   DISPLAY
========================== */

function renderApplications() {

    const container =
        document.getElementById(
            "applicationsList"
        );

    container.innerHTML = "";

    const filtered =
        currentFilter === "All"
        ? applications
        : applications.filter(
            job =>
                job.status === currentFilter
        );


    if (!filtered.length) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                <h2>
                    No applications here
                </h2>

                <p>
                    Start searching for jobs
                    and track your applications.
                </p>

                <a
                    href="job-finder.html"
                    class="primary-btn">
                    Find Jobs
                </a>

            </div>

        `;

        return;
    }


    filtered.forEach(job => {

        const card =
            document.createElement("article");

        card.className =
            "application";


        const safeTitle =
            job.title ||
            "Untitled Job";

        const safeCompany =
            job.company ||
            "Company not specified";

        const safeLocation =
            job.location ||
            "Location not specified";


        card.innerHTML = `

            <div class="application-top">

                <div>

                    <div class="job-title">
                        ${escapeHTML(safeTitle)}
                    </div>

                    <div class="company">
                        ${escapeHTML(safeCompany)}
                    </div>

                    <div class="location">
                        📍 ${escapeHTML(safeLocation)}
                    </div>

                </div>

                <div>

                    <span
                        class="status status-${job.status}">
                        ${job.status}
                    </span>

                </div>

            </div>


            <div class="application-bottom">

                <div>

                    <span class="date">
                        Added:
                        ${job.date || "Recently"}
                    </span>

                    ${
                        job.url
                        ? `
                        <br>
                        <a
                            href="${job.url}"
                            target="_blank"
                            class="view-job">
                            View Job →
                        </a>
                        `
                        : ""
                    }

                </div>


                <div class="controls">

                    <select
                        onchange="changeStatus('${job.id}', this.value)">

                        <option
                            value="Saved"
                            ${job.status === "Saved" ? "selected" : ""}>
                            Saved
                        </option>

                        <option
                            value="Applied"
                            ${job.status === "Applied" ? "selected" : ""}>
                            Applied
                        </option>

                        <option
                            value="Interview"
                            ${job.status === "Interview" ? "selected" : ""}>
                            Interview
                        </option>

                        <option
                            value="Offer"
                            ${job.status === "Offer" ? "selected" : ""}>
                            Offer
                        </option>

                        <option
                            value="Rejected"
                            ${job.status === "Rejected" ? "selected" : ""}>
                            Rejected
                        </option>

                    </select>


                    <button
                        onclick="removeApplication('${job.id}')">
                        Remove
                    </button>

                </div>

            </div>

        `;

        container.appendChild(card);

    });

}


/* ==========================
   CHANGE STATUS
========================== */

function changeStatus(id, status) {

    const job =
        applications.find(
            item => item.id === id
        );

    if (!job) return;

    job.status = status;

    saveApplications();

    updateStats();

    renderApplications();

}


/* ==========================
   REMOVE
========================== */

function removeApplication(id) {

    if (
        !confirm(
            "Remove this application?"
        )
    ) {
        return;
    }

    applications =
        applications.filter(
            job => job.id !== id
        );

    saveApplications();

    updateStats();

    renderApplications();

}


/* ==========================
   ESCAPE HTML
========================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================
   FILTER BUTTONS
========================== */

document
    .querySelectorAll(".filter button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".filter button"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                currentFilter =
                    button.dataset.filter;

                renderApplications();

            }
        );

    });


/* ==========================
   INITIAL LOAD
========================== */

updateStats();

renderApplications();

</script></body></html>
