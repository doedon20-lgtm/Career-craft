<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In - CareerCraft</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .signup a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">CareerCraft</div>

        <p class="subtitle">Log in to your account</p>

        <form id="loginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="button" id="loginButton">
                Log In
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Create an account</a>
        </div>

    </div>

    <script>
        document.getElementById("loginButton").addEventListener("click", function () {

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const message = document.getElementById("message");

            if (email === "" || password === "") {
                message.textContent = "Please enter your email and password.";
                message.style.color = "red";
                return;
            }

            message.textContent = "Logging in...";
            message.style.color = "#2563eb";

            /*
             * Temporary login test.
             * Once the button is confirmed to work,
             * we will connect this to your real login system.
             */

            setTimeout(function () {
                message.textContent = "Login button is working!";
                message.style.color = "green";
            }, 800);

        });
    </script>

</body>
</html>
