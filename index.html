<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerCraft | Build Your Career</title>

    <meta
        name="description"
        content="CareerCraft helps you build professional CVs, choose beautiful templates, review your CV and find jobs."
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #172033;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            width: 100%;
            min-height: 74px;
            padding: 14px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid #edf0f4;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #4b5563;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        .nav-dashboard {
            color: #2563eb !important;
        }

        .nav-signup {
            background: #2563eb;
            color: #ffffff !important;
            padding: 10px 17px;
            border-radius: 9px;
        }

        .nav-signup:hover {
            background: #1d4ed8;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            background:
                radial-gradient(circle at 85% 15%, #dbeafe 0, transparent 28%),
                linear-gradient(135deg, #f8fbff 0%, #ffffff 60%);
            padding: 80px 6% 75px;
            overflow: hidden;
        }

        .hero-container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            align-items: center;
            gap: 70px;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 30px;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            color: #2563eb;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .hero-badge-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        .hero h1 {
            font-size: 57px;
            line-height: 1.08;
            letter-spacing: -2px;
            color: #111827;
            margin-bottom: 22px;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero-description {
            max-width: 590px;
            color: #667085;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 13px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 13px 21px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 800;
            transition: 0.2s ease;
        }

        .primary-button {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(37,99,235,0.2);
        }

        .primary-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .outline-button {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #172033;
        }

        .outline-button:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .hero-note {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #667085;
            font-size: 13px;
            font-weight: 600;
        }

        .check {
            width: 21px;
            height: 21px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #dcfce7;
            color: #16a34a;
            font-size: 12px;
            font-weight: 900;
        }

        /* =========================
           HERO DASHBOARD PREVIEW
        ========================= */

        .hero-product {
            position: relative;
        }

        .product-window {
            background: #ffffff;
            border: 1px solid #e4e9f0;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(15,23,42,0.13);
            overflow: hidden;
        }

        .window-top {
            height: 48px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 17px;
            background: #f8fafc;
            border-bottom: 1px solid #edf0f4;
        }

        .window-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .product-body {
            display: grid;
            grid-template-columns: 145px 1fr;
            min-height: 390px;
        }

        .product-sidebar {
            background: #172033;
            padding: 22px 14px;
        }

        .side-brand {
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 30px;
            padding-left: 8px;
        }

        .side-brand span {
            color: #60a5fa;
        }

        .side-item {
            color: #b8c1d1;
            padding: 10px 9px;
            margin-bottom: 5px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 700;
        }

        .side-item.active {
            background: #2563eb;
            color: white;
        }

        .product-main {
            padding: 22px;
            background: #f8fafc;
        }

        .product-welcome {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 18px;
        }

        .product-welcome h3 {
            font-size: 17px;
            color: #172033;
        }

        .product-welcome p {
            color: #94a3b8;
            font-size: 10px;
            margin-top: 2px;
        }

        .avatar {
            width: 37px;
            height: 37px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-weight: 800;
            font-size: 13px;
        }

        .product-stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .product-stat {
            background: #ffffff;
            border: 1px solid #e8edf3;
            border-radius: 9px;
            padding: 13px;
        }

        .product-stat strong {
            display: block;
            font-size: 20px;
            color: #172033;
        }

        .product-stat span {
            color: #94a3b8;
            font-size: 9px;
        }

        .dashboard-panel {
            background: #ffffff;
            border: 1px solid #e8edf3;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .cv-row {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .cv-icon {
            width: 37px;
            height: 42px;
            border-radius: 5px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .cv-row-text {
            flex: 1;
        }

        .cv-row-text strong {
            display: block;
            font-size: 11px;
        }

        .cv-row-text span {
            color: #94a3b8;
            font-size: 9px;
        }

        .small-progress {
            width: 70px;
            height: 6px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .small-progress div {
            width: 80%;
            height: 100%;
            background: #2563eb;
        }

        .job-mini {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .job-mini:last-child {
            border-bottom: 0;
        }

        .job-company {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-weight: 800;
            font-size: 11px;
        }

        .job-info {
            flex: 1;
        }

        .job-info strong {
            display: block;
            font-size: 10px;
        }

        .job-info span {
            color: #94a3b8;
            font-size: 8px;
        }

        .job-status {
            color: #16a34a;
            font-size: 8px;
            font-weight: 800;
        }

        /* =========================
           QUICK ACCESS
        ========================= */

        .quick-section {
            margin-top: -1px;
            padding: 25px 6%;
            background: #ffffff;
            border-bottom: 1px solid #edf0f4;
        }

        .quick-container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 13px;
        }

        .quick-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border: 1px solid #e8edf3;
            border-radius: 11px;
            background: #ffffff;
            transition: 0.2s;
        }

        .quick-card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 8px 25px rgba(15,23,42,0.05);
            transform: translateY(-2px);
        }

        .quick-icon {
            width: 39px;
            height: 39px;
            border-radius: 9px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .quick-card strong {
            display: block;
            font-size: 13px;
        }

        .quick-card span {
            color: #94a3b8;
            font-size: 10px;
        }

        /* =========================
           GENERAL SECTION
        ========================= */

        .section {
            padding: 85px 6%;
        }

        .section-container {
            max-width: 1200px;
            margin: auto;
        }

        .section-heading {
            max-width: 680px;
            margin: 0 auto 45px;
            text-align: center;
        }

        .section-heading .eyebrow {
            color: #2563eb;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 9px;
        }

        .section-heading h2 {
            color: #111827;
            font-size: 38px;
            line-height: 1.2;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .section-heading p {
            color: #667085;
            font-size: 15px;
        }

        /* =========================
           TOOLS
        ========================= */

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 17px;
        }

        .tool-card {
            padding: 26px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            transition: 0.25s;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            border-color: #bfdbfe;
            box-shadow: 0 16px 40px rgba(15,23,42,0.07);
        }

        .tool-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: #eff6ff;
            font-size: 22px;
            margin-bottom: 18px;
        }

        .tool-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .tool-card p {
            min-height: 67px;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 17px;
        }

        .tool-link {
            color: #2563eb;
            font-size: 13px;
            font-weight: 800;
        }

        /* =========================
           JOB SEARCH
        ========================= */

        .jobs-section {
            background: #f8fafc;
        }

        .jobs-layout {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 50px;
            align-items: center;
        }

        .jobs-text h2 {
            font-size: 39px;
            line-height: 1.2;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .jobs-text > p {
            color: #667085;
            font-size: 15px;
            margin-bottom: 24px;
        }

        .job-benefits {
            list-style: none;
            margin-bottom: 25px;
        }

        .job-benefits li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
        }

        .jobs-preview {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 17px;
            padding: 18px;
            box-shadow: 0 15px 45px rgba(15,23,42,0.06);
        }

        .jobs-search {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            margin-bottom: 14px;
        }

        .fake-input {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px 12px;
            color: #64748b;
            font-size: 11px;
            background: #ffffff;
        }

        .search-button {
            border: 0;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            padding: 0 15px;
            font-weight: 800;
            font-size: 11px;
        }

        .job-card {
            border: 1px solid #edf0f4;
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
        }

        .job-card-top {
            display: flex;
            gap: 11px;
        }

        .company-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .job-card-info {
            flex: 1;
        }

        .job-card-info h4 {
            font-size: 13px;
        }

        .job-card-info p {
            color: #64748b;
            font-size: 10px;
        }

        .job-tag {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            padding: 4px 7px;
            border-radius: 5px;
            font-size: 8px;
            font-weight: 700;
            margin-top: 8px;
            margin-right: 4px;
        }

        /* =========================
           TEMPLATES
        ========================= */

        .template-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 17px;
        }

        .template-card {
            border: 1px solid #e5e7eb;
            border-radius: 13px;
            padding: 11px;
            background: #ffffff;
            transition: 0.2s;
        }

        .template-card:hover {
            border-color: #2563eb;
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(15,23,42,0.08);
        }

        .template-paper {
            height: 235px;
            border-radius: 7px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 15px;
            overflow: hidden;
        }

        .template-header {
            height: 42px;
            background: #172033;
            margin: -15px -15px 13px;
            padding: 13px;
        }

        .template-header span {
            display: block;
            width: 65px;
            height: 7px;
            background: #ffffff;
            border-radius: 3px;
        }

        .template-header small {
            display: block;
            width: 42px;
            height: 4px;
            background: #93c5fd;
            margin-top: 5px;
            border-radius: 3px;
        }

        .template-line {
            height: 5px;
            background: #dbe2ea;
            border-radius: 3px;
            margin: 7px 0;
        }

        .template-line.short {
            width: 65%;
        }

        .template-title {
            width: 55px;
            height: 6px;
            background: #2563eb;
            border-radius: 3px;
            margin: 14px 0 8px;
        }

        .template-card h3 {
            font-size: 14px;
            margin: 12px 4px 3px;
        }

        .template-card p {
            color: #94a3b8;
            font-size: 10px;
            margin: 0 4px 7px;
        }

        .template-link {
            color: #2563eb;
            font-size: 11px;
            font-weight: 800;
            margin-left: 4px;
        }

        .template-modern .template-header {
            background: #2563eb;
        }

        .template-minimal .template-header {
            background: #ffffff;
            border-bottom: 2px solid #172033;
        }

        .template-minimal .template-header span {
            background: #172033;
        }

        .template-minimal .template-header small {
            background: #94a3b8;
        }

        .template-executive .template-header {
            background: #0f172a;
        }

        /* =========================
           APPLICATION TRACKER
        ========================= */

        .tracker-section {
            background: #172033;
            color: white;
        }

        .tracker-layout {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 55px;
            align-items: center;
        }

        .tracker-text .eyebrow {
            color: #60a5fa;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }

        .tracker-text h2 {
            font-size: 38px;
            line-height: 1.2;
            margin-bottom: 14px;
        }

        .tracker-text p {
            color: #cbd5e1;
            font-size: 15px;
            margin-bottom: 23px;
        }

        .tracker-points {
            list-style: none;
            margin-bottom: 25px;
        }

        .tracker-points li {
            color: #e2e8f0;
            margin: 10px 0;
            font-size: 13px;
            font-weight: 700;
        }

        .tracker-button {
            background: #ffffff;
            color: #172033;
        }

        .tracker-button:hover {
            background: #eff6ff;
        }

        .tracker-preview {
            background: #ffffff;
            color: #172033;
            border-radius: 16px;
            padding: 19px;
        }

        .tracker-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .tracker-head h3 {
            font-size: 15px;
        }

        .tracker-head span {
            color: #2563eb;
            font-size: 10px;
            font-weight: 800;
        }

        .tracker-stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .tracker-stat {
            background: #f8fafc;
            padding: 11px;
            border-radius: 8px;
        }

        .tracker-stat strong {
            display: block;
            font-size: 18px;
        }

        .tracker-stat span {
            color: #94a3b8;
            font-size: 8px;
        }

        .application-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid #edf0f4;
        }

        .application-row:last-child {
            border-bottom: 0;
        }

        .application-logo {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
        }

        .application-info {
            flex: 1;
        }

        .application-info strong {
            display: block;
            font-size: 10px;
        }

        .application-info span {
            color: #94a3b8;
            font-size: 8px;
        }

        .application-status {
            font-size: 8px;
            font-weight: 800;
            padding: 5px 7px;
            border-radius: 5px;
            background: #eff6ff;
            color: #2563eb;
        }

        .application-status.interview {
            background: #fef3c7;
            color: #a16207;
        }

        /* =========================
           HOW IT WORKS
        ========================= */

        .steps {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }

        .step {
            text-align: center;
            padding: 20px;
        }

        .step-number {
            width: 53px;
            height: 53px;
            margin: 0 auto 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
            border-radius: 50%;
            font-size: 17px;
            font-weight: 900;
        }

        .step h3 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .step p {
            color: #6b7280;
            font-size: 12px;
        }

        /* =========================
           CTA
        ========================= */

        .cta-section {
            padding: 20px 6% 85px;
        }

        .cta-box {
            max-width: 1200px;
            margin: auto;
            background: linear-gradient(135deg,#2563eb,#1d4ed8);
            color: white;
            border-radius: 19px;
            padding: 55px 30px;
            text-align: center;
        }

        .cta-box h2 {
            font-size: 37px;
            line-height: 1.2;
            margin-bottom: 11px;
        }

        .cta-box p {
            color: #dbeafe;
            max-width: 570px;
            margin: 0 auto 24px;
            font-size: 14px;
        }

        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cta-white {
            background: #ffffff;
            color: #172033;
        }

        .cta-outline {
            border: 1px solid rgba(255,255,255,0.6);
            color: white;
        }

        .cta-outline:hover {
            background: rgba(255,255,255,0.1);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #f8fafc;
            border-top: 1px solid #e5e7eb;

            font-size: 13px;
            margin-top: 12px;

            margin-bottom: 14px;

        .footer-column a {

            color: #64748b;
            font-size: 12px;
            margin: 9px 0;

        .footer-column a:hover {

            font-size: 11px;
