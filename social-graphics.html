<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Graphics | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --danger: #ef4444;
    --shadow: 0 10px 30px rgba(15, 23, 42, .07);
}

body.dark {
    --bg: #0b1020;
    --card: #111827;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #263244;
    --shadow: 0 10px 30px rgba(0, 0, 0, .25);
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: .25s;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
}

/* NAVIGATION */

.topbar {
    height: 72px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: grid;
    place-items: center;
    color: white;
    font-weight: 800;
}

.brand h1 {
    font-size: 19px;
}

.brand span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
}

.nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 18px;
}

.primary-btn {
    border: none;
    color: white;
    background: var(--primary);
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 700;
    transition: .2s;
}

.primary-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
}

/* MAIN */

.container {
    width: min(1250px, calc(100% - 32px));
    margin: 0 auto;
    padding: 35px 0 60px;
}

.hero {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 28px;
}

.hero h2 {
    font-size: clamp(28px, 4vw, 42px);
    margin-bottom: 8px;
}

.hero p {
    color: var(--muted);
    max-width: 650px;
    line-height: 1.6;
}

.hero-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}

.stat-number {
    font-size: 28px;
    font-weight: 800;
}

/* TOOLBAR */

.toolbar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
}

.search {
    flex: 1;
    position: relative;
}

.search input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 12px;
    padding: 13px 15px;
    outline: none;
}

.search input:focus {
    border-color: var(--primary);
}

/* GRID */

.graphics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.graphic-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: .2s;
}

.graphic-card:hover {
    transform: translateY(-3px);
}

.thumbnail {
    aspect-ratio: 1 / .72;
    background: #e5e7eb;
    overflow: hidden;
    position: relative;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.thumbnail-fallback {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    color: white;
    font-size: 28px;
    font-weight: 800;
    padding: 20px;
    text-align: center;
}

.card-content {
    padding: 17px;
}

.card-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
}

.card-title {
    font-size: 17px;
    font-weight: 800;
    word-break: break-word;
}

.platform {
    background: rgba(79, 70, 229, .1);
    color: var(--primary);
    border-radius: 20px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}

.card-date {
    color: var(--muted);
    font-size: 12px;
    margin-top: 7px;
}

.card-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 15px;
}

.small-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 9px 6px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
}

.small-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.small-btn.delete:hover {
    border-color: var(--danger);
    color: var(--danger);
}

/* EMPTY */

.empty {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 22px;
    text-align: center;
    padding: 65px 20px;
    grid-column: 1 / -1;
}

.empty-icon {
    width: 70px;
    height: 70px;
    border-radius: 20px;
    background: rgba(79, 70, 229, .1);
    color: var(--primary);
    display: grid;
    place-items: center;
    margin: 0 auto 18px;
    font-size: 30px;
}

.empty h3 {
    margin-bottom: 8px;
}

.empty p {
    color: var(--muted);
    margin-bottom: 20px;
}

/* TOAST */

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #111827;
    color: white;
    padding: 13px 17px;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,.2);
    transform: translateY(100px);
    opacity: 0;
    pointer-events: none;
    transition: .3s;
    z-index: 100;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* MOBILE */

@media(max-width: 950px) {
    .graphics-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 650px) {
    .topbar {
        padding: 0 15px;
    }

    .brand span {
        display: none;
    }

    .primary-btn {
        padding: 10px 13px;
        font-size: 13px;
    }

    .container {
        width: min(100% - 20px, 1250px);
        padding-top: 25px;
    }

    .hero {
        align-items: flex-start;
        flex-direction: column;
    }

    .hero-actions {
        width: 100%;
    }

    .hero-actions .primary-btn {
        width: 100%;
    }

    .toolbar {
        flex-direction: column;
    }

    .graphics-grid {
        grid-template-columns: 1fr;
    }

    .stats {
        gap: 10px;
    }

    .stat {
        padding: 15px;
    }

    .stat-number {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">CC</div>
        <div>
            <h1>CareerCraft</h1>
            <span>Social Graphics</span>
        </div>
    </div>

    <div class="nav-actions">
        <button class="icon-btn" id="themeBtn" title="Toggle dark mode">🌙</button>

        <button class="primary-btn" onclick="createNewGraphic()">
            + Create Graphic
        </button>
    </div>

</header>

<main class="container">

    <section class="hero">

        <div>
            <h2>Social Graphics</h2>
            <p>
                Create professional graphics for Instagram, Facebook,
                LinkedIn, X, TikTok and other platforms.
            </p>
        </div>

        <div class="hero-actions">
            <button class="primary-btn" onclick="createNewGraphic()">
                Create New Graphic
            </button>
        </div>

    </section>

    <section class="stats">

        <div class="stat">
            <div class="stat-label">Total Graphics</div>
            <div class="stat-number" id="totalGraphics">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Instagram</div>
            <div class="stat-number" id="instagramCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">LinkedIn</div>
            <div class="stat-number" id="linkedinCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Other Platforms</div>
            <div class="stat-number" id="otherCount">0</div>
        </div>

    </section>

    <section class="toolbar">

        <div class="search">
            <input
                type="search"
                id="searchInput"
                placeholder="Search your graphics..."
            >
        </div>

        <button class="icon-btn" onclick="loadGraphics()" title="Refresh">
            ↻
        </button>

    </section>

    <section class="graphics-grid" id="graphicsGrid">

        <div class="empty">
            <div class="empty-icon">🎨</div>
            <h3>Loading graphics...</h3>
            <p>Please wait.</p>
        </div>

    </section>

</main>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://upcxmlbgmqhaqieldmyk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

let graphics = [];

/* =========================================================
   THEME
========================================================= */

const savedTheme = localStorage.getItem("cc_social_theme");

if (savedTheme === "dark") {
    document.body.classList.add("dark");
    document.getElementById("themeBtn").textContent = "☀️";
}

document.getElementById("themeBtn").addEventListener("click", () => {

    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    localStorage.setItem(
        "cc_social_theme",
        dark ? "dark" : "light"
    );

    document.getElementById("themeBtn").textContent =
        dark ? "☀️" : "🌙";
});

/* =========================================================
   AUTH
========================================================= */

async function getUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (error) {
        console.error(error);
        return null;
    }

    return data.user;
}

/* =========================================================
   LOAD
========================================================= */

async function loadGraphics() {

    const grid = document.getElementById("graphicsGrid");

    grid.innerHTML = `
        <div class="empty">
            <div class="empty-icon">⏳</div>
            <h3>Loading graphics...</h3>
            <p>Please wait.</p>
        </div>
    `;

    const user = await getUser();

    if (!user) {

        grid.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🔐</div>
                <h3>Sign in required</h3>
                <p>Please sign in to view your saved graphics.</p>
            </div>
        `;

        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("social_graphics")
        .select("*")
        .eq("user_id", user.id)
        .order("updated_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        grid.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <h3>Unable to load graphics</h3>
                <p>${escapeHtml(error.message)}</p>
            </div>
        `;

        return;
    }

    graphics = data || [];

    updateStats();
    renderGraphics();
}

/* =========================================================
   STATS
========================================================= */

function updateStats() {

    const instagram = graphics.filter(
        g => String(g.platform || "").toLowerCase().includes("instagram")
    ).length;

    const linkedin = graphics.filter(
        g => String(g.platform || "").toLowerCase().includes("linkedin")
    ).length;

    const other = graphics.length - instagram - linkedin;

    document.getElementById("totalGraphics").textContent =
        graphics.length;

    document.getElementById("instagramCount").textContent =
        instagram;

    document.getElementById("linkedinCount").textContent =
        linkedin;

    document.getElementById("otherCount").textContent =
        Math.max(0, other);
}

/* =========================================================
   RENDER
========================================================= */

function renderGraphics() {

    const grid = document.getElementById("graphicsGrid");

    const query =
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    const filtered = graphics.filter(g => {

        return (
            String(g.title || "").toLowerCase().includes(query) ||
            String(g.platform || "").toLowerCase().includes(query) ||
            String(g.template || "").toLowerCase().includes(query)
        );

    });

    if (!filtered.length) {

        grid.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🎨</div>
                <h3>${query ? "No matching graphics" : "No graphics yet"}</h3>
                <p>
                    ${
                        query
                        ? "Try another search."
                        : "Create your first professional social graphic."
                    }
                </p>

                ${
                    !query
                    ? `
                    <button class="primary-btn" onclick="createNewGraphic()">
                        Create New Graphic
                    </button>
                    `
                    : ""
                }
            </div>
        `;

        return;
    }

    grid.innerHTML = filtered.map(graphic => {

        const background =
            graphic.background_color || "#4f46e5";

        const headline =
            graphic.headline || "Untitled Graphic";

        const image =
            graphic.background_image_url ||
            graphic.logo_url ||
            "";

        const date =
            graphic.updated_at
            ? new Date(graphic.updated_at).toLocaleDateString()
            : "";

        return `
            <article class="graphic-card">

                <div class="thumbnail">

                    ${
                        image
                        ? `
                        <img
                            src="${escapeAttribute(image)}"
                            alt=""
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
                        >
                        `
                        : ""
                    }

                    <div
                        class="thumbnail-fallback"
                        style="background:${escapeAttribute(background)};display:${image ? "none" : "grid"}"
                    >
                        ${escapeHtml(headline)}
                    </div>

                </div>

                <div class="card-content">

                    <div class="card-top">

                        <div>
                            <div class="card-title">
                                ${escapeHtml(graphic.title || "Untitled")}
                            </div>

                            <div class="card-date">
                                Updated ${escapeHtml(date)}
                            </div>
                        </div>

                        <span class="platform">
                            ${escapeHtml(graphic.platform || "Social")}
                        </span>

                    </div>

                    <div class="card-buttons">

                        <button
                            class="small-btn"
                            onclick="editGraphic('${graphic.id}')"
                        >
                            Edit
                        </button>

                        <button
                            class="small-btn"
                            onclick="downloadGraphic('${graphic.id}')"
                        >
                            Download
                        </button>

                        <button
                            class="small-btn delete"
                            onclick="deleteGraphic('${graphic.id}')"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            </article>
        `;

    }).join("");
}

/* =========================================================
   SEARCH
========================================================= */

document.getElementById("searchInput").addEventListener(
    "input",
    renderGraphics
);

/* =========================================================
   CREATE
========================================================= */

function createNewGraphic() {

    window.location.href =
        "social-graphics-editor.html";
}

/* =========================================================
   EDIT
========================================================= */

function editGraphic(id) {

    window.location.href =
        "social-graphics-editor.html?id=" +
        encodeURIComponent(id);
}

/* =========================================================
   DELETE
========================================================= */

async function deleteGraphic(id) {

    const graphic = graphics.find(
        g => g.id === id
    );

    if (!graphic) return;

    const confirmed = confirm(
        "Delete this graphic? This action cannot be undone."
    );

    if (!confirmed) return;

    const user = await getUser();

    if (!user) {
        showToast("Please sign in first.");
        return;
    }

    /* Delete database record */

    const {
        error
    } = await supabaseClient
        .from("social_graphics")
        .delete()
        .eq("id", id)
        .eq("user_id", user.id);

    if (error) {

        console.error(error);

        showToast(
            "Delete failed: " + error.message
        );

        return;
    }

    /* Try to delete associated files */

    const files = [];

    if (graphic.background_image_url) {
        const path = extractStoragePath(
            graphic.background_image_url,
            "social-graphics"
        );

        if (path) files.push(path);
    }

    if (graphic.logo_url) {
        const path = extractStoragePath(
            graphic.logo_url,
            "social-graphics"
        );

        if (path) files.push(path);
    }

    if (files.length) {

        await supabaseClient
            .storage
            .from("social-graphics")
            .remove(files);
    }

    showToast("Graphic deleted.");

    await loadGraphics();
}

/* =========================================================
   DOWNLOAD
========================================================= */

async function downloadGraphic(id) {

    const graphic = graphics.find(
        g => g.id === id
    );

    if (!graphic) return;

    try {

        showToast("Preparing download...");

        const data =
            graphic.graphic_data || {};

        const width =
            Number(graphic.width) || 1080;

        const height =
            Number(graphic.height) || 1080;

        const canvas =
            document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
            canvas.getContext("2d");

        /* Background */

        ctx.fillStyle =
            graphic.background_color || "#4f46e5";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        /* Background image */

        if (graphic.background_image_url) {

            try {

                const img =
                    await loadImage(
                        graphic.background_image_url
                    );

                drawCover(
                    ctx,
                    img,
                    0,
                    0,
                    width,
                    height
                );

            } catch (e) {
                console.warn(
                    "Background image could not be loaded."
                );
            }
        }

        /* Overlay */

        if (data.overlay) {

            ctx.fillStyle =
                data.overlay;

            ctx.fillRect(
                0,
                0,
                width,
                height
            );
        }

        /* Headline */

        const headline =
            graphic.headline || "";

        if (headline) {

            ctx.fillStyle =
                data.headlineColor || "#ffffff";

            ctx.font =
                `800 ${Number(data.headlineSize) || 72}px Arial`;

            ctx.textAlign =
                data.headlineAlign || "center";

            wrapText(
                ctx,
                headline,
                width / 2,
                Number(data.headlineY) || height * .42,
                width * .82,
                Number(data.headlineLineHeight) || 1.15 *
                (Number(data.headlineSize) || 72)
            );
        }

        /* Body */

        const body =
            graphic.body_text || "";

        if (body) {

            ctx.fillStyle =
                data.bodyColor || "#ffffff";

            ctx.font =
                `400 ${Number(data.bodySize) || 30}px Arial`;

            ctx.textAlign =
                data.bodyAlign || "center";

            wrapText(
                ctx,
                body,
                width / 2,
                Number(data.bodyY) || height * .60,
                width * .76,
                Number(data.bodyLineHeight) || 1.35 *
                (Number(data.bodySize) || 30)
            );
        }

        /* Author */

        if (graphic.author_name) {

            ctx.fillStyle =
                data.authorColor || "#ffffff";

            ctx.font =
                `600 ${Number(data.authorSize) || 24}px Arial`;

            ctx.textAlign = "center";

            ctx.fillText(
                graphic.author_name,
                width / 2,
                Number(data.authorY) || height * .88
            );
        }

        /* Logo */

        if (graphic.logo_url) {

            try {

                const logo =
                    await loadImage(
                        graphic.logo_url
                    );

                const size =
                    Math.min(
                        width,
                        height
                    ) * .15;

                ctx.drawImage(
                    logo,
                    width - size - 45,
                    35,
                    size,
                    size
                );

            } catch (e) {
                console.warn(
                    "Logo could not be loaded."
                );
            }
        }

        const link =
            document.createElement("a");

        link.download =
            safeFileName(
                graphic.title || "social-graphic"
            ) + ".png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        link.click();

        showToast("Graphic downloaded.");

    } catch (error) {

        console.error(error);

        showToast(
            "Unable to download graphic."
        );
    }
}

/* =========================================================
   CANVAS HELPERS
========================================================= */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.crossOrigin =
            "anonymous";

        img.onload = () =>
            resolve(img);

        img.onerror = () =>
            reject(new Error("Image load failed"));

        img.src = src;
    });
}

function drawCover(
    ctx,
    img,
    x,
    y,
    width,
    height
) {

    const scale =
        Math.max(
            width / img.width,
            height / img.height
        );

    const w =
        img.width * scale;

    const h =
        img.height * scale;

    const dx =
        x + (width - w) / 2;

    const dy =
        y + (height - h) / 2;

    ctx.drawImage(
        img,
        dx,
        dy,
        w,
        h
    );
}

function wrapText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight
) {

    const words =
        text.split(/\s+/);

    let line = "";
    let currentY = y;

    for (let i = 0; i < words.length; i++) {

        const test =
            line
            ? line + " " + words[i]
            : words[i];

        const metrics =
            ctx.measureText(test);

        if (
            metrics.width > maxWidth &&
            line
        ) {

            ctx.fillText(
                line,
                x,
                currentY
            );

            line =
                words[i];

            currentY += lineHeight;

        } else {

            line = test;
        }
    }

    if (line) {

        ctx.fillText(
            line,
            x,
            currentY
        );
    }
}

function extractStoragePath(
    url,
    bucket
) {

    try {

        const marker =
            `/storage/v1/object/public/${bucket}/`;

        const index =
            url.indexOf(marker);

        if (index === -1)
            return null;

        return decodeURIComponent(
            url.substring(
                index + marker.length
            )
        );

    } catch {
        return null;
    }
}

   UTILITY
========================================================= */

function safeFileName(name) {

    return String(name)
        .replace(/[^a-z0-9-_]+/gi, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .toLowerCase() || "social-graphic";
}

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
    return escapeHtml(value);
}

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 3000);
}
