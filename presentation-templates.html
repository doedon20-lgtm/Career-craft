<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presentation Templates | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8fafc;
  color:#0f172a;
  min-height:100vh;
}

button,
a{
  font:inherit;
}

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:19px;
  font-weight:800;
}

.brand-mark{
  width:36px;
  height:36px;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.back{
  text-decoration:none;
  color:#475569;
  font-size:14px;
  font-weight:600;
}

.back:hover{
  color:#7c3aed;
}

.container{
  width:min(1180px,94%);
  margin:auto;
  padding:34px 0 60px;
}

.hero{
  margin-bottom:30px;
}

.hero h1{
  font-size:34px;
  margin-bottom:8px;
  letter-spacing:-.5px;
}

.hero p{
  color:#64748b;
  max-width:700px;
  line-height:1.6;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 35px rgba(15,23,42,.08);
}

.preview{
  height:210px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.preview-inner{
  width:90%;
  height:82%;
  border-radius:9px;
  padding:22px;
  box-shadow:0 12px 25px rgba(0,0,0,.14);
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.preview-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:9px;
}

.preview-line{
  height:7px;
  width:70%;
  background:currentColor;
  opacity:.2;
  border-radius:20px;
  margin-bottom:7px;
}

.preview-line.short{
  width:45%;
}

.card-body{
  padding:20px;
}

.card-body h2{
  font-size:18px;
  margin-bottom:7px;
}

.card-body p{
  color:#64748b;
  font-size:14px;
  line-height:1.5;
  min-height:42px;
  margin-bottom:17px;
}

.use-btn{
  width:100%;
  border:0;
  background:#7c3aed;
  color:#fff;
  padding:12px 15px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

.use-btn:hover{
  background:#6d28d9;
}

.use-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#0f172a;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  font-size:14px;
  display:none;
  z-index:100;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  max-width:90%;
  text-align:center;
}

.loading{
  position:fixed;
  inset:0;
  background:#f8fafc;
  display:grid;
  place-items:center;
  z-index:200;
}

.loading.hidden{
  display:none;
}

.loader{
  width:42px;
  height:42px;
  border:4px solid #e5e7eb;
  border-top-color:#7c3aed;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.error-box{
  background:#fff;
  border:1px solid #fecaca;
  color:#991b1b;
  border-radius:14px;
  padding:20px;
  line-height:1.6;
  display:none;
  margin-top:20px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .topbar{
    padding:0 15px;
  }

  .brand{
    font-size:17px;
  }

  .brand-mark{
    width:34px;
    height:34px;
  }

  .container{
    padding-top:25px;
  }

  .hero h1{
    font-size:28px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .preview{
    height:200px;
  }
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div class="loader"></div>
</div>

<header class="topbar">

  <div class="brand">
    <div class="brand-mark">C</div>
    <span>CareerCraft</span>
  </div>

  <a href="presentations.html" class="back">
    ← Presentations
  </a>

  <section class="grid" id="templateGrid"></section>

<div class="message" id="message"></div>

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   RENDER TEMPLATES
========================================= */

function renderTemplates(){

  const grid =
    document.getElementById("templateGrid");

  grid.innerHTML = templates.map(template => {

    return `

      <article class="card">

        <div
          class="preview"
          style="
            background:${template.background};
            color:${template.color};
          "
        >

          <div
            class="preview-inner"
            style="
              background:${template.background};
              color:${template.color};
            "
          >

            <div class="preview-title">
              ${escapeHtml(template.name)}
            </div>

            <div class="preview-line"></div>
            <div class="preview-line short"></div>
            <div class="preview-line"></div>

          </div>

        </div>


        <div class="card-body">

          <h2>
            ${escapeHtml(template.name)}
          </h2>

          <p>
            ${escapeHtml(template.description)}
          </p>

          <button
            class="use-btn"
            type="button"
            data-template-id="${escapeHtml(template.id)}"
          >
            Use Template
          </button>

        </div>

      </article>

    `;

  }).join("");


  document
    .querySelectorAll(".use-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          useTemplate(
            this.dataset.templateId,
            this
          );

        }
      );

    });

}


/* =========================================
   USE TEMPLATE
========================================= */

async function useTemplate(
  templateId,
  button
){

  const template =
    templates.find(
      item => item.id === templateId
    );

  if(!template){
    showMessage(
      "Template not found."
    );
    return;
  }


  button.disabled = true;
  button.textContent = "Creating...";


  try{

    const {
      data:{user},
      error:userError
    } =
      await supabaseClient.auth.getUser();


    if(userError){
      throw userError;
    }


    if(!user){

      showMessage(
        "Please sign in first."
      );

      button.disabled = false;
      button.textContent = "Use Template";

      return;
    }


    /* =====================================
       CREATE PRESENTATION
    ===================================== */

    const {
      data:presentation,
      error:presentationError
    } =
      await supabaseClient
        .from("presentations")
        .insert({

          user_id:user.id,

          title:
            template.name,

          description:
            template.description,

          template:
            template.id,

          is_published:false

        })
        .select()
        .single();


    if(presentationError){
      throw presentationError;
    }


    /* =====================================
       CREATE SLIDES
    ===================================== */

    const slideRows =
      template.slides.map(
        (slide,index) => ({

          presentation_id:
            presentation.id,

          slide_order:
            index,

          layout:
            "title_content",

          title:
            slide.title,

          subtitle:
            slide.subtitle,

          content:
            slide.content,

          image_url:
            null,

          background:
            template.background

        })
      );


    const {
      error:slideError
    } =
      await supabaseClient
        .from("presentation_slides")
        .insert(slideRows);


    if(slideError){

      await supabaseClient
        .from("presentations")
        .delete()
        .eq(
          "id",
          presentation.id
        );

      throw slideError;
    }


    showMessage(
      "Presentation created successfully."
    );


    setTimeout(() => {

      window.location.href =
        "presentations.html?edit=" +
        encodeURIComponent(
          presentation.id
        );

    },700);


  }catch(error){

    console.error(
      "Template creation error:",
      error
    );


    showMessage(
      error?.message ||
      "Unable to create presentation."
    );


    button.disabled = false;
    button.textContent = "Use Template";

  }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

  const element =
    document.getElementById("message");

  element.textContent = text;
  element.style.display = "block";


  clearTimeout(
    window.messageTimer
  );


  window.messageTimer =
    setTimeout(() => {

      element.style.display = "none";

    },3500);

}


/* =========================================
   INITIALIZE
========================================= */

function startPage(){

  try{

    renderTemplates();

  }catch(error){

    console.error(error);

    const errorBox =
      document.getElementById("errorBox");

    errorBox.textContent =
      "Unable to load presentation templates.";

    errorBox.style.display = "block";

  }


  document
    .getElementById("loading")
    .classList.add("hidden");

}


/* =========================================
   START
========================================= */

startPage();
