*{

}

:root{

  --primary-dark:#1d4ed8;

  --text:#172033;
  --muted:#687386;
  --border:#e5e9f0;
  --danger:#dc2626;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  height:72px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5%;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  text-decoration:none;
  color:var(--text);
  font-size:22px;
  font-weight:800;
}

.logo span{

}

.back{
  text-decoration:none;
  color:var(--muted);
  font-weight:600;
}

.back:hover{
  color:var(--primary);
}

.container{
  width:min(1180px,92%);
  margin:0 auto;
  padding:45px 0 70px;
}

.hero{
  text-align:center;
  margin-bottom:38px;
}

.hero h1{
  font-size:clamp(30px,5vw,48px);
  line-height:1.1;
  margin-bottom:12px;
  letter-spacing:-1.5px;
}

.hero p{
  color:var(--muted);
  max-width:650px;
  margin:auto;
  font-size:16px;
  line-height:1.7;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.template{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.2s ease;
}

.template:hover{
  transform:translateY(-5px);
  box-shadow:0 18px 40px rgba(15,23,42,.12);
}

.preview{
  height:210px;
  padding:20px;
  position:relative;
  overflow:hidden;
}

.preview-inner{
  width:100%;
  height:100%;
  border-radius:12px;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}

.preview h3{
  font-size:22px;
  margin-bottom:8px;
}

.preview p{
  font-size:12px;
  opacity:.75;
  max-width:80%;
}

.business{
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
}

.business .preview-inner{
  background:#fff;
}

.portfolio{
  background:linear-gradient(135deg,#ede9fe,#faf5ff);
}

.portfolio .preview-inner{
  background:#1e1b4b;
  color:#fff;
}

.project{

}

.project .preview-inner{
  background:#fff;
}

.interview{
  background:linear-gradient(135deg,#fef3c7,#fffbeb);
}

.interview .preview-inner{
  background:#fff;
}

.minimal{
  background:#f3f4f6;
}

.minimal .preview-inner{
  background:#fff;
}

.executive{
  background:linear-gradient(135deg,#111827,#374151);
}

.executive .preview-inner{
  background:#111827;
  color:#fff;
}

.template-info{
  padding:20px;
}

.template-info h2{
  font-size:19px;
  margin-bottom:7px;
}

.template-info p{
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
  min-height:44px;
}

.use-btn{
  width:100%;
  border:0;
  margin-top:17px;
  padding:13px 16px;
  border-radius:11px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  transition:.2s ease;
}

.use-btn:hover{
  background:var(--primary-dark);
}

.use-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:13px 18px;
  border-radius:10px;
  box-shadow:var(--shadow);
  z-index:100;
  max-width:90%;
  text-align:center;
}

.message.show{
  display:block;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.96);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:200;
}

.loading.hidden{
  display:none;
}

.loader-box{
  text-align:center;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #dbe3f0;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 15px;
}

.loader-box p{
  color:var(--muted);
  font-weight:600;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:620px){
  .header{
    padding:0 20px;
  }

  .container{
    padding-top:32px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .preview{
    height:220px;
  }
}

const grid = document.getElementById("templatesGrid");
const loading = document.getElementById("loading");
const message = document.getElementById("message");

function showMessage(text){
  message.textContent = text;
  message.classList.add("show");

  setTimeout(()=>{
    message.classList.remove("show");
  },4000);
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderTemplates(){

  grid.innerHTML = templates.map(template => {

    return `
      <article class="template">

        <div class="preview ${escapeHtml(template.id)}">

          <div class="preview-inner">

            <h3>
              ${escapeHtml(template.slides[0].title)}
            </h3>

            <p>
              ${escapeHtml(template.slides[0].subtitle || template.description)}
            </p>

          </div>

        </div>

        <div class="template-info">

          <h2>${escapeHtml(template.name)}</h2>

          <p>${escapeHtml(template.description)}</p>

          <button
            class="use-btn"
            data-template-id="${escapeHtml(template.id)}">
            Use this template
          </button>

        </div>

      </article>
    `;

  }).join("");

  document.querySelectorAll(".use-btn").forEach(button => {

    button.addEventListener("click",()=>{

      const templateId = button.dataset.templateId;

      useTemplate(templateId,button);

    });

  });
}

async function useTemplate(templateId,button){

  const template = templates.find(item => item.id === templateId);

  if(!template){
    showMessage("Template could not be found.");
    return;
  }

  button.disabled = true;
  button.textContent = "Creating...";

  try{

    const {
      data:{
        user
      },
      error:userError
    } = await supabaseClient.auth.getUser();

    if(userError){
      throw userError;
    }

    if(!user){

      showMessage("Please log in to create a presentation.");

      setTimeout(()=>{
        window.location.href = "login.html";
      },1200);

      return;
    }

    const {
      data:presentation,
      error:presentationError
    } = await supabaseClient
      .from("presentations")
      .insert({
        user_id:user.id,
        title:template.name,
        description:template.description,
        template:template.id,
        is_published:false
      })
      .select()
      .single();

    if(presentationError){
      throw presentationError;
    }

    if(!presentation || !presentation.id){
      throw new Error("Presentation was not created.");
    }

    const slides = template.slides.map((slide,index)=>({

      presentation_id:presentation.id,

      slide_order:index,

      layout:slide.layout || "title_content",

      title:slide.title || null,

      subtitle:slide.subtitle || null,

      content:slide.content || null,

      image_url:slide.image_url || null,

      background:slide.background || null

    }));

    const {
      error:slidesError
    } = await supabaseClient
      .from("presentation_slides")
      .insert(slides);

    if(slidesError){

      await supabaseClient
        .from("presentations")
        .delete()
        .eq("id",presentation.id);

      throw slidesError;
    }

    window.location.href =
      "presentations.html?edit=" +
      encodeURIComponent(presentation.id);

  }catch(error){

    console.error("Presentation creation error:",error);

    showMessage(
      error?.message ||
      "Unable to create presentation."
    );

    button.disabled = false;
    button.textContent = "Use this template";
  }
}

async function initialize(){

  try{

    renderTemplates();

    const {
      data:{
        user

      error

    if(error){
      console.warn(error);
    }

      /*

        Authentication is checked when the user chooses a template.
      */
    }

  }catch(error){

    console.error(error);

    showMessage("Unable to load presentation templates.");

  }finally{

    loading.classList.add("hidden");

  }
}

initialize();
