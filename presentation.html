<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Presentation Studio - CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --purple:#6c5ce7;
  --purple2:#8175ef;
  --purple-light:#eeeaff;
  --bg:#f4f5f9;
  --panel:#fff;
  --border:#e4e5ec;
  --text:#1d1d29;
  --muted:#777b89;
  --dark:#171821;
  --green:#20a66a;
  --danger:#e05252;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   APP BAR
========================================================= */

.appbar{
  height:58px;
  min-height:58px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:12px;
  z-index:30;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  color:var(--purple);
  min-width:175px;
}

.brand-icon{
  width:32px;
  height:32px;
  border-radius:9px;
  background:var(--purple);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn{
  border:0;
  background:#f3f3f7;
  width:34px;
  height:34px;
  border-radius:9px;
  color:#555;
  font-size:18px;
}

.title-wrap{
  flex:1;
  min-width:100px;
}

.presentation-title{
  border:1px solid transparent;
  background:transparent;
  font-size:14px;
  font-weight:700;
  width:100%;
  max-width:420px;
  padding:7px 9px;
  border-radius:7px;
}

.presentation-title:hover,
.presentation-title:focus{
  border-color:var(--border);
  outline:none;
}

.save-status{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

.save-status.saved{
  color:var(--green);
}

.app-actions{
  display:flex;
  gap:7px;
}

.app-btn{
  border:1px solid var(--border);
  background:#fff;
  color:#555;
  padding:8px 11px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}

.app-btn:hover{
  background:#f6f6fa;
}

.present-btn{
  background:var(--purple);
  border-color:var(--purple);
  color:#fff;
}

.present-btn:hover{
  background:#5849d8;
}

/* =========================================================
   RIBBON
========================================================= */

.ribbon{
  background:#fff;
  border-bottom:1px solid var(--border);
  z-index:20;
}

.ribbon-tabs{
  height:38px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:3px;
  overflow-x:auto;
}

.ribbon-tab{
  height:34px;
  border:0;
  background:transparent;
  padding:0 14px;
  font-size:12px;
  font-weight:700;
  color:#626574;
  border-radius:6px 6px 0 0;
  white-space:nowrap;
}

.ribbon-tab:hover{
  background:#f5f4fa;
}

.ribbon-tab.active{
  color:var(--purple);
  border-bottom:2px solid var(--purple);
}

.ribbon-panel{
  min-height:82px;
  border-top:1px solid #f0f0f3;
  padding:8px 14px;
  display:flex;
  align-items:stretch;
  gap:18px;
  overflow-x:auto;
}

.ribbon-group{
  display:flex;
  align-items:center;
  gap:6px;
  padding-right:18px;
  border-right:1px solid var(--border);
  position:relative;
  padding-bottom:12px;
}

.ribbon-group:last-child{
  border-right:0;
}

.ribbon-group-title{
  position:absolute;
  bottom:-1px;
  left:0;
  right:0;
  text-align:center;
  font-size:9px;
  color:#999ca7;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.tool-btn{
  min-width:48px;
  height:53px;
  border:0;
  background:transparent;
  border-radius:7px;
  color:#555968;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  padding:4px;
  white-space:nowrap;
}

.tool-btn span:first-child{
  font-size:19px;
}

.tool-btn:hover{
  background:#f1effd;
  color:var(--purple);
}

.tool-btn.active{
  background:var(--purple-light);
  color:var(--purple);
}

.tool-select{
  height:34px;
  border:1px solid var(--border);
  border-radius:7px;
  background:#fff;
  padding:0 8px;
  font-size:11px;
}

.tool-input{
  width:65px;
  height:34px;
  border:1px solid var(--border);
  border-radius:7px;
  padding:0 7px;
  font-size:12px;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  flex:1;
  min-height:0;
  display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:235px;
  min-width:235px;
  background:#fafbfc;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.sidebar-head{
  height:45px;
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 11px;
  border-bottom:1px solid var(--border);
}

.sidebar-head strong{
  font-size:12px;
}

.add-slide-small{
  border:0;
  background:var(--purple-light);
  color:var(--purple);
  width:29px;
  height:29px;
  border-radius:7px;
  font-size:18px;
}

.thumbnails{
  flex:1;
  overflow-y:auto;
  padding:12px 10px 20px;
}

.thumbnail-item{
  display:flex;
  gap:7px;
  margin-bottom:10px;
  cursor:pointer;
  user-select:none;
}

.thumbnail-number{
  width:22px;
  min-width:22px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:15px;
  font-size:10px;
  color:#858895;
}

.thumbnail-wrap{
  flex:1;
  position:relative;
}

.thumbnail{
  width:100%;
  aspect-ratio:16/9;
  background:#fff;
  border:2px solid transparent;
  border-radius:6px;
  overflow:hidden;
  position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.thumbnail-item:hover .thumbnail{
  border-color:#c9c5f7;
}

.thumbnail-item.active .thumbnail{
  border-color:var(--purple);
  box-shadow:0 0 0 2px rgba(108,92,231,.12);
}

.thumbnail-delete{
  position:absolute;
  right:4px;
  top:4px;
  width:20px;
  height:20px;
  border:0;
  border-radius:5px;
  background:rgba(20,20,30,.7);
  color:#fff;
  display:none;
  font-size:11px;
  z-index:4;
}

.thumbnail-wrap:hover .thumbnail-delete{
  display:block;
}

.thumbnail-transition{
  position:absolute;
  right:4px;
  bottom:4px;
  background:var(--purple);
  color:#fff;
  width:16px;
  height:16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  z-index:5;
}

/* =========================================================
   CANVAS
========================================================= */

.canvas-area{
  flex:1;
  min-width:0;
  background:
    radial-gradient(#dfe1e9 1px,transparent 1px);
  background-size:18px 18px;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.canvas-toolbar{
  height:43px;
  min-height:43px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.zoom-label{
  font-size:11px;
  color:var(--muted);
}

.zoom-range{
  width:120px;
}

.canvas-scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
}

.canvas{
  width:min(900px,80vw);
  aspect-ratio:16/9;
  background:#fff;
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
  overflow:hidden;
  transition:transform .2s;
  flex-shrink:0;
}

.canvas-editable{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

.slide-element{
  position:absolute;
  outline:1px solid transparent;
  cursor:text;
}

.slide-element:hover{
  outline:1px dashed rgba(108,92,231,.6);
}

.slide-element.selected{
  outline:2px solid var(--purple);
}

.editable-text{
  width:100%;
  min-height:30px;
  border:0;
  outline:0;
  background:transparent;
  resize:none;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:inherit;
  display:block;
}

.editable-text:focus{
  outline:0;
}

.canvas-image{
  position:absolute;
  object-fit:cover;
  border-radius:8px;
}

/* =========================================================
   STATUS BAR
========================================================= */

.statusbar{
  height:27px;
  min-height:27px;
  background:#fff;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-size:10px;
  color:#888b97;
}

/* =========================================================
   DESIGNS
========================================================= */

.design-purple{
  background:linear-gradient(135deg,#6c5ce7,#927fff);
  color:#fff;
}

.design-dark{
  background:#171821;
  color:#fff;
}

.design-blue{
  background:linear-gradient(135deg,#eaf2ff,#cfe0ff);
  color:#16335c;
}

.design-green{
  background:linear-gradient(135deg,#eaf9f1,#c9eedc);
  color:#174d32;
}

.design-cream{
  background:#fff8ea;
  color:#49351d;
}

.design-pink{
  background:linear-gradient(135deg,#fff0f6,#ffd9e8);
  color:#632c46;
}

.design-white{
  background:#fff;
  color:#181820;
}

.design-gradient{
  background:linear-gradient(135deg,#111827,#6c5ce7);
  color:#fff;
}

.shape-circle{
  position:absolute;
  width:32%;
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  right:-8%;
  top:-20%;
  pointer-events:none;
}

.shape-circle2{
  position:absolute;
  width:20%;
  aspect-ratio:1;
  border-radius:50%;
  background:rgba(108,92,231,.14);
  left:-7%;
  bottom:-12%;
  pointer-events:none;
}

.design-content{
  position:absolute;
  inset:0;
  padding:8%;
  overflow:hidden;
}

.design-title{
  font-size:clamp(18px,4vw,54px);
  font-weight:800;
  line-height:1.05;
  white-space:pre-wrap;
}

.design-subtitle{
  font-size:clamp(8px,1.5vw,22px);
  opacity:.72;
  margin-top:13px;
  line-height:1.4;
  white-space:pre-wrap;
}

.design-body{
  font-size:clamp(7px,1.3vw,19px);
  line-height:1.55;
  margin-top:16px;
  white-space:pre-wrap;
}

.mini-line{
  width:18%;
  height:3px;
  background:currentColor;
  margin-bottom:15px;
  border-radius:4px;
}

.mini-number{
  font-size:clamp(8px,1vw,14px);
  opacity:.55;
}

.mini-stat{
  display:flex;
  gap:4%;
  margin-top:12%;
}

.mini-stat-box{
  flex:1;
  padding:6%;
  border-radius:8px;
  background:rgba(255,255,255,.45);
}

.mini-stat-number{
  font-size:clamp(14px,2.5vw,35px);
  font-weight:800;
}

.mini-stat-label{
  font-size:clamp(6px,1vw,12px);
  opacity:.65;
  margin-top:3px;
}

.mini-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4%;
  margin-top:9%;
}

.mini-card{
  background:rgba(255,255,255,.55);
  border-radius:7px;
  padding:8%;
  min-height:45px;
}

.mini-card strong{
  display:block;
  font-size:clamp(7px,1.1vw,15px);
}

.mini-card small{
  display:block;
  font-size:clamp(5px,.8vw,10px);
  opacity:.6;
  margin-top:5px;
}

.mini-quote{
  font-size:clamp(12px,2vw,29px);
  font-weight:700;
  font-style:italic;
  line-height:1.3;
  text-align:center;
  max-width:75%;
  margin:10% auto 0;
}

.mini-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8%;
  margin-top:8%;
}

.mini-column{
  min-width:0;
}

.mini-column h4{
  font-size:clamp(8px,1.2vw,17px);
  margin-bottom:7px;
}

.mini-column p{
  font-size:clamp(6px,1vw,12px);
  line-height:1.5;
  opacity:.72;
  white-space:pre-wrap;
}

.mini-timeline{
  display:flex;
  align-items:center;
  gap:0;
  margin-top:15%;
}

.mini-time{
  flex:1;
  position:relative;
  text-align:center;
}

.mini-time-dot{
  width:10px;
  height:10px;
  background:currentColor;
  border-radius:50%;
  margin:auto;
  position:relative;
  z-index:2;
}

.mini-time-line{
  position:absolute;
  top:5px;
  left:50%;
  width:100%;
  height:2px;
  background:currentColor;
  opacity:.3;
}

.mini-time:last-child .mini-time-line{
  display:none;
}

.mini-time span{
  display:block;
  margin-top:5px;
  font-size:clamp(5px,.8vw,10px);
}

/* =========================================================
   TEMPLATE MODAL
========================================================= */

.template-overlay{
  position:fixed;
  inset:0;
  background:rgba(10,10,18,.45);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.template-overlay.open{
  display:flex;
}

.template-modal{
  width:min(1000px,95vw);
  height:min(720px,90vh);
  background:#fff;
  border-radius:18px;
  box-shadow:0 30px 100px rgba(0,0,0,.3);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.modal-head{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid var(--border);
}

.modal-head h2{
  font-size:18px;
}

.close-modal{
  border:0;
  background:#f1f1f5;
  width:34px;
  height:34px;
  border-radius:8px;
  font-size:20px;
}

.template-grid{
  flex:1;
  overflow:auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.template-card{
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:#fff;
  cursor:pointer;
  transition:.2s;
}

.template-card:hover{
  border-color:var(--purple);
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.template-preview{
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
}

.template-info{
  padding:9px;
  font-size:11px;
  font-weight:700;
}

.template-number{
  font-size:9px;
  color:#999;
  margin-bottom:3px;
}

/* =========================================================
   TRANSITIONS
========================================================= */

.transition-panel{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  overflow-x:auto;
}

.transition-card{
  width:82px;
  min-width:82px;
  height:62px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.transition-card:hover,
.transition-card.active{
  border-color:var(--purple);
  background:var(--purple-light);
  color:var(--purple);
}

.transition-icon{
  font-size:20px;
}

/* =========================================================
   PRESENTATION MODE
========================================================= */

.present-mode{
  position:fixed;
  inset:0;
  background:#050509;
  z-index:5000;
  display:none;
  flex-direction:column;
}

.present-mode.open{
  display:flex;
}

.present-stage{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.present-slide{
  width:min(94vw,1400px);
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,.5);
}

.present-slide .design-content{
  padding:8%;
}

.present-controls{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:rgba(20,20,27,.85);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:7px;
  display:flex;
  align-items:center;
  gap:5px;
  opacity:0;
  transition:.2s;
  z-index:10;
}

.present-stage:hover .present-controls,
.present-controls:hover{
  opacity:1;
}

.present-control-btn{
  border:0;
  background:transparent;
  color:#fff;
  width:39px;
  height:36px;
  border-radius:8px;
  font-size:17px;
}

.present-control-btn:hover{
  background:rgba(255,255,255,.12);
}

.present-counter{
  color:#ddd;
  font-size:11px;
  padding:0 8px;
}

.present-exit{
  position:absolute;
  right:20px;
  top:20px;
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:22px;
  z-index:20;
}

.present-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  color:#fff;
  font-size:35px;
  z-index:15;
  opacity:.35;
}

.present-nav:hover{
  opacity:1;
  background:rgba(255,255,255,.16);
}

.present-nav.left{
  left:20px;
}

.present-nav.right{
  right:20px;
}

/* =========================================================
   ANIMATIONS
========================================================= */

.object-fade{
  animation:objectFade .7s ease both;
}

.object-rise{
  animation:objectRise .7s ease both;
}

.object-zoom{
  animation:objectZoom .7s ease both;
}

@keyframes objectFade{
  from{opacity:0}
  to{opacity:1}
}

@keyframes objectRise{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes objectZoom{
  from{
    opacity:0;
    transform:scale(.85);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes presentationFade{
  from{opacity:0}
  to{opacity:1}
}

@keyframes presentationSlide{
  from{
    opacity:0;
    transform:translateX(100%);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes presentationZoom{
  from{
    opacity:0;
    transform:scale(.7);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes presentationDissolve{
  0%{
    opacity:0;
    filter:blur(12px);
  }
  100%{
    opacity:1;
    filter:blur(0);
  }
}

@keyframes presentationWipe{
  from{
    clip-path:inset(0 100% 0 0);
  }
  to{
    clip-path:inset(0 0 0 0);
  }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#20212b;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-size:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(80px);
  opacity:0;
  transition:.25s;
  z-index:10000;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

  .brand{
    min-width:auto;
  }

  .brand span{
    display:none;
  }

  .sidebar{
    width:180px;
    min-width:180px;
  }

  .template-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .app-actions .optional-btn{
    display:none;
  }
}

@media(max-width:650px){

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser=null;
let presentationId=null;
let presentation=null;
let slides=[];
let currentSlideIndex=0;
let selectedElement=null;
let zoomLevel=85;
let autoPlayTimer=null;
let isAutoPlay=false;
let historyStack=[];
let redoStack=[];
let presentationIndex=0;


/* =========================================================
   50 DESIGNS
========================================================= */

const templates=[

["title","Executive Title","purple"],
["title","Minimal Title","white"],
["title","Dark Title","dark"],
["title","Blue Title","blue"],
["title","Green Title","green"],
["title","Cream Title","cream"],
["title","Pink Title","pink"],
["title","Gradient Title","gradient"],
["title","Modern Title","dark"],
["title","Creative Title","purple"],

["content","About Me","white"],
["content","Career Overview","blue"],
["content","Experience","cream"],
["content","Skills","green"],
["content","Education","white"],
["content","Achievements","purple"],
["content","Professional Summary","dark"],
["content","Career Goals","blue"],
["content","My Story","pink"],
["content","Introduction","gradient"],

["cards","Three Highlights","white"],
["cards","Core Skills","blue"],
["cards","Services","purple"],
["cards","Projects","green"],
["cards","Features","dark"],
["cards","Key Areas","cream"],
["cards","Strengths","pink"],
["cards","Portfolio","gradient"],
["cards","What I Offer","white"],
["cards","Career Toolkit","blue"],

["stats","Key Statistics","purple"],
["stats","Results","dark"],
["stats","Impact","blue"],
["stats","Performance","green"],
["stats","Business Metrics","cream"],

["quote","Inspirational Quote","dark"],
["quote","Career Quote","purple"],
["quote","Vision Quote","blue"],
["quote","Mission Quote","green"],
["quote","Closing Quote","pink"],

["columns","Two Perspectives","white"],
["columns","Skills & Experience","blue"],
["columns","Problem & Solution","cream"],
["columns","Before & After","green"],
["columns","Goals & Actions","purple"],

["timeline","Career Timeline","dark"],
["timeline","Project Timeline","blue"],
["timeline","Growth Journey","green"],
["timeline","Roadmap","purple"],
["timeline","Future Plan","gradient"]

];


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

try{

const {data:{session},error:sessionError}=
await supabaseClient.auth.getSession();

if(sessionError){
console.error(sessionError);
}

if(!session || !session.user){

window.location.href="login.html";
return;

}

currentUser=session.user;

const params=
new URLSearchParams(
window.location.search
);

const id=params.get("id");
const isNew=params.get("new")==="1";

if(id){

if(!isValidUUID(id)){

showToast("Invalid presentation ID.");

setTimeout(
()=>goBack(),
1200
);

return;
}

presentationId=id;

await loadPresentation();

}else{

createNewLocalPresentation();

}

normalizeSlideOrders();

renderThumbnails();
renderCanvas();
buildTemplateGallery();
updateSlidePosition();
updateTransitionUI();

}catch(error){

console.error("Initialization error:",error);

showToast(
error.message ||
"Unable to initialize presentation."
);

}

}


/* =========================================================
   UUID
========================================================= */

function isValidUUID(value){

return typeof value==="string" &&
/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

if(value===null || value===undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   NEW PRESENTATION
========================================================= */

function createNewLocalPresentation(){

presentation={
title:"My Career Presentation",
description:"Created with CareerCraft",
background:"light"
};

document.getElementById(
"presentationTitle"
).value=presentation.title;

slides=[
createSlideFromTemplate(0)
];

slides[0].title=
"Welcome to My Presentation";

slides[0].subtitle=
"CareerCraft Presentation Studio";

slides[0].content=
"Introduce yourself, your experience, skills, achievements, or career goals here.";

}


/* =========================================================
   CREATE SLIDE
========================================================= */

function createSlideFromTemplate(index){

const t=
templates[
index % templates.length
];

return{

id:null,

presentation_id:
presentationId,

slide_order:
slides.length,

layout:t[0],

title:t[1],

subtitle:
"CareerCraft Presentation",

content:
"Add your content here.",

image_url:null,

background:t[2],

transition:"none",

transition_duration:.5,

animation:"none",

theme:t[2]

};

}


/* =========================================================
   LOAD PRESENTATION
========================================================= */

async function loadPresentation(){

setSaveStatus("Loading...");

try{

const {
data:p,
error:pError
}=
await supabaseClient
.from("presentations")
.select("*")
.eq("id",presentationId)
.eq("user_id",currentUser.id)
.single();

if(pError){
throw pError;
}

if(!p){
throw new Error("Presentation not found.");
}

presentation=p;

document.getElementById(
"presentationTitle"
).value=
p.title ||
"Untitled Presentation";


const {
data:slideData,
error:sError
}=
await supabaseClient
.from("presentation_slides")
.select("*")
.eq("presentation_id",presentationId);

if(sError){
throw sError;
}

slides=(slideData||[])
.sort(
(a,b)=>
Number(a.slide_order??a.order??0)-
Number(b.slide_order??b.order??0)
)
.map(normalizeSlide);

if(!slides.length){

slides=[
createSlideFromTemplate(0)
];

}

setSaveStatus("Saved");

}catch(error){

console.error(
"Load presentation:",
error
);

showToast(
error.message ||
"Unable to load presentation."
);

createNewLocalPresentation();

setSaveStatus(
"New presentation"
);

}

}


/* =========================================================
   NORMALIZE SLIDE
========================================================= */

function normalizeSlide(slide){

return{

id:slide.id||null,

presentation_id:
slide.presentation_id||
presentationId||
null,

slide_order:
Number(slide.slide_order??0),

layout:
slide.layout||
"title_content",

title:
slide.title||"",

subtitle:
slide.subtitle||"",

content:
slide.content||"",

image_url:
slide.image_url||null,

background:
slide.background||"light",

transition:
slide.transition||"none",

transition_duration:
Number(slide.transition_duration||.5),

animation:
slide.animation||"none",

theme:
slide.theme||""

};

}


/* =========================================================
   THUMBNAILS
========================================================= */

function renderThumbnails(){

const container=
document.getElementById("thumbnails");

container.innerHTML="";

slides.forEach(
(slide,index)=>{

const item=
document.createElement("div");

item.className=
"thumbnail-item"+
(index===currentSlideIndex?" active":"");

item.onclick=
()=>selectSlide(index);

const wrap=
document.createElement("div");

wrap.className=
"thumbnail-wrap";

const thumb=
document.createElement("div");

thumb.className="thumbnail";

thumb.innerHTML=
buildSlideVisual(slide,true);

if(
slide.transition &&
slide.transition!=="none"
){

const transition=
document.createElement("div");

transition.className=
"thumbnail-transition";

transition.textContent="✦";

thumb.appendChild(
transition
);

}

const deleteBtn=
document.createElement("button");

deleteBtn.className=
"thumbnail-delete";

deleteBtn.textContent="×";

deleteBtn.onclick=
event=>{

event.stopPropagation();

deleteSlide(index);

};

wrap.appendChild(thumb);
wrap.appendChild(deleteBtn);

const number=
document.createElement("div");

number.className=
"thumbnail-number";

number.textContent=
index+1;

item.appendChild(number);
item.appendChild(wrap);

container.appendChild(item);

}
);

}


/* =========================================================
   SELECT SLIDE
========================================================= */

function selectSlide(index){

if(
index<0 ||
index>=slides.length
){
return;
}

currentSlideIndex=index;

selectedElement=null;

renderThumbnails();
renderCanvas();
updateSlidePosition();
updateTransitionUI();

}


/* =========================================================
   CANVAS
========================================================= */

function renderCanvas(){

const canvas=
document.getElementById("canvas");

if(!slides.length){

canvas.innerHTML=
`
<div style="
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#888;
">
No slides
</div>
`;

return;

}

canvas.innerHTML=
buildEditableSlide(
slides[currentSlideIndex]
);

}


/* =========================================================
   EDITABLE SLIDE
========================================================= */

/* =========================================================
   BACKGROUND
========================================================= */

function backgroundCSS(value){

const v=
String(value||"light").toLowerCase();

if(v==="purple"){
return`
background:linear-gradient(
135deg,#6c5ce7,#927fff
);
`;
}

if(v==="dark"){
return`
background:#171821;
`;
}

if(v==="blue"){
return`
background:linear-gradient(
135deg,#eaf2ff,#cfe0ff
);
`;
}

if(v==="green"){
return`
background:linear-gradient(
135deg,#eaf9f1,#c9eedc
);
`;
}

if(v==="cream"){
return`
background:#fff8ea;
`;
}

if(v==="pink"){
return`
background:linear-gradient(
135deg,#fff0f6,#ffd9e8
);
`;
}

if(v==="gradient"){
return`
background:linear-gradient(
135deg,#111827,#6c5ce7
);
`;
}

return`
background:#fff;
`;

}


/* =========================================================
   TEXT COLOR
========================================================= */

function textColor(value){

const v=
String(value||"light").toLowerCase();

if(
v==="purple"||
v==="dark"||
v==="gradient"
){
return"#fff";
}

if(v==="blue"){
return"#16335c";
}

if(v==="green"){
return"#174d32";
}

if(v==="cream"){
return"#49351d";
}

if(v==="pink"){
return"#632c46";
}

return"#181820";

}

   OBJECT ANIMATION
========================================================= */

function animationClass(slide){

if(!slide || slide.animation==="none"){
return"";
}

if(slide.animation==="fade"){
return"object-fade";
}

if(slide.animation==="rise"){
return"object-rise";
}

if(slide.animation==="zoom"){
return"object-zoom";
}

return"";

}

/* =========================================================
   DUPLICATE
========================================================= */

function duplicateSlide(){

if(!slides.length){
return;
}

saveHistory();

const copy=
JSON.parse(
JSON.stringify(
slides[currentSlideIndex]
)
);

copy.id=null;

copy.slide_order=
slides.length;

slides.splice(
currentSlideIndex+1,
0,
copy
);

currentSlideIndex++;

normalizeSlideOrders();

renderThumbnails();
renderCanvas();
updateSlidePosition();

setSaveStatus("Unsaved changes");

showToast("Slide duplicated.");

}

showToast(

);

saveHistory();

slides.splice(index,1);

if(currentSlideIndex>=slides.length){

currentSlideIndex=
slides.length-1;

}

normalizeSlideOrders();

renderThumbnails();
renderCanvas();
updateSlidePosition();

setSaveStatus("Unsaved changes");

}

/* =========================================================
   PRESENTATION
========================================================= */

function startPresentation(
startIndex=currentSlideIndex
){

if(!slides.length){
return;
}

presentationIndex=
Math.max(
0,
Math.min(
slides.length-1,
Number(startIndex)||0
)
);

const mode=
document.getElementById(
"presentMode"
);

mode.classList.add("open");

document.body.style.overflow="hidden";

renderPresentationSlide();

if(isAutoPlay){
startAutoPlay();
}

}


function renderPresentationSlide(){

if(!slides.length){
return;
}

presentationIndex=
Math.max(
0,
Math.min(
slides.length-1,
presentationIndex
)
);

const slide=
slides[presentationIndex];

const container=
document.getElementById(
"presentSlide"
);

const transition=
slide.transition||"none";

const duration=
Math.max(
.2,
Number(
slide.transition_duration||.5
)
);

container.style.animation="none";

void container.offsetWidth;

container.innerHTML=
buildSlideVisual(
slide,
false
);

container.style.animation=
"none";

void container.offsetWidth;

if(transition==="fade"){

container.style.animation=
`presentationFade ${duration}s ease`;

}

if(transition==="slide"){

container.style.animation=
`presentationSlide ${duration}s ease`;

}

if(transition==="zoom"){

container.style.animation=
`presentationZoom ${duration}s ease`;

}

if(transition==="dissolve"){

container.style.animation=
`presentationDissolve ${duration}s ease`;

}

if(transition==="wipe"){

container.style.animation=
`presentationWipe ${duration}s ease`;

}

document.getElementById(
"presentCounter"
).textContent=
`${presentationIndex+1} / ${slides.length}`;

}


function presentationNext(){

if(
presentationIndex>=
slides.length-1
){

if(isAutoPlay){
stopAutoPlay();
}

return;

}

presentationIndex++;

renderPresentationSlide();

}


function presentationPrevious(){

if(presentationIndex<=0){
return;
}

presentationIndex--;

renderPresentationSlide();

}


function exitPresentation(){

stopAutoPlay();

document
.getElementById("presentMode")
.classList.remove("open");

if(document.fullscreenElement){

document
.exitFullscreen()
.catch(()=>{});

}

document.body.style.overflow="hidden";

}


/* =========================================================
   AUTO PLAY
========================================================= */

function toggleAutoPlay(){

isAutoPlay=!isAutoPlay;

if(isAutoPlay){

startAutoPlay();

showToast(
"Auto play enabled."
);

}else{

stopAutoPlay();

showToast(
"Auto play disabled."
);

}

}


function startAutoPlay(){

stopAutoPlay();

autoPlayTimer=
setInterval(
()=>{

const mode=
document.getElementById(
"presentMode"
);

if(
!mode.classList.contains("open")
){

stopAutoPlay();
return;

}

if(
presentationIndex>=
slides.length-1
){

stopAutoPlay();
return;

}

presentationNext();

},
5000
);

}


function stopAutoPlay(){

if(autoPlayTimer){

clearInterval(
autoPlayTimer
);

autoPlayTimer=null;

}

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen(){

const mode=
document.getElementById(
"presentMode"
);

try{

if(!document.fullscreenElement){

await mode.requestFullscreen();

}else{

await document.exitFullscreen();

}

}catch(error){

console.error(
"Fullscreen error:",
error
);

showToast(
"Fullscreen is not available on this device."
);

}

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
"keydown",
event=>{

const mode=
document.getElementById(
"presentMode"
);

if(
event.key==="Escape" &&
mode.classList.contains("open")
){

exitPresentation();
return;

}

if(
!mode.classList.contains("open")
){

if(event.key==="ArrowUp"){

selectSlide(
Math.max(
0,
currentSlideIndex-1
)
);

}

if(event.key==="ArrowDown"){

selectSlide(
Math.min(
slides.length-1,
currentSlideIndex+1
)
);

}

return;

}

if(
event.key==="ArrowRight"||
event.key===" "||
event.key==="PageDown"
){

event.preventDefault();

presentationNext();

}

if(
event.key==="ArrowLeft"||
event.key==="PageUp"
){

event.preventDefault();

presentationPrevious();

}

if(event.key==="Home"){

presentationIndex=0;
renderPresentationSlide();

}

if(event.key==="End"){

presentationIndex=
slides.length-1;

renderPresentationSlide();

}

}
);


/* =========================================================
   ZOOM
========================================================= */

function changeZoom(value){

zoomLevel=
Number(value);

const canvas=
document.getElementById(
"canvas"
);

canvas.style.transform=
`scale(${zoomLevel/100})`;

document.getElementById(
"zoomValue"
).textContent=
`${zoomLevel}%`;

}


function zoomIn(){

const range=
document.getElementById(
"zoomRange"
);

range.value=
Math.min(
130,
Number(range.value)+5
);

changeZoom(range.value);

}


function zoomOut(){

const range=
document.getElementById(
"zoomRange"
);

range.value=
Math.max(
50,
Number(range.value)-5
);

changeZoom(range.value);

}


/* =========================================================
   POSITION
========================================================= */

function updateSlidePosition(){

document.getElementById(
"slidePosition"
).textContent=
`Slide ${
currentSlideIndex+1
} of ${
slides.length
}`;

document.getElementById(
"statusLeft"
).textContent=
`Slide ${
currentSlideIndex+1
}`;

}


/* =========================================================
   SAVE
========================================================= */

async function savePresentation(){

if(!currentUser || !presentation){
showToast("Presentation is not ready.");
return;
}

setSaveStatus("Saving...");

try{

const title=
document.getElementById(
"presentationTitle"
).value.trim()||
"Untitled Presentation";


/* CREATE PRESENTATION */

if(!presentationId){

const insertData={
user_id:currentUser.id,
title:title,
description:
presentation.description||
"Created with CareerCraft"
};

const {
data:newPresentation,
error
}=
await supabaseClient
.from("presentations")
.insert(insertData)
.select()
.single();

if(error){
throw error;
}

presentation=
newPresentation;

presentationId=
newPresentation.id;

window.history.replaceState(
{},
"",
`presentation.html?id=${encodeURIComponent(
presentationId
)}`
);

}


/* UPDATE PRESENTATION */

const {
error:updateError
}=
await supabaseClient
.from("presentations")
.update({
title:title
})
.eq("id",presentationId)
.eq("user_id",currentUser.id);

if(updateError){
throw updateError;
}


/* DELETE REMOVED SLIDES */

const existingIds=
slides
.filter(
slide=>
slide.id &&
isValidUUID(slide.id)
)
.map(
slide=>slide.id
);

if(existingIds.length){

const {
data:existingSlides,
error:existingError
}=
await supabaseClient
.from("presentation_slides")
.select("id")
.eq(
"presentation_id",
presentationId
);

if(existingError){
throw existingError;
}

const idsToDelete=
(existingSlides||[])
.filter(
row=>!existingIds.includes(row.id)
)
.map(row=>row.id);

if(idsToDelete.length){

const {
error:deleteError
}=
await supabaseClient
.from("presentation_slides")
.delete()
.in("id",idsToDelete)
.eq(
"presentation_id",
presentationId
);

if(deleteError){
throw deleteError;
}

}

}else{

const {
error:deleteAllError
}=
await supabaseClient
.from("presentation_slides")
.delete()
.eq(
"presentation_id",
presentationId
);

if(deleteAllError){
throw deleteAllError;
}

}


/* SAVE SLIDES */

normalizeSlideOrders();

for(const slide of slides){

const payload={

presentation_id:
presentationId,

slide_order:
slide.slide_order,

layout:
slide.layout,

title:
slide.title,

subtitle:
slide.subtitle,

content:
slide.content,

image_url:
slide.image_url||null,

background:
slide.background||"light",

transition:
slide.transition||"none",

transition_duration:
Number(
slide.transition_duration||.5
)

};


/* Existing slide */

if(
slide.id &&
isValidUUID(slide.id)
){

const {
error
}=
await supabaseClient
.from("presentation_slides")
.update(payload)
.eq("id",slide.id)
.eq(
"presentation_id",
presentationId
);

if(error){
throw error;
}

}else{

const {
data,
error
}=
await supabaseClient
.from("presentation_slides")
.insert(payload)
.select()
.single();

if(error){
throw error;
}

if(data){
slide.id=data.id;
}

}

}

setSaveStatus("Saved");

showToast(
"Presentation saved successfully."
);

}catch(error){

console.error(
"Save error:",
error
);

setSaveStatus("Save failed");

showToast(
error.message||
"Unable to save presentation."
);

}

}


/* =========================================================
   SAVE STATUS
========================================================= */

function setSaveStatus(text){

const el=
document.getElementById(
"saveStatus"
);

el.textContent=text;

el.classList.toggle(
"saved",
text==="Saved"
);

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(){

historyStack.push(
JSON.stringify(slides)
);

if(historyStack.length>30){
historyStack.shift();
}

redoStack=[];

}


function undoAction(){

if(!historyStack.length){

showToast(
"Nothing to undo."
);

return;

}

redoStack.push(
JSON.stringify(slides)
);

slides=
JSON.parse(
historyStack.pop()
);

normalizeSlideOrders();

if(
currentSlideIndex>=
slides.length
){

currentSlideIndex=
slides.length-1;

}

renderThumbnails();
renderCanvas();
updateSlidePosition();
updateTransitionUI();

setSaveStatus(
"Unsaved changes"
);

}


function redoAction(){

if(!redoStack.length){

showToast(
"Nothing to redo."
);

return;

}

historyStack.push(
JSON.stringify(slides)
);

slides=
JSON.parse(
redoStack.pop()
);

normalizeSlideOrders();

if(
currentSlideIndex>=
slides.length
){

currentSlideIndex=
slides.length-1;

}

renderThumbnails();
renderCanvas();
updateSlidePosition();
updateTransitionUI();

setSaveStatus(
"Unsaved changes"
);

}


/* =========================================================
   TITLE
========================================================= */

document
.getElementById("presentationTitle")
.addEventListener(
"input",
event=>{

if(presentation){

presentation.title=
event.target.value;

}

setSaveStatus(
"Unsaved changes"
);

}
);


/* =========================================================
   BACK
========================================================= */

function goBack(){

window.location.href=
"presentations.html";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function showToast(message){

const toast=
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

if(toastTimer){
clearTimeout(toastTimer);
}

toastTimer=
setTimeout(
()=>{
toast.classList.remove("show");
},
2800
);

}


/* =========================================================
   TEMPLATE BACKDROP
========================================================= */

document
.getElementById("templateOverlay")
.addEventListener(
"click",
event=>{

if(
event.target===
document.getElementById(
"templateOverlay"
)
){

closeTemplates();

}

}
);


/* =========================================================
   INITIALIZE
========================================================= */

initialize();

</script>
