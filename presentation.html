<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareerCraft Presentation Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#6c5ce7;
    --primary-dark:#5546d6;
    --primary-soft:#eeeafd;
    --background:#f5f6fa;
    --panel:#ffffff;
    --border:#e3e5ec;
    --text:#1d2030;
    --muted:#777b8a;
    --danger:#e55353;
    --success:#1ca56b;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--background);
    color:var(--text);
    overflow:hidden;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    height:58px;
    min-height:58px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    z-index:100;
}

.back-button{
    width:36px;
    height:36px;
    border:0;
    border-radius:9px;
    background:#f1f2f6;
    font-size:19px;
    color:#555;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:800;
    color:var(--primary);
    min-width:180px;
}

.logo-box{
    width:32px;
    height:32px;
    border-radius:9px;
    background:var(--primary);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.title-area{
    flex:1;
    min-width:80px;
}

.title-input{
    width:100%;
    max-width:430px;
    border:1px solid transparent;
    background:transparent;
    padding:8px 10px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    outline:none;
}

.title-input:hover,
.title-input:focus{
    border-color:var(--border);
    background:#fafafa;
}

.save-message{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
}

.save-message.saved{
    color:var(--success);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.top-button{
    height:35px;
    padding:0 11px;
    border:1px solid var(--border);
    border-radius:8px;
    background:white;
    color:#555967;
    font-size:12px;
    font-weight:700;
}

.top-button:hover{
    background:#f5f5f8;
}

.top-button.present{
    background:var(--primary);
    border-color:var(--primary);
    color:white;
}

/* =========================================================
   RIBBON
========================================================= */

.ribbon{
    background:#fff;
    border-bottom:1px solid var(--border);
    z-index:90;
}

.tabs{
    height:38px;
    display:flex;
    align-items:center;
    gap:2px;
    padding:0 12px;
    overflow-x:auto;
}

.tab{
    height:36px;
    border:0;
    background:transparent;
    padding:0 15px;
    color:#676a78;
    font-size:12px;
    font-weight:700;
    border-bottom:2px solid transparent;
    white-space:nowrap;
}

.tab:hover{
    background:#f6f5fb;
}

.tab.active{
    color:var(--primary);
    border-bottom-color:var(--primary);
}

.panel{
    min-height:84px;
    padding:8px 12px;
    display:flex;
    align-items:stretch;
    gap:17px;
    border-top:1px solid #f1f1f4;
    overflow-x:auto;
}

.panel.hidden{
    display:none;
}

.group{
    display:flex;
    align-items:center;
    gap:5px;
    border-right:1px solid var(--border);
    padding-right:16px;
    position:relative;
    padding-bottom:13px;
}

.group:last-child{
    border-right:0;
}

.group-name{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    text-align:center;
    font-size:9px;
    color:#999daa;
    text-transform:uppercase;
}

.tool{
    width:53px;
    min-width:53px;
    height:55px;
    border:0;
    border-radius:8px;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color:#5f6370;
    font-size:10px;
}

.tool:hover{
    background:var(--primary-soft);
    color:var(--primary);
}

.tool-icon{
    font-size:18px;
}

.select{
    height:34px;
    border:1px solid var(--border);
    border-radius:7px;
    background:white;
    padding:0 8px;
    font-size:11px;
}

.number-input{
    width:65px;
    height:34px;
    border:1px solid var(--border);
    border-radius:7px;
    padding:0 8px;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    flex:1;
    min-height:0;
    display:flex;
}

/* =========================================================
   SLIDE SIDEBAR
========================================================= */

.sidebar{
    width:235px;
    min-width:235px;
    background:#fafbfc;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.sidebar-header{
    height:45px;
    min-height:45px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 11px;
}

.sidebar-header strong{
    font-size:12px;
}

.small-add{
    width:29px;
    height:29px;
    border:0;
    border-radius:7px;
    background:var(--primary-soft);
    color:var(--primary);
    font-size:18px;
}

.slide-list{
    flex:1;
    overflow-y:auto;
    padding:12px 9px 25px;
}

.slide-row{
    display:flex;
    gap:7px;
    margin-bottom:10px;
    cursor:pointer;
}

.slide-number{
    width:22px;
    min-width:22px;
    padding-top:14px;
    text-align:center;
    font-size:10px;
    color:#8b8e99;
}

.thumbnail-holder{
    flex:1;
    position:relative;
}

.thumbnail{
    width:100%;
    aspect-ratio:16/9;
    border-radius:7px;
    overflow:hidden;
    background:#fff;
    border:2px solid transparent;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.slide-row.active .thumbnail{
    border-color:var(--primary);
    box-shadow:0 0 0 2px rgba(108,92,231,.12);
}

.slide-row:hover .thumbnail{
    border-color:#bdb8f4;
}

.delete-slide{
    position:absolute;
    top:4px;
    right:4px;
    width:21px;
    height:21px;
    border:0;
    border-radius:5px;
    background:rgba(25,25,30,.78);
    color:white;
    display:none;
    z-index:5;
}

.thumbnail-holder:hover .delete-slide{
    display:block;
}

.transition-mark{
    position:absolute;
    bottom:4px;
    right:4px;
    width:17px;
    height:17px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    font-size:9px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   EDITOR AREA
========================================================= */

.editor{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(#dfe1e8 1px,transparent 1px);
    background-size:18px 18px;
}

.editor-toolbar{
    height:43px;
    min-height:43px;
    background:rgba(255,255,255,.95);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.editor-small-button{
    height:30px;
    padding:0 9px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#fff;
    color:#555;
}

.zoom-range{
    width:120px;
}

.zoom-text{
    font-size:11px;
    color:var(--muted);
}

.editor-scroll{
    flex:1;
    min-height:0;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:35px;
}

.canvas{
    width:min(900px,80vw);
    aspect-ratio:16/9;
    background:#fff;
    box-shadow:0 20px 65px rgba(0,0,0,.18);
    flex-shrink:0;
    overflow:hidden;
    transform-origin:center center;
}

.statusbar{
    height:27px;
    min-height:27px;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    color:#888b96;
    font-size:10px;
}

/* =========================================================
   SLIDE VISUALS
========================================================= */

.slide{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

.slide-inner{
    position:absolute;
    inset:0;
    padding:8%;
    overflow:hidden;
}

.theme-purple{
    background:linear-gradient(135deg,#6c5ce7,#9485ff);
    color:#fff;
}

.theme-dark{
    background:#171821;
    color:#fff;
}

.theme-blue{
    background:linear-gradient(135deg,#eaf2ff,#cfe0ff);
    color:#17365e;
}

.theme-green{
    background:linear-gradient(135deg,#ebfaf2,#c9eedc);
    color:#174c31;
}

.theme-cream{
    background:#fff7e7;
    color:#4c371e;
}

.theme-pink{
    background:linear-gradient(135deg,#fff0f6,#ffd9e9);
    color:#642e49;
}

.theme-white{
    background:#fff;
    color:#1c1d24;
}

.theme-gradient{
    background:linear-gradient(135deg,#101522,#6c5ce7);
    color:#fff;
}

.decor-one{
    position:absolute;
    width:34%;
    aspect-ratio:1;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    right:-12%;
    top:-20%;
}

.decor-two{
    position:absolute;
    width:22%;
    aspect-ratio:1;
    border-radius:50%;
    background:rgba(108,92,231,.12);
    left:-10%;
    bottom:-15%;
}

.slide-title{
    font-size:clamp(18px,4vw,54px);
    font-weight:800;
    line-height:1.06;
    white-space:pre-wrap;
}

.slide-subtitle{
    font-size:clamp(8px,1.5vw,22px);
    line-height:1.45;
    opacity:.7;
    margin-top:13px;
    white-space:pre-wrap;
}

.slide-content{
    font-size:clamp(8px,1.4vw,20px);
    line-height:1.6;
    margin-top:18px;
    white-space:pre-wrap;
}

.edit-field{
    width:100%;
    border:0;
    outline:0;
    resize:none;
    overflow:hidden;
    background:transparent;
    color:inherit;
    font-family:inherit;
    display:block;
}

.edit-field:focus{
    outline:1px dashed rgba(108,92,231,.8);
    border-radius:5px;
}

/* =========================================================
   IMAGE SLIDE
========================================================= */

.image-layout{
    display:grid;
    grid-template-columns:45% 47%;
    gap:8%;
    align-items:center;
}

.image-area{
    height:70%;
    min-height:120px;
    border-radius:13px;
    overflow:hidden;
    background:rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    justify-content:center;
}

.image-area img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================================================
   CARDS
========================================================= */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4%;
    margin-top:9%;
}

.card{
    padding:8%;
    min-height:110px;
    border-radius:11px;
    background:rgba(255,255,255,.5);
}

.card h3{
    font-size:clamp(9px,1.4vw,18px);
    margin-bottom:7px;
}

.card p{
    font-size:clamp(6px,1vw,13px);
    opacity:.68;
    line-height:1.4;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4%;
    margin-top:12%;
}

.stat{
    padding:9%;
    border-radius:11px;
    background:rgba(255,255,255,.46);
}

.stat-number{
    font-size:clamp(17px,3vw,42px);
    font-weight:800;
}

.stat-label{
    margin-top:5px;
    font-size:clamp(6px,1vw,13px);
    opacity:.65;
}

/* =========================================================
   QUOTE
========================================================= */

.quote-layout{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.quote-layout .quote{
    max-width:80%;
    font-size:clamp(15px,3vw,40px);
    font-weight:700;
    line-height:1.35;
    font-style:italic;
}

.quote-author{
    margin-top:25px;
    font-size:clamp(8px,1.2vw,16px);
    opacity:.6;
}

/* =========================================================
   COLUMNS
========================================================= */

.columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8%;
    margin-top:9%;
}

.column{
    min-width:0;
}

.column-line{
    width:20%;
    height:3px;
    border-radius:5px;
    background:currentColor;
    margin-bottom:14px;
}

.column h3{
    font-size:clamp(9px,1.4vw,19px);
    margin-bottom:9px;
}

.column p{
    font-size:clamp(7px,1.25vw,17px);
    line-height:1.6;
    opacity:.72;
    white-space:pre-wrap;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline{
    display:flex;
    margin-top:17%;
}

.timeline-item{
    flex:1;
    text-align:center;
    position:relative;
}

.timeline-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:currentColor;
    margin:auto;
    position:relative;
    z-index:2;
}

.timeline-line{
    position:absolute;
    left:50%;
    top:6px;
    width:100%;
    height:2px;
    background:currentColor;
    opacity:.3;
}

.timeline-item:last-child .timeline-line{
    display:none;
}

.timeline-year{
    margin-top:9px;
    font-weight:700;
    font-size:clamp(7px,1vw,14px);
}

.timeline-label{
    margin-top:4px;
    font-size:clamp(6px,.9vw,12px);
    opacity:.6;
}

/* =========================================================
   SHAPE
========================================================= */

.shape-layout{
    display:flex;
    align-items:center;
    gap:8%;
}

.shape-box{
    width:30%;
    aspect-ratio:1;
    border-radius:25%;
    background:rgba(255,255,255,.23);
    transform:rotate(12deg);
    flex-shrink:0;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(8,8,15,.5);
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-overlay.open{
    display:flex;
}

.modal{
    width:min(1050px,95vw);
    height:min(720px,90vh);
    background:white;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 30px 100px rgba(0,0,0,.3);
}

.modal-header{
    height:64px;
    min-height:64px;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-header h2{
    font-size:18px;
}

.modal-close{
    width:34px;
    height:34px;
    border:0;
    border-radius:8px;
    background:#f0f1f5;
    font-size:20px;
}

.template-grid{
    flex:1;
    overflow:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.template-card{
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    background:#fff;
    transition:.2s;
}

.template-card:hover{
    border-color:var(--primary);
    transform:translateY(-3px);
    box-shadow:0 9px 24px rgba(0,0,0,.1);
}

.template-preview{
    aspect-ratio:16/9;
    overflow:hidden;
}

.template-name{
    padding:9px;
    font-size:11px;
    font-weight:700;
}

.template-index{
    color:#999;
    font-size:9px;
    margin-bottom:3px;
}

/* =========================================================
   PRESENTATION MODE
========================================================= */

.presentation-mode{
    position:fixed;
    inset:0;
    z-index:6000;
    background:#050509;
    display:none;
    flex-direction:column;
}

.presentation-mode.open{
    display:flex;
}

.presentation-stage{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.presentation-slide{
    width:min(94vw,1450px);
    aspect-ratio:16/9;
    overflow:hidden;
    position:relative;
}

.presentation-close{
    position:absolute;
    top:18px;
    right:18px;
    width:42px;
    height:42px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:23px;
    z-index:30;
}

.presentation-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:34px;
    z-index:20;
    opacity:.45;
}

.presentation-nav:hover{
    opacity:1;
}

.presentation-nav.left{
    left:18px;
}

.presentation-nav.right{
    right:18px;
}

.presentation-controls{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:4px;
    padding:7px;
    border-radius:13px;
    background:rgba(20,20,27,.9);
    opacity:0;
    transition:.2s;
    z-index:25;
}

.presentation-stage:hover .presentation-controls{
    opacity:1;
}

.presentation-control{
    width:39px;
    height:35px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#fff;
    font-size:17px;
}

.presentation-control:hover{
    background:rgba(255,255,255,.12);
}

.presentation-counter{
    color:#ddd;
    font-size:11px;
    padding:0 8px;
}

/* =========================================================
   TRANSITIONS
========================================================= */

@keyframes fadeTransition{
    from{opacity:0}
    to{opacity:1}
}

@keyframes slideTransition{
    from{
        opacity:0;
        transform:translateX(100%);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes zoomTransition{
    from{
        opacity:0;
        transform:scale(.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes wipeTransition{
    from{
        clip-path:inset(0 100% 0 0);
    }
    to{
        clip-path:inset(0 0 0 0);
    }
}

@keyframes dissolveTransition{
    from{
        opacity:0;
        filter:blur(12px);
    }
    to{
        opacity:1;
        filter:blur(0);
    }
}

/* =========================================================
   ANIMATIONS
========================================================= */

.animate-fade{
    animation:elementFade .7s ease both;
}

.animate-rise{
    animation:elementRise .7s ease both;
}

.animate-zoom{
    animation:elementZoom .7s ease both;
}

@keyframes elementFade{
    from{opacity:0}
    to{opacity:1}
}

@keyframes elementRise{
    from{
        opacity:0;
        transform:translateY(22px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes elementZoom{
    from{
        opacity:0;
        transform:scale(.85);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    right:18px;
    bottom:18px;
    background:#20212b;
    color:#fff;
    padding:12px 16px;
    border-radius:9px;
    font-size:12px;
    z-index:10000;
    opacity:0;
    transform:translateY(60px);
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .logo{
        min-width:auto;
    }

    .logo span{
        display:none;
    }

    .sidebar{
        width:190px;
        min-width:190px;
    }

    .template-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){

    .sidebar{
        display:none;
    }

    .save-message{
        display:none;
    }

    .top-button.undo-button,
    .top-button.redo-button{
        display:none;
    }

    .title-input{
        max-width:180px;
    }

    .template-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .editor-scroll{
        padding:15px;
    }

    .canvas{
        width:95vw;
    }

<script>

/* =========================================================

========================================================= */

const SUPABASE_URL =
"https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,

);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let presentationId = null;

let presentation = null;

let slides = [];

let currentSlideIndex = 0;

let presentationIndex = 0;

let zoomLevel = 85;

let isAutoPlay = false;

let autoPlayTimer = null;

let historyStack = [];

let redoStack = [];

let toastTimer = null;


/* =========================================================
   TEMPLATES
========================================================= */

const templates = [

    ["title","Executive Title","purple"],
    ["title","Minimal Title","white"],
    ["title","Dark Title","dark"],
    ["title","Blue Title","blue"],
    ["title","Green Title","green"],
    ["title","Cream Title","cream"],
    ["title","Pink Title","pink"],

    ["content","About Me","white"],

    ["quote","Inspirational Quote","dark"],
    ["quote","Career Quote","purple"],
    ["quote","Vision Quote","blue"],
    ["quote","Mission Quote","green"],
    ["quote","Closing Quote","pink"],

    ["columns","Two Perspectives","white"],
    ["columns","Skills & Experience","blue"],
    ["columns","Problem & Solution","cream"],
    ["columns","Before & After","green"],
    ["columns","Goals & Actions","purple"],

    ["timeline","Career Timeline","dark"],
    ["timeline","Project Timeline","blue"],
    ["timeline","Growth Journey","green"],
    ["timeline","Roadmap","purple"],
    ["timeline","Future Plan","gradient"]

];


/* =========================================================
   START
========================================================= */

async function initialize(){

    try{

        const result =
            await supabaseClient.auth.getSession();

        const session =
            result?.data?.session;

        if(!session){

            window.location.href="login.html";
            return;

        }

        currentUser=session.user;

        const params =
            new URLSearchParams(
                window.location.search
            );

        const possibleId =
            params.get("id") ||
            params.get("presentation_id") ||
            params.get("presentationId");

        if(possibleId){

            if(!isValidUUID(possibleId)){

                showToast(
                    "Invalid presentation ID."
                );

                setTimeout(
                    goBack,
                    1400
                );

                return;
            }

            presentationId=possibleId;

            await loadPresentation();

        }else{

            createLocalPresentation();

        }

        buildTemplateGallery();

        normalizeOrders();

        renderSlideList();

        renderCanvas();

        updatePosition();

        updateTransitionUI();

        changeZoom(zoomLevel);

    }catch(error){

        console.error(error);

        showToast(
            error?.message ||
            "Unable to open presentation."
        );

    }

}


/* =========================================================
   UUID VALIDATION
========================================================= */

function isValidUUID(value){

    return typeof value==="string" &&
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(value===null || value===undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   LOCAL PRESENTATION
========================================================= */

function createLocalPresentation(){

    presentation={

        title:"My Career Presentation",

        description:"Created with CareerCraft",

        background:"light"

    };

    document
        .getElementById("presentationTitle")
        .value=presentation.title;

    slides=[

        {

            id:null,

            presentation_id:null,

            slide_order:0,

            layout:"title",

            title:"Welcome to My Presentation",

            subtitle:"CareerCraft Presentation Studio",

            content:
                "Introduce yourself, your experience, skills, achievements, or career goals here.",

            image_url:null,

            background:"purple",

            transition:"none",

            transition_duration:.5,

            animation:"none",

            theme:"purple"

        }

    ];

}


/* =========================================================
   LOAD
========================================================= */

async function loadPresentation(){

    setSaveMessage("Loading...");

    const {
        data:p,
        error:pError
    } =
        await supabaseClient
        .from("presentations")
        .select("*")
        .eq("id",presentationId)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(pError){
        throw pError;
    }

    if(!p){

        showToast(
            "Presentation was not found."
        );

        throw new Error(
            "Presentation not found."
        );

    }

    presentation=p;

    document
        .getElementById("presentationTitle")
        .value=
        p.title ||
        "Untitled Presentation";


    const {
        data:slideRows,
        error:slideError
    } =
        await supabaseClient
        .from("presentation_slides")
        .select("*")
        .eq("presentation_id",presentationId);

    if(slideError){
        throw slideError;
    }

    slides=(slideRows||[])
        .sort(
            (a,b)=>
                Number(
                    a.slide_order ??
                    a.order ??
                    0
                ) -
                Number(
                    b.slide_order ??
                    b.order ??
                    0
                )
        )
        .map(normalizeSlide);

    if(!slides.length){

        slides=[
            createSlide("title","Welcome to My Presentation","purple")
        ];

    }

    setSaveMessage("Saved");

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeSlide(row){

    return{

        id:row.id || null,

        presentation_id:
            row.presentation_id ||
            presentationId ||
            null,

        slide_order:
            Number(
                row.slide_order ??
                row.order ??
                0
            ),

        layout:
            row.layout ||
            "title",

        title:
            row.title ||
            "",

        subtitle:
            row.subtitle ||
            "",

        content:
            row.content ||
            "",

        image_url:
            row.image_url ||
            null,

        background:
            row.background ||
            "white",

        transition:
            row.transition ||
            "none",

        transition_duration:
            Number(
                row.transition_duration ||
                .5
            ),

        animation:
            row.animation ||
            "none",

        theme:
            row.theme ||
            row.background ||
            "white"

    };

}


/* =========================================================
   CREATE SLIDE
========================================================= */

function createSlide(
    layout,
    title,
    background
){

    return{

        id:null,

        presentation_id:
            presentationId,

        slide_order:
            slides.length,

        layout:
            layout,

        title:
            title,

        subtitle:
            "CareerCraft Presentation",

        content:
            "Add your professional content here.",

        image_url:null,

        background:
            background,

        transition:
            "none",

        transition_duration:
            .5,

        animation:
            "none",

        theme:
            background

    };

}


/* =========================================================
   NORMALIZE ORDER
========================================================= */

function normalizeOrders(){

    slides.forEach(
        (slide,index)=>{
            slide.slide_order=index;
        }
    );

}


/* =========================================================
   SLIDE LIST
========================================================= */

function renderSlideList(){

    const list =
        document.getElementById(
            "slideList"
        );

    list.innerHTML="";

    slides.forEach(
        (slide,index)=>{

            const row =
                document.createElement("div");

            row.className =
                "slide-row"+
                (
                    index===currentSlideIndex
                    ? " active"
                    : ""
                );

            row.onclick=()=>{
                selectSlide(index);
            };


            const number =
                document.createElement("div");

            number.className="slide-number";

            number.textContent=
                String(index+1);


            const holder =
                document.createElement("div");

            holder.className=
                "thumbnail-holder";


            const thumbnail =
                document.createElement("div");

            thumbnail.className="thumbnail";

            thumbnail.innerHTML=
                buildVisualSlide(
                    slide,
                    true
                );


            if(
                slide.transition &&
                slide.transition!=="none"
            ){

                const mark =
                    document.createElement("div");

                mark.className=
                    "transition-mark";

                mark.textContent="✦";

                thumbnail.appendChild(mark);

            }


            const deleteButton =
                document.createElement("button");

            deleteButton.className=
                "delete-slide";

            deleteButton.textContent="×";

            deleteButton.onclick=(event)=>{

                event.stopPropagation();

                deleteSlide(index);

            };


            holder.appendChild(thumbnail);

            holder.appendChild(deleteButton);

            row.appendChild(number);

            row.appendChild(holder);

            list.appendChild(row);

        }
    );

}


/* =========================================================
   SELECT
========================================================= */

function selectSlide(index){

    if(
        index<0 ||
        index>=slides.length
    ){
        return;
    }

    currentSlideIndex=index;

    renderSlideList();

    renderCanvas();

    updatePosition();

    updateTransitionUI();

}


/* =========================================================
   RENDER CANVAS
========================================================= */

function renderCanvas(){

    const canvas =
        document.getElementById("canvas");

    if(!slides.length){

        canvas.innerHTML="";

        return;

    }

    canvas.innerHTML=
        buildEditableSlide(
            slides[currentSlideIndex]
        );

}

function timelineItem(year,label){

    return `

    <div class="timeline-item">

        <div class="timeline-dot"></div>

        <div class="timeline-line"></div>

        <div class="timeline-year">
            ${escapeHTML(year)}
        </div>

        <div class="timeline-label">
            ${escapeHTML(label)}
        </div>

    </div>

    `;

}


function getThemeClass(theme){

    const valid=[
        "purple",
        "dark",
        "blue",
        "green",
        "cream",
        "pink",
        "white",
        "gradient"
    ];

    if(valid.includes(theme)){
        return "theme-"+theme;
    }

    return "theme-white";

}


function getAnimationClass(animation){

    if(animation==="fade"){
        return "animate-fade";
    }

    if(animation==="rise"){
        return "animate-rise";
    }

    if(animation==="zoom"){
        return "animate-zoom";
    }

    return "";

}


/* =========================================================
   FIELD UPDATE
========================================================= */

function updateField(field,value){

    if(!slides[currentSlideIndex]){
        return;
    }

    slides[currentSlideIndex][field]=value;

    setSaveMessage(
        "Unsaved changes"
    );

    renderSlideList();

}


/* =========================================================
   ADD SLIDE
========================================================= */

function addSlide(){

    saveHistory();

    const newSlide =
        createSlide(
            "title",
            "New Slide",
            "white"
        );

    slides.push(newSlide);

    currentSlideIndex=
        slides.length-1;

    normalizeOrders();

    renderSlideList();

    renderCanvas();

    updatePosition();

    setSaveMessage(
        "Unsaved changes"
    );

}


/* =========================================================
   DUPLICATE
========================================================= */

function duplicateSlide(){

    if(!slides.length){
        return;
    }

    saveHistory();

    const copy =
        JSON.parse(
            JSON.stringify(
                slides[currentSlideIndex]
            )
        );

    copy.id=null;

    copy.presentation_id=
        presentationId;

    slides.splice(
        currentSlideIndex+1,
        0,
        copy
    );

    currentSlideIndex++;

    normalizeOrders();

    renderSlideList();

    renderCanvas();

    updatePosition();

    setSaveMessage(
        "Unsaved changes"
    );

}


/* =========================================================
   DELETE
========================================================= */

function deleteCurrentSlide(){

    deleteSlide(
        currentSlideIndex
    );

}


function deleteSlide(index){

    if(slides.length<=1){

        showToast(
            "You need at least one slide."
        );

        return;

    }

    saveHistory();

    slides.splice(index,1);

    if(
        currentSlideIndex>=
        slides.length
    ){

        currentSlideIndex=
            slides.length-1;

    }

    normalizeOrders();

    renderSlideList();

    renderCanvas();

    updatePosition();

    setSaveMessage(
        "Unsaved changes"
    );

}

/* =========================================================
   TABS
========================================================= */

function switchTab(tab){

    document
        .querySelectorAll(".tab")
        .forEach(
            button=>{
                button.classList.toggle(
                    "active",
                    button.dataset.tab===tab
                );
            }
        );

    document
        .querySelectorAll(".panel")
        .forEach(
            panel=>{
                panel.classList.add(
                    "hidden"
                );
            }
        );

    const panel =
        document.getElementById(
            "panel-"+tab
        );

    if(panel){
        panel.classList.remove(
            "hidden"
        );
    }

    if(tab==="transitions"){
        updateTransitionUI();
    }

}


/* =========================================================
   FONT
========================================================= */

function getFocusedEditor(){

    return document.querySelector(
        "#canvas textarea:focus"
    ) || document.querySelector(
        "#canvas textarea"
    );

}


function applyFontFamily(font){

    const field=
        getFocusedEditor();

    if(!field){
        return;
    }

    field.style.fontFamily=font;

}


function applyFontSize(size){

    const field=
        getFocusedEditor();

    if(!field){
        return;
    }

    field.style.fontSize=
        `${Number(size)||28}px`;

}


function toggleBold(){

    const field=
        getFocusedEditor();

    if(!field){
        return;
    }

    field.style.fontWeight=
        field.style.fontWeight==="800"
        ? "400"
        : "800";

}


function toggleItalic(){

    const field=
        getFocusedEditor();

    if(!field){
        return;
    }

    field.style.fontStyle=
        field.style.fontStyle==="italic"
        ? "normal"
        : "italic";

}


function toggleUnderline(){

    const field=
        getFocusedEditor();

    if(!field){
        return;
    }

    field.style.textDecoration=
        field.style.textDecoration==="underline"
        ? "none"
        : "underline";

}


function alignText(alignment){

    const field=
        getFocusedEditor();

    if(!field){
        return;
    }

    field.style.textAlign=
        alignment;

}


/* =========================================================
   TRANSITIONS
========================================================= */

function setTransition(type){

    saveHistory();

    slides[currentSlideIndex].transition=
        type;

    renderSlideList();

    updateTransitionUI();

    setSaveMessage(
        "Unsaved changes"
    );

}


function changeTransitionDuration(value){

    slides[currentSlideIndex]
        .transition_duration=
        Number(value)||.5;

    setSaveMessage(
        "Unsaved changes"
    );

}


function updateTransitionUI(){

    const slide=
        slides[currentSlideIndex];

    if(!slide){
        return;
    }

    const duration =
        document.getElementById(
            "transitionDuration"
        );

    if(duration){

        duration.value=
            String(
                slide.transition_duration||.5
            );

    }

}


function applyTransitionToAll(){

    const slide=
        slides[currentSlideIndex];

    if(!slide){
        return;
    }

    saveHistory();

    slides.forEach(
        item=>{

            item.transition=
                slide.transition;

            item.transition_duration=
                slide.transition_duration;

        }
    );

    renderSlideList();

    setSaveMessage(
        "Unsaved changes"
    );

    showToast(
        "Transition applied to all slides."
    );

}


/* =========================================================
   PREVIEW TRANSITION
========================================================= */

function previewTransition(){

    startPresentation(
        currentSlideIndex
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function setAnimation(type){

    saveHistory();

    slides[currentSlideIndex].animation=
        type;

    renderCanvas();

    setSaveMessage(
        "Unsaved changes"
    );

}


/* =========================================================
   PRESENTATION
========================================================= */

function startPresentation(
    startIndex=currentSlideIndex
){

    if(!slides.length){
        return;
    }

    presentationIndex=
        Math.max(
            0,
            Math.min(
                slides.length-1,
                Number(startIndex)||0
            )
        );

    document
        .getElementById(
            "presentationMode"
        )
        .classList.add("open");

    document.body.style.overflow="hidden";

    renderPresentationSlide();

    if(isAutoPlay){
        startAutoPlay();
    }

}


function renderPresentationSlide(){

    const slide=
        slides[presentationIndex];

    if(!slide){
        return;
    }

    const container=
        document.getElementById(
            "presentationSlide"
        );

    container.style.animation="none";

    container.innerHTML=
        buildVisualSlide(
            slide,
            false
        );

    void container.offsetWidth;

    const transition=
        slide.transition ||
        "none";

    const duration=
        Math.max(
            .2,
            Number(
                slide.transition_duration||.5
            )
        );

    if(transition==="fade"){

        container.style.animation=
            `fadeTransition ${duration}s ease`;

    }

    else if(transition==="slide"){

        container.style.animation=
            `slideTransition ${duration}s ease`;

    }

    else if(transition==="zoom"){

        container.style.animation=
            `zoomTransition ${duration}s ease`;

    }

    else if(transition==="wipe"){

        container.style.animation=
            `wipeTransition ${duration}s ease`;

    }

    else if(transition==="dissolve"){

        container.style.animation=
            `dissolveTransition ${duration}s ease`;

    }

    document
        .getElementById(
            "presentationCounter"
        )
        .textContent=
        `${presentationIndex+1} / ${slides.length}`;

}


function presentationNext(){

    if(
        presentationIndex>=
        slides.length-1
    ){

        stopAutoPlay();

        return;

    }

    presentationIndex++;

    renderPresentationSlide();

}


function presentationPrevious(){

    if(presentationIndex<=0){
        return;
    }

    presentationIndex--;

    renderPresentationSlide();

}


function exitPresentation(){

    stopAutoPlay();

    document
        .getElementById(
            "presentationMode"
        )
        .classList.remove("open");

    document.body.style.overflow="hidden";

}


/* =========================================================
   AUTOPLAY
========================================================= */

function toggleAutoPlay(){

    isAutoPlay=!isAutoPlay;

    if(isAutoPlay){

        startAutoPlay();

        showToast(
            "Auto play enabled."
        );

    }else{

        stopAutoPlay();

        showToast(
            "Auto play disabled."
        );

    }

}


function startAutoPlay(){

    stopAutoPlay();

    autoPlayTimer=
        setInterval(
            ()=>{

                const mode=
                    document.getElementById(
                        "presentationMode"
                    );

                if(
                    !mode.classList.contains(
                        "open"
                    )
                ){

                    stopAutoPlay();

                    return;

                }

                if(
                    presentationIndex>=
                    slides.length-1
                ){

                    stopAutoPlay();

                    return;

                }

                presentationNext();

            },
            5000
        );

}


function stopAutoPlay(){

    if(autoPlayTimer){

        clearInterval(
            autoPlayTimer
        );

        autoPlayTimer=null;

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function toggleFullscreen(){

    const mode=
        document.getElementById(
            "presentationMode"
        );

    try{

        if(!document.fullscreenElement){

            await mode.requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(error){

        console.error(error);

        showToast(
            "Fullscreen is not supported here."
        );

    }

}


/* =========================================================
   ZOOM
========================================================= */

function changeZoom(value){

    zoomLevel=
        Number(value);

    document
        .getElementById("canvas")
        .style.transform=
        `scale(${zoomLevel/100})`;

    document
        .getElementById("zoomText")
        .textContent=
        `${zoomLevel}%`;

}


function zoomIn(){

    const range=
        document.getElementById(
            "zoomRange"
        );

    range.value=
        Math.min(
            130,
            Number(range.value)+5
        );

    changeZoom(
        range.value
    );

}


function zoomOut(){

    const range=
        document.getElementById(
            "zoomRange"
        );

    range.value=
        Math.max(
            50,
            Number(range.value)-5
        );

    changeZoom(
        range.value
    );

}


/* =========================================================
   POSITION
========================================================= */

function updatePosition(){

    document
        .getElementById(
            "slidePosition"
        )
        .textContent=
        `Slide ${
            currentSlideIndex+1
        } of ${
            slides.length
        }`;

    document
        .getElementById(
            "statusText"
        )
        .textContent=
        `Slide ${
            currentSlideIndex+1
        }`;

}


/* =========================================================
   SAVE PRESENTATION
========================================================= */

async function savePresentation(){

    if(!currentUser){

        showToast(
            "You are not logged in."
        );

        return;

    }

    if(!presentation){

        showToast(
            "Presentation is not ready."
        );

        return;

    }

    setSaveMessage(
        "Saving..."
    );

    try{

        const title=
            document
                .getElementById(
                    "presentationTitle"
                )
                .value
                .trim() ||
            "Untitled Presentation";


        /* CREATE PRESENTATION */

        if(!presentationId){

            const insertData={

                user_id:
                    currentUser.id,

                title:
                    title,

                description:
                    presentation.description ||
                    "Created with CareerCraft"

            };


            const {
                data:newPresentation,
                error:createError
            } =
                await supabaseClient
                .from("presentations")
                .insert(insertData)
                .select()
                .single();


            if(createError){
                throw createError;
            }

            presentation=
                newPresentation;

            presentationId=
                newPresentation.id;


            window.history.replaceState(
                {},
                "",
                "presentation.html?id="+
                encodeURIComponent(
                    presentationId
                )
            );

        }


        /* UPDATE PRESENTATION */

        const {
            error:updateError
        } =
            await supabaseClient
            .from("presentations")
            .update({
                title:title
            })
            .eq(
                "id",
                presentationId
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if(updateError){
            throw updateError;
        }


        normalizeOrders();


        /*
         * SAVE CURRENT SLIDES
         */

        const savedIds=[];


        for(
            const slide of slides
        ){

            const payload={

                presentation_id:
                    presentationId,

                slide_order:
                    slide.slide_order,

                layout:
                    slide.layout,

                title:
                    slide.title,

                subtitle:
                    slide.subtitle,

                content:
                    slide.content,

                image_url:
                    slide.image_url ||
                    null,

                background:
                    slide.background ||
                    "white",

                transition:
                    slide.transition ||
                    "none",

                transition_duration:
                    Number(
                        slide.transition_duration ||
                        .5
                    )

            };


            if(
                slide.id &&
                isValidUUID(slide.id)
            ){

                const {
                    error
                } =
                    await supabaseClient
                    .from("presentation_slides")
                    .update(payload)
                    .eq(
                        "id",
                        slide.id
                    )
                    .eq(
                        "presentation_id",
                        presentationId
                    );


                if(error){
                    throw error;
                }

                savedIds.push(
                    slide.id
                );


            }else{

                const {
                    data:newSlide,
                    error
                } =
                    await supabaseClient
                    .from("presentation_slides")
                    .insert(payload)
                    .select()
                    .single();


                if(error){
                    throw error;
                }


                if(newSlide){

                    slide.id=
                        newSlide.id;

                    slide.presentation_id=
                        presentationId;

                    savedIds.push(
                        newSlide.id
                    );

                }

            }

        }


        /*
         * REMOVE SLIDES DELETED
         * FROM THE EDITOR
         */

        const {
            data:existingRows,
            error:existingError
        } =
            await supabaseClient
            .from("presentation_slides")
            .select("id")
            .eq(
                "presentation_id",
                presentationId
            );


        if(existingError){
            throw existingError;
        }


        const deleteIds=
            (existingRows||[])
            .map(row=>row.id)
            .filter(
                id=>!savedIds.includes(id)
            );


        if(deleteIds.length){

            const {
                error:deleteError
            } =
                await supabaseClient
                .from("presentation_slides")
                .delete()
                .in(
                    "id",
                    deleteIds
                )
                .eq(
                    "presentation_id",
                    presentationId
                );


            if(deleteError){
                throw deleteError;
            }

        }


        setSaveMessage(
            "Saved"
        );

        showToast(
            "Presentation saved successfully."
        );


    }catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );

        setSaveMessage(
            "Save failed"
        );

        showToast(
            error?.message ||
            "Unable to save presentation."
        );

    }

}


/* =========================================================
   SAVE MESSAGE
========================================================= */

function setSaveMessage(text){

    const element=
        document.getElementById(
            "saveMessage"
        );

    element.textContent=text;

    element.classList.toggle(
        "saved",
        text==="Saved"
    );

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(){

    historyStack.push(
        JSON.stringify(slides)
    );

    if(historyStack.length>40){
        historyStack.shift();
    }

    redoStack=[];

}


function undoAction(){

    if(!historyStack.length){

        showToast(
            "Nothing to undo."
        );

        return;

    }

    redoStack.push(
        JSON.stringify(slides)
    );

    slides=
        JSON.parse(
            historyStack.pop()
        );

    normalizeOrders();

    if(
        currentSlideIndex>=
        slides.length
    ){

        currentSlideIndex=
            slides.length-1;

    }

    renderSlideList();

    renderCanvas();

    updatePosition();

    updateTransitionUI();

    setSaveMessage(
        "Unsaved changes"
    );

}


function redoAction(){

    if(!redoStack.length){

        showToast(
            "Nothing to redo."
        );

        return;

    }

    historyStack.push(
        JSON.stringify(slides)
    );

    slides=
        JSON.parse(
            redoStack.pop()
        );

    normalizeOrders();

    if(
        currentSlideIndex>=
        slides.length
    ){

        currentSlideIndex=
            slides.length-1;

    }

    renderSlideList();

    renderCanvas();

    updatePosition();

    updateTransitionUI();

    setSaveMessage(
        "Unsaved changes"
    );

}


/* =========================================================
   TITLE
========================================================= */

document
    .getElementById(
        "presentationTitle"
    )
    .addEventListener(
        "input",
        ()=>{
            setSaveMessage(
                "Unsaved changes"
            );
        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const mode=
            document.getElementById(
                "presentationMode"
            );

        if(
            event.ctrlKey &&
            event.key.toLowerCase()==="s"
        ){

            event.preventDefault();

            savePresentation();

            return;

        }


        if(
            event.ctrlKey &&
            !event.shiftKey &&
            event.key.toLowerCase()==="z"
        ){

            event.preventDefault();

            undoAction();

            return;

        }


        if(
            event.ctrlKey &&
            (
                event.key.toLowerCase()==="y" ||
                (
                    event.shiftKey &&
                    event.key.toLowerCase()==="z"
                )
            )
        ){

            event.preventDefault();

            redoAction();

            return;

        }


        if(
            mode.classList.contains("open")
        ){

            if(event.key==="Escape"){

                exitPresentation();

                return;

            }

            if(
                event.key==="ArrowRight" ||
                event.key===" " ||
                event.key==="PageDown"
            ){

                event.preventDefault();

                presentationNext();

            }

            if(
                event.key==="ArrowLeft" ||
                event.key==="PageUp"
            ){

                event.preventDefault();

                presentationPrevious();

            }

            if(event.key==="Home"){

                presentationIndex=0;

                renderPresentationSlide();

            }

            if(event.key==="End"){

                presentationIndex=
                    slides.length-1;

                renderPresentationSlide();

            }

            return;

        }


        /*
         * Don't change slides while typing
         */

        if(
            event.target.tagName==="TEXTAREA" ||
            event.target.tagName==="INPUT"
        ){
            return;
        }


        if(event.key==="ArrowUp"){

            selectSlide(
                Math.max(
                    0,
                    currentSlideIndex-1
                )
            );

        }


        if(event.key==="ArrowDown"){

            selectSlide(
                Math.min(
                    slides.length-1,
                    currentSlideIndex+1
                )
            );

        }

    }
);


/* =========================================================
   MODAL BACKDROP
========================================================= */

document
    .getElementById(
        "templateModal"
    )
    .addEventListener(
        "click",
        event=>{

            if(
                event.target===
                document.getElementById(
                    "templateModal"
                )
            ){

                closeTemplates();

            }

        }
    );


/* =========================================================
   BACK
========================================================= */

function goBack(){

    window.location.href=
        "presentations.html";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast=
        document.getElementById(
            "toast"
        );

    toast.textContent=
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer=
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2800
        );

}

   START APPLICATION
========================================================= */

initialize();
