<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Presentations | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --danger:#dc2626;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:22px 16px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:800;
  margin-bottom:32px;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  display:grid;
  place-items:center;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  border:0;
  background:transparent;
  padding:12px 14px;
  border-radius:10px;
  text-align:left;
  color:#4b5563;
  font-weight:600;
}

.nav button:hover,
.nav button.active{
  background:#eff6ff;
  color:var(--primary);
}

/* MAIN */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:15;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.topbar h1{
  font-size:21px;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
  color:#374151;
  font-weight:600;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#dbeafe;
  color:#1d4ed8;
  display:grid;
  place-items:center;
  font-weight:800;
}

.content{
  padding:28px;
}

/* DASHBOARD */

.dashboard{
  max-width:1250px;
  margin:auto;
}

.hero{
  background:linear-gradient(135deg,#1d4ed8,#4f46e5);
  color:#fff;
  border-radius:20px;
  padding:30px;
  margin-bottom:25px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

.hero h2{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#dbeafe;
  max-width:650px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 17px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.hero .btn-primary{
  background:#fff;
  color:#1d4ed8;
}

.btn-secondary{
  background:#f3f4f6;
  color:#374151;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.btn:hover{
  opacity:.9;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.section-head h3{
  font-size:19px;
}

.presentation-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}

.presentation-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.card-preview{
  height:165px;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(135deg,#eff6ff,#eef2ff);
}

.card-preview h4{
  font-size:21px;
  margin-bottom:7px;
}

.card-preview p{
  color:#6b7280;
  font-size:13px;
}

.card-body{
  padding:17px;
}

.card-title{
  font-weight:800;
  margin-bottom:5px;
}

.card-date{
  color:var(--muted);
  font-size:12px;
  margin-bottom:15px;
}

.card-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.card-actions button{
  flex:1;
}

/* EMPTY */

.empty{
  background:#fff;
  border:1px dashed #cbd5e1;
  border-radius:16px;
  padding:55px 20px;
  text-align:center;
}

.empty-icon{
  font-size:42px;
  margin-bottom:12px;
}

.empty h3{
  margin-bottom:7px;
}

.empty p{
  color:var(--muted);
  margin-bottom:18px;
}

/* BUILDER */

.builder{
  display:none;
  height:calc(100vh - 70px);
}

.builder.active{
  display:flex;
}

.builder-sidebar{
  width:280px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:18px;
  overflow:auto;
}

.builder-sidebar h3{
  margin-bottom:15px;
}

.slide-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.slide-thumb{
  border:2px solid transparent;
  border-radius:10px;
  background:#f8fafc;
  padding:10px;
  min-height:80px;
  cursor:pointer;
  position:relative;
}

.slide-thumb.active{
  border-color:var(--primary);
}

.slide-thumb-number{
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
}

.slide-thumb-title{
  font-size:13px;
  font-weight:700;
}

.add-slide{
  width:100%;
  margin-top:15px;
}

.editor{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.editor-toolbar{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.toolbar-group{
  display:flex;
  gap:8px;
  align-items:center;
}

.editor-workspace{
  flex:1;
  overflow:auto;
  padding:35px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.slide-stage{
  width:min(900px,100%);
  aspect-ratio:16/9;
  background:#fff;
  box-shadow:0 20px 50px rgba(15,23,42,.15);
  border-radius:5px;
  position:relative;
  overflow:hidden;
}

.slide-stage.dark{
  background:#111827;
  color:#fff;
}

.slide-stage.blue{
  background:linear-gradient(135deg,#1d4ed8,#4f46e5);
  color:#fff;
}

.slide-stage.purple{
  background:linear-gradient(135deg,#6d28d9,#9333ea);
  color:#fff;
}

.slide-stage.green{
  background:linear-gradient(135deg,#047857,#059669);
  color:#fff;
}

.slide-stage.light{
  background:#f8fafc;
}

.slide-content{
  width:100%;
  height:100%;
  padding:8%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.slide-title{
  font-size:clamp(24px,4vw,52px);
  line-height:1.08;
  font-weight:850;
  margin-bottom:18px;
  white-space:pre-wrap;
}

.slide-subtitle{
  font-size:clamp(14px,2vw,24px);
  color:#64748b;
  white-space:pre-wrap;
}

.slide-stage.dark .slide-subtitle,
.slide-stage.blue .slide-subtitle,
.slide-stage.purple .slide-subtitle,
.slide-stage.green .slide-subtitle{
  color:rgba(255,255,255,.78);
}

.slide-body{
  font-size:clamp(13px,1.6vw,19px);
  line-height:1.6;
  white-space:pre-wrap;
}

.slide-image{
  max-width:100%;
  max-height:45%;
  object-fit:contain;
  border-radius:10px;
  margin-top:20px;
}

.layout-title{
  text-align:center;
}

.layout-title .slide-content{
  align-items:center;
}

.layout-two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  align-items:center;
}

.layout-image{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  align-items:center;
}

.layout-image img{
  width:100%;
  max-height:75%;
  object-fit:contain;
  border-radius:12px;
}

/* INSPECTOR */

.inspector{
  width:310px;
  background:#fff;
  border-left:1px solid var(--border);
  padding:20px;
  overflow:auto;
}

.inspector h3{
  margin-bottom:18px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:7px;
  color:#374151;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:10px 11px;
  outline:none;
  background:#fff;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.save-status{
  font-size:12px;
  color:#059669;
  font-weight:700;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modal-card{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#f3f4f6;
  width:35px;
  height:35px;
  border-radius:50%;
}

/* PREVIEW */

.preview-modal .modal-card{
  width:min(1100px,100%);
  background:#f1f5f9;
}

.preview-slide{
  width:100%;
  aspect-ratio:16/9;
  background:#fff;
  margin-bottom:15px;
  border-radius:8px;
  overflow:hidden;
}

/* MOBILE */

.mobile-menu{
  display:none;
  border:0;
  background:#f3f4f6;
  width:38px;
  height:38px;
  border-radius:9px;
}

@media(max-width:1000px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .builder-sidebar{
    width:220px;
  }

  .inspector{
    width:260px;
  }
}

@media(max-width:760px){
  .content{
    padding:16px;
  }

  .hero{
    flex-direction:column;
    align-items:flex-start;
    padding:22px;
  }

  .hero h2{
    font-size:24px;
  }

  .topbar{
    padding:0 15px;
  }

  .user span{
    display:none;
  }

  .builder{
    height:auto;
    min-height:calc(100vh - 70px);
    flex-direction:column;
  }

  .builder-sidebar,
  .inspector{
    width:100%;
    border:0;
    border-bottom:1px solid var(--border);
  }

  .builder-sidebar{
    max-height:210px;
  }

  .inspector{
    order:3;
  }

  .editor-workspace{
    padding:15px;
  }

  .editor-toolbar{
    padding:10px;
  }

  .toolbar-group{
    width:100%;
    overflow:auto;
  }

  .toolbar-group .btn{
    white-space:nowrap;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">C</div>
      CareerCraft
    </div>

    <nav class="nav">
      <button onclick="goHome()">🏠 Dashboard</button>
      <button onclick="goToPage('cv-builder.html')">📄 CV Builder</button>
      <button onclick="goToPage('job-finder.html')">💼 Jobs</button>
      <button onclick="goToPage('portfolio-dashboard.html')">🖼️ Portfolio</button>
      <button class="active">📊 Presentations</button>
      <button onclick="goToPage('communities.html')">👥 Communities</button>
      <button onclick="goToPage('messages.html')">💬 Messages</button>
    </nav>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
        <h1 id="pageTitle">Presentations</h1>
      </div>

      <div class="user">
        <div class="avatar" id="avatar">C</div>
        <span id="userEmail"></span>
      </div>
    </header>

    <!-- DASHBOARD -->

    <section class="content" id="dashboardView">

      <div class="dashboard">

        <div class="hero">
          <div>
            <h2>Create professional presentations</h2>
            <p>
              Build presentations for interviews, projects, business ideas,
              school work, portfolios and professional meetings.
            </p>
          </div>

          <button class="btn btn-primary" onclick="createPresentation()">
            ＋ Create Presentation
          </button>
        </div>

        <div class="section-head">
          <h3>Your presentations</h3>

          <button class="btn btn-primary" onclick="createPresentation()">
            ＋ New
          </button>
        </div>

        <div id="presentationList"></div>

      </div>

    </section>

    <!-- BUILDER -->

    <section class="builder" id="builderView">

      <aside class="builder-sidebar">

        <h3>Slides</h3>

        <div class="slide-list" id="slideList"></div>

        <button class="btn btn-primary add-slide" onclick="addSlide()">
          ＋ Add Slide
        </button>

      </aside>

      <section class="editor">

        <div class="editor-toolbar">

          <div class="toolbar-group">

            <button class="btn btn-secondary" onclick="backToDashboard()">
              ← Back
            </button>

            <button class="btn btn-secondary" onclick="previewPresentation()">
              ▶ Preview
            </button>

          </div>

          <div class="toolbar-group">

            <span class="save-status" id="saveStatus">
              Ready
            </span>

            <button class="btn btn-primary" onclick="savePresentation()">
              Save
            </button>

            <button class="btn btn-primary" onclick="togglePublish()">
              Publish
            </button>

          </div>

        </div>

        <div class="editor-workspace">

          <div class="slide-stage" id="slideStage">

            <div class="slide-content" id="slideContent">

              <div class="slide-title" id="canvasTitle">
                Presentation Title
              </div>

              <div class="slide-subtitle" id="canvasSubtitle">
                Add a subtitle
              </div>

              <div class="slide-body" id="canvasBody"></div>

              <img
                id="canvasImage"
                class="slide-image"
                style="display:none"
                alt="Presentation image"
              >

            </div>

          </div>

        </div>

      </section>

      <aside class="inspector">

        <h3>Slide settings</h3>

        <div class="field">
          <label>Layout</label>

          <select id="layoutInput" onchange="updateSlide()">
            <option value="title_content">Title & Content</option>
            <option value="title">Title Slide</option>
            <option value="two_column">Two Column</option>
            <option value="image">Image & Content</option>
          </select>
        </div>

        <div class="field">
          <label>Title</label>

          <input
            id="titleInput"
            type="text"
            placeholder="Slide title"
            oninput="updateSlide()"
          >
        </div>

        <div class="field">
          <label>Subtitle</label>

          <input
            id="subtitleInput"
            type="text"
            placeholder="Subtitle"
            oninput="updateSlide()"
          >
        </div>

        <div class="field">
          <label>Content</label>

          <textarea
            id="contentInput"
            placeholder="Write your slide content..."
            oninput="updateSlide()"
          ></textarea>
        </div>

        <div class="field">
          <label>Image URL</label>

          <input
            id="imageInput"
            type="url"
            placeholder="https://..."
            oninput="updateSlide()"
          >
        </div>

        <div class="field">
          <label>Background</label>

          <select id="backgroundInput" onchange="updateSlide()">
            <option value="light">Light</option>
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
            <option value="green">Green</option>
            <option value="dark">Dark</option>
          </select>
        </div>

        <button
          class="btn btn-danger"
          style="width:100%"
          onclick="deleteCurrentSlide()"
        >
          Delete Slide
        </button>

      </aside>

    </section>

  </main>

</div>

<!-- CREATE MODAL -->

<div class="modal" id="createModal">

  <div class="modal-card">

    <div class="modal-head">
      <h2>New presentation</h2>

      <button class="close" onclick="closeCreateModal()">×</button>
    </div>

    <div class="field">
      <label>Presentation title</label>

      <input
        id="presentationTitle"
        type="text"
        placeholder="My Presentation"
      >
    </div>

    <div class="field">
      <label>Description</label>

      <textarea
        id="presentationDescription"
        placeholder="What is this presentation about?"
      ></textarea>
    </div>

    <button
      class="btn btn-primary"
      style="width:100%"
      onclick="createPresentationNow()"
    >
      Create Presentation
    </button>

  </div>

</div>

<!-- PREVIEW MODAL -->

<div class="modal preview-modal" id="previewModal">

  <div class="modal-card">

    <div class="modal-head">
      <h2 id="previewTitle">Presentation</h2>

      <button class="close" onclick="closePreview()">×</button>
    </div>

    <div id="previewSlides"></div>

  </div>

</div>

<script>
/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "https://upcxmlbgmqhaqieldmyk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;
let currentPresentation = null;
let slides = [];
let currentSlideIndex = 0;


/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
    return;
  }

  currentUser = session.user;

  document.getElementById("userEmail").textContent =
    currentUser.email || "";

  document.getElementById("avatar").textContent =
    (currentUser.email || "C").charAt(0).toUpperCase();

  await loadPresentations();

});


/* =========================================================
   LOAD PRESENTATIONS
   ========================================================= */

async function loadPresentations(){

  const container =
    document.getElementById("presentationList");

  container.innerHTML =
    '<div class="empty"><div class="empty-icon">⏳</div><h3>Loading presentations...</h3></div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("presentations")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        <div class="empty-icon">⚠️</div>
        <h3>Unable to load presentations</h3>
        <p>${escapeHtml(error.message)}</p>
      </div>`;

    return;
  }

  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="empty">
        <div class="empty-icon">📊</div>
        <h3>No presentations yet</h3>
        <p>Create your first professional presentation.</p>
        <button class="btn btn-primary" onclick="createPresentation()">
          Create Presentation
        </button>
      </div>`;

    return;
  }

  container.innerHTML =
    `<div class="presentation-grid">
      ${data.map(renderPresentationCard).join("")}
    </div>`;
}


/* =========================================================
   PRESENTATION CARD
   ========================================================= */

function renderPresentationCard(item){

  const title =
    item.title || "Untitled Presentation";

  const description =
    item.description || "Professional presentation";

  const status =
    item.is_published ? "Published" : "Draft";

  return `
    <article class="presentation-card">

      <div class="card-preview">

        <h4>${escapeHtml(title)}</h4>

        <p>${escapeHtml(description)}</p>

      </div>

      <div class="card-body">

        <div class="card-title">
          ${escapeHtml(title)}
        </div>

        <div class="card-date">
          ${status} ·
          ${formatDate(item.created_at)}
        </div>

        <div class="card-actions">

          <button
            class="btn btn-primary"
            onclick="openPresentation('${item.id}')"
          >
            Edit
          </button>

          <button
            class="btn btn-secondary"
            onclick="previewExisting('${item.id}')"
          >
            Preview
          </button>

          <button
            class="btn btn-danger"
            onclick="deletePresentation('${item.id}')"
          >
            Delete
          </button>

        </div>

      </div>

    </article>
  `;
}


/* =========================================================
   CREATE
   ========================================================= */

function createPresentation(){

  document.getElementById("presentationTitle").value = "";

  document.getElementById("presentationDescription").value = "";

  document.getElementById("createModal")
    .classList.add("active");
}


function closeCreateModal(){

  document.getElementById("createModal")
    .classList.remove("active");
}


async function createPresentationNow(){

  const title =
    document.getElementById("presentationTitle")
      .value.trim();

  const description =
    document.getElementById("presentationDescription")
      .value.trim();

  if(!title){

    alert("Please enter a presentation title.");

    return;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("presentations")
    .insert({
      user_id:currentUser.id,
      title,
      description,
      template:"modern",
      is_published:false
    })
    .select()
    .single();

  if(error){

    alert(error.message);

    return;
  }

  currentPresentation = data;

  const firstSlide = {
    presentation_id:data.id,
    slide_order:0,
    layout:"title",
    title:title,
    subtitle:"",
    content:"",
    image_url:"",
    background:"light"
  };

  const {
    error:slideError
  } = await supabaseClient
    .from("presentation_slides")
    .insert(firstSlide);

  if(slideError){

    alert(slideError.message);

    return;
  }

  closeCreateModal();

  await openPresentation(data.id);
}


/* =========================================================
   OPEN PRESENTATION
   ========================================================= */

async function openPresentation(id){

  const {
    data,
    error
  } = await supabaseClient
    .from("presentations")
    .select("*")
    .eq("id", id)
    .eq("user_id", currentUser.id)
    .single();

  if(error){

    alert(error.message);

    return;
  }

  currentPresentation = data;

  const {
    data:slideData,
    error:slideError
  } = await supabaseClient
    .from("presentation_slides")
    .select("*")
    .eq("presentation_id", id)
    .order("slide_order", {
      ascending:true
    });

  if(slideError){

    alert(slideError.message);

    return;
  }

  slides = slideData || [];

  currentSlideIndex = 0;

  document.getElementById("dashboardView")
    .style.display = "none";

  document.getElementById("builderView")
    .classList.add("active");

  document.getElementById("pageTitle").textContent =
    data.title || "Presentation";

  renderSlideList();

  renderCurrentSlide();

}


/* =========================================================
   RENDER SLIDE LIST
   ========================================================= */

function renderSlideList(){

  const list =
    document.getElementById("slideList");

  if(!slides.length){

    list.innerHTML =
      "<p style='color:#6b7280;font-size:13px'>No slides.</p>";

    return;
  }

  list.innerHTML =
    slides.map((slide,index) => `

      <div
        class="slide-thumb ${index === currentSlideIndex ? "active" : ""}"
        onclick="selectSlide(${index})"
      >

        <div class="slide-thumb-number">
          Slide ${index + 1}
        </div>

        <div class="slide-thumb-title">
          ${escapeHtml(slide.title || "Untitled Slide")}
        </div>

      </div>

    `).join("");
}


/* =========================================================
   SELECT SLIDE
   ========================================================= */

function selectSlide(index){

  currentSlideIndex = index;

  renderSlideList();

  renderCurrentSlide();
}


/* =========================================================
   RENDER CURRENT SLIDE
   ========================================================= */

function renderCurrentSlide(){

  const slide =
    slides[currentSlideIndex];

  if(!slide) return;

  document.getElementById("titleInput").value =
    slide.title || "";

  document.getElementById("subtitleInput").value =
    slide.subtitle || "";

  document.getElementById("contentInput").value =
    slide.content || "";

  document.getElementById("imageInput").value =
    slide.image_url || "";

  document.getElementById("layoutInput").value =
    slide.layout || "title_content";

  document.getElementById("backgroundInput").value =
    slide.background || "light";

  renderCanvas();
}


/* =========================================================
   UPDATE SLIDE
   ========================================================= */

function updateSlide(){

  const slide =
    slides[currentSlideIndex];

  if(!slide) return;

  slide.title =
    document.getElementById("titleInput").value;

  slide.subtitle =
    document.getElementById("subtitleInput").value;

  slide.content =
    document.getElementById("contentInput").value;

  slide.image_url =
    document.getElementById("imageInput").value;

  slide.layout =
    document.getElementById("layoutInput").value;

  slide.background =
    document.getElementById("backgroundInput").value;

  renderSlideList();

  renderCanvas();
}


/* =========================================================
   CANVAS
   ========================================================= */

function renderCanvas(){

  const slide =
    slides[currentSlideIndex];

  if(!slide) return;

  const stage =
    document.getElementById("slideStage");

  const content =
    document.getElementById("slideContent");

  stage.className =
    "slide-stage " +
    (slide.background || "light");

  content.className =
    "slide-content";

  const title =
    document.getElementById("canvasTitle");

  const subtitle =
    document.getElementById("canvasSubtitle");

  const body =
    document.getElementById("canvasBody");

  const image =
    document.getElementById("canvasImage");

  title.textContent =
    slide.title || "";

  subtitle.textContent =
    slide.subtitle || "";

  body.textContent =
    slide.content || "";

  if(slide.image_url){

    image.src = slide.image_url;

    image.style.display = "block";

    image.onerror = () => {
      image.style.display = "none";
    };

  }else{

    image.style.display = "none";

  }

  if(slide.layout === "title"){

    content.className =
      "slide-content layout-title";

    body.style.display = "none";

  }else if(slide.layout === "two_column"){

    content.className =
      "slide-content layout-two";

    body.style.display = "block";

  }else if(slide.layout === "image"){

    content.className =
      "slide-content layout-image";

    body.style.display = "block";

  }else{

    body.style.display = "block";

  }

}


/* =========================================================
   ADD SLIDE
   ========================================================= */

async function addSlide(){

  if(!currentPresentation) return;

  const slide = {
    presentation_id:currentPresentation.id,
    slide_order:slides.length,
    layout:"title_content",
    title:"New Slide",
    subtitle:"",
    content:"",
    image_url:"",
    background:"light"
  };

  const {
    data,
    error
  } = await supabaseClient
    .from("presentation_slides")
    .insert(slide)
    .select()
    .single();

  if(error){

    alert(error.message);

    return;
  }

  slides.push(data);

  currentSlideIndex =
    slides.length - 1;

  renderSlideList();

  renderCurrentSlide();

}


/* =========================================================
   DELETE SLIDE
   ========================================================= */

async function deleteCurrentSlide(){

  const slide =
    slides[currentSlideIndex];

  if(!slide) return;

  if(slides.length === 1){

    alert("A presentation must have at least one slide.");

    return;
  }

  if(!confirm("Delete this slide?")) return;

  const {
    error
  } = await supabaseClient
    .from("presentation_slides")
    .delete()
    .eq("id", slide.id);

  if(error){

    alert(error.message);

    return;
  }

  slides.splice(currentSlideIndex,1);

  if(currentSlideIndex >= slides.length){

    currentSlideIndex =
      slides.length - 1;

  }

  await reorderSlides();

  renderSlideList();

  renderCurrentSlide();

}


/* =========================================================
   REORDER
   ========================================================= */

async function reorderSlides(){

  for(let i = 0; i < slides.length; i++){

    slides[i].slide_order = i;

    await supabaseClient
      .from("presentation_slides")
      .update({
        slide_order:i
      })
      .eq("id", slides[i].id);

  }

}


/* =========================================================
   SAVE
   ========================================================= */

async function savePresentation(){

  if(!currentPresentation) return;

  setSaveStatus("Saving...");

  const {
    error:presentationError
  } = await supabaseClient
    .from("presentations")
    .update({
      title:currentPresentation.title,
      description:currentPresentation.description,
      updated_at:new Date().toISOString()
    })
    .eq("id", currentPresentation.id)
    .eq("user_id", currentUser.id);

  if(presentationError){

    setSaveStatus("Save failed");

    alert(presentationError.message);

    return;
  }

  for(const slide of slides){

    const {
      error
    } = await supabaseClient
      .from("presentation_slides")
      .update({
        slide_order:slide.slide_order,
        layout:slide.layout,
        title:slide.title,
        subtitle:slide.subtitle,
        content:slide.content,
        image_url:slide.image_url,
        background:slide.background
      })
      .eq("id", slide.id);

    if(error){

      setSaveStatus("Save failed");

      alert(error.message);

      return;
    }
  }

  setSaveStatus("Saved");

}


/* =========================================================
   PUBLISH
   ========================================================= */

async function togglePublish(){

  if(!currentPresentation) return;

  const newStatus =
    !currentPresentation.is_published;

  const {
    data,
    error
  } = await supabaseClient
    .from("presentations")
    .update({
      is_published:newStatus,
      published_at:
        newStatus
          ? new Date().toISOString()
          : null,
      updated_at:new Date().toISOString()
    })
    .eq("id", currentPresentation.id)
    .eq("user_id", currentUser.id)
    .select()
    .single();

  if(error){

    alert(error.message);

    return;
  }

  currentPresentation = data;

  alert(
    newStatus
      ? "Presentation published successfully."
      : "Presentation unpublished."
  );

}


/* =========================================================
   PREVIEW
   ========================================================= */

function previewPresentation(){

  document.getElementById("previewTitle").textContent =
    currentPresentation?.title || "Presentation";

  document.getElementById("previewSlides").innerHTML =
    slides.map(slide => renderPreviewSlide(slide)).join("");

  document.getElementById("previewModal")
    .classList.add("active");
}


async function previewExisting(id){

  const {
    data:presentation,
    error
  } = await supabaseClient
    .from("presentations")
    .select("*")
    .eq("id",id)
    .single();

  if(error){

    alert(error.message);

    return;
  }

  const {
    data:slideData,
    error:slideError
  } = await supabaseClient
    .from("presentation_slides")
    .select("*")
    .eq("presentation_id",id)
    .order("slide_order");

  if(slideError){

    alert(slideError.message);

    return;
  }

  document.getElementById("previewTitle").textContent =
    presentation.title || "Presentation";

  document.getElementById("previewSlides").innerHTML =
    (slideData || [])
      .map(slide => renderPreviewSlide(slide))
      .join("");

  document.getElementById("previewModal")
    .classList.add("active");
}


function renderPreviewSlide(slide){

  const image =
    slide.image_url
      ? `<img class="slide-image" src="${escapeHtml(slide.image_url)}" alt="">`
      : "";

  return `
    <div class="preview-slide slide-stage ${escapeHtml(slide.background || "light")}">

      <div class="slide-content">

        <div class="slide-title">
          ${escapeHtml(slide.title || "")}
        </div>

        <div class="slide-subtitle">
          ${escapeHtml(slide.subtitle || "")}
        </div>

        <div class="slide-body">
          ${escapeHtml(slide.content || "")}
        </div>

        ${image}

      </div>

    </div>
  `;
}


function closePreview(){

  document.getElementById("previewModal")
    .classList.remove("active");
}


/* =========================================================
   DELETE PRESENTATION
   ========================================================= */

async function deletePresentation(id){

  if(!confirm(
    "Delete this presentation and all its slides?"
  )) return;

  const {
    error
  } = await supabaseClient
    .from("presentations")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(error){

    alert(error.message);

    return;
  }

  await loadPresentations();
}

   NAVIGATION

    .classList.remove("active");

}


function toggleSidebar(){

  document.getElementById("sidebar")
    .classList.toggle("open");
}


/* =========================================================
   HELPERS
   ========================================================= */

function setSaveStatus(text){

  document.getElementById("saveStatus")
    .textContent = text;
}


function formatDate(date){

  if(!date) return "";

  return new Date(date).toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );
}


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
