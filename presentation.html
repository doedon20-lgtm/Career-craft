<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerCraft Presentation Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#6d4aff;
  --primary2:#8b5cf6;
  --dark:#17151f;
  --panel:#ffffff;
  --soft:#f5f3fa;
  --line:#e7e3ef;
  --text:#211d2b;
  --muted:#777080;
  --danger:#e5484d;
  --shadow:0 12px 35px rgba(33,25,66,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#f1eff6;
  color:var(--text);
  overflow:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */

.topbar{
  height:62px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 16px;
  flex-shrink:0;
}

.back-btn{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f4f1fa;
  font-size:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:800;
  white-space:nowrap;
}

.logo{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:10px;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),#a855f7);
}

.title-input{
  width:230px;
  border:1px solid transparent;
  padding:8px 10px;
  border-radius:8px;
  font-weight:700;
  color:var(--text);
  outline:none;
}

.title-input:focus{
  border-color:#cfc4ff;
  background:#faf9ff;
}

.top-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.save-status{
  color:var(--muted);
  font-size:12px;
  margin-right:5px;
}

.top-btn{
  height:36px;
  padding:0 13px;
  border-radius:9px;
  background:#f3f0f8;
  color:#332c40;
  font-weight:700;
}

.top-btn:hover{
  background:#e9e4f2;
}

.top-btn.primary{
  color:#fff;
  background:var(--primary);
}

.top-btn.primary:hover{
  background:#5939ed;
}

/* RIBBON */

.ribbon{
  background:#fff;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}

.tabs{
  height:39px;
  display:flex;
  gap:4px;
  padding:0 14px;
  border-bottom:1px solid #eeeaf4;
}

.tab{
  padding:0 16px;
  background:transparent;
  color:#746d7e;
  font-weight:700;
  font-size:13px;
}

.tab.active{
  color:var(--primary);
  border-bottom:3px solid var(--primary);
}

.ribbon-content{
  min-height:82px;
  padding:9px 14px;
  display:flex;
  align-items:center;
  gap:7px;
  overflow-x:auto;
}

.ribbon-panel{
  display:none;
  align-items:center;
  gap:7px;
}

.ribbon-panel.active{
  display:flex;
}

.tool{
  min-width:54px;
  height:57px;
  padding:5px 7px;
  border-radius:9px;
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  color:#4e4758;
  font-size:11px;
  font-weight:700;
}

.tool:hover{
  background:#f3f0f8;
}

.tool-icon{
  font-size:20px;
}

.tool.danger{
  color:var(--danger);
}

.tool.wide{
  min-width:88px;
}

.separator{
  height:50px;
  width:1px;
  background:var(--line);
  margin:0 5px;
}

.ribbon-select{
  height:34px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  padding:0 8px;
  outline:none;
}

.ribbon-select:focus{
  border-color:var(--primary);
}

/* WORKSPACE */

.workspace{
  flex:1;
  min-height:0;
  display:flex;
}

.sidebar{
  width:215px;
  background:#fff;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}

.sidebar-head{
  padding:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.sidebar-head strong{
  font-size:13px;
}

.slide-count{
  font-size:11px;
  color:var(--muted);
}

.thumbnails{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.thumbnail-wrap{
  position:relative;
  margin-bottom:12px;
}

.thumbnail{
  width:100%;
  aspect-ratio:16/9;
  border:2px solid transparent;
  border-radius:9px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
  cursor:pointer;
  position:relative;
}

.thumbnail.active{
  border-color:var(--primary);
}

.thumb-number{
  position:absolute;
  left:-2px;
  top:-2px;
  width:24px;
  height:24px;
  border-radius:8px 0 8px 0;
  display:grid;
  place-items:center;
  background:var(--primary);
  color:#fff;
  font-size:10px;
  font-weight:800;
  z-index:3;
}

.thumb-delete{
  position:absolute;
  right:6px;
  top:6px;
  width:24px;
  height:24px;
  border-radius:7px;
  background:rgba(0,0,0,.6);
  color:#fff;
  z-index:5;
  opacity:0;
}

.thumbnail-wrap:hover .thumb-delete{
  opacity:1;
}

/* CANVAS */

.editor{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.canvas-toolbar{
  height:45px;
  background:#f8f7fb;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:10px;
}

.canvas-toolbar span{
  font-size:12px;
  color:var(--muted);
}

.zoom{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.zoom input{
  width:110px;
}

.canvas-area{
  flex:1;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:35px;
}

.slide-stage{
  width:min(900px,90vw);
  min-width:520px;
  aspect-ratio:16/9;
  transform-origin:top center;
  transition:transform .2s ease;
}

.slide{
  width:100%;
  height:100%;
  border-radius:5px;
  overflow:hidden;
  position:relative;
  box-shadow:0 18px 50px rgba(28,20,50,.22);
}

.slide-content{
  position:absolute;
  inset:0;
  padding:7%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.edit-title,
.edit-subtitle,
.edit-content{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  resize:none;
  outline:none;
  color:inherit;
}

.edit-title:hover,
.edit-subtitle:hover,
.edit-content:hover,
.edit-title:focus,
.edit-subtitle:focus,
.edit-content:focus{
  border-color:rgba(109,74,255,.35);
  background:rgba(255,255,255,.10);
  border-radius:7px;
}

.edit-title{
  font-size:clamp(28px,4vw,54px);
  font-weight:900;
  line-height:1.08;
  min-height:65px;
}

.edit-subtitle{
  font-size:clamp(15px,1.8vw,24px);
  margin-top:16px;
  min-height:40px;
  opacity:.82;
}

.edit-content{
  font-size:clamp(13px,1.3vw,19px);
  line-height:1.65;
  margin-top:25px;
  min-height:130px;
}

.slide-footer{
  position:absolute;
  bottom:4%;
  left:7%;
  right:7%;
  display:flex;
  justify-content:space-between;
  font-size:11px;
  opacity:.55;
}

/* LAYOUTS */

.layout-stats .slide-content,
.layout-cards .slide-content,
.layout-columns .slide-content,
.layout-timeline .slide-content,
.layout-image .slide-content{
  justify-content:flex-start;
}

.visual-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:25px;
}

.visual-card{
  min-height:115px;
  border-radius:14px;
  padding:18px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
}

.visual-card strong{
  display:block;
  font-size:20px;
  margin-bottom:8px;
}

.visual-card span{
  font-size:12px;
  line-height:1.5;
  opacity:.8;
}

.stats-number{
  font-size:34px!important;
  font-weight:900;
}

.columns-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  margin-top:25px;
}

.column-box{
  padding:22px;
  border-radius:14px;
  background:rgba(255,255,255,.13);
  min-height:170px;
}

.quote-box{
  text-align:center;
}

.quote-mark{
  font-size:60px;
  font-weight:900;
  opacity:.3;
}

.image-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
  align-items:center;
}

.slide-image{
  width:100%;
  max-height:310px;
  object-fit:cover;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.timeline{
  margin-top:25px;
  display:flex;
  gap:8px;
}

.timeline-item{
  flex:1;
  min-height:105px;
  padding:14px;
  border-left:4px solid currentColor;
  background:rgba(255,255,255,.12);
}

.timeline-item strong{
  display:block;
  font-size:18px;
}

.shape-box{
  width:130px;
  height:130px;
  margin:25px auto 0;
  border-radius:30px;
  background:rgba(255,255,255,.22);
  transform:rotate(-7deg);
  display:grid;
  place-items:center;
  font-size:45px;
}

/* STATUS */

.statusbar{
  height:30px;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 14px;
  font-size:11px;
  color:var(--muted);
  flex-shrink:0;
}

.status-right{
  margin-left:auto;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(17,13,27,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(950px,100%);
  max-height:90vh;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
  display:flex;
  flex-direction:column;
}

.modal-head{
  padding:18px 20px;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--line);
}

.modal-head h2{
  font-size:19px;
}

.modal-close{
  margin-left:auto;
  width:34px;
  height:34px;
  border-radius:8px;
  background:#f3f0f8;
}

.template-grid{
  padding:20px;
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.template-card{
  cursor:pointer;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  transition:.15s;
}

.template-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
  border-color:#cfc3ff;
}

.template-preview{
  aspect-ratio:16/9;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.template-name{
  padding:10px;
  font-size:12px;
  font-weight:800;
}

/* PRESENT MODE */

.presentation-mode{
  position:fixed;
  inset:0;
  background:#000;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
}

.presentation-mode.show{
  display:flex;
}

.present-slide{
  width:100vw;
  height:100vh;
  max-width:1600px;
  max-height:900px;
  aspect-ratio:16/9;
  position:relative;
}

.present-controls{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  padding:8px;
  border-radius:13px;
  background:rgba(20,20,25,.75);
  backdrop-filter:blur(10px);
  opacity:0;
  transition:.2s;
}

.presentation-mode:hover .present-controls{
  opacity:1;
}

.present-controls button{
  width:40px;
  height:38px;
  border-radius:9px;
  color:#fff;
  background:rgba(255,255,255,.12);
}

.present-counter{
  position:absolute;
  top:18px;
  right:20px;
  color:#fff;
  background:rgba(0,0,0,.45);
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
}

/* ANIMATIONS */

.anim-fade{
  animation:fadeIn .7s ease both;
}

.anim-rise{
  animation:riseIn .7s ease both;
}

.anim-zoom{
  animation:zoomIn .7s ease both;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes riseIn{
  from{opacity:0;transform:translateY(35px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes zoomIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

/* TOAST */

.toast{
  position:fixed;
  bottom:45px;
  left:50%;
  transform:translate(-50%,20px);
  background:#211d2b;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:900px){
  .sidebar{
    width:170px;
  }

  .template-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .title-input{
    width:150px;
  }

  .brand span{
    display:none;
  }

  .canvas-area{
    padding:20px;
  }
}

@media(max-width:650px){
  body{
    overflow:auto;
  }

  .topbar{
    height:auto;
    min-height:58px;
    flex-wrap:wrap;
    padding:8px;
  }

  .top-actions{
    width:100%;
    margin-left:0;
    justify-content:flex-end;
  }

  .save-status{
    margin-right:auto;
  }

  .ribbon-content{
    min-height:70px;
  }

  .workspace{
    min-height:650px;
  }

  .sidebar{
    width:115px;
  }

  .canvas-area{
    padding:15px;
    overflow:auto;
  }

  .slide-stage{
    min-width:500px;
  }

  .tool{
    min-width:48px;
  }

  .template-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <button class="back-btn" id="backBtn" title="Back">←</button>

    <div class="brand">
      <div class="logo">C</div>
      <span>CareerCraft Studio</span>
    </div>

    <input
      id="presentationTitle"
      class="title-input"
      value="My Career Presentation"
      placeholder="Presentation title"
    >

    <div class="top-actions">
      <span id="saveStatus" class="save-status">Not saved</span>

      <button class="top-btn" id="undoBtn">↶ Undo</button>
      <button class="top-btn" id="redoBtn">↷ Redo</button>
      <button class="top-btn primary" id="saveBtn">Save</button>
      <button class="top-btn primary" id="presentBtn">▶ Present</button>
    </div>
  </header>

  <section class="ribbon">

    <div class="tabs">
      <button class="tab active" data-tab="home">Home</button>
      <button class="tab" data-tab="insert">Insert</button>
      <button class="tab" data-tab="design">Design</button>
      <button class="tab" data-tab="transitions">Transitions</button>
      <button class="tab" data-tab="animations">Animations</button>
      <button class="tab" data-tab="slideshow">Slide Show</button>
    </div>

    <div class="ribbon-content">

      <div class="ribbon-panel active" data-panel="home">
        <button class="tool" id="newSlideBtn">
          <span class="tool-icon">＋</span>
          New Slide
        </button>

        <button class="tool" id="duplicateBtn">
          <span class="tool-icon">▣</span>
          Duplicate
        </button>

        <button class="tool danger" id="deleteBtn">
          <span class="tool-icon">⌫</span>
          Delete
        </button>

        <div class="separator"></div>

        <select id="fontFamily" class="ribbon-select">
          <option>Arial</option>
          <option>Georgia</option>
          <option>Verdana</option>
          <option>Trebuchet MS</option>
          <option>Times New Roman</option>
        </select>

        <select id="fontSize" class="ribbon-select">
          <option value="14">14</option>
          <option value="18">18</option>
          <option value="24" selected>24</option>
          <option value="32">32</option>
          <option value="40">40</option>
          <option value="48">48</option>
        </select>

        <button class="tool" id="boldBtn"><span class="tool-icon">B</span>Bold</button>
        <button class="tool" id="italicBtn"><span class="tool-icon"><i>I</i></span>Italic</button>
        <button class="tool" id="underlineBtn"><span class="tool-icon"><u>U</u></span>Underline</button>

        <div class="separator"></div>

        <button class="tool" id="leftAlignBtn">☰<br>Left</button>
        <button class="tool" id="centerAlignBtn">☰<br>Center</button>
        <button class="tool" id="rightAlignBtn">☰<br>Right</button>

        <button class="tool wide" id="layoutsBtn">▦ Layouts</button>
        <button class="tool wide" id="templatesBtn">✨ Templates</button>
      </div>

      <div class="ribbon-panel" data-panel="insert">
        <button class="tool" id="textBoxBtn"><span class="tool-icon">T</span>Text Box</button>
        <button class="tool" id="headingBtn"><span class="tool-icon">H</span>Heading</button>
        <button class="tool" id="quoteBtn"><span class="tool-icon">❝</span>Quote</button>
        <button class="tool" id="imageBtn"><span class="tool-icon">▧</span>Image</button>
        <button class="tool" id="shapeBtn"><span class="tool-icon">◆</span>Shape</button>
        <button class="tool wide" id="designGalleryBtn">✨ 50 Designs</button>
      </div>

      <div class="ribbon-panel" data-panel="design">
        <button class="tool" data-theme="purple">🟣<br>Purple</button>
        <button class="tool" data-theme="dark">⚫<br>Dark</button>
        <button class="tool" data-theme="blue">🔵<br>Blue</button>
        <button class="tool" data-theme="green">🟢<br>Green</button>
        <button class="tool" data-theme="cream">🟡<br>Cream</button>
        <button class="tool wide" id="allDesignsBtn">All Designs</button>
      </div>

      <div class="ribbon-panel" data-panel="transitions">
        <button class="tool" data-transition="none">None</button>
        <button class="tool" data-transition="fade">Fade</button>
        <button class="tool" data-transition="slide">Slide</button>
        <button class="tool" data-transition="wipe">Wipe</button>
        <button class="tool" data-transition="zoom">Zoom</button>
        <button class="tool" data-transition="dissolve">Dissolve</button>

        <select id="transitionDuration" class="ribbon-select">
          <option value=".3">0.3s</option>
          <option value=".5" selected>0.5s</option>
          <option value="1">1s</option>
          <option value="1.5">1.5s</option>
          <option value="2">2s</option>
        </select>

        <button class="tool wide" id="applyAllTransitionBtn">Apply to All</button>
        <button class="tool wide" id="previewTransitionBtn">Preview</button>
      </div>

      <div class="ribbon-panel" data-panel="animations">
        <button class="tool" data-animation="none">None</button>
        <button class="tool" data-animation="fade">Fade In</button>
        <button class="tool" data-animation="rise">Rise</button>
        <button class="tool" data-animation="zoom">Zoom</button>
      </div>

      <div class="ribbon-panel" data-panel="slideshow">
        <button class="tool wide" id="startPresentationBtn">▶ From Start</button>
        <button class="tool wide" id="currentPresentationBtn">▶ From Current</button>
        <button class="tool wide" id="autoplayBtn">⏱ Auto Play</button>
        <button class="tool wide" id="fullscreenBtn">⛶ Fullscreen</button>
      </div>

    </div>
  </section>

  <main class="workspace">

    <aside class="sidebar">
      <div class="sidebar-head">
        <strong>Slides</strong>
        <span class="slide-count" id="slideCount">0 slides</span>
      </div>

      <div id="thumbnails" class="thumbnails"></div>
    </aside>

    <section class="editor">

      <div class="canvas-toolbar">
        <span id="slidePosition">Slide 1 of 1</span>

        <div class="zoom">
          <span id="zoomValue">85%</span>
          <input id="zoomSlider" type="range" min="50" max="130" value="85">
        </div>
      </div>

      <div id="canvasArea" class="canvas-area"></div>

    </section>
  </main>

  <footer class="statusbar">
    <span id="statusMessage">Ready</span>
    <span class="status-right">CareerCraft Presentation Studio</span>
  </footer>

</div>


<!-- TEMPLATE MODAL -->

/* =========================================================
   UUID
========================================================= */

function isValidUUID(value){
  if(typeof value !== "string") return false;

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);
}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function clone(value){
  return JSON.parse(JSON.stringify(value));
}

function getTheme(theme){
  return themes[theme] || themes.purple;
}

function getThemeStyle(slide){
  const theme = getTheme(slide.background || slide.theme || "purple");

  return `
    background:${theme.background};
    color:${theme.color};
  `;
}

function getAnimationClass(slide){
  if(slide.animation === "fade") return "anim-fade";
  if(slide.animation === "rise") return "anim-rise";
  if(slide.animation === "zoom") return "anim-zoom";
  return "";
}

function showToast(message){
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(()=>{
    toast.classList.remove("show");
  },2600);
}

function setStatus(message){
  document.getElementById("statusMessage").textContent = message;
}

function markUnsaved(){
  document.getElementById("saveStatus").textContent = "Unsaved changes";
  setStatus("Unsaved changes");
}

function markSaved(){
  document.getElementById("saveStatus").textContent = "Saved";
  setStatus("All changes saved");
}


/* =========================================================
   HISTORY
========================================================= */

function createSnapshot(){
  return {
    slides:clone(slides),
    currentSlideIndex,
    title:document.getElementById("presentationTitle").value
  };
}

function pushHistory(){
  historyStack.push(createSnapshot());

  if(historyStack.length > 50){
    historyStack.shift();
  }

  redoStack = [];
}

function restoreSnapshot(snapshot){
  slides = clone(snapshot.slides);
  currentSlideIndex = snapshot.currentSlideIndex;

  document.getElementById("presentationTitle").value = snapshot.title;

  renderEverything();
  markUnsaved();
}

function undo(){
  if(!historyStack.length){
    showToast("Nothing to undo");
    return;
  }

  redoStack.push(createSnapshot());

  const snapshot = historyStack.pop();

  restoreSnapshot(snapshot);
}

function redo(){
  if(!redoStack.length){
    showToast("Nothing to redo");
    return;
  }

  historyStack.push(createSnapshot());

  const snapshot = redoStack.pop();

  restoreSnapshot(snapshot);
}


/* =========================================================
   SLIDE NORMALIZATION
========================================================= */

function normalizeSlide(row, index){
  return {
    id:row?.id || null,
    presentation_id:row?.presentation_id || presentationId || null,
    slide_order:Number(row?.slide_order ?? row?.order ?? index + 1),
    layout:row?.layout || "content",
    title:row?.title || "Untitled Slide",
    subtitle:row?.subtitle || "",
    content:row?.content || "",
    image_url:row?.image_url || "",
    background:row?.background || row?.theme || "purple",
    transition:row?.transition || "none",
    transition_duration:Number(row?.transition_duration ?? .5),
    animation:row?.animation || "none"
  };
}

function makeSlide(templateIndex=0){
  const template = templates[templateIndex] || templates[0];

  return {
    id:null,
    presentation_id:presentationId || null,
    slide_order:slides.length + 1,
    layout:template.layout,
    title:template.title,
    subtitle:template.subtitle,
    content:template.content,
    image_url:"",
    background:template.theme,
    transition:"none",
    transition_duration:.5,
    animation:"none"
  };
}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize(){

  try{

    setStatus("Loading CareerCraft...");

    const {
      data:{session},
      error:sessionError
    } = await supabaseClient.auth.getSession();

    if(sessionError){
      console.error(sessionError);
    }

    if(!session?.user){
      window.location.href = "login.html";
      return;
    }

    currentUser = session.user;

    const params = new URLSearchParams(window.location.search);

    const rawId =
      params.get("id") ||
      params.get("presentation_id") ||
      params.get("presentationId");

    const isNew =
      params.get("new") === "1" ||
      params.get("new") === "true";

    if(rawId){

      if(!isValidUUID(rawId)){

        showToast("Invalid presentation ID");

        setTimeout(()=>{
          window.location.href = "presentations.html";
        },1300);

        return;
      }

      presentationId = rawId;

      await loadPresentation();

    }else if(isNew){

      createLocalPresentation();

    }else{

      createLocalPresentation();

    }

  }catch(error){

    console.error("Initialization error:",error);

    setStatus("Unable to load presentation");

    showToast("Unable to load presentation");
  }
}

/* =========================================================
   LOAD FROM SUPABASE
========================================================= */

async function loadPresentation(){

  setStatus("Loading presentation...");

  const {
    data:presentationData,
    error:presentationError
  } = await supabaseClient
    .from("presentations")
    .select("*")
    .eq("id",presentationId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(presentationError){
    console.error(presentationError);

    showToast("Could not load presentation");

    setStatus("Database error");

    return;
  }

  if(!presentationData){

    showToast("Presentation not found");

    setTimeout(()=>{
      window.location.href = "presentations.html";
    },1500);

    return;
  }

  presentation = {
    ...presentation,
    ...presentationData
  };

  document.getElementById("presentationTitle").value =
    presentation.title || "Untitled Presentation";

  const {
    data:slideRows,
    error:slidesError
  } = await supabaseClient
    .from("presentation_slides")
    .select("*")
    .eq("presentation_id",presentationId)
    .order("slide_order",{ascending:true});

  if(slidesError){

    console.error(slidesError);

    showToast("Could not load slides");

    slides = [makeSlide(0)];

  }else{

    slides = (slideRows || []).map(normalizeSlide);

    if(!slides.length){
      slides = [makeSlide(0)];
    }
  }

  currentSlideIndex = 0;

  renderEverything();

  markSaved();

  setStatus("Presentation loaded");
}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function renderEverything(){

  if(currentSlideIndex < 0){
    currentSlideIndex = 0;
  }

  if(currentSlideIndex >= slides.length){
    currentSlideIndex = slides.length - 1;
  }

  renderThumbnails();
  renderCanvas();
  updateSlideInfo();
  updateUndoRedo();
  updateTransitionUI();
}


/* =========================================================
   THUMBNAILS
========================================================= */

function renderThumbnails(){

  const container = document.getElementById("thumbnails");

  container.innerHTML = "";

  slides.forEach((slide,index)=>{

    const wrapper = document.createElement("div");

    wrapper.className = "thumbnail-wrap";

    const thumbnail = document.createElement("div");

    thumbnail.className =
      "thumbnail " +
      (index === currentSlideIndex ? "active" : "");

    thumbnail.innerHTML = `
      <div class="thumb-number">${index + 1}</div>
      ${buildSlideVisual(slide,true)}
    `;

    thumbnail.addEventListener("click",()=>{
      selectSlide(index);
    });

    const deleteButton = document.createElement("button");

    deleteButton.className = "thumb-delete";
    deleteButton.textContent = "✕";
    deleteButton.title = "Delete slide";

    deleteButton.addEventListener("click",(event)=>{
      event.stopPropagation();
      deleteSlide(index);
    });

    wrapper.appendChild(thumbnail);
    wrapper.appendChild(deleteButton);

    container.appendChild(wrapper);
  });

  document.getElementById("slideCount").textContent =
    `${slides.length} slide${slides.length === 1 ? "" : "s"}`;
}


/* =========================================================
   SLIDE VISUAL
========================================================= */

function buildSlideVisual(slide,thumbnail=false){

  const title = escapeHTML(slide.title || "");
  const subtitle = escapeHTML(slide.subtitle || "");
  const content = escapeHTML(slide.content || "");

  const themeStyle = getThemeStyle(slide);

  const animation = getAnimationClass(slide);

  const small =
    thumbnail
      ? "font-size:.42em!important"
      : "";

  if(slide.layout === "stats"){

    const values =
      (slide.content || "")
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

    while(values.length < 3){
      values.push("—");
    }

    return `
      <div class="slide ${animation}" style="${themeStyle}">
        <div class="slide-content layout-stats" style="${small}">
          <div>
            <div class="edit-title">${title}</div>
            <div class="edit-subtitle">${subtitle}</div>
          </div>

          <div class="visual-grid">
            ${values.slice(0,3).map((v,i)=>`
              <div class="visual-card">
                <strong class="stats-number">${escapeHTML(v)}</strong>
                <span>${["Experience","Projects","Impact"][i]}</span>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    `;
  }

  if(slide.layout === "cards"){

    const values =
      (slide.content || "")
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

    while(values.length < 3){
      values.push(`Highlight ${values.length + 1}`);
    }

    return `
      <div class="slide ${animation}" style="${themeStyle}">
        <div class="slide-content layout-cards" style="${small}">
          <div class="edit-title">${title}</div>
          <div class="edit-subtitle">${subtitle}</div>

          <div class="visual-grid">
            ${values.slice(0,3).map((v,i)=>`
              <div class="visual-card">
                <strong>${escapeHTML(v)}</strong>
                <span>Professional highlight ${i+1}</span>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    `;
  }

  if(slide.layout === "quote"){

    return `
      <div class="slide ${animation}" style="${themeStyle}">
        <div class="slide-content quote-box" style="${small}">
          <div class="quote-mark">“</div>
          <div class="edit-title">${title}</div>
          <div class="edit-content">${content}</div>
          <div class="edit-subtitle">${subtitle}</div>
        </div>
      </div>
    `;
  }

  if(slide.layout === "columns"){

    const parts =
      (slide.content || "")
      .split(/\n\s*---COLUMN---\s*\n|\n\s*\n/)
      .map(x=>x.trim());

    const first = parts[0] || "Add information here.";
    const second = parts[1] || "Add more information here.";

    return `
      <div class="slide ${animation}" style="${themeStyle}">
        <div class="slide-content layout-columns" style="${small}">
          <div class="edit-title">${title}</div>
          <div class="edit-subtitle">${subtitle}</div>

          <div class="columns-grid">
            <div class="column-box">${escapeHTML(first)}</div>
            <div class="column-box">${escapeHTML(second)}</div>
          </div>
        </div>
      </div>
    `;
  }

  if(slide.layout === "timeline"){

    const items =
      (slide.content || "")
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean);

    const list =
      items.length
        ? items.slice(0,4)
        : ["Step 1","Step 2","Step 3","Step 4"];

    return `
      <div class="slide ${animation}" style="${themeStyle}">
        <div class="slide-content layout-timeline" style="${small}">
          <div class="edit-title">${title}</div>
          <div class="edit-subtitle">${subtitle}</div>

          <div class="timeline">
            ${list.map((item,i)=>`
              <div class="timeline-item">
                <strong>${escapeHTML(item)}</strong>
                <span>Milestone ${i+1}</span>
              </div>
            `).join("")}
          </div>
        </div>
      </div>
    `;
  }

  if(slide.layout === "image_text"){

    const image =
      slide.image_url
        ? `<img class="slide-image" src="${escapeHTML(slide.image_url)}" alt="Presentation image">`
        : `<div class="slide-image" style="height:220px;background:rgba(255,255,255,.16);display:grid;place-items:center;">Add Image</div>`;

    return `
      <div class="slide ${animation}" style="${themeStyle}">
        <div class="slide-content image-layout" style="${small}">
          <div>
            <div class="edit-title">${title}</div>
            <div class="edit-subtitle">${subtitle}</div>
            <div class="edit-content">${content}</div>
          </div>

          ${image}
        </div>
      </div>
    `;
  }

  if(slide.layout === "shape"){

    return `
      <div class="slide ${animation}" style="${themeStyle}">
        <div class="slide-content" style="${small}">
          <div class="edit-title">${title}</div>
          <div class="edit-subtitle">${subtitle}</div>
          <div class="shape-box">◆</div>
          <div class="edit-content">${content}</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="slide ${animation}" style="${themeStyle}">
      <div class="slide-content">
        <textarea
          class="edit-title"
          data-field="title"
          style="${small}"
          spellcheck="false"
        >${title}</textarea>

        <textarea
          class="edit-subtitle"
          data-field="subtitle"
          style="${small}"
          spellcheck="false"
        >${subtitle}</textarea>

        <textarea
          class="edit-content"
          data-field="content"
          style="${small}"
          spellcheck="false"
        >${content}</textarea>

        <div class="slide-footer">
          <span>CareerCraft</span>
          <span>${currentSlideIndex + 1}</span>
        </div>
      </div>
    </div>
  `;
}

          <textarea class="edit-subtitle" data-field="subtitle">${subtitle}</textarea>

          <div class="visual-grid">
            ${values.slice(0,3).map((value,index)=>`
              <div class="visual-card">
                <strong class="stats-number">${escapeHTML(value)}</strong>
                <span>${["Experience","Projects","Impact"][index]}</span>
              </div>
            `).join("")}
          </div>

          <textarea class="edit-content" data-field="content" style="margin-top:20px">${content}</textarea>

        </div>

        <div class="slide-footer">
          <span>CareerCraft</span>
          <span>${currentSlideIndex+1}</span>
        </div>

      </div>
    `;
  }

  if(slide.layout === "cards"){

    const values =
      (slide.content || "")
      .split("\n")
      .filter(Boolean);

    while(values.length < 3){
      values.push(`Highlight ${values.length+1}`);
    }

    return `
      <div class="slide ${animation}" style="${themeStyle}">

        <div class="slide-content layout-cards">

          <textarea class="edit-title" data-field="title">${title}</textarea>

          <textarea class="edit-subtitle" data-field="subtitle">${subtitle}</textarea>

          <div class="visual-grid">
            ${values.slice(0,3).map((value,index)=>`
              <div class="visual-card">
                <strong>${escapeHTML(value)}</strong>
                <span>Professional highlight ${index+1}</span>
              </div>
            `).join("")}
          </div>

          <textarea class="edit-content" data-field="content">${content}</textarea>

        </div>

        <div class="slide-footer">
          <span>CareerCraft</span>
          <span>${currentSlideIndex+1}</span>
        </div>

      </div>
    `;
  }

  if(slide.layout === "quote"){

    return `
      <div class="slide ${animation}" style="${themeStyle}">

        <div class="slide-content quote-box">

          <div class="quote-mark">“</div>

          <textarea class="edit-title" data-field="title">${title}</textarea>

          <textarea class="edit-content" data-field="content">${content}</textarea>

          <textarea class="edit-subtitle" data-field="subtitle">${subtitle}</textarea>

        </div>

      </div>
    `;
  }

  if(slide.layout === "columns"){

    const parts =
      (slide.content || "")
      .split(/\n\s*---COLUMN---\s*\n|\n\s*\n/);

    const first = parts[0] || "";
    const second = parts[1] || "";

    return `
      <div class="slide ${animation}" style="${themeStyle}">

        <div class="slide-content layout-columns">

          <textarea class="edit-title" data-field="title">${title}</textarea>

          <textarea class="edit-subtitle" data-field="subtitle">${subtitle}</textarea>

          <div class="columns-grid">

            <div class="column-box">
              <textarea
                class="edit-content"
                data-column="first"
                style="margin:0;min-height:130px"
              >${escapeHTML(first)}</textarea>
            </div>

            <div class="column-box">
              <textarea
                class="edit-content"
                data-column="second"
                style="margin:0;min-height:130px"
              >${escapeHTML(second)}</textarea>
            </div>

          </div>

        </div>

      </div>
    `;
  }

  if(slide.layout === "timeline"){

    return `
      <div class="slide ${animation}" style="${themeStyle}">

        <div class="slide-content layout-timeline">

          <textarea class="edit-title" data-field="title">${title}</textarea>

          <textarea class="edit-subtitle" data-field="subtitle">${subtitle}</textarea>

          <div class="timeline">

            <div class="timeline-item">
              <strong>01</strong>
              <span>Beginning</span>
            </div>

            <div class="timeline-item">
              <strong>02</strong>
              <span>Growth</span>
            </div>

            <div class="timeline-item">
              <strong>03</strong>
              <span>Experience</span>
            </div>

            <div class="timeline-item">
              <strong>04</strong>
              <span>Future</span>
            </div>

          </div>

          <textarea class="edit-content" data-field="content">${content}</textarea>

        </div>

      </div>
    `;
  }

  if(slide.layout === "image_text"){

    const image =
      slide.image_url
        ? `
          <img
            class="slide-image"
            src="${escapeHTML(slide.image_url)}"
            alt="Presentation image"
            onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
          >
          <div
            class="slide-image"
            style="display:none;height:250px;background:rgba(255,255,255,.15);place-items:center;"
          >
            Image unavailable
          </div>
        `
        : `
          <div
            class="slide-image"
            style="height:250px;background:rgba(255,255,255,.15);display:grid;place-items:center;"
          >
            Add Image
          </div>
        `;

    return `
      <div class="slide ${animation}" style="${themeStyle}">

        <div class="slide-content image-layout">

          <div>
            <textarea class="edit-title" data-field="title">${title}</textarea>
            <textarea class="edit-subtitle" data-field="subtitle">${subtitle}</textarea>
            <textarea class="edit-content" data-field="content">${content}</textarea>
          </div>

          ${image}

        </div>

      </div>
    `;
  }

  if(slide.layout === "shape"){

    return `
      <div class="slide ${animation}" style="${themeStyle}">

        <div class="slide-content">

          <textarea class="edit-title" data-field="title">${title}</textarea>

          <textarea class="edit-subtitle" data-field="subtitle">${subtitle}</textarea>

          <div class="shape-box">◆</div>

          <textarea class="edit-content" data-field="content">${content}</textarea>

        </div>

      </div>
    `;
  }

  return `
    <div class="slide ${animation}" style="${themeStyle}">

      <div class="slide-content">

        <textarea
          class="edit-title"
          data-field="title"
          spellcheck="false"
        >${title}</textarea>

        <textarea
          class="edit-subtitle"
          data-field="subtitle"
          spellcheck="false"
        >${subtitle}</textarea>

        <textarea
          class="edit-content"
          data-field="content"
          spellcheck="false"
        >${content}</textarea>

        <div class="slide-footer">
          <span>CareerCraft</span>
          <span>${currentSlideIndex+1}</span>
        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   CANVAS RENDER
========================================================= */

function renderCanvas(){

  const area = document.getElementById("canvasArea");

  if(!slides.length){
    area.innerHTML = "";
    return;
  }

  const slide = slides[currentSlideIndex];

  area.innerHTML = `
    <div
      id="slideStage"
      class="slide-stage"
      style="transform:scale(${zoomLevel/100})"
    >
      ${buildEditableSlide(slide)}
    </div>
  `;

  attachCanvasEvents();
}

function attachCanvasEvents(){

  const area = document.getElementById("canvasArea");

  area.querySelectorAll("textarea").forEach(textarea=>{

    textarea.addEventListener("focus",()=>{
      activeTextArea = textarea;

      if(!editingSession){
        pushHistory();
        editingSession = true;
      }
    });

    textarea.addEventListener("input",()=>{

      const slide = slides[currentSlideIndex];

      if(!slide) return;

      const field = textarea.dataset.field;

      if(field){

        slide[field] = textarea.value;
      }

      if(textarea.dataset.column){

        const first =
          area.querySelector('[data-column="first"]')?.value || "";

        const second =
          area.querySelector('[data-column="second"]')?.value || "";

        slide.content =
          first.trim() +
          "\n\n---COLUMN---\n\n" +
          second.trim();
      }

      markUnsaved();

      renderThumbnails();

      updateSlideInfo();
    });

    textarea.addEventListener("blur",()=>{
      editingSession = false;
    });
  });
}


/* =========================================================
   SLIDE INFO
========================================================= */

function updateSlideInfo(){

  document.getElementById("slidePosition").textContent =
    `Slide ${currentSlideIndex + 1} of ${slides.length}`;

  document.getElementById("zoomValue").textContent =
    `${zoomLevel}%`;
}


/* =========================================================
   SELECT SLIDE
========================================================= */

function selectSlide(index){

  if(index < 0 || index >= slides.length){
    return;
  }

  currentSlideIndex = index;

  activeTextArea = null;
  editingSession = false;

  renderThumbnails();
  renderCanvas();
  updateSlideInfo();
  updateTransitionUI();

  setStatus(`Editing slide ${index+1}`);
}


/* =========================================================
   NEW SLIDE
========================================================= */

function addSlide(templateIndex=0){

  pushHistory();

  const newSlide = makeSlide(templateIndex);

  newSlide.slide_order = slides.length + 1;

  slides.splice(currentSlideIndex + 1,0,newSlide);

  currentSlideIndex++;

  normalizeSlideOrders();

  renderEverything();

  markUnsaved();

  showToast("New slide added");
}


/* =========================================================
   DUPLICATE
========================================================= */

function duplicateCurrentSlide(){

  const source = slides[currentSlideIndex];

  if(!source) return;

  pushHistory();

  const copy = clone(source);

  copy.id = null;
  copy.presentation_id = presentationId || null;
  copy.slide_order = currentSlideIndex + 2;

  slides.splice(currentSlideIndex + 1,0,copy);

  currentSlideIndex++;

  normalizeSlideOrders();

  renderEverything();

  markUnsaved();

  showToast("Slide duplicated");
}


/* =========================================================
   DELETE
========================================================= */

function deleteCurrentSlide(){

  deleteSlide(currentSlideIndex);
}

function deleteSlide(index){

  if(slides.length <= 1){
    showToast("You need at least one slide");
    return;
  }

  pushHistory();

  slides.splice(index,1);

  if(currentSlideIndex >= slides.length){
    currentSlideIndex = slides.length - 1;
  }

  if(index < currentSlideIndex){
    currentSlideIndex--;
  }

  normalizeSlideOrders();

  renderEverything();

  markUnsaved();

  showToast("Slide deleted");
}


/* =========================================================
   NORMALIZE ORDERS
========================================================= */

function normalizeSlideOrders(){

  slides.forEach((slide,index)=>{
    slide.slide_order = index + 1;
    slide.presentation_id = presentationId || slide.presentation_id || null;
  });
}


/* =========================================================
   TEMPLATE MODAL
========================================================= */

function openTemplateModal(){

  const grid = document.getElementById("templateGrid");

  grid.innerHTML = "";

  templates.forEach((template,index)=>{

    const card = document.createElement("div");

    card.className = "template-card";

    const theme = getTheme(template.theme);

    card.innerHTML = `
      <div
        class="template-preview"
        style="background:${theme.background};color:${theme.color}"
      >
        <strong style="font-size:18px">${escapeHTML(template.title)}</strong>
        <span style="font-size:10px;margin-top:5px;opacity:.75">
          ${escapeHTML(template.subtitle)}
        </span>
      </div>

      <div class="template-name">
        ${index+1}. ${escapeHTML(template.name)}
      </div>
    `;

    card.addEventListener("click",()=>{
      applyTemplate(index);
      closeTemplateModal();
    });

    grid.appendChild(card);
  });

  document.getElementById("templateModal")
    .classList.add("show");
}

function closeTemplateModal(){

  document.getElementById("templateModal")
    .classList.remove("show");
}

function applyTemplate(index){

  const template = templates[index];

  if(!template) return;

  pushHistory();

  const slide = slides[currentSlideIndex];

  slide.layout = template.layout;
  slide.title = template.title;
  slide.subtitle = template.subtitle;
  slide.content = template.content;
  slide.background = template.theme;

  slide.image_url = "";

  renderEverything();

  markUnsaved();

  showToast(`${template.name} applied`);
}

/* =========================================================
   LAYOUTS
========================================================= */

function chooseLayout(){

  const choices = [
    ["title","Title Slide"],
    ["content","Content"],
    ["cards","Three Cards"],
    ["stats","Statistics"],
    ["quote","Quote"],
    ["columns","Two Columns"],
    ["timeline","Timeline"],
    ["image_text","Image + Text"],
    ["shape","Shape"]
  ];

  const answer =
    prompt(
      "Choose a layout:\n\n" +
      choices.map((item,i)=>`${i+1}. ${item[1]}`).join("\n")
    );

  const number = Number(answer);

  if(!Number.isInteger(number) || !choices[number-1]){
    return;
  }

  pushHistory();

  slides[currentSlideIndex].layout =
    choices[number-1][0];

  renderEverything();

  markUnsaved();

  showToast("Layout changed");
}

   THEMES
========================================================= */

function applyTheme(theme){

  if(!themes[theme]){
    return;
  }

  pushHistory();

  slides[currentSlideIndex].background = theme;

  renderEverything();

  markUnsaved();

  showToast("Theme updated");
}


/* =========================================================

========================================================= */

function ensureTextArea(){

  if(activeTextArea){
    return activeTextArea;
  }

  const textarea =
    document.querySelector(".edit-content");

  if(textarea){
    activeTextArea = textarea;
    return textarea;
  }

  return null;
}

function applyTextStyle(property,value){

  const textarea = ensureTextArea();

  if(!textarea){
    return;
  }

  textarea.style[property] = value;
}

document.getElementById("fontFamily")

document.getElementById("fontSize")

  });

document.getElementById("boldBtn")

document.getElementById("italicBtn")
  .addEventListener("click",()=>{

document.getElementById("underlineBtn")

document.getElementById("centerAlignBtn")

document.getElementById("rightAlignBtn")

/* =========================================================
   TRANSITIONS
========================================================= */

function setTransition(transition){

  pushHistory();

  slides[currentSlideIndex].transition =
    transition;

  slides[currentSlideIndex].transition_duration =
    Number(
      document.getElementById("transitionDuration").value
    );

  renderThumbnails();
  updateTransitionUI();

  markUnsaved();

  showToast(`${transition} transition selected`);
}

function updateTransitionUI(){

  const slide = slides[currentSlideIndex];

  if(!slide){
    return;
  }

  document.getElementById("transitionDuration").value =
    String(slide.transition_duration ?? .5);
}

function applyTransitionToAll(){

  const transition =
    slides[currentSlideIndex]?.transition || "none";

  const duration =
    Number(
      document.getElementById("transitionDuration").value
    );

  pushHistory();

  slides.forEach(slide=>{
    slide.transition = transition;
    slide.transition_duration = duration;
  });

  renderThumbnails();

  markUnsaved();

  showToast("Transition applied to all slides");
}

function previewTransition(){

  const stage =
    document.getElementById("slideStage");

  if(!stage){
    return;
  }

  const slide = slides[currentSlideIndex];

  const transition =
    slide.transition || "fade";

  stage.style.transition = "none";

  if(transition === "fade"){
    stage.style.opacity = "0";
    requestAnimationFrame(()=>{
      stage.style.transition =
        `opacity ${slide.transition_duration}s ease`;
      stage.style.opacity = "1";
    });
  }

  else if(transition === "zoom"){
    stage.style.transform =
      `scale(${zoomLevel/100}) scale(.85)`;

    requestAnimationFrame(()=>{
      stage.style.transition =
        `transform ${slide.transition_duration}s ease`;
      stage.style.transform =
        `scale(${zoomLevel/100})`;
    });
  }

  else if(transition === "slide"){
    stage.style.transform =
      `translateX(80px) scale(${zoomLevel/100})`;

    requestAnimationFrame(()=>{
      stage.style.transition =
        `transform ${slide.transition_duration}s ease`;
      stage.style.transform =
        `translateX(0) scale(${zoomLevel/100})`;
    });
  }

  else{
    stage.animate(
      [
        {opacity:0},
        {opacity:1}
      ],
      {
        duration:
          slide.transition_duration * 1000,
        easing:"ease"
      }
    );
  }
}

/* =========================================================
   SAVE
========================================================= */

async function savePresentation(){

  if(!currentUser){

    showToast("Please log in first");

    return;
  }

  const saveButton =
    document.getElementById("saveBtn");

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  setStatus("Saving presentation...");

  try{

    normalizeSlideOrders();

    const title =
      document.getElementById("presentationTitle").value.trim()
      || "Untitled Presentation";


    /* CREATE PRESENTATION IF NEW */

    if(!presentationId){

      const {
        data:newPresentation,
        error:createError
      } = await supabaseClient
        .from("presentations")
        .insert({
          user_id:currentUser.id,
          title,
          description:presentation.description || "Created with CareerCraft"
        })
        .select("id")
        .single();

      if(createError){
        throw createError;
      }

      if(!newPresentation?.id ||
         !isValidUUID(newPresentation.id)){

        throw new Error(
          "Supabase returned an invalid presentation ID."
        );
      }

      presentationId = newPresentation.id;

      presentation.id = presentationId;

      slides.forEach(slide=>{
        slide.presentation_id = presentationId;
      });

      const newUrl =
        `${window.location.pathname}?id=${encodeURIComponent(presentationId)}`;

      window.history.replaceState({},document.title,newUrl);
    }


    /* UPDATE PRESENTATION */

    const {
      error:updatePresentationError
    } = await supabaseClient
      .from("presentations")
      .update({
        title
      })
      .eq("id",presentationId)
      .eq("user_id",currentUser.id);

    if(updatePresentationError){
      throw updatePresentationError;
    }


    /* SAVE SLIDES */

    const savedIds = [];

    for(const slide of slides){

      const payload = {
        presentation_id:presentationId,
        slide_order:slide.slide_order,
        layout:slide.layout,
        title:slide.title || "",
        subtitle:slide.subtitle || "",
        content:slide.content || "",
        image_url:slide.image_url || "",
        background:slide.background || "purple",
        transition:slide.transition || "none",
        transition_duration:
          Number(slide.transition_duration ?? .5)
      };


      if(isValidUUID(slide.id)){

        const {
          data:updatedSlide,
          error:updateError
        } = await supabaseClient
          .from("presentation_slides")
          .update(payload)
          .eq("id",slide.id)
          .eq("presentation_id",presentationId)
          .select("id")
          .maybeSingle();

        if(updateError){
          throw updateError;
        }

        if(updatedSlide?.id){

          slide.id = updatedSlide.id;

          savedIds.push(updatedSlide.id);

        }else{

          const {
            data:insertedSlide,
            error:insertError
          } = await supabaseClient
            .from("presentation_slides")
            .insert(payload)
            .select("id")
            .single();

          if(insertError){
            throw insertError;
          }

          slide.id = insertedSlide.id;

          savedIds.push(insertedSlide.id);
        }

      }else{

        const {
          data:insertedSlide,
          error:insertError
        } = await supabaseClient
          .from("presentation_slides")
          .insert(payload)
          .select("id")
          .single();

        if(insertError){
          throw insertError;
        }

        if(!insertedSlide?.id){
          throw new Error("Slide was saved without an ID.");
        }

        slide.id = insertedSlide.id;

        savedIds.push(insertedSlide.id);
      }


      /*
        Animation is optional.
        If the database has an animation column,
        CareerCraft will save it.
        If it doesn't, the main save remains successful.
      */

      if(slide.animation && slide.animation !== "none"){

        await supabaseClient
          .from("presentation_slides")
          .update({
            animation:slide.animation
          })
          .eq("id",slide.id)
          .eq("presentation_id",presentationId);
      }
    }


    /* REMOVE DELETED DATABASE SLIDES */

    const {
      data:existingRows,
      error:existingError
    } = await supabaseClient
      .from("presentation_slides")
      .select("id")
      .eq("presentation_id",presentationId);

    if(existingError){
      throw existingError;
    }

    const keepIds = new Set(savedIds);

    const staleIds =
      (existingRows || [])
        .map(row=>row.id)
        .filter(id=>!keepIds.has(id));


    if(staleIds.length){

      const {
        error:deleteError
      } = await supabaseClient
        .from("presentation_slides")
        .delete()
        .eq("presentation_id",presentationId)
        .in("id",staleIds);

      if(deleteError){
        throw deleteError;
      }
    }


    markSaved();

    showToast("Presentation saved successfully");

    setStatus("Saved successfully");

  }catch(error){

    console.error("SAVE ERROR:",error);

    document.getElementById("saveStatus").textContent =
      "Save failed";

    setStatus(
      error?.message ||
      "Unable to save presentation"
    );

    showToast(
      error?.message ||
      "Unable to save presentation"
    );

  }finally{

    saveButton.disabled = false;
    saveButton.textContent = "Save";
  }
}


/* =========================================================
   PRESENTATION MODE
========================================================= */

function openPresentation(startIndex=0){

  if(!slides.length){
    return;
  }

  presentationModeIndex =
    Math.max(
      0,
      Math.min(startIndex,slides.length-1)
    );

  document
    .getElementById("presentationMode")
    .classList.add("show");

  renderPresentationSlide();

  document.body.style.overflow = "hidden";
}

function closePresentation(){

  stopAutoPlay();

  document
    .getElementById("presentationMode")
    .classList.remove("show");

  document.body.style.overflow = "";
}

function renderPresentationSlide(){

  const slide =
    slides[presentationModeIndex];

  if(!slide){
    return;
  }

  const container =
    document.getElementById("presentSlide");

  container.innerHTML =
    buildSlideVisual(slide,false);

  document.getElementById("presentCounter")
    .textContent =
      `${presentationModeIndex+1} / ${slides.length}`;

  const transition =
    slide.transition || "none";

  const duration =
    Number(slide.transition_duration ?? .5);

  if(transition !== "none"){

    container.animate(
      [
        {opacity:0},
        {opacity:1}
      ],
      {
        duration:duration * 1000,
        easing:"ease"
      }
    );
  }
}

function nextPresentationSlide(){

  if(presentationModeIndex < slides.length-1){

    presentationModeIndex++;

    renderPresentationSlide();

  }else if(isAutoPlay){

    presentationModeIndex = 0;

    renderPresentationSlide();
  }
}

function previousPresentationSlide(){

  if(presentationModeIndex > 0){

    presentationModeIndex--;

    renderPresentationSlide();
  }
}

function startAutoPlay(){

  stopAutoPlay();

  isAutoPlay = true;

  autoPlayTimer = setInterval(
    nextPresentationSlide,
    4000
  );

  showToast("Auto play started");
}

function stopAutoPlay(){

  if(autoPlayTimer){

    clearInterval(autoPlayTimer);

    autoPlayTimer = null;
  }

  isAutoPlay = false;
}

function toggleAutoPlay(){

  if(isAutoPlay){

    stopAutoPlay();

    showToast("Auto play stopped");

  }else{

    startAutoPlay();
  }
}

async function enterFullscreen(){

  const element =
    document.getElementById("presentationMode");

  try{

    if(document.fullscreenElement){

      await document.exitFullscreen();

    }else{

      await element.requestFullscreen();
    }

  }catch(error){

    console.log(error);

    showToast("Fullscreen is not available");
  }
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",event=>{

  const presentationVisible =
    document
      .getElementById("presentationMode")
      .classList.contains("show");

  if(presentationVisible){

    if(event.key === "ArrowRight" ||
       event.key === " " ||
       event.key === "PageDown"){

      event.preventDefault();

      nextPresentationSlide();
    }

    if(event.key === "ArrowLeft" ||
       event.key === "PageUp"){

      event.preventDefault();

      previousPresentationSlide();
    }

    if(event.key === "Escape"){

      closePresentation();
    }

    return;
  }


  if(
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase() === "s"
  ){

    event.preventDefault();

    savePresentation();
  }


  if(
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase() === "z"
  ){

    event.preventDefault();

    undo();
  }


  if(
    (event.ctrlKey || event.metaKey) &&
    event.key.toLowerCase() === "y"
  ){

    event.preventDefault();

    redo();
  }


  if(
    event.key === "Delete" &&
    !["TEXTAREA","INPUT"].includes(
      document.activeElement?.tagName
    )
  ){

    deleteCurrentSlide();
  }
});


/* =========================================================
   ZOOM
========================================================= */

document.getElementById("zoomSlider")
  .addEventListener("input",event=>{

      Number(event.target.value);

    const stage =
      document.getElementById("slideStage");

    if(stage){

      stage.style.transform =
        `scale(${zoomLevel/100})`;
    }

    updateSlideInfo();
  });

          item.classList.toggle(

========================================================= */

  document.getElementById("undoBtn").disabled =
    historyStack.length === 0;

  document.getElementById("redoBtn").disabled =
    redoStack.length === 0;
}

========================================================= */
