<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerCraft Presentation Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#6d4aff;
  --primary2:#8b5cf6;
  --bg:#f4f2f8;
  --panel:#fff;
  --text:#211c2d;
  --muted:#81798e;
  --border:#e7e2ee;
  --danger:#e5484d;
  --shadow:0 15px 45px rgba(35,25,60,.12);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  min-height:100vh;
}

/* TOPBAR */

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:100;
}

.back-btn{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f1eef7;
  font-size:20px;
}

.logo{
  width:36px;
  height:36px;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.brand{
  font-weight:900;
  white-space:nowrap;
}

.title-input{
  width:230px;
  border:1px solid transparent;
  border-radius:8px;
  padding:9px;
  outline:none;
  font-weight:700;
}

.title-input:focus{
  border-color:#cfc4ff;
  background:#faf9ff;
}

.top-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.status{
  color:var(--muted);
  font-size:12px;
}

.btn{
  height:38px;
  padding:0 14px;
  border-radius:9px;
  background:#f1eef6;
  font-weight:800;
}

.btn:hover{
  background:#e7e2ed;
}

.btn.primary{
  background:var(--primary);
  color:#fff;
}

.btn.primary:hover{
  background:#5637dd;
}

.btn.danger{
  color:var(--danger);
}

/* LAYOUT */

.workspace{
  display:grid;
  grid-template-columns:310px 1fr;
  min-height:calc(100vh - 64px);
}

/* SIDEBAR */

.sidebar{
  background:#fff;
  border-right:1px solid var(--border);
  padding:16px;
  overflow-y:auto;
}

.side-section{
  margin-bottom:22px;
}

.side-title{
  font-size:12px;
  font-weight:900;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.side-title span{
  color:var(--muted);
  font-size:9px;
}

.new-btn{
  width:100%;
  height:42px;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  font-weight:900;
  margin-bottom:12px;
}

/* SEARCH */

.search{
  width:100%;
  height:39px;
  border:1px solid var(--border);
  border-radius:9px;
  padding:0 11px;
  outline:none;
  margin-bottom:10px;
}

.search:focus{
  border-color:var(--primary);
}

/* SAVED PROJECTS */

.projects{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.project{
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px;
  background:#fff;
  transition:.2s;
}

.project:hover{
  border-color:#c6b9ff;
  background:#faf9ff;
}

.project.active{
  border-color:var(--primary);
  background:#f7f4ff;
}

.project-name{
  font-size:12px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.project-date{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.project-actions{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.project-actions button{
  flex:1;
  height:29px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
  background:#efebf5;
}

.project-actions .open{
  background:var(--primary);
  color:#fff;
}

.project-actions .delete{
  color:var(--danger);
}

/* EDITOR */

.editor{
  display:flex;
  flex-direction:column;
  min-width:0;
}

/* TOOLBAR */

.toolbar{
  height:54px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 14px;
}

.tool{
  height:34px;
  padding:0 11px;
  border-radius:8px;
  background:#f3f0f7;
  font-size:11px;
  font-weight:800;
}

.tool.active{
  background:var(--primary);
  color:#fff;
}

.toolbar-spacer{
  flex:1;
}

/* CANVAS */

.canvas{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px;
  overflow:auto;
  background:
    radial-gradient(circle at 20% 20%,rgba(109,74,255,.08),transparent 28%),
    radial-gradient(circle at 80% 80%,rgba(139,92,246,.08),transparent 30%),
    #f5f3f9;
}

/* SLIDE */

.slide-wrapper{
  width:min(900px,90vw);
  aspect-ratio:16/9;
  box-shadow:0 25px 70px rgba(30,20,50,.18);
  background:#fff;
  border-radius:5px;
  overflow:hidden;
}

.slide{
  width:100%;
  height:100%;
  position:relative;
  padding:8%;
  background:#fff;
  overflow:hidden;
}

.slide.dark{
  background:#15111e;
  color:#fff;
}

.slide.blue{
  background:linear-gradient(135deg,#eef2ff,#fff);
}

.slide.gradient{
  background:linear-gradient(135deg,#6d4aff,#a855f7);
  color:#fff;
}

.slide-line{
  width:80px;
  height:6px;
  border-radius:20px;
  background:var(--primary);
  margin-bottom:25px;
}

.slide-title{
  font-size:clamp(25px,5vw,64px);
  font-weight:950;
  line-height:1.02;
  max-width:85%;
}

.slide-subtitle{
  margin-top:18px;
  font-size:clamp(12px,1.6vw,21px);
  color:#777080;
  max-width:75%;
  line-height:1.5;
}

.dark .slide-subtitle,
.gradient .slide-subtitle{
  color:rgba(255,255,255,.72);
}

.slide-number{
  position:absolute;
  right:5%;
  bottom:5%;
  font-size:11px;
  opacity:.5;
}

/* RIGHT PROPERTIES */

.properties{
  position:fixed;
  right:20px;
  bottom:20px;
  width:240px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  box-shadow:var(--shadow);
  z-index:20;
}

.properties h3{
  font-size:12px;
  margin-bottom:10px;
}

.field{
  margin-bottom:9px;
}

.field label{
  display:block;
  font-size:10px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:4px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px;
  outline:none;
  font-size:11px;
}

.field textarea{
  resize:vertical;
  min-height:65px;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--primary);
}

/* EMPTY */

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px 8px;
  font-size:11px;
}

.empty-icon{
  font-size:28px;
  margin-bottom:7px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#211c2d;
  color:#fff;
  padding:11px 17px;
  border-radius:9px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(20,15,30,.6);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:250;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,100%);
  background:#fff;
  border-radius:16px;
  overflow:hidden;
}

.modal-head{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
}

.modal-head strong{
  font-size:14px;
}

.close{
  margin-left:auto;
  width:32px;
  height:32px;
  border-radius:8px;
  background:#f1eef7;
}

.modal-body{
  padding:18px;
}

.template-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.template{
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  background:#fff;
  text-align:left;
}

.template:hover{
  border-color:var(--primary);
}

.template-preview{
  height:65px;
  border-radius:7px;
  margin-bottom:7px;
}

.template strong{
  font-size:11px;
}

.template small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
}

/* RESPONSIVE */

@media(max-width:1000px){

  .workspace{
    grid-template-columns:260px 1fr;
  }

  .properties{
    position:static;
    width:auto;
    margin:12px;
  }

}

@media(max-width:700px){

  .topbar{
    height:auto;
    min-height:64px;
    flex-wrap:wrap;
    padding:8px;
  }

  .brand{
    display:none;
  }

  .title-input{
    width:170px;
  }

  .top-right{
    width:100%;
    margin-left:0;
    justify-content:flex-end;
  }

  .workspace{
    display:block;
  }

  .sidebar{
    border-right:0;
    border-bottom:1px solid var(--border);
  }

  .projects{
    max-height:220px;
    overflow-y:auto;
  }

  .canvas{
    padding:20px 10px;
  }

  .slide-wrapper{
    width:95vw;
  }

  .properties{
    margin:10px;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <button class="back-btn" id="backBtn">←</button>

  <div class="logo">C</div>

  <div class="brand">
    CareerCraft Presentation Studio
  </div>

  <input
    id="presentationTitle"
    class="title-input"
    value="Untitled Presentation"
    placeholder="Presentation title"

  <div class="top-right">

    <span
      id="saveStatus"

    >
      New presentation
    </span>

    <button
      class="btn"
      id="newBtn"
    >
      New
    </button>

    <button
      class="btn primary"
      id="saveBtn"
    >
      Save
    </button>

  </div>

</header>


<div class="workspace">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <section class="side-section">

      <div class="side-title">
        Saved Projects
        <span id="projectCount">0</span>
      </div>

      <button
        class="new-btn"
        id="newPresentationBtn"
      >
        + Create New Presentation
      </button>

      <input
        id="projectSearch"
        class="search"
        placeholder="Search presentations..."
      >

      <div
        id="projects"
        class="projects"
      >

        <div class="empty">
          <div class="empty-icon">📂</div>
          Loading saved presentations...
        </div>

      </div>

    </section>


    <section class="side-section">

      <div class="side-title">
        Presentation Tools
      </div>

      <button
        class="tool"
        id="templateBtn"
        style="width:100%;margin-bottom:7px;"
      >
        🎨 Change Template
      </button>

      <button
        class="tool"
        id="duplicateCurrentBtn"
        style="width:100%;"
      >
        📑 Duplicate Current
      </button>

    </section>

  </aside>


  <!-- EDITOR -->

  <section class="editor">

    <div class="toolbar">

      <button
        class="tool active"
        id="editModeBtn"
      >
        Edit
      </button>

      <button
        class="tool"
        id="presentBtn"
      >
        ▶ Present
      </button>

      <button
        class="tool"
        id="fullscreenBtn"
      >
        ⛶ Fullscreen
      </button>

      <div class="toolbar-spacer"></div>

      <button
        class="tool"
        id="prevBtn"
      >
        ←
      </button>

      <span
        id="slideCounter"
        style="font-size:11px;color:#81798e;"
      >
        Slide 1 of 1
      </span>

      <button
        class="tool"
        id="nextBtn"
      >
        →
      </button>

    </div>


    <div class="canvas">

      <div class="slide-wrapper">

        <div
          class="slide"
          id="slide"
        >

          <div class="slide-line"></div>

          <div
            id="slideTitle"
            class="slide-title"
          >
            Your Presentation Title
          </div>

          <div
            id="slideSubtitle"
            class="slide-subtitle"
          >
            Add a short description to introduce your presentation.
          </div>

          <div
            id="slideNumber"
            class="slide-number"
          >
            1
          </div>

        </div>

      </div>

    </div>


    <div class="properties">

      <h3>Slide Content</h3>

      <div class="field">

        <label>Slide Title</label>

        <input
          id="titleEditor"
          value="Your Presentation Title"
        >

      </div>

      <div class="field">

        <label>Description</label>

        <textarea
          id="subtitleEditor"

      </div>

      <div class="field">

        <label>Slide Style</label>

        <select id="slideStyle">

          <option value="light">

          </option>

</div>

</div>


<!-- TEMPLATE MODAL -->

<div
  id="templateModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <strong>
        Choose Presentation Template
      </strong>

      <button
        class="close"
        id="closeModal"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="template-grid">

        <button
          class="template"
          data-template="light"
        >

          <div
            class="template-preview"
            style="background:#fff;border:1px solid #eee;"
          ></div>

          <strong>Professional</strong>
          <small>Clean white design</small>

        </button>


        <button
          class="template"
          data-template="dark"
        >

          <div
            class="template-preview"
            style="background:#15111e;"
          ></div>

          <strong>Midnight</strong>
          <small>Dark professional</small>

        </button>


        <button
          class="template"
          data-template="blue"
        >

          <div
            class="template-preview"
            style="background:linear-gradient(135deg,#eef2ff,#fff);"
          ></div>

          <strong>Corporate</strong>
          <small>Soft blue business</small>

        </button>


        <button
          class="template"
          data-template="gradient"
        >

          <div
            class="template-preview"
            style="background:linear-gradient(135deg,#6d4aff,#a855f7);"
          ></div>

          <strong>Creative</strong>
          <small>Bold purple gradient</small>

        </button>

      </div>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentPresentationId = null;

let presentations = [];

let currentSlide = 0;

let slides = [
  {
    title:"Your Presentation Title",
    subtitle:"Add a short description to introduce your presentation.",
    style:"light"
  }
];


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function isUUID(value){

  return typeof value === "string" &&
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
    .test(value);

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function toast(message){

  const element =
    $("toast");

  element.textContent =
    message;

  element.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer =
    setTimeout(()=>{
      element.classList.remove("show");
    },2500);

}


function status(message){

  $("saveStatus").textContent =
    message;

}


/* =========================================================
   LOAD PRESENTATIONS
========================================================= */

async function loadPresentations(){

  $("projects").innerHTML = `
    <div class="empty">
      <div class="empty-icon">⏳</div>
      Loading saved presentations...
    </div>
  `;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("presentations")
      .select(
        "id,user_id,title,description,created_at,updated_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "updated_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "PRESENTATION LIST ERROR:",
      error
    );

    $("projects").innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        Unable to load presentations.
      </div>
    `;

    return;
  }


  presentations =
    data || [];


  renderProjects(
    presentations
  );

}


/* =========================================================
   RENDER PROJECTS
========================================================= */

function renderProjects(list){

  $("projectCount").textContent =
    list.length;


  if(!list.length){

    $("projects").innerHTML = `
      <div class="empty">
        <div class="empty-icon">📂</div>
        No saved presentations yet.
      </div>
    `;

    return;
  }


  $("projects").innerHTML =
    list.map(item=>{

      const active =
        item.id === currentPresentationId
          ? "active"
          : "";


      const title =
        escapeHTML(
          item.title ||
          "Untitled Presentation"
        );


      const description =
        escapeHTML(
          item.description ||
          "No description"
        );


      const date =
        item.updated_at
          ? new Date(item.updated_at)
              .toLocaleDateString(
                undefined,
                {
                  day:"numeric",
                  month:"short",
                  year:"numeric"
                }
              )
          : "Recently";


      return `

        <div
          class="project ${active}"
          data-id="${item.id}"
        >

          <div class="project-name">
            ${title}
          </div>

          <div class="project-date">
            ${date}
          </div>

          <div
            style="
              font-size:9px;
              color:#81798e;
              margin-top:3px;
              overflow:hidden;
              white-space:nowrap;
              text-overflow:ellipsis;
            "
          >
            ${description}
          </div>

          <div class="project-actions">

            <button
              class="open"
              onclick="openPresentation('${item.id}')"
            >
              Open
            </button>

            <button
              onclick="duplicatePresentation('${item.id}')"
            >
              Copy
            </button>

            <button
              class="delete"
              onclick="deletePresentation('${item.id}')"
            >
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   URL PRESENTATION ID
========================================================= */

function getPresentationId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return (
    params.get("id") ||
    params.get("presentation_id") ||
    params.get("presentationId")
  );

}


/* =========================================================
   OPEN PRESENTATION
========================================================= */

async function openPresentation(id){

  if(!isUUID(id)){

    toast(
      "Invalid presentation ID"
    );

    return;
  }


  currentPresentationId =
    id;


  window.history.replaceState(
    {},
    document.title,
    `${window.location.pathname}?id=${encodeURIComponent(id)}`
  );


  await loadCurrentPresentation();

}


/* =========================================================
   LOAD CURRENT PRESENTATION
========================================================= */

async function loadCurrentPresentation(){

  if(!isUUID(currentPresentationId)){

    return;
  }


  status("Loading...");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("presentations")
      .select(
        "id,user_id,title,description,created_at,updated_at"
      )
      .eq(
        "id",
        currentPresentationId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if(error){

    console.error(error);

    toast(
      "Unable to load presentation"
    );

    status("Load failed");

    return;
  }


  if(!data){

    toast(
      "Presentation not found"
    );

    currentPresentationId =
      null;

    createNewPresentation();

    return;
  }


  $("presentationTitle").value =
    data.title ||
    "Untitled Presentation";


  /*
    The presentations table provided by you
    contains the presentation metadata.

    We keep the editor working even if the
    slide table uses a different schema.
  */

  slides = [
    {
      title:
        data.title ||
        "Your Presentation Title",

      subtitle:
        data.description ||
        "Add a short description to introduce your presentation.",

      style:"light"
    }
  ];


  currentSlide = 0;


  renderSlide();

  renderProjects(
    presentations
  );


  status("Saved");

  toast(
    "Presentation opened"
  );

}


/* =========================================================
   SAVE PRESENTATION
========================================================= */

async function savePresentation(){

  if(!currentUser){

    toast(
      "Please log in first"
    );

    return;
  }


  const saveButton =
    $("saveBtn");


  saveButton.disabled =
    true;

  saveButton.textContent =
    "Saving...";


  try{

    const title =
      $("presentationTitle")
        .value
        .trim() ||
      "Untitled Presentation";


    const current =
      slides[currentSlide] ||
      slides[0];


    const description =
      current.subtitle ||
      "";


    let savedId =
      currentPresentationId;


    if(isUUID(savedId)){

      const {
        data,
        error
      } =
        await supabaseClient
          .from("presentations")
          .update({
            title:title,
            description:description,
            updated_at:new Date().toISOString()
          })
          .eq(
            "id",
            savedId
          )
          .eq(
            "user_id",
            currentUser.id
          )
          .select(
            "id,user_id,title,description,created_at,updated_at"
          )
          .maybeSingle();


      if(error){
        throw error;
      }


      if(!data){

        savedId =
          null;

      }

    }


    if(!isUUID(savedId)){

      const {
        data,
        error
      } =
        await supabaseClient
          .from("presentations")
          .insert({
            user_id:
              currentUser.id,

            title:title,

            description:
              description
          })
          .select(
            "id,user_id,title,description,created_at,updated_at"
          )
          .single();


      if(error){
        throw error;
      }


      if(!data?.id){

        throw new Error(
          "Presentation was saved but no ID was returned."
        );

      }


      savedId =
        data.id;

    }


    currentPresentationId =
      savedId;


    window.history.replaceState(
      {},
      document.title,
      `${window.location.pathname}?id=${encodeURIComponent(savedId)}`
    );


    status("Saved");


    await loadPresentations();


    toast(
      "Presentation saved successfully"
    );


  }catch(error){

    console.error(
      "SAVE PRESENTATION ERROR:",
      error
    );


    status("Save failed");


    toast(
      error?.message ||
      "Unable to save presentation"
    );

  }finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Save";

  }

}


/* =========================================================
   NEW PRESENTATION
========================================================= */

function createNewPresentation(){

  currentPresentationId =
    null;


  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );


  $("presentationTitle").value =
    "Untitled Presentation";


  slides = [
    {
      title:
        "Your Presentation Title",

      subtitle:
        "Add a short description to introduce your presentation.",

      style:"light"
    }
  ];


  currentSlide =
    0;


  renderSlide();


  status(
    "New presentation"
  );


  renderProjects(
    presentations
  );

}


/* =========================================================
   DELETE
========================================================= */

async function deletePresentation(id){

  if(!isUUID(id)){

    toast(
      "Invalid presentation ID"
    );

    return;
  }


  const project =
    presentations.find(
      item=>item.id === id
    );


  const confirmed =
    confirm(
      `Delete "${project?.title || "this presentation"}"?`
    );


  if(!confirmed){
    return;
  }


  try{

    const {
      error
    } =
      await supabaseClient
        .from("presentations")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(error){
      throw error;
    }


    if(
      currentPresentationId === id
    ){

      createNewPresentation();

    }


    await loadPresentations();


    toast(
      "Presentation deleted"
    );


  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Unable to delete presentation"
    );

  }

}


/* =========================================================
   DUPLICATE
========================================================= */

async function duplicatePresentation(id){

  const project =
    presentations.find(
      item=>item.id === id
    );


  if(!project){
    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("presentations")
        .insert({
          user_id:
            currentUser.id,

          title:
            `${project.title || "Untitled Presentation"} Copy`,

          description:
            project.description || ""
        })
        .select(
          "id"
        )
        .single();


    if(error){
      throw error;
    }


    if(data?.id){

      currentPresentationId =
        data.id;


      window.history.replaceState(
        {},
        document.title,
        `${window.location.pathname}?id=${encodeURIComponent(data.id)}`
      );

    }


    await loadPresentations();


    toast(
      "Presentation duplicated"
    );


    await loadCurrentPresentation();


  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Unable to duplicate presentation"
    );

  }

}


/* =========================================================
   DUPLICATE CURRENT
========================================================= */

$("duplicateCurrentBtn")
  .addEventListener(
    "click",
    async ()=>{

      if(!isUUID(currentPresentationId)){

        toast(
          "Save this presentation first."
        );

        return;
      }


      await duplicatePresentation(
        currentPresentationId
      );

    }
  );


/* =========================================================
   SEARCH
========================================================= */

$("projectSearch")
  .addEventListener(
    "input",
    event=>{

      const term =
        event.target.value
          .trim()
          .toLowerCase();


      if(!term){

        renderProjects(
          presentations
        );

        return;
      }


      const filtered =
        presentations.filter(item=>{

          return (
            String(
              item.title || ""
            )
            .toLowerCase()
            .includes(term)
            ||
            String(
              item.description || ""
            )
            .toLowerCase()
            .includes(term)
          );

        });


      renderProjects(
        filtered
      );

    }
  );


/* =========================================================
   SLIDE RENDER
========================================================= */

function renderSlide(){

  const current =
    slides[currentSlide] ||
    slides[0];


  $("slideTitle").textContent =
    current.title ||
    "Untitled Slide";


  $("slideSubtitle").textContent =
    current.subtitle ||
    "";


  $("slideNumber").textContent =
    currentSlide + 1;


  $("titleEditor").value =
    current.title || "";


  $("subtitleEditor").value =
    current.subtitle || "";


  $("slideStyle").value =
    current.style || "light";


  const slide =
    $("slide");


  slide.classList.remove(
    "dark",
    "blue",
    "gradient"
  );


  if(current.style !== "light"){

    slide.classList.add(
      current.style
    );

  }


  $("slideCounter").textContent =
    `Slide ${currentSlide + 1} of ${slides.length}`;

}


/* =========================================================
   SLIDE EDITING
========================================================= */

$("titleEditor")
  .addEventListener(
    "input",
    event=>{

      slides[currentSlide].title =
        event.target.value;

      renderSlide();

      status(
        "Unsaved changes"
      );

    }
  );


$("subtitleEditor")
  .addEventListener(
    "input",
    event=>{

      slides[currentSlide].subtitle =
        event.target.value;

      renderSlide();

      status(
        "Unsaved changes"
      );

    }
  );


$("slideStyle")
  .addEventListener(
    "change",
    event=>{

      slides[currentSlide].style =
        event.target.value;

      renderSlide();

      status(
        "Unsaved changes"
      );

    }
  );


/* =========================================================
   ADD SLIDE
========================================================= */

$("addSlideBtn")
  .addEventListener(
    "click",
    ()=>{

      slides.push({

        title:
          `Slide ${slides.length + 1}`,

        subtitle:
          "Add your content here.",

        style:"light"

      });


      currentSlide =
        slides.length - 1;


      renderSlide();


      status(
        "Unsaved changes"
      );

    }
  );


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

$("nextBtn")
  .addEventListener(
    "click",
    ()=>{

      if(
        currentSlide <
        slides.length - 1
      ){

        currentSlide++;

        renderSlide();

      }

    }
  );


$("prevBtn")
  .addEventListener(
    "click",
    ()=>{

      if(currentSlide > 0){

        currentSlide--;

        renderSlide();

      }

    }
  );


/* =========================================================
   NEW BUTTONS
========================================================= */

$("newBtn")
  .addEventListener(
    "click",
    createNewPresentation
  );


$("newPresentationBtn")
  .addEventListener(
    "click",
    createNewPresentation
  );


/* =========================================================
   SAVE
========================================================= */

$("saveBtn")
  .addEventListener(
    "click",
    savePresentation
  );


$("presentationTitle")
  .addEventListener(
    "input",
    ()=>{
      status(
        "Unsaved changes"
      );
    }
  );


/* =========================================================
   TEMPLATE
========================================================= */

$("templateBtn")
  .addEventListener(
    "click",
    ()=>{
      $("templateModal")
        .classList.add("show");
    }
  );


$("closeModal")
  .addEventListener(
    "click",
    ()=>{
      $("templateModal")
        .classList.remove("show");
    }
  );


$("templateModal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        $("templateModal")
      ){

        $("templateModal")
          .classList.remove("show");

      }

    }
  );


document
  .querySelectorAll("[data-template]")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        slides[currentSlide].style =
          button.dataset.template;

        renderSlide();

        status(
          "Unsaved changes"
        );

        $("templateModal")
          .classList.remove("show");

      }
    );

  });


/* =========================================================
   PRESENT MODE
========================================================= */

$("presentBtn")
  .addEventListener(
    "click",
    ()=>{

      const slide =
        $("slide");

      if(
        slide.requestFullscreen
      ){

        slide.requestFullscreen();

      }

    }
  );


$("fullscreenBtn")
  .addEventListener(
    "click",
    ()=>{

      const canvas =
        document.querySelector(
          ".canvas"
        );

      if(
        !document.fullscreenElement
      ){

        canvas.requestFullscreen?.();

      }else{

        document.exitFullscreen?.();

      }

    }
  );


/* =========================================================
   BACK
========================================================= */

$("backBtn")
  .addEventListener(
    "click",
    ()=>{

      if(
        history.length > 1
      ){

        history.back();

      }else{

        window.location.href =
          "index.html";

      }

    }
  );


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      savePresentation();

    }


    if(event.key === "ArrowRight"){

      if(
        currentSlide <
        slides.length - 1
      ){

        currentSlide++;

        renderSlide();

      }

    }


    if(event.key === "ArrowLeft"){

      if(currentSlide > 0){

        currentSlide--;

        renderSlide();

      }

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

  try{

    const {
      data:{session}
    } =
      await supabaseClient
        .auth
        .getSession();


    if(!session?.user){

      window.location.href =
        "login.html";

      return;
    }


    currentUser =
      session.user;


    /*
      FIRST: load all saved projects.
      This is the important part that was missing.
    */

    await loadPresentations();


    /*
      SECOND: check whether the URL contains
      a presentation ID.
    */

    const urlId =
      getPresentationId();


    if(urlId){

      if(!isUUID(urlId)){

        toast(
          "Invalid presentation ID"
        );

        createNewPresentation();

        return;
      }


      currentPresentationId =
        urlId;


      await loadCurrentPresentation();

      return;
    }


    /*
      No ID = new presentation.
    */

    createNewPresentation();

  }catch(error){

    console.error(
      "PRESENTATION INITIALIZATION ERROR:",
      error
    );

    toast(
      "Unable to start Presentation Studio"
    );

  }

}


/* =========================================================
   START
========================================================= */

initialize();

</script>
