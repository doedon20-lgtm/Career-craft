<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Card Studio | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}
header{
  background:white;
  padding:15px 5%;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{font-size:21px;font-weight:800;color:#2563eb}
.back{
  background:#eef2f7;
  color:#172033
}
main{
  max-width:1050px;
  margin:auto;
  padding:30px 5%
}
h1{font-size:28px;margin-bottom:7px}
.sub{color:#667085;margin-bottom:25px}

.layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px
}
.panel{
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 5px 20px #0000000d
}
h2{font-size:18px;margin-bottom:18px}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:13px 0 6px
}
input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #d8dee9;
  border-radius:9px;
  font-size:14px;
  outline:none
}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{
  border-color:#2563eb
}

.colors{
  display:flex;
  gap:10px;
  margin-top:8px
}
.colors button{
  width:35px;
  height:35px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #ddd;
  padding:0
}

.save{
  width:100%;
  margin-top:20px;
  background:#2563eb;
  color:white;
  padding:14px
}
.status{
  text-align:center;
  margin-top:12px;
  font-size:14px
}

.preview{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:320px
}
.business-card{
  width:100%;
  max-width:450px;
  aspect-ratio:1.65;
  border-radius:18px;
  padding:30px;
  color:white;
  background:#2563eb;
  box-shadow:0 15px 35px #0003;
  display:flex;
  flex-direction:column;
  justify-content:center
}
.business-card .name{
  font-size:27px;
  font-weight:800
}
.business-card .role{
  margin-top:7px;
  font-size:15px;
  opacity:.9
}
.business-card .company{
  margin-top:3px;
  font-weight:700
}
.details{
  margin-top:22px;
  font-size:12px;
  line-height:1.8;
  opacity:.9
}

@media(max-width:750px){
  .layout{grid-template-columns:1fr}
  main{padding:25px 4%}
  .preview{min-height:250px}
}
</style>
</head>

<body>

<header>
  <div class="logo">CareerCraft</div>
  <button class="back" onclick="goBack()">← My Cards</button>
</header>

<main>

<h1 id="heading">Create Business Card</h1>
<p class="sub">Build your professional digital business card.</p>

<div class="layout">

<div class="panel">

<h2>Your Information</h2>

<label>Card Title</label>
<input id="title" placeholder="e.g. My Professional Card">

<label>Full Name</label>
<input id="name" placeholder="Your name">

<label>Job Title / Role</label>
<input id="role" placeholder="e.g. Graphic Designer">

<label>Company</label>
<input id="company" placeholder="Company name">

<label>Tagline</label>
<input id="tagline" placeholder="Your professional tagline">

<label>Phone</label>
<input id="phone" placeholder="+234...">

<label>Email</label>
<input id="email" type="email" placeholder="you@example.com">

<label>Website</label>
<input id="website" placeholder="https://example.com">

<label>Location</label>
<input id="location" placeholder="Abuja, Nigeria">

<label>LinkedIn</label>
<input id="linkedin" placeholder="LinkedIn profile">

<label>Social Media</label>
<input id="social" placeholder="@username">

<label>Card Color</label>

<div class="colors">
<button style="background:#2563eb" onclick="setColor('#2563eb')"></button>
<button style="background:#111827" onclick="setColor('#111827')"></button>
<button style="background:#7c3aed" onclick="setColor('#7c3aed')"></button>
<button style="background:#059669" onclick="setColor('#059669')"></button>
<button style="background:#dc2626" onclick="setColor('#dc2626')"></button>
</div>

<button class="save" id="saveBtn" onclick="saveCard()">Save Business Card</button>

<div class="status" id="status"></div>

</div>

<div class="panel">

<h2>Live Preview</h2>

<div class="preview">

<div class="business-card" id="preview">

<div class="name" id="pName">Your Name</div>
<div class="role" id="pRole">Professional Role</div>
<div class="company" id="pCompany">Your Company</div>

<div class="details">
<div id="pPhone">📞 Phone</div>
<div id="pEmail">✉ Email</div>
<div id="pWebsite">🌐 Website</div>
<div id="pLocation">📍 Location</div>
</div>

</div>

</div>

</div>

</div>

</main>

<script>
const {createClient}=supabase;

const db=createClient(
"https://upcxmlbgmqhaqieldmyk.supabase.co",
"sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj"
);

let user=null;
let cardId=null;
let color="#2563eb";

const fields=[
"title","name","role","company","tagline",
"phone","email","website","location","linkedin","social"
];

const params=new URLSearchParams(location.search);
cardId=params.get("id");

async function start(){

 const result=await db.auth.getUser();
 user=result.data.user;

 if(!user){
   location.href="login.html";
   return;
 }

 if(cardId){

   const {data,error}=await db
   .from("business_cards")
   .select("*")
   .eq("id",cardId)
   .eq("user_id",user.id)
   .maybeSingle();

   if(error||!data){
     alert("Business card not found.");
     location.href="business-cards.html";
     return;
   }

   fields.forEach(x=>{
     const el=document.getElementById(x);
     if(el) el.value=data[x]||"";
   });

   color=data.color||"#2563eb";
   document.getElementById("preview").style.background=color;
   document.getElementById("heading").textContent="Edit Business Card";
   document.getElementById("saveBtn").textContent="Update Business Card";

   updatePreview();
 }
}

fields.forEach(id=>{
 const el=document.getElementById(id);
 if(el) el.addEventListener("input",updatePreview);
});

function setColor(c){
 color=c;
 document.getElementById("preview").style.background=c;
}

function updatePreview(){

 document.getElementById("pName").textContent=
 document.getElementById("name").value||"Your Name";

 document.getElementById("pRole").textContent=
 document.getElementById("role").value||"Professional Role";

 document.getElementById("pCompany").textContent=
 document.getElementById("company").value||"Your Company";

 document.getElementById("pPhone").textContent=
 "📞 "+(document.getElementById("phone").value||"Phone");

 document.getElementById("pEmail").textContent=
 "✉ "+(document.getElementById("email").value||"Email");

 document.getElementById("pWebsite").textContent=
 "🌐 "+(document.getElementById("website").value||"Website");

 document.getElementById("pLocation").textContent=
 "📍 "+(document.getElementById("location").value||"Location");
}

async function saveCard(){

 if(!user){
   alert("Please log in first.");
   return;
 }

 const name=document.getElementById("name").value.trim();

 if(!name){
   alert("Please enter your full name.");
   return;
 }

 const payload={
   user_id:user.id,
   title:document.getElementById("title").value.trim(),
   name:name,
   role:document.getElementById("role").value.trim(),
   company:document.getElementById("company").value.trim(),
   tagline:document.getElementById("tagline").value.trim(),
   phone:document.getElementById("phone").value.trim(),
   email:document.getElementById("email").value.trim(),
   website:document.getElementById("website").value.trim(),
   location:document.getElementById("location").value.trim(),
   linkedin:document.getElementById("linkedin").value.trim(),
   social:document.getElementById("social").value.trim(),
   color:color
 };

 const btn=document.getElementById("saveBtn");
 const status=document.getElementById("status");

 btn.disabled=true;
 btn.textContent="Saving...";

 let result;

 if(cardId){

   result=await db
   .from("business_cards")
   .update(payload)
   .eq("id",cardId)
   .eq("user_id",user.id)
   .select()
   .maybeSingle();

 }else{

   result=await db
   .from("business_cards")
   .insert(payload)
   .select()
   .single();
 }

 if(result.error){

   console.error(result.error);
   status.textContent="Could not save: "+result.error.message;
   status.style.color="#dc2626";

   btn.disabled=false;
   btn.textContent=cardId?
   "Update Business Card":
   "Save Business Card";

   return;
 }

 status.textContent="Business card saved successfully!";
 status.style.color="#059669";

 setTimeout(()=>{
   location.href="business-cards.html";
 },800);
}

function goBack(){
 location.href="business-cards.html";
}

start();
</script>

</body>
 </html>
