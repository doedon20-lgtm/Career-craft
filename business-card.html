<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Card Studio | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033;
 transition:.25s
}

body.dark{
 background:#10141c;
 color:#f5f7fb
}

header{
 background:white;
 border-bottom:1px solid #e5e7eb;
 padding:15px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center
}

body.dark header{
 background:#171c26;
 border-color:#2b3442
}

.logo{
 font-size:22px;
 font-weight:800;
 color:#2563eb
}

button{
 border:0;
 border-radius:10px;
 padding:11px 16px;
 font-weight:bold;
 cursor:pointer
}

.back{
 background:#eef2f7;
 color:#172033
}

body.dark .back{
 background:#273142;
 color:white
}

main{
 max-width:1100px;
 margin:auto;
 padding:30px 5%
}

h1{
 margin:0 0 7px;
 font-size:28px
}

.sub{
 color:#667085;
 margin-bottom:25px
}

body.dark .sub{
 color:#aab4c3
}

.layout{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:25px
}

.panel{
 background:white;
 padding:22px;
 border-radius:17px;
 box-shadow:0 6px 25px #0000000d
}

body.dark .panel{
 background:#171c26;
 box-shadow:none
}

h2{
 font-size:18px;
 margin:0 0 18px
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin:13px 0 6px
}

input{
 width:100%;
 padding:12px;
 border:1px solid #d8dee9;
 border-radius:9px;
 font-size:14px;
 outline:none;
 background:white;
 color:#172033
}

body.dark input{
 background:#202733;
 color:white;
 border-color:#394555
}

input:focus{
 border-color:#2563eb
}

.mode{
 display:flex;
 gap:8px;
 margin-bottom:15px
}

.mode button{
 flex:1;
 background:#eef2f7;
 color:#172033
}

.mode button.active{
 background:#2563eb;
 color:white
}

body.dark .mode button{
 background:#273142;
 color:white
}

.colors{
 display:flex;
 gap:10px;
 margin-top:8px
}

.colors button{
 width:34px;
 height:34px;
 padding:0;
 border-radius:50%;
 border:3px solid white;
 box-shadow:0 0 0 1px #bbb
}

.save{
 width:100%;
 background:#2563eb;
 color:white;
 margin-top:20px;
 padding:14px
}

.status{
 text-align:center;
 margin-top:12px;
 font-size:14px
}

.preview{
 min-height:330px;
 display:flex;
 align-items:center;
 justify-content:center
}

.business-card{
 width:100%;
 max-width:450px;
 aspect-ratio:1.65;
 border-radius:18px;
 padding:30px;
 color:white;
 background:#2563eb;
 box-shadow:0 15px 35px #0003;
 display:flex;
 flex-direction:column;
 justify-content:center;
 overflow:hidden
}

.business-card.light{
 background:#ffffff;
 color:#172033;
 border:1px solid #ddd;
 box-shadow:0 15px 35px #0002
}

.business-card.dark{
 background:#111827;
 color:white
}

.name{
 font-size:27px;
 font-weight:800
}

.role{
 margin-top:7px;
 font-size:15px;
 opacity:.85
}

.company{
 margin-top:4px;
 font-weight:bold
}

.tagline{
 margin-top:10px;
 font-size:12px;
 opacity:.8
}

.details{
 margin-top:20px;
 font-size:12px;
 line-height:1.8;
 opacity:.9
}

.actions{
 display:flex;
 gap:10px;
 margin-top:18px
}

.action{
 flex:1;
 background:#eef2f7;
 color:#172033
}

body.dark .action{
 background:#273142;
 color:white
}

@media(max-width:750px){
 .layout{grid-template-columns:1fr}
 main{padding:25px 4%}
 .preview{min-height:250px}
 .actions{flex-direction:column}
}
</style>
</head>

<body>

<header>
 <div class="logo">CareerCraft</div>
 <button class="back" onclick="back()">← My Cards</button>
</header>

<main>

<h1 id="heading">Create Business Card</h1>
<p class="sub">Create your professional card and save it to your phone.</p>

<div class="layout">

<div class="panel">

<h2>Card Information</h2>

<label>Card Title</label>
<input id="title" placeholder="e.g. My Business Card">

<label>Full Name</label>
<input id="name" placeholder="Enter your full name">

<label>Job Title / Role</label>
<input id="role" placeholder="Enter your job title">

<label>Company</label>
<input id="company" placeholder="Enter your company">

<label>Tagline</label>
<input id="tagline" placeholder="Optional tagline">

<label>Phone</label>
<input id="phone" placeholder="Enter your phone number">

<label>Email</label>
<input id="email" placeholder="Enter your email">

<label>Website</label>
<input id="website" placeholder="Enter your website">

<label>Location</label>
<input id="location" placeholder="Enter your location">

<label>LinkedIn</label>
<input id="linkedin" placeholder="Enter your LinkedIn">

<label>Social Media</label>
<input id="social" placeholder="Enter your social media">

<label>Card Style</label>

<div class="mode">
 <button id="lightBtn" onclick="setMode('light')">☀️ Light</button>
 <button id="darkBtn" onclick="setMode('dark')">🌙 Dark</button>
</div>

<label>Card Color</label>

<div class="colors">
 <button style="background:#2563eb" onclick="setColor('#2563eb')"></button>
 <button style="background:#111827" onclick="setColor('#111827')"></button>
 <button style="background:#7c3aed" onclick="setColor('#7c3aed')"></button>
 <button style="background:#059669" onclick="setColor('#059669')"></button>
 <button style="background:#dc2626" onclick="setColor('#dc2626')"></button>
</div>

<button class="save" id="saveBtn" onclick="saveCard()">
 Save Business Card
</button>

<div class="status" id="status"></div>

</div>

<div>

<div class="panel">

<h2>Live Preview</h2>

<div class="preview">

<div id="card" class="business-card">

<div class="name" id="pName">Your Name</div>

<div class="role" id="pRole">
Professional Role
</div>

<div class="company" id="pCompany">
Your Company
</div>

<div class="tagline" id="pTagline"></div>

<div class="details">
<div id="pPhone">📞 Phone</div>
<div id="pEmail">✉ Email</div>
<div id="pWebsite">🌐 Website</div>
<div id="pLocation">📍 Location</div>
</div>

</div>

</div>

</div>

<div class="panel" style="margin-top:20px">

<h2>Actions</h2>

<div class="actions">

<button class="action" onclick="saveToPhone()">
📱 Save to Phone
</button>

<button class="action" onclick="shareCard()">
🔗 Share
</button>

<button class="action" onclick="printCard()">
🖨️ Print
</button>

</div>

</div>

</div>

</div>

</main>

<script>

const db=supabase.createClient(
 "https://upcxmlbgmqhaqieldmyk.supabase.co",
 "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj"
);

let user=null;
let cardId=null;
let color="#2563eb";
let mode="light";

const fields=[
 "title","name","role","company","tagline",
 "phone","email","website","location",
 "linkedin","social"
];

const params=new URLSearchParams(location.search);
cardId=params.get("id");

async function start(){

 const {data,error}=await db.auth.getUser();

 if(error||!data.user){
  location.href="login.html";
  return;
 }

 user=data.user;

 if(cardId){

  const result=await db
   .from("business_cards")
   .select("*")
   .eq("id",cardId)
   .eq("user_id",user.id)
   .maybeSingle();

  if(result.error||!result.data){
   alert("Business card not found.");
   location.href="business-cards.html";
   return;
  }

  const card=result.data;

  fields.forEach(id=>{
   document.getElementById(id).value=card[id]||"";
  });

  color=card.color||"#2563eb";
  mode=card.theme||"light";

  document.getElementById("heading").textContent=
   "Edit Business Card";

  document.getElementById("saveBtn").textContent=
   "Update Business Card";

  setMode(mode);
  updatePreview();

 }else{

  setMode("light");
  updatePreview();

 }
}

fields.forEach(id=>{
 document.getElementById(id).addEventListener(
  "input",
  updatePreview
 );
});

function setMode(value){

 mode=value;

 const card=document.getElementById("card");

 card.classList.remove("light","dark");
 card.classList.add(value);

 document.getElementById("lightBtn")
  .classList.toggle("active",value==="light");

 document.getElementById("darkBtn")
  .classList.toggle("active",value==="dark");

 document.body.classList.toggle(
  "dark",
  value==="dark"
 );

 if(value==="dark"){
  card.style.background="#111827";
 }else{
  card.style.background="#ffffff";
 }

 updatePreview();
}

function setColor(value){

 color=value;

 if(mode==="dark"){
  document.getElementById("card").style.background="#111827";
 }else{
  document.getElementById("card").style.background="#ffffff";
 }
}

function updatePreview(){

 document.getElementById("pName").textContent=
  document.getElementById("name").value||"Your Name";

 document.getElementById("pRole").textContent=
  document.getElementById("role").value||"Professional Role";

 document.getElementById("pCompany").textContent=
  document.getElementById("company").value||"Your Company";

 document.getElementById("pTagline").textContent=
  document.getElementById("tagline").value||"";

 document.getElementById("pPhone").textContent=
  "📞 "+(document.getElementById("phone").value||"Phone");

 document.getElementById("pEmail").textContent=
  "✉ "+(document.getElementById("email").value||"Email");

 document.getElementById("pWebsite").textContent=
  "🌐 "+(document.getElementById("website").value||"Website");

 document.getElementById("pLocation").textContent=
  "📍 "+(document.getElementById("location").value||"Location");
}

async function saveCard(){

 if(!user){
  alert("Please log in first.");
  return;
 }

 const name=document.getElementById("name").value.trim();

 if(!name){
  alert("Please enter your full name.");
  return;
 }

 const payload={
  user_id:user.id,
  title:document.getElementById("title").value.trim(),
  name:name,
  role:document.getElementById("role").value.trim(),
  company:document.getElementById("company").value.trim(),
  tagline:document.getElementById("tagline").value.trim(),
  phone:document.getElementById("phone").value.trim(),
  email:document.getElementById("email").value.trim(),
  website:document.getElementById("website").value.trim(),
  location:document.getElementById("location").value.trim(),
  linkedin:document.getElementById("linkedin").value.trim(),
  social:document.getElementById("social").value.trim(),
  color:color,
  theme:mode
 };

 const btn=document.getElementById("saveBtn");

 btn.disabled=true;
 btn.textContent="Saving...";

 let result;

 if(cardId){

  result=await db
   .from("business_cards")
   .update(payload)
   .eq("id",cardId)
   .eq("user_id",user.id)
   .select()
   .maybeSingle();

 }else{

  result=await db
   .from("business_cards")
   .insert(payload)
   .select()
   .single();
 }

 if(result.error){

  console.error(result.error);

  document.getElementById("status").textContent=
   "Save failed: "+result.error.message;

  document.getElementById("status").style.color="#dc2626";

  btn.disabled=false;
  btn.textContent=cardId?
   "Update Business Card":
   "Save Business Card";

  return;
 }

 document.getElementById("status").textContent=
  "Business card saved successfully.";

 document.getElementById("status").style.color="#059669";

 if(!cardId && result.data){
  cardId=result.data.id;
 }

 btn.disabled=false;
 btn.textContent="Saved ✓";

 setTimeout(()=>{
  location.href="business-cards.html";
 },800);
}

async function saveToPhone(){

 const card=document.getElementById("card");

 try{

  const canvas=await html2canvas(card,{
   scale:3,
   backgroundColor:null,
   useCORS:true
  });

  const link=document.createElement("a");

  link.download="CareerCraft-Business-Card.png";
  link.href=canvas.toDataURL("image/png");

  document.body.appendChild(link);
  link.click();
  link.remove();

 }catch(error){

  console.error(error);
  alert("Unable to save the card as an image.");

 }
}

async function shareCard(){

 if(!navigator.share){
  alert("Sharing is not supported on this device. Use Save to Phone instead.");
  return;
 }

 try{

  await navigator.share({
   title:"My CareerCraft Business Card",
   text:"My professional business card"
  });

 }catch(error){}
}

function printCard(){

 const card=document.getElementById("card");

 const win=window.open("","_blank");

 win.document.write(`
 <html>
 <head>
 <title>CareerCraft Business Card</title>
 <style>
 body{
  margin:0;
  padding:40px;
  display:flex;
  justify-content:center;
 }
 </style>
 </head>
 <body>
 ${card.outerHTML}
 </body>
 </html>
 `);

 win.document.close();
 win.focus();
 win.print();
}

function back(){
 location.href="business-cards.html";
}

start();

</script>

</body>
  </html>
