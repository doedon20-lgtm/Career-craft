<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Graphics | CareerCraft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --primary:#4f46e5;
    --primary2:#7c3aed;
    --danger:#ef4444;
    --success:#10b981;
    --shadow:0 12px 35px rgba(15,23,42,.07);
}

body.dark{
    --bg:#080d19;
    --card:#111827;
    --text:#f9fafb;
    --muted:#9ca3af;
    --border:#263244;
    --shadow:0 12px 35px rgba(0,0,0,.25);
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.25s;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:72px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    display:grid;
    place-items:center;
    color:#fff;
    font-weight:900;
}

.brand h1{
    font-size:19px;
}

.brand span{
    color:var(--muted);
    font-size:12px;
}

.nav-actions{
    display:flex;
    gap:10px;
    align-items:center;
}

.icon-btn{
    width:42px;
    height:42px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:18px;
}

.primary-btn{
    border:0;
    color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    padding:12px 18px;
    border-radius:12px;
    font-weight:800;
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-1px);
}

/* =========================
   PAGE
========================= */

.container{
    width:min(1250px,calc(100% - 32px));
    margin:auto;
    padding:35px 0 70px;
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:28px;
}

.hero h2{
    font-size:clamp(28px,4vw,42px);
    margin-bottom:8px;
}

.hero p{
    color:var(--muted);
    line-height:1.6;
    max-width:680px;
}

.hero-actions{
    display:flex;
    gap:10px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:28px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:var(--shadow);
}

.stat-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:9px;
}

.stat-number{
    font-size:29px;
    font-weight:900;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:15px;
    display:flex;
    gap:12px;
    margin-bottom:24px;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:13px 15px;
    border-radius:12px;
    border:1px solid var(--border);
    outline:none;
    background:var(--bg);
    color:var(--text);
}

.search input:focus{
    border-color:var(--primary);
}

/* =========================
   GRID
========================= */

.graphics-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.graphic-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:.2s;
}

.graphic-card:hover{
    transform:translateY(-3px);
}

/* =========================
   PREVIEW
========================= */

.thumbnail{
    position:relative;
    aspect-ratio:1/.72;
    background:#d1d5db;
    overflow:hidden;
}

.preview-canvas{
    width:100%;
    height:100%;
    display:block;
}

.preview-label{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,0,.65);
    color:#fff;
    border-radius:8px;
    padding:5px 8px;
    font-size:10px;
    font-weight:800;
}

/* =========================
   CARD
========================= */

.card-content{
    padding:17px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.card-title{
    font-weight:900;
    font-size:17px;
    word-break:break-word;
}

.card-date{
    color:var(--muted);
    font-size:12px;
    margin-top:7px;
}

.platform{
    padding:5px 9px;
    border-radius:20px;
    background:rgba(79,70,229,.1);
    color:var(--primary);
    font-size:10px;
    font-weight:900;
    white-space:nowrap;
}

.card-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:15px;
}

.small-btn{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    padding:9px 5px;
    border-radius:9px;
    font-size:11px;
    font-weight:800;
}

.small-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
}

.small-btn.delete:hover{
    border-color:var(--danger);
    color:var(--danger);
}

/* =========================
   EMPTY / ERROR
========================= */

.empty{
    grid-column:1/-1;
    background:var(--card);
    border:1px dashed var(--border);
    border-radius:22px;
    padding:65px 20px;
    text-align:center;
}

.empty-icon{
    width:70px;
    height:70px;
    border-radius:20px;
    background:rgba(79,70,229,.1);
    display:grid;
    place-items:center;
    margin:0 auto 18px;
    font-size:30px;
}

.empty h3{
    margin-bottom:8px;
}

.empty p{
    color:var(--muted);
    line-height:1.6;
    max-width:600px;
    margin:0 auto 20px;
}

.error-details{
    margin:15px auto;
    max-width:700px;
    background:var(--bg);
    border:1px solid var(--border);
    padding:12px;
    border-radius:10px;
    font-size:12px;
    color:var(--danger);
    word-break:break-word;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:200;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(850px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--card);
    border-radius:22px;
    padding:20px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.modal-head h3{
    font-size:20px;
}

.preview-large{
    width:100%;
    max-height:70vh;
    object-fit:contain;
    background:#111;
    border-radius:14px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:#fff;
    padding:13px 17px;
    border-radius:12px;
    opacity:0;
    transform:translateY(80px);
    pointer-events:none;
    transition:.3s;
    z-index:500;
    max-width:90%;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:950px){

    .graphics-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){

    .topbar{
        padding:0 14px;
    }

    .brand span{
        display:none;
    }

    .brand h1{
        font-size:17px;
    }

    .primary-btn{
        padding:10px 12px;
        font-size:12px;
    }

    .container{
        width:calc(100% - 20px);
        padding-top:25px;
    }

    .hero{
        flex-direction:column;
        align-items:flex-start;
    }

    .hero-actions{
        width:100%;
    }

    .hero-actions .primary-btn{
        width:100%;
    }

    .toolbar{
        padding:11px;
    }

    .graphics-grid{
        grid-template-columns:1fr;
    }

    .stats{
        gap:10px;
    }

    .stat{
        padding:15px;
    }

    .stat-number{
        font-size:23px;
    }

    .card-buttons{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            CC
        </div>

        <div>
            <h1>CareerCraft</h1>
            <span>Social Graphics</span>
        </div>

    </div>

    <div class="nav-actions">

        <button
            class="icon-btn"
            id="themeBtn"
            title="Toggle dark mode"
        >
            🌙
        </button>

        <button
            class="primary-btn"
            onclick="createNewGraphic()"
        >
            + Create
        </button>

    </div>

</header>


<main class="container">

    <section class="hero">

        <div>

            <h2>Your Social Graphics</h2>

            <p>
                All your saved social graphics are stored in your
                CareerCraft Supabase account and appear here.
            </p>

        </div>

        <div class="hero-actions">

            <button
                class="primary-btn"
                onclick="createNewGraphic()"
            >
                Create New Graphic
            </button>

        </div>

    </section>


    <section class="stats">

        <div class="stat">
            <div class="stat-label">
                Total Graphics
            </div>

            <div
                class="stat-number"
                id="totalGraphics"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                Instagram
            </div>

            <div
                class="stat-number"
                id="instagramCount"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                LinkedIn
            </div>

            <div
                class="stat-number"
                id="linkedinCount"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="stat-label">
                Other Platforms
            </div>

            <div
                class="stat-number"
                id="otherCount"
            >
                0
            </div>
        </div>

    </section>


    <section class="toolbar">

        <div class="search">

            <input
                type="search"
                id="searchInput"
                placeholder="Search your saved graphics..."
            >

        </div>

        <button
            class="icon-btn"
            onclick="loadGraphics()"
            title="Refresh graphics"
        >
            ↻
        </button>

    </section>


    <section
        class="graphics-grid"
        id="graphicsGrid"
    >

        <div class="empty">

            <div class="empty-icon">
                ⏳
            </div>

            <h3>
                Loading your graphics...
            </h3>

            <p>
                Connecting to your CareerCraft account.
            </p>

        </div>

    </section>

</main>


<!-- PREVIEW MODAL -->

<div
    class="modal"
    id="previewModal"
>

    <div class="modal-box">

        <div class="modal-head">

            <h3 id="previewTitle">
                Graphic Preview
            </h3>

            <button
                class="icon-btn"
                onclick="closePreview()"
            >
                ✕
            </button>

        </div>

        <canvas
            id="largePreview"
            class="preview-large"
        ></canvas>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://upcxmlbgmqhaqieldmyk.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9IvHKSA89WshqhmrKI4neQ_zaiBXGCj";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let graphics = [];


/* =========================================================
   THEME
   NO LOCALSTORAGE
========================================================= */

document
    .getElementById("themeBtn")
    .addEventListener("click", () => {

        document.body.classList.toggle("dark");

        document.getElementById("themeBtn").textContent =
            document.body.classList.contains("dark")
                ? "☀️"
                : "🌙";

    });


/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if(error){

        console.error(
            "Auth error:",
            error
        );

        return null;
    }

    return data?.user || null;
}


/* =========================================================
   LOAD GRAPHICS
========================================================= */

async function loadGraphics(){

    const grid =
        document.getElementById("graphicsGrid");

    grid.innerHTML = `
        <div class="empty">
            <div class="empty-icon">⏳</div>
            <h3>Loading your graphics...</h3>
            <p>
                Checking your CareerCraft account.
            </p>
        </div>
    `;


    try{

        /* First make sure there is a valid session */

        const {
            data: sessionData
        } =
            await supabaseClient.auth.getSession();


        const session =
            sessionData?.session;


        if(!session){

            grid.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        🔐
                    </div>

                    <h3>
                        You're not signed in
                    </h3>

                    <p>
                        Please sign in to CareerCraft
                        before viewing your saved graphics.
                    </p>

                    <button
                        class="primary-btn"
                        onclick="goToLogin()"
                    >
                        Sign In
                    </button>

                </div>
            `;

            return;
        }


        const user =
            session.user;


        console.log(
            "Logged in user:",
            user.id
        );


        /* =================================================
           IMPORTANT DATABASE QUERY
        ================================================= */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("social_graphics")
                .select("*")
                .eq("user_id", user.id)
                .order(
                    "updated_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(
                "Supabase graphics error:",
                error
            );

            grid.innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        Could not load your graphics
                    </h3>

                    <p>
                        Supabase returned an error while
                        reading your saved graphics.
                    </p>

                    <div class="error-details">
                        ${escapeHtml(error.message)}
                    </div>

                    <button
                        class="primary-btn"
                        onclick="loadGraphics()"
                    >
                        Try Again
                    </button>

                </div>
            `;

            return;
        }


        console.log(
            "Graphics returned from Supabase:",
            data
        );


        graphics =
            Array.isArray(data)
                ? data
                : [];


        updateStats();

        renderGraphics();


    }catch(error){

        console.error(
            "Unexpected load error:",
            error
        );


        grid.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Something went wrong
                </h3>

                <p>
                    We couldn't load your saved graphics.
                </p>

                <div class="error-details">
                    ${escapeHtml(error.message)}
                </div>

                <button
                    class="primary-btn"
                    onclick="loadGraphics()"
                >
                    Try Again
                </button>

            </div>
        `;

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const instagram =
        graphics.filter(
            g =>
                String(
                    g.platform || ""
                )
                .toLowerCase()
                .includes("instagram")
        ).length;


    const linkedin =
        graphics.filter(
            g =>
                String(
                    g.platform || ""
                )
                .toLowerCase()
                .includes("linkedin")
        ).length;


    const other =
        Math.max(
            0,
            graphics.length -
            instagram -
            linkedin
        );


    document.getElementById(
        "totalGraphics"
    ).textContent =
        graphics.length;


    document.getElementById(
        "instagramCount"
    ).textContent =
        instagram;


    document.getElementById(
        "linkedinCount"
    ).textContent =
        linkedin;


    document.getElementById(
        "otherCount"
    ).textContent =
        other;

}


/* =========================================================
   RENDER
========================================================= */

function renderGraphics(){

    const grid =
        document.getElementById(
            "graphicsGrid"
        );


    const query =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const filtered =
        graphics.filter(
            graphic => {

                return (

                    String(
                        graphic.title || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        graphic.platform || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        graphic.template || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        graphic.headline || ""
                    )
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    if(!filtered.length){

        grid.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🎨
                </div>

                <h3>
                    ${
                        query
                        ? "No matching graphics"
                        : "No saved graphics yet"
                    }
                </h3>

                <p>
                    ${
                        query
                        ? "Try a different search."
                        : "Create a graphic and save it. It will appear here automatically."
                    }
                </p>

                ${
                    !query
                    ? `
                        <button
                            class="primary-btn"
                            onclick="createNewGraphic()"
                        >
                            Create New Graphic
                        </button>
                    `
                    : ""
                }

            </div>
        `;

        return;
    }


    grid.innerHTML =
        filtered
        .map(
            graphic => {

                const date =
                    graphic.updated_at
                    ? new Date(
                        graphic.updated_at
                    ).toLocaleString()
                    : "Recently";


                const id =
                    graphic.id;


                return `
                    <article
                        class="graphic-card"
                    >

                        <div
                            class="thumbnail"
                            id="thumb-${escapeAttribute(id)}"
                        >

                            <canvas
                                class="preview-canvas"
                                id="canvas-${escapeAttribute(id)}"
                            ></canvas>

                            <div class="preview-label">
                                ${escapeHtml(
                                    graphic.platform ||
                                    "Social"
                                )}
                            </div>

                        </div>


                        <div class="card-content">

                            <div class="card-top">

                                <div>

                                    <div class="card-title">
                                        ${escapeHtml(
                                            graphic.title ||
                                            "Untitled Graphic"
                                        )}
                                    </div>

                                    <div class="card-date">
                                        Updated ${escapeHtml(date)}
                                    </div>

                                </div>


                                <span class="platform">
                                    ${escapeHtml(
                                        graphic.platform ||
                                        "Social"
                                    )}
                                </span>

                            </div>


                            <div class="card-buttons">

                                <button
                                    class="small-btn"
                                    onclick="previewGraphic('${escapeAttribute(id)}')"
                                >
                                    Preview
                                </button>

                                <button
                                    class="small-btn"
                                    onclick="editGraphic('${escapeAttribute(id)}')"
                                >
                                    Edit
                                </button>

                                <button
                                    class="small-btn"
                                    onclick="duplicateGraphic('${escapeAttribute(id)}')"
                                >
                                    Duplicate
                                </button>

                                <button
                                    class="small-btn"
                                    onclick="downloadGraphic('${escapeAttribute(id)}')"
                                >
                                    Download
                                </button>

                                <button
                                    class="small-btn delete"
                                    onclick="deleteGraphic('${escapeAttribute(id)}')"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>

                    </article>
                `;

            }
        )
        .join("");


    /* Draw previews after cards exist */

    filtered.forEach(
        graphic => {

            const canvas =
                document.getElementById(
                    "canvas-" + graphic.id
                );

            if(canvas){

                drawGraphic(
                    canvas,
                    graphic
                );

            }

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        renderGraphics
    );


/* =========================================================
   CREATE
========================================================= */

function createNewGraphic(){

    window.location.href =
        "social-graphics-editor.html";

}


/* =========================================================
   EDIT
========================================================= */

function editGraphic(id){

    window.location.href =
        "social-graphics-editor.html?id=" +
        encodeURIComponent(id);

}


/* =========================================================
   DUPLICATE
========================================================= */

async function duplicateGraphic(id){

    const original =
        graphics.find(
            g => g.id === id
        );


    if(!original){

        showToast(
            "Graphic not found."
        );

        return;
    }


    const user =
        await getCurrentUser();


    if(!user){

        showToast(
            "Please sign in first."
        );

        return;
    }


    try{

        showToast(
            "Duplicating graphic..."
        );


        const duplicate = {

            user_id:user.id,

            title:
                (original.title ||
                "Social Graphic") +
                " Copy",

            platform:
                original.platform,

            width:
                original.width,

            height:
                original.height,

            background_color:
                original.background_color,

            background_type:
                original.background_type,

            background_image_url:
                original.background_image_url,

            logo_url:
                original.logo_url,

            headline:
                original.headline,

            body_text:
                original.body_text,

            author_name:
                original.author_name,

            template:
                original.template,

            graphic_data:
                original.graphic_data || {}

        };


        const {
            error
        } =
            await supabaseClient
                .from("social_graphics")
                .insert(
                    duplicate
                );


        if(error){

            console.error(error);

            showToast(
                "Duplicate failed: " +
                error.message
            );

            return;
        }


        showToast(
            "Graphic duplicated."
        );


        await loadGraphics();


    }catch(error){

        console.error(error);

        showToast(
            "Unable to duplicate graphic."
        );

    }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteGraphic(id){

    const graphic =
        graphics.find(
            g => g.id === id
        );


    if(!graphic)
        return;


    const confirmed =
        confirm(
            "Delete this graphic permanently?"
        );


    if(!confirmed)
        return;


    const user =
        await getCurrentUser();


    if(!user){

        showToast(
            "Please sign in first."
        );

        return;
    }


    try{

        showToast(
            "Deleting graphic..."
        );


        const {
            error
        } =
            await supabaseClient
                .from("social_graphics")
                .delete()
                .eq(
                    "id",
                    id
                )
                .eq(
                    "user_id",
                    user.id
                );


        if(error){

            console.error(error);

            showToast(
                "Delete failed: " +
                error.message
            );

            return;
        }


        /* Try removing associated files */

        const paths = [];


        if(
            graphic.background_image_url
        ){

            const path =
                extractStoragePath(
                    graphic.background_image_url
                );

            if(path)
                paths.push(path);

        }


        if(graphic.logo_url){

            const path =
                extractStoragePath(
                    graphic.logo_url
                );

            if(path)
                paths.push(path);

        }


        if(paths.length){

            await supabaseClient
                .storage
                .from("social-graphics")
                .remove(paths);

        }


        showToast(
            "Graphic deleted."
        );


        await loadGraphics();


    }catch(error){

        console.error(error);

        showToast(
            "Unable to delete graphic."
        );

    }

}

/* =========================================================
   DRAW GRAPHIC
========================================================= */

function drawGraphic(
    canvas,
    graphic
){

    const width =
        Number(
            graphic.width
        ) || 1080;


    const height =
        Number(
            graphic.height
        ) || 1080;


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    const data =
        graphic.graphic_data || {};


    /* Background */

    ctx.fillStyle =
        graphic.background_color ||
        "#4f46e5";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Background image */

    if(
        graphic.background_image_url
    ){

        loadImage(
            graphic.background_image_url
        )
        .then(
            img => {

                drawCover(
                    ctx,
                    img,
                    0,
                    0,
                    width,
                    height
                );


                drawTextLayers(
                    ctx,
                    graphic,
                    data,
                    width,
                    height
                );

            }
        )
        .catch(
            () => {

                drawTextLayers(
                    ctx,
                    graphic,
                    data,
                    width,
                    height
                );

            }
        );

    }else{

        drawTextLayers(
            ctx,
            graphic,
            data,
            width,
            height
        );

    }

}


/* =========================================================
   TEXT / OVERLAY
========================================================= */

function drawTextLayers(
    ctx,
    graphic,
    data,
    width,
    height
){

    /* Overlay */

    if(
        data.overlay
    ){

        ctx.fillStyle =
            data.overlay;

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }


    /* Logo */

    if(
        graphic.logo_url
    ){

        loadImage(
            graphic.logo_url
        )
        .then(
            logo => {

                const size =
                    Math.min(
                        width,
                        height
                    ) * .15;


                ctx.drawImage(
                    logo,
                    width -
                    size -
                    40,
                    35,
                    size,
                    size
                );

            }
        )
        .catch(
            () => {}
        );

    }


    /* Headline */

    if(
        graphic.headline
    ){

        const size =
            Number(
                data.headlineSize
            ) || Math.max(
                32,
                width * .067
            );


        ctx.fillStyle =
            data.headlineColor ||
            "#ffffff";


        ctx.font =
            `800 ${size}px Arial`;


        ctx.textAlign =
            data.headlineAlign ||
            "center";


        wrapText(
            ctx,
            graphic.headline,
            width / 2,
            Number(
                data.headlineY
            ) ||
            height * .42,
            width * .82,
            size * 1.15
        );

    }


    /* Body */

    if(
        graphic.body_text
    ){

        const size =
            Number(
                data.bodySize
            ) || Math.max(
                18,
                width * .028
            );


        ctx.fillStyle =
            data.bodyColor ||
            "#ffffff";


        ctx.font =
            `400 ${size}px Arial`;


        ctx.textAlign =
            data.bodyAlign ||
            "center";


        wrapText(
            ctx,
            graphic.body_text,
            width / 2,
            Number(
                data.bodyY
            ) ||
            height * .60,
            width * .76,
            size * 1.35
        );

    }


    /* Author */

    if(
        graphic.author_name
    ){

        const size =
            Number(
                data.authorSize
            ) || Math.max(
                16,
                width * .022
            );


        ctx.fillStyle =
            data.authorColor ||
            "#ffffff";


        ctx.font =
            `600 ${size}px Arial`;


        ctx.textAlign =
            "center";


        ctx.fillText(
            graphic.author_name,
            width / 2,
            Number(
                data.authorY
            ) ||
            height * .88
        );

    }

}


/* =========================================================
   DOWNLOAD
========================================================= */

async function downloadGraphic(id){

    const graphic =
        graphics.find(
            g => g.id === id
        );


    if(!graphic){

        showToast(
            "Graphic not found."
        );

        return;
    }


    try{

        showToast(
            "Preparing PNG..."
        );


        const canvas =
            document.createElement(
                "canvas"
            );


        await drawGraphicForDownload(
            canvas,
            graphic
        );


        const blob =
            await new Promise(
                resolve =>
                    canvas.toBlob(
                        resolve,
                        "image/png"
                    )
            );


        if(!blob){

            throw new Error(
                "PNG creation failed."
            );

        }


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            safeFileName(
                graphic.title ||
                "social-graphic"
            ) +
            ".png";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            () =>
                URL.revokeObjectURL(url),
            2000
        );


        showToast(
            "PNG downloaded."
        );


    }catch(error){

        console.error(
            error
        );


        showToast(
            "Download failed."
        );

    }

}

/* =========================================================
   CANVAS HELPERS
========================================================= */

function loadImage(src){

    return new Promise(
        (resolve,reject) => {

            const img =
                new Image();


            img.crossOrigin =
                "anonymous";


            img.onload =
                () =>
                    resolve(img);


            img.onerror =
                () =>
                    reject(
                        new Error(
                            "Image failed to load"
                        )
                    );


            img.src =
                src;

        }
    );

}


function drawCover(
    ctx,
    img,
    x,
    y,
    width,
    height
){

    const scale =
        Math.max(
            width / img.width,
            height / img.height
        );


    const w =
        img.width *
        scale;


    const h =
        img.height *
        scale;


    const dx =
        x +
        (width - w) /
        2;


    const dy =
        y +
        (height - h) /
        2;


    ctx.drawImage(
        img,
        dx,
        dy,
        w,
        h
    );

}


function wrapText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    lineHeight
){

    const words =
        String(text)
        .split(/\s+/);


    let line = "";

    let currentY =
        y;


    for(
        let i = 0;
        i < words.length;
        i++
    ){

        const test =
            line
            ? line +
              " " +
              words[i]
            : words[i];


        const width =
            ctx.measureText(
                test
            ).width;


        if(
            width > maxWidth &&
            line
        ){

            ctx.fillText(
                line,
                x,
                currentY
            );


            line =
                words[i];


            currentY +=
                lineHeight;

        }else{

            line =
                test;

        }

    }


    if(line){

        ctx.fillText(
            line,
            x,
            currentY
        );

    }

}


/* =========================================================
   STORAGE PATH
========================================================= */

function extractStoragePath(url){

    try{

        const marker =
            "/storage/v1/object/public/social-graphics/";


        const index =
            url.indexOf(
                marker
            );


        if(
            index === -1
        )
            return null;


        return decodeURIComponent(
            url.substring(
                index +
                marker.length
            )
        );

    }catch{

        return null;

    }

}


/* =========================================================
   UTILITY
========================================================= */

function safeFileName(name){

    return String(name)
        .replace(
            /[^a-z0-9-_]+/gi,
            "-"
        )
        .replace(
            /-+/g,
            "-"
        )
        .replace(
            /^-|-$/g,
            ""
        )
        .toLowerCase()
        ||
        "social-graphic";

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return escapeHtml(
        value
    );

}


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}
